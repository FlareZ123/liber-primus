name: Manual p50 INSTAR phase-table hypothesis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pinned research source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run bounded 30x6 INSTAR phase-table test
        run: node sims/lp2_p50_30x6_instar_phase_table_sft.cjs > p50-instar-phase-table-results.json
      - name: Upload reproducible result
        uses: actions/upload-artifact@v4
        with:
          name: p50-instar-phase-table-results
          path: p50-instar-phase-table-results.json
          if-no-files-found: error
          retention-days: 30
