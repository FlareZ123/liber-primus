name: Historical Parable prime32 grid AES source gate
on:
  workflow_dispatch:
jobs:
  original-prime32-aes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frozen source prime interval against original LP2 grid and known-answer plant
        run: node sims/parable_prime32_grid_aes_sft.cjs
