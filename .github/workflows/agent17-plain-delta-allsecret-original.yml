name: Agent17 original plaintext-difference bijection gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-rune-inverse:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout original source corpus
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce all-secret original-runic inverse and positive plant
        run: node sims/lp2_plaintext_delta_nonlinear_allsecret_original_sft.cjs
