name: Agent15 pinned 2013 DH session census

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: cicada-solvers/neuroretransmit-cicada
          ref: ade9a02889ef8acbc8cde8edbfd0a785c369f4c3
          path: research/external-cicada
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Census pinned 2013 DH commands
        working-directory: research
        run: node sims/lp2_2013_dh_session_census_sft.cjs external-cicada
