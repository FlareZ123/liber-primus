name: LP2 source-linked HG four-state all-secret GP29 inverse (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lfsr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exhaust 29^4 seeds and test heldout original ciphertext
        run: node sims/lp2_hg_fourstate_lfsr_allsecret_sft.cjs --full
