name: Agent9 terminal 180 solved runes carry key
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  76-carry-key:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
