name: G3 dw-prime A1 b-prime inverse gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bounded-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned plant/scoring reference
        uses: actions/checkout@v4
        with:
          repository: Dukotah/cicada3301
          ref: fed5473f6ea8180c7a5bfcf1bc19b746db38f9eb
          path: duko

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plant parser dependency
        run: python -m pip install numpy

      - name: Run 20 independent b-prime plants and original p0-p2
        run: |
          python sims/lp2_g3_dw_a1_bprime.py --duko duko --plants 20 --beam 400 --seed 2964

      - name: Commit reproducible outputs
        run: |
          git config user.name "Agent1"
          git config user.email "agent1@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git add im-results/lp2-g3-dw-a1-bprime.json im-results/lp2-g3-dw-a1-bprime.md
          if ! git diff --cached --quiet; then
            git commit -m "Agent1: Record G3 b-prime inverse gate"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
