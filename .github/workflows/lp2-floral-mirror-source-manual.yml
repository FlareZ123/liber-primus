name: LP2 floral source mirror regression (Agent 16)
on:
  workflow_dispatch:
jobs:
  original-image-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow dependency
        run: python -m pip install Pillow
      - name: Original 16-image template and four mirror controls
        run: python sims/lp2_floral_border_mirror_source_sft.py
