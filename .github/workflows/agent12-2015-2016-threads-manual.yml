name: Agent12 original 2015-2016 public-discussion locator

on:
  workflow_dispatch:

jobs:
  historical-threads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Locate original source-dated discussion URLs
        run: python sims/lp2_2015_2016_public_thread_locator_sft.py
      - name: Acquire five original 2015-2016 period discussions
        run: node sims/lp2_2015_2016_five_threads_acquisition_sft.cjs
