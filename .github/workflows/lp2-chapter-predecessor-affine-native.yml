name: LP2 chapter-local predecessor affine native gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original ciphertext and nine native-positive plants
        run: |
          node sims/lp2_chapter_predecessor_affine_lexicon_sft.cjs
          node sims/lp2_chapter_predecessor_affine_lexicon_sft.cjs --wide
