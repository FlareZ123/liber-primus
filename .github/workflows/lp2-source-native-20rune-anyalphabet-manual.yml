name: LP2 Source-Native 20-Rune Any-Secret-Alphabet Search
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-plaintext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact 20-rune original unknown-page/source-register equality-pattern join
        run: |
          node --check sims/lp2_original_anyalphabet_20rune_knowntext_recovery_sft.cjs
          node sims/lp2_original_anyalphabet_20rune_knowntext_recovery_sft.cjs
