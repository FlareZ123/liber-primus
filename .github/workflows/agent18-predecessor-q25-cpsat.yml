name: Agent18 predecessor-bijection q25 exact gate

on:
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CP-SAT
        run: python -m pip install --disable-pip-version-check ortools
      - name: Solve q25 joint permutation feasibility
        run: python sims/lp2_predecessor_q25_cpsat.py
