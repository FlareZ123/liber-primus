name: Research SFT (read-only, manual)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Repo sims/*.cjs standalone test filename"
        required: true
        default: "sims/lp2_clock_quagmire_full_affine_motif_sft.cjs"
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate SFT path and execute
        shell: pwsh
        env:
          SFT_SCRIPT: ${{ inputs.script }}
        run: |
          if ($env:SFT_SCRIPT -notmatch '^sims/[A-Za-z0-9_-]+\.cjs$') {
            throw 'Script must be a root-level sims/*.cjs file'
          }
          if (-not (Test-Path -LiteralPath $env:SFT_SCRIPT -PathType Leaf)) {
            throw 'SFT script does not exist in this revision'
          }
          node -- $env:SFT_SCRIPT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
