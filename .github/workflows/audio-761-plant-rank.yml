name: Historical 761 audio true-key shortlist rank
on:
  workflow_dispatch:
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch immutable Cicada 2013 source
        run: curl --fail --location --silent --show-error --output /tmp/761.MP3 https://raw.githubusercontent.com/rtkd/iddqd/f2267b0c2f1e1d2662806b90b9c3a2953b3a7023/2013/02/761.MP3
      - name: Exhaustive planted true-offset ranking
        run: node sims/audio_761_plant_rank.cjs
