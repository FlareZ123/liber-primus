name: Agent6 Five Numbered Rune Round Robin Original

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact 553-rune original 1-to-5 interleave
        shell: pwsh
        run: |
          node sims/lp2_five_numbered_rune_roundrobin_source_sft.cjs
          node sims/lp2_five_numbered_passages_single_rune_roundrobin_original_sft.cjs
          node sims/lp2_five_numbered_two_source_squares_91column_sft.cjs
          node sims/lp2_five_numbered_stage10_sevensquare_553_sft.cjs
