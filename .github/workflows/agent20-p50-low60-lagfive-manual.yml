name: Agent20 p50 low60 lag-five coupling SFT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-selector-coupling:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original printed-word and table-gate coupling with positive control
        run: node sims/lp2_p50_low60_lagfive_coupling_sft.cjs
