name: Agent 13 one-shot external 27-square candidate audit
on:
  workflow_dispatch:
jobs:
  external27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Challenge 27-square proposed words using source-bound null
        run: node sims/external_27square_word_density.cjs
