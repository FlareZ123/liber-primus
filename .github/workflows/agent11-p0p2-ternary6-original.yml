name: Agent11 original LP2 opening ternary-six collision SAT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-collision-sat:
    runs-on: windows-latest
    timeout-minutes: 23
    steps:
      - name: Checkout authentic GP29 ciphertext
        uses: actions/checkout@v6
      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Z3Py
        shell: pwsh
        run: python -m pip install z3-solver==4.13.0.0
      - name: Check complete family of stationary ternary class maps
        shell: pwsh
        run: python -u sims/lp2_p0p2_ternary6_collision_sat_sft.py
