name: Agent8 exact candidate onion in Ahmia 2014
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact Ahmia 2014 host gate
        shell: pwsh
        run: |
          node --check sims/lp2_candidate_onion_ahmia2014_exact_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Syntax' }
          node sims/lp2_candidate_onion_ahmia2014_exact_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'SFT' }
