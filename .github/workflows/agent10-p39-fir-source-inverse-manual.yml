name: Agent10 original-cipher clue-selected inverses
on:
  workflow_dispatch:
jobs:
  source-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original LP2 and withheld positive control
        run: node sims/lp2_p39_red_polynomial_fir_inverse_sft.cjs
      - name: P50 inner solved-tail plaintext as byte key
        run: node sims/lp2_p50_inner180_solved_tail_byte_readout_sft.cjs
