name: LP2 original printed-word-length grammar gate
on:
  workflow_dispatch:
jobs:
  wordlength_original:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original LP2 and solved LP1 exact grammar controls
        run: node sims/lp2_wordlength_chapter_mutualinformation_sft.cjs
        shell: pwsh
      - name: Sixteen-column planted and original heldout inverse
        run: node sims/lp2_16column_wordperm_blind_sft.cjs
        shell: pwsh
      - name: Historical onion2 timing original table cross-source gate
        run: node sims/lp2_onion2_timing_table_crosssource_sft.cjs
        shell: pwsh
