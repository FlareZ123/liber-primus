name: Agent15 p27 red13 onion candidate SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce candidate continuation
        run: node sims/lp2_primeecho_red13_onion_candidate_sft.cjs
