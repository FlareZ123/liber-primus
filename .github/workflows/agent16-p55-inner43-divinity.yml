name: Agent16 P55 Inner43 DIVINITY Exact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact p55 inner DIVINITY gate
        shell: pwsh
        run: node sims/agent16_p55_inner43_divinity_exact_sft.cjs
