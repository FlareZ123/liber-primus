name: Agent1 line-column all-secret gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact line-column equality gate
        run: node sims/lp2_linecolumn_allsecret_bijection_sft.cjs
