name: Red 225 Hill / feedback inverse (manual)

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Select existing suite or source-locked Salsa20 32x8 nonce test'
        type: choice
        required: true
        default: legacy
        options:
          - legacy
          - salsa20
          - mix_end_parable
          - tensor_357
          - red11_core

jobs:
  inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify peeled original red 11x11 Hill compatibility against p32
        if: github.event.inputs.probe == 'red11_core'
        run: |
          node --check sims/lp2_red225_inner11_p32_hill_sft.cjs
          node sims/lp2_red225_inner11_p32_hill_sft.cjs
      - name: Run source-constrained original and exact planted inverse
        if: github.event.inputs.probe == 'legacy'
        run: node sims/red_225_hill_feedback_inverse.cjs
      - name: Red 225-core and 31-stencil rim 16x16 original-source inverse
        if: github.event.inputs.probe == 'legacy'
        run: node sims/red_256_rim_hill_inverse.cjs
      - name: Exact solved-page literal-F gate of red256 event pad keys
        if: github.event.inputs.probe == 'legacy'
        run: node sims/red256_literal_f_source_gate.cjs
      - name: Image-shifted terminal-moth arbitrary-rune-bijection necessary condition
        if: github.event.inputs.probe == 'legacy'
        run: node sims/moth_shifted_bijection_gate.cjs
      - name: Verify red225 MIX AN END PARABLE source gate
        if: github.event.inputs.probe == 'mix_end_parable'
        run: |
          node --check sims/lp2_red225_mix_end_parable_sft.cjs
          node sims/lp2_red225_mix_end_parable_sft.cjs
      - name: Verify red357 3x5x7 title Hill inverse on p33-39
        if: github.event.inputs.probe == 'tensor_357'
        run: |
          node --check sims/lp2_red357_tensor_p33_39_sft.cjs
          node sims/lp2_red357_tensor_p33_39_sft.cjs
      - name: Salsa20 original grid nonce and 32 red-run key inverse
        if: github.event.inputs.probe == 'salsa20'
        run: |
          npm install --no-save --no-package-lock @noble/ciphers@2.4.0
          node sims/red32_grid64_salsa20_source_inverse.cjs
