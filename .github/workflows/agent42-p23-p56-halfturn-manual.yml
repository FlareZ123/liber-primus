name: Agent42 LP2 p23-p56 half-turn original-image gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-halfturn-image-and-cipher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source comparison dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Verify every LP2 JPEG image and source-selected p56 cipher transfer
        run: python sims/lp2_p23_p56_halfturn_emblem_sft.py
