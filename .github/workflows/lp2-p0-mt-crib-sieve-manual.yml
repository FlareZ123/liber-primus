name: LP2 p0 first13 Py27-MT crib sieve (manual)
on:
  workflow_dispatch:
    inputs:
      start:
        description: First integer seed (inclusive, 0..4294967295)
        required: true
        type: string
      end:
        description: First integer seed after tested range (exclusive, <=4294967296)
        required: true
        type: string

permissions:
  contents: read

jobs:
  exact-source-crib-sieve:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout original-source corpus and SFT
        uses: actions/checkout@v4
      - name: Assert first thirteen original p0 rune indices
        run: >-
          node -e "const c=require('./resources/liber-primus/lp2-corpus.json');
          const v=c.pages[0].indices.slice(0,13).join(',');
          if(v !== '15,8,18,3,6,19,27,0,15,26,18,21,5') process.exit(42);
          console.log('ORIGINAL P0 13-RUNE INPUT VERIFIED');"
      - name: Compile standalone historical-seed receiver
        run: gcc -std=c11 -O3 -Wall -Wextra -Werror sims/lp2_p0_epiphany_py27_mt_seed_sieve.c -lm -o /tmp/lp2_mt_crib_sieve
      - name: Original MT vectors and independent plant positive controls
        run: /tmp/lp2_mt_crib_sieve --selftest
      - name: Exhaustive bounded seed window for three reducers both signs
        run: /tmp/lp2_mt_crib_sieve "${{ inputs.start }}" "${{ inputs.end }}" SELFTEST
