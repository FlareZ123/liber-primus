name: LP2 original JPEG F5 carrier and authenticated payload gate

on:
  workflow_dispatch:

jobs:
  original-f5:
    runs-on: windows-2025
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile source-pinned F5 algorithm (2001 historical Java)
        shell: pwsh
        run: |
          git clone --quiet https://github.com/matthewgao/F5-steganography.git external-f5
          git -C external-f5 checkout --quiet d08b5f83dd6794e4081dacaf92bae7ed2f6ea232
          javac -encoding windows-1252 -cp external-f5 -sourcepath external-f5 -d external-f5 external-f5/Extract.java external-f5/Embed.java
          if ($LASTEXITCODE -ne 0) { throw "Pinned F5 Java compilation failed" }
      - name: Genuine LP2 JPEG F5 extraction and planted-control gate
        shell: pwsh
        env:
          F5_ALL: "0"
        run: |
          node sims/lp2_f5_original_jpeg_gate_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw "F5 original/jpeg-gate failed" }
      - name: Preserve exact original extraction metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-original-f5-carrier-gate
          path: im-results/generated-f5/lp2-f5-original-source-results.json
          if-no-files-found: warn
