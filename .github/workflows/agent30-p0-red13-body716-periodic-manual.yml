name: Agent30 p0 red13 body716 periodic original-source gate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent30-p0-red13-body716-periodic
  cancel-in-progress: false

jobs:
  controls:
    name: body716 planted m6/m9 controls
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the pinned original-source layer2 implementation and key tapes
        uses: actions/download-artifact@v4
        with:
          name: layer2-prepared
          run-id: 44062412799
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prepared
      - name: Restore executable permission after artifact extraction
        run: chmod +x prepared/upstream/work/layer2/target/release/layer2
      - name: Require independent 716-rune controls for both marker states
        run: python sims/agent30_p0_red13_body716_periodic_control_sft.py prepared/upstream/work/layer2
      - uses: actions/upload-artifact@v4
        with:
          name: agent30-p0-red13-body716-controls
          path: prepared/upstream/work/layer2/data/controls_body716
          if-no-files-found: error
          retention-days: 30

  screen:
    needs: controls
    name: body716 ${{ matrix.boundary }} / ${{ matrix.side }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        boundary: [continuity, reset]
        side: [real, "null"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the pinned original-source layer2 implementation and key tapes
        uses: actions/download-artifact@v4
        with:
          name: layer2-prepared
          run-id: 44062412799
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prepared
      - name: Restore executable permission after artifact extraction
        run: chmod +x prepared/upstream/work/layer2/target/release/layer2
      - name: Download the independently verified 716-rune positive controls
        uses: actions/download-artifact@v4
        with:
          name: agent30-p0-red13-body716-controls
          path: prepared/upstream/work/layer2/data/controls_body716
      - name: Require the control gate before original ciphertext
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("prepared/upstream/work/layer2/data/controls_body716/control_manifest.json")
          m=json.loads(p.read_text())
          assert m["all_controls_pass"] and len(m["checks"]) == 4
          assert m["original_body_sha256"] == "3e6191f2f5ab96359d9dbc27b223bd17d565f0e2978254e4b63041b61b2ed689"
          PY
      - name: Build the exact black-body source window from original p0
        env:
          BOUNDARY: ${{ matrix.boundary }}
        run: |
          mkdir -p prepared/upstream/work/layer2/data
          node sims/agent30_p0_red13_body716_source_sft.cjs "$BOUNDARY" > "prepared/upstream/work/layer2/data/body716_${BOUNDARY}.txt"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          boundary=os.environ["BOUNDARY"]
          p=Path(f"prepared/upstream/work/layer2/data/body716_{boundary}.txt")
          lines=p.read_text().splitlines()
          assert lines[0].startswith("W body716_")
          previous=int(lines[0].split()[-1])
          expected={"continuity":5,"reset":-1}[boundary]
          runes=[int(x) for x in lines[1][2:].split()]
          assert previous == expected and len(runes) == 716
          assert hashlib.sha256(bytes(runes)).hexdigest() == "3e6191f2f5ab96359d9dbc27b223bd17d565f0e2978254e4b63041b61b2ed689"
          PY
      - name: Run original or matched-null periodic2-14 receiver and native whole-window verifier
        env:
          BOUNDARY: ${{ matrix.boundary }}
          SIDE: ${{ matrix.side }}
        run: |
          cd prepared/upstream/work/layer2
          mkdir -p results
          case "$SIDE" in
            real) keyfile=core20 ;;
            null) keyfile=null_core20 ;;
          esac
          target/release/layer2 screen "data/body716_${BOUNDARY}.txt" "file:data/${keyfile}.ksb" "results/body716_${BOUNDARY}_${SIDE}.tsv" mode=periodic ms=2:14 litf=0 abort=150:2.5 n=716 beam=16 mults=1,28 models=0,1 threads=4
          python verify.py "results/body716_${BOUNDARY}_${SIDE}.tsv" --top 20 --controls 20 --out "results/body716_${BOUNDARY}_${SIDE}_verify.txt"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          boundary=os.environ["BOUNDARY"]
          side=os.environ["SIDE"]
          data=Path("data")
          results=Path("results")
          stem=f"body716_{boundary}_{side}"
          window=(data/f"body716_{boundary}.txt").read_bytes()
          runes=[int(x) for x in (data/f"body716_{boundary}.txt").read_text().splitlines()[1][2:].split()]
          tsv=(results/f"{stem}.tsv").read_bytes()
          verify=(results/f"{stem}_verify.txt").read_bytes()
          keyfile=data/("core20.ksb" if side=="real" else "null_core20.ksb")
          report={
            "window":f"body716_{boundary}",
            "boundary":boundary,
            "previous_cipher_state":5 if boundary=="continuity" else -1,
            "n":716,
            "original_body_rune_sha256":hashlib.sha256(bytes(runes)).hexdigest(),
            "window_file_sha256":hashlib.sha256(window).hexdigest(),
            "side":side,
            "family_file":keyfile.name,
            "family_sha256":hashlib.sha256(keyfile.read_bytes()).hexdigest(),
            "tsv_sha256":hashlib.sha256(tsv).hexdigest(),
            "verify_sha256":hashlib.sha256(verify).hexdigest(),
            "candidate_lines":[x for x in verify.decode().splitlines() if x.startswith("CANDIDATE")]
          }
          (results/f"{stem}.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: agent30-p0-red13-body716-${{ matrix.boundary }}-${{ matrix.side }}
          path: |
            prepared/upstream/work/layer2/results/body716_${{ matrix.boundary }}_${{ matrix.side }}.tsv
            prepared/upstream/work/layer2/results/body716_${{ matrix.boundary }}_${{ matrix.side }}_verify.txt
            prepared/upstream/work/layer2/results/body716_${{ matrix.boundary }}_${{ matrix.side }}.json
          if-no-files-found: error
          retention-days: 30
