name: Agent 38 terminal256 original known-page arithmetic (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original 256-table and solved-p56 modular relation
        run: node sims/lp2_terminal256_solved56_grid_gcd_sft.cjs
