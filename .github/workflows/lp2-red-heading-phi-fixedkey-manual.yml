name: LP2 red heading GP prime-totient direct original key gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-title-key:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check sims/lp2_red_heading_prime_totient_fixedkey_sft.cjs
      - name: Exact nine titled-unit original decoder and native-GP control
        run: node sims/lp2_red_heading_prime_totient_fixedkey_sft.cjs
