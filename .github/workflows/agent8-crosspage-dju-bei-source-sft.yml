name: Agent8 original cross-page two-word collision
on:
  workflow_dispatch:
jobs:
  wordpair-original:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-exact line-null and page-null
        run: node sims/lp2_crosspage_wordpair_jdu_bei_sft.cjs
