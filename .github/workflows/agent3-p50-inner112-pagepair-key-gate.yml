name: Agent 3 p50 inner112 page-pair key gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-frozen-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run original-input gate
        run: node sims/lp2_p50_inner112_pagepair_key_gate.cjs
