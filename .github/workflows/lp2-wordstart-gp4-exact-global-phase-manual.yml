name: LP2 exact GP-English word-start global phase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen pronunciation wordlist
        run: python -m pip install cmudict==1.1.3
      - name: Exact full ciphertext cyclic word-start phase enumeration
        run: python sims/lp2_wordstart_gp4_exact_global_phase_sft.py
