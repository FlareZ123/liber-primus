name: Authentic Liber Primus historical decryptions

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify three original 2013 first and second onion signatures
        shell: bash
        run: |
          set -euo pipefail
          gpg --batch --import resources/control/cicada-3301-public-key.asc
          for file in \
            resources/historical/cicada2013-first-onion-hello.asc \
            resources/historical/cicada2013-second-onion-everything-you-need.asc \
            resources/historical/cicada2013-second-onion-icmp-echo.asc; do
            status="$(gpg --batch --status-fd 1 --verify "$file" 2>&1)"
            echo "$file"
            echo "$status" | grep -F '[GNUPG:] VALIDSIG 6D854CD7933322A601C3286D181F01E57A35090F'
          done
      - name: Test causal previous-word GP prime directions into p50 key stream
        run: node sims/lp2_previous_word_p50_consecutive_key_sft.cjs
      - name: Audit original 86-event mask combinatorial AN END channel
        run: node sims/lp2_doublet_combinadic_anend_sft.cjs
      - name: Decode original runic ciphertext with documented historical keys
        run: node sims/authentic_decryption_regression.cjs
      - name: Test five-dot artwork reflection against solved page-56 totient inverse
        run: node sims/fivedot_reflection_totient_inverse.cjs
      - name: Test five-dot height-order columnar transposition with known prime-totient cipher
        run: node sims/lp2_fivedot_columnar_totient_gate.cjs
      - name: Check historical source handoff, original LP2 and all literal-F clock masks
        run: node sims/historical_solve_path_transfer.cjs
      - name: Exhaust all original physical-page literal-F prime-totient clock masks
        run: node sims/historical_solve_path_transfer.cjs --all-pages
      - name: Check solved p57 word-interior starts against all authentic literal-F prime masks
        run: node sims/lp2_p57_shed_primecursor_fskip_sft.cjs
