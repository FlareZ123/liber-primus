name: Agent10 exact shared affine GP29 three-insect source gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-exact:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-exact unpruned triple native GP29 word inverse
        shell: pwsh
        run: node sims/lp2_p24p25p26_affine_triple_exact_sft.cjs
