name: Agent44 2014 auxiliary 9901 original profile OutGuess

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Provision source-compatible JPEG development headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libjpeg-dev
      - name: Test exact archived image and authentic original control
        run: python3 sims/cicada2014_aux9901_profile_outguess_sft.py
