name: Agent10 p55 candidate against Ahmia 2014
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-historical-host-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frozen exact-candidate check
        run: |
          node --check sims/agent10_p55_candidate_ahmia2014_exact_sft.cjs
          node sims/agent10_p55_candidate_ahmia2014_exact_sft.cjs
