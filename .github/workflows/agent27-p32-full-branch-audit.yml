name: Agent27 p32 full branch audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Charge full p32 source-loop family
        shell: pwsh
        run: node sims/lp2_p32_full_branch_audit_sft.cjs
