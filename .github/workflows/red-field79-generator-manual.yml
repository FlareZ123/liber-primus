name: Red source F79 generator heldout
on:
  workflow_dispatch:
jobs:
  field79:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source-selected F79 inverse
        run: node sims/red_field79_generator_heldout.cjs
      - name: Test exact F79 zero-mask invariant against literary controls
        run: node sims/red_f79_zero_mask_invariant.cjs
