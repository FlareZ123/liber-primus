name: Agent34 original terminal prime77 source key gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal77:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Original source and 2014 cipher positive plus terminal inverse
        shell: pwsh
        run: |
          node --check sims/lp2_terminal389_p27_prime77_pointer_sft.cjs
          node sims/lp2_terminal389_p27_prime77_pointer_sft.cjs
