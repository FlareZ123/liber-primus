      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-only BM6 inference and original F-transparent counterexample
        run: |
          node --check sims/lp2_p0_epiphany_bm6_original_sft.cjs
          node sims/lp2_p0_epiphany_bm6_original_sft.cjs
