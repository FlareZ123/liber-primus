name: LP2 stateful ASCII source constraint (manual)
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Select source original 7-bit ASCII key-independent transport gate
        type: choice
        required: true
        default: stateful
        options:
          - stateful
          - binary47
          - binary47third
          - full7
          - fullprint
      charset:
        description: ASCII payload register (source-only control choice)
        type: choice
        required: true
        default: 7bit
        options:
          - 7bit
          - printable
          - upper
          - lower

jobs:
  survivor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned constraint solver
        run: python -m pip install --disable-pip-version-check ortools==9.15.6755
      - name: Solve original predecessor-29-row stateful ASCII framing
        if: inputs.probe == 'stateful'
        run: python sims/stateful_ascii_survivor_cp.py
      - name: Positive hidden-cyclic-order ASCII source capacity control
        if: inputs.probe == 'binary47'
        run: python sims/prime78_ascii_bit_cp.py --plant --charset ${{ inputs.charset }} --seconds 60
      - name: Search original 164 packet leaders under all 29 cyclic orders
        if: inputs.probe == 'binary47'
        run: python sims/prime78_ascii_bit_cp.py --original --charset ${{ inputs.charset }} --seconds 300
      - name: Positive exact 7bit first-three-byte source test
        if: inputs.probe == 'binary47third'
        run: python sims/prime78_ascii_bit_cp.py --plant --charset 7bit --third-byte --seconds 60
      - name: Original all-secret cyclic orders second and third ASCII high bits
        if: inputs.probe == 'binary47third'
        run: python sims/prime78_ascii_bit_cp.py --original --charset 7bit --third-byte --seconds 240
      - name: Validate full-octet byte carry conversion
        if: inputs.probe == 'full7' || inputs.probe == 'fullprint'
        run: python sims/stateful_ascii_full_octet_cp.py --self-test-only --self-test-samples 10000
      - name: Solve all 18 octets for stationary radix-28 survivor
        if: inputs.probe == 'full7' || inputs.probe == 'fullprint'
        run: |
          if [ "${{ inputs.probe }}" = "fullprint" ]; then mode=printable; else mode=7bit; fi
          python sims/stateful_ascii_full_octet_cp.py --mode "$mode" --seconds 780 --seed 44
      - name: Upload full-octet solver result
        if: always() && (inputs.probe == 'full7' || inputs.probe == 'fullprint')
        uses: actions/upload-artifact@v4
        with:
          name: full-octet-${{ inputs.probe }}
          path: full_octet_*_result.json
          if-no-files-found: ignore

