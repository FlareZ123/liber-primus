name: Manual p27 red13 stencil geometry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-image-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@v7
      - name: Use Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install "Pillow==12.3.0"
      - name: Run source-image and rune gate
        run: python sims/lp2_p27_red13_stencil_geometry_sft.py
