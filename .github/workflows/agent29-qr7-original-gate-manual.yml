name: Agent29 exact original LP2 QR-v7 raster gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-qr7-finder:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and original numeric-table source gate
        run: |
          node --check sims/lp2_grid2048_qr7_finder_source_sft.cjs
          node sims/lp2_grid2048_qr7_finder_source_sft.cjs
