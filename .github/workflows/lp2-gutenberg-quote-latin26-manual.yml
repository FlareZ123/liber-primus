name: LP2 Gutenberg literal-Latin quote source search (manual)

on:
  workflow_dispatch:
    inputs:
      shard_list:
        description: "JSON array of Gutenberg Parquet shards 0..58"
        required: true
        type: string
        default: "[0]"

jobs:
  latin-quote-search:
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(inputs.shard_list) }}
    steps:
      - name: Checkout pinned original ciphertext
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet and atomic-output dependencies
        run: python -m pip install pyarrow huggingface_hub filelock
      - name: Run literal-Latin quotation controls and exact-source search
        env:
          LP2_LATIN_QUOTE_SHARD: ${{ matrix.shard }}
          LP2_LATIN_QUOTE_OUTPUT: latinquote-artifacts/shard-${{ matrix.shard }}.json
        run: python sims/lp2_quote_latin26_gutenberg_sft.py
      - name: Save original-source candidate quotes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-latin-quote-shard-${{ matrix.shard }}
          path: latinquote-artifacts/*.json
          if-no-files-found: warn
