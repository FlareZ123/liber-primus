name: Agent36 word-length Hill full-key original test

on:
  workflow_dispatch:

jobs:
  native-word-inversion:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All-secret native-word GP29 inversion and source controls
        run: node sims/lp2_wordlength_hill_allsecret_sft.cjs
