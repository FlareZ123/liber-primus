name: LP2 original p8–14 tree-stencil source gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-jpeg:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image parser
        run: python -m pip install pillow numpy
      - name: Verify original seven-page botanical stencils
        run: python sims/lp2_p8_14_tree_source_template_sft.py

  reused-additive-pad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact original six-pair word-feasibility DP and native plants
        run: node sims/lp2_p8_14_stencil_reused_additive_pad_sft.cjs
