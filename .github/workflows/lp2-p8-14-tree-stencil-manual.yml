name: LP2 original p8–14 tree-stencil source gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-jpeg:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image parser
        run: python -m pip install pillow numpy
      - name: Verify original seven-page botanical stencils
        run: python sims/lp2_p8_14_tree_source_template_sft.py
