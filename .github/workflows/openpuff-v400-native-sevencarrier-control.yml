name: OpenPuff v4.00 native seven-carrier calibration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpuff-v400-sevenjpeg-native-calibration
  cancel-in-progress: false

jobs:
  seven-jpeg-positive:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PLANT_PASSWORD: "N7wX4cP8rZ2gH6qT9vK3"
      WRONG_PASSWORD: "X4mR9qV2sL7cP5wD8hJ6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Install dependencies and validate native evidence capture
        shell: pwsh
        run: |
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py

      - name: Retrieve original OpenPuff v4.00 and verify pinned blobs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "OpenPuff-v400-seven-carrier"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = "https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff"
          $expected = @{
            "OpenPuff.exe" = "466e03c792075313ce533a5dc7a789e8a41209f9"
            "libObfuscate.dll" = "f3b1c3315f8286346416fefd6141410f422f2454"
            "OpenPuff_license.txt" = "b0bab97d3c9906caada26fbb890a2a6fe028baa4"
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original OpenPuff file mismatch: $name"
            }
          }
          $exe = Join-Path $root "OpenPuff.exe"
          $v = (Get-Item $exe).VersionInfo
          $version = "$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)"
          if ($version -ne "4.0.0.0") { throw "Unexpected original OpenPuff version: $version" }
          "OPENPUFF_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate seven source-size JPEGs with a payload requiring carrier seven
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python sims/openpuff_v400_native_sevencarrier_plant.py --exe "$env:OPENPUFF_EXE" --out probe-output/seven-carrier --password "$env:PLANT_PASSWORD"
          if ($LASTEXITCODE -ne 0) { throw "Native seven-carrier Hide plant failed" }
          $meta = Get-Content probe-output/seven-carrier/hide-result.json -Raw | ConvertFrom-Json
          if ($meta.status -ne "hidden-seven-carriers") { throw "Seven-carrier native Hide not confirmed" }
          if (@($meta.stego_paths).Count -ne 7 -or @($meta.actual_stego_files).Count -ne 7) {
            throw "Native Hide did not create exactly seven output JPEGs"
          }
          $cap6 = [int]$meta.six_carrier_capacity
          $cap7 = [int]$meta.seven_carrier_capacity
          $size = [int]$meta.payload_size
          if (-not ($cap6 -lt $size -and $size -lt $cap7)) {
            throw "Payload is not proven to require the seventh carrier"
          }
          "EXPECTED_SHA256=$($meta.payload_sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          for ($i = 1; $i -le 7; $i++) {
            "STEGO_CARRIER_$i=$($meta.stego_paths[$i-1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Write-Host "Seven-carrier plant ready: payload=$size; six-capacity=$cap6; seven-capacity=$cap7"

      - name: Recover exact payload with ordered native seven-JPEG Unhide
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyArgs = @(
            "--exe", "$env:OPENPUFF_EXE",
            "--password", "$env:PLANT_PASSWORD",
            "--bit-format", "Jpeg (Image)",
            "--bit-level", "1/5 (20%) - Medium",
            "--out", "probe-output/ordered-recovery",
            "--wait-seconds", "180",
            "--expected-size", "$env:EXPECTED_SIZE"
          )
          for ($i = 1; $i -le 7; $i++) {
            $carrier = [Environment]::GetEnvironmentVariable("STEGO_CARRIER_$i")
            if (-not $carrier) { throw "Missing ordered carrier $i" }
            $pyArgs += @("--carrier", $carrier)
          }
          python sims/openpuff_v400_extract.py @pyArgs
          if ($LASTEXITCODE -ne 0) { throw "Ordered native seven-carrier Unhide failed" }
          $result = Get-Content probe-output/ordered-recovery/result.json -Raw | ConvertFrom-Json
          if (-not $result.carrier_chain_verified -or $result.carrier_count -ne 7 -or -not $result.bit_selection_verified) {
            throw "Native Unhide did not verify the exact seven-carrier JPEG Medium chain"
          }
          $matches = @($result.outputs | Where-Object { $_.sha256 -eq $env:EXPECTED_SHA256 })
          if ($matches.Count -ne 1) { throw "Native seven-carrier Unhide did not recover exact planted bytes" }
          $processed = @($result.completion_dialogs | Where-Object { $_.message -match '7\s*/\s*7\s+carriers?\s+processed' })
          if ($processed.Count -eq 0) { throw "Original native GUI did not witness 7/7 carrier completion" }
          Write-Host "GENUINE SEVEN-CARRIER PASS: exact payload recovered; native 7/7 completion witnessed"

      - name: Wrong-password negative control
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyArgs = @(
            "--exe", "$env:OPENPUFF_EXE",
            "--password", "$env:WRONG_PASSWORD",
            "--bit-format", "Jpeg (Image)",
            "--bit-level", "1/5 (20%) - Medium",
            "--out", "probe-output/wrong-password",
            "--wait-seconds", "90",
            "--expected-size", "$env:EXPECTED_SIZE"
          )
          for ($i = 1; $i -le 7; $i++) {
            $pyArgs += @("--carrier", [Environment]::GetEnvironmentVariable("STEGO_CARRIER_$i"))
          }
          python sims/openpuff_v400_extract.py @pyArgs
          if ($LASTEXITCODE -ne 0) { throw "Wrong-password native control could not execute" }
          $result = Get-Content probe-output/wrong-password/result.json -Raw | ConvertFrom-Json
          if (-not $result.carrier_chain_verified -or $result.carrier_count -ne 7) { throw "Wrong-password chain order not verified" }
          if (@($result.outputs | Where-Object { $_.sha256 -eq $env:EXPECTED_SHA256 }).Count -ne 0) {
            throw "Wrong password recovered the exact planted payload"
          }
          if ($result.native_probe_outcome -eq "inconclusive-timeout") {
            throw "Wrong-password control ended without a native terminal outcome"
          }
          Write-Host "Wrong-password outcome: $($result.native_probe_outcome)"

      - name: Reversed-order negative control
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyArgs = @(
            "--exe", "$env:OPENPUFF_EXE",
            "--password", "$env:PLANT_PASSWORD",
            "--bit-format", "Jpeg (Image)",
            "--bit-level", "1/5 (20%) - Medium",
            "--out", "probe-output/reversed-order",
            "--wait-seconds", "90",
            "--expected-size", "$env:EXPECTED_SIZE"
          )
          for ($i = 7; $i -ge 1; $i--) {
            $pyArgs += @("--carrier", [Environment]::GetEnvironmentVariable("STEGO_CARRIER_$i"))
          }
          python sims/openpuff_v400_extract.py @pyArgs
          if ($LASTEXITCODE -ne 0) { throw "Reversed-order native control could not execute" }
          $result = Get-Content probe-output/reversed-order/result.json -Raw | ConvertFrom-Json
          if (-not $result.carrier_chain_verified -or $result.carrier_count -ne 7) { throw "Reversed native chain order not verified" }
          if ($result.native_probe_outcome -eq "inconclusive-timeout") {
            throw "Reversed-order control ended without a native terminal outcome"
          }
          if (@($result.outputs | Where-Object { $_.sha256 -eq $env:EXPECTED_SHA256 }).Count -eq 0) {
            Write-Host "Reversed order did not recover the exact planted payload: $($result.native_probe_outcome)"
          } else {
            Write-Host "Reversed order ALSO recovered the exact payload; order-sensitivity is not supported by this plant"
          }

      - name: Preserve original native GUI, carrier bytes and exact outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpuff-v400-native-seven-carrier-evidence
          path: probe-output/
          if-no-files-found: warn
