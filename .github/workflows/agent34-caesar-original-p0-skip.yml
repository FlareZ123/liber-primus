name: Agent34 Caesar p0 running-text collision-skip original inverse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caesar-original-p0:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sims/lp2_p0_caesar_collision_skip_sft.cjs
      - run: node sims/lp2_p0_caesar_collision_skip_sft.cjs
