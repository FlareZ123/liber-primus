name: LP2 original-JPEG microspacing innovation SFT (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-geometry:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original image-analysis dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Audit original ink microspacing and paired rounding covariance
        shell: pwsh
        run: python sims/lp2_microspacing_innovation_sft.py
      - name: Test within-word residual alphabet and source-coordinate stability
        shell: pwsh
        run: python sims/lp2_withinword_gap_residual_sequence_sft.py
      - name: Upload within-word residual evidence
        uses: actions/upload-artifact@v4
        with:
          name: lp2-withinword-gap-residual-sft
          path: im-results/lp2-withinword-gap-residual-sequence-sft.json
