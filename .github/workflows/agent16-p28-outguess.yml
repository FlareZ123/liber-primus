name: Agent16 p28 OutGuess gate

on:
  push:
    paths:
      - ".github/workflows/agent16-p28-outguess.yml"
  workflow_dispatch:

jobs:
  outguess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify original p28 image
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum resources/liber-primus/45.jpg | cut -d' ' -f1)"
          echo "sha256=$actual"
          test "$actual" = "318bb587f4dcab11b4db7ba3b8bb13b7913ca79bb409e1c987595503a22e0522"

      - name: Build pinned OutGuess 0.4
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake build-essential git
          git clone --depth 1 --branch 0.4 https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          cd /tmp/outguess
          ./autogen.sh
          CFLAGS="-O2 -std=gnu17" ./configure --with-generic-jconfig
          sed -i 's/^#undef HAVE_PROTOTYPES/#define HAVE_PROTOTYPES/' src/jpeg-6b-steg/jconfig.h
          sed -i 's/^#undef HAVE_UNSIGNED_CHAR/#define HAVE_UNSIGNED_CHAR/' src/jpeg-6b-steg/jconfig.h
          sed -i 's/^#undef HAVE_UNSIGNED_SHORT/#define HAVE_UNSIGNED_SHORT/' src/jpeg-6b-steg/jconfig.h
          sed -i 's/^#undef HAVE_STDDEF_H/#define HAVE_STDDEF_H/' src/jpeg-6b-steg/jconfig.h
          sed -i 's/^#undef HAVE_STDLIB_H/#define HAVE_STDLIB_H/' src/jpeg-6b-steg/jconfig.h
          grep -E 'HAVE_(PROTOTYPES|UNSIGNED_CHAR|UNSIGNED_SHORT|STDDEF_H|STDLIB_H)' src/jpeg-6b-steg/jconfig.h
          make -j2
          sudo make install
          outguess 2>&1 | head -n 2 || true

      - name: Charge source-motivated OutGuess keys
        shell: bash
        run: |
          set +e
          set -u
          image="resources/liber-primus/45.jpg"
          rm -rf outguess-results
          mkdir outguess-results

          inspect_output() {
            label="$1"
            file="$2"
            status="$3"
            echo "=== $label exit=$status ==="
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file")"
              echo "bytes=$bytes"
              sha256sum "$file"
              file "$file" || true
              xxd -l 256 "$file" || true
              strings -n 4 "$file" | head -n 40 || true
            else
              echo "no-output-file"
            fi
          }

          run_first() {
            label="$1"
            key="$2"
            out="outguess-results/${label}.bin"
            log="outguess-results/${label}.log"
            if [ "$key" = "__DEFAULT__" ]; then
              outguess -r "$image" "$out" >"$log" 2>&1
            else
              outguess -r -k "$key" "$image" "$out" >"$log" 2>&1
            fi
            status=$?
            cat "$log"
            inspect_output "$label" "$out" "$status"
          }

          run_first "first-default" "__DEFAULT__"
          for entry in \
            "HERE:HERE" \
            "here:here" \
            "READ:READ" \
            "OUT:OUT" \
            "FIND:FIND" \
            "NUMBERS:NUMBERS" \
            "DIRECTION:DIRECTION" \
            "READOUT:READOUT" \
            "readout:readout" \
            "READ_OUT:READ OUT" \
            "read_out:read out" \
            "READOUTHERE:READOUTHERE" \
            "readouthere:readouthere" \
            "READOUT_HERE:READOUT HERE" \
            "READ_OUT_HERE:READ OUT HERE" \
            "read_out_here:read out here"
          do
            label="${entry%%:*}"
            key="${entry#*:}"
            run_first "first-${label}" "$key"
          done

          echo "=== result inventory ==="
          find outguess-results -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

          echo "=== calibrated positive control: upstream OutGuess test JPEG ==="
          printf 'OUTGUESS-CALIBRATION\nBEGIN PGP SIGNED MESSAGE\n' >/tmp/outguess-known.txt
          outguess -k "READ OUT" -d /tmp/outguess-known.txt /tmp/outguess/tests/test.jpg /tmp/outguess-calibrated-test.jpg >/tmp/outguess-embed-test.log 2>&1
          embed_test_status=$?
          cat /tmp/outguess-embed-test.log
          echo "embed-test-status=$embed_test_status"
          if [ "$embed_test_status" -eq 0 ]; then
            outguess -k "READ OUT" -r /tmp/outguess-calibrated-test.jpg /tmp/outguess-recovered-test.txt >/tmp/outguess-recover-test.log 2>&1
            recover_test_status=$?
            cat /tmp/outguess-recover-test.log
            echo "recover-test-status=$recover_test_status"
            cmp /tmp/outguess-known.txt /tmp/outguess-recovered-test.txt
            echo "upstream-control=PASS"
          else
            echo "upstream-control=FAIL"
          fi

          echo "=== calibrated positive control: exact p28 carrier ==="
          printf 'X' >/tmp/outguess-one-byte.txt
          outguess -k "READ OUT" -d /tmp/outguess-one-byte.txt "$image" /tmp/outguess-calibrated-p28.jpg >/tmp/outguess-embed-p28.log 2>&1
          embed_p28_status=$?
          cat /tmp/outguess-embed-p28.log
          echo "embed-p28-status=$embed_p28_status"
          if [ "$embed_p28_status" -eq 0 ]; then
            outguess -k "READ OUT" -r /tmp/outguess-calibrated-p28.jpg /tmp/outguess-recovered-p28.txt >/tmp/outguess-recover-p28.log 2>&1
            recover_p28_status=$?
            cat /tmp/outguess-recover-p28.log
            echo "recover-p28-status=$recover_p28_status"
            cmp /tmp/outguess-one-byte.txt /tmp/outguess-recovered-p28.txt
            echo "p28-carrier-control=PASS"
          else
            echo "p28-carrier-control=FAIL"
          fi

          echo "=== candidate statistics ==="
          python3 - <<'PY'
          import glob, math, os
          from collections import Counter
          
          markers = [
              b"BEGIN PGP", b"3301", b"http", b"onion", b"LIBER", b"CICADA",
              b"OUTGUESS", b"READ", b"HERE"
          ]
          for name in sorted(glob.glob("outguess-results/first-*.bin")):
              data = open(name, "rb").read()
              if data:
                  counts = Counter(data)
                  entropy = -sum((n/len(data))*math.log2(n/len(data)) for n in counts.values())
                  printable = sum((32 <= b <= 126) or b in (9,10,13) for b in data) / len(data)
              else:
                  entropy = 0.0
                  printable = 0.0
              found = [m.decode("ascii") for m in markers if m.lower() in data.lower()]
              print(
                  os.path.basename(name),
                  "bytes=", len(data),
                  "entropy=", f"{entropy:.6f}",
                  "printable=", f"{printable:.6f}",
                  "markers=", ",".join(found) if found else "-"
              )
          PY

