name: Agent7 Wisdom word-prime row-key gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact original-cipher and planted-control gate
        run: |
          node --check sims/lp2_wisdom_wordprime_rowkey_gate.cjs
          node sims/lp2_wisdom_wordprime_rowkey_gate.cjs
