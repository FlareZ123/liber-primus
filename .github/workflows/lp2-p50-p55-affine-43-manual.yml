name: LP2 p50 bracket43 to p55 affine key family
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affine-original:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp2_p50_43byte_p55_inner43_affine_fullfamily_sft.cjs
