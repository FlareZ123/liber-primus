name: LP2 2016 signed-source OutGuess key gate

on:
  workflow_dispatch:

jobs:
  source-key:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out original manuscript and historical source
        uses: actions/checkout@v4
      - name: Install pinned maintained OutGuess extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential libjpeg-dev
          git clone --depth 1 https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          git -C /tmp/outguess fetch --depth 1 origin 24810e14327c2bbeedeaadd3e24491f2a4425c02
          git -C /tmp/outguess checkout --detach 24810e14327c2bbeedeaadd3e24491f2a4425c02
          cd /tmp/outguess
          ./autogen.sh
          CFLAGS='-O2 -std=gnu11' ./configure --with-generic-jconfig
          make -j2 CC='gcc -std=gnu11' CFLAGS='-O2 -std=gnu11'
          sudo make install
      - name: Execute fixed original signed phrase key extraction
        run: |
          node --check sims/lp2_signed2016_source_outguess_sft.cjs
          node sims/lp2_signed2016_source_outguess_sft.cjs
      - name: Preserve source-key scan and any authenticated candidates
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lp2-signed2016-source-outguess
          path: outguess-signed2016-results/
          if-no-files-found: warn
          retention-days: 30
