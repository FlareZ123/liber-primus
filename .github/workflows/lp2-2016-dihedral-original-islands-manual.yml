name: LP2 Corrected 2016 Dihedral 40-Rune Island Search
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-islands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-corrected original 2016 invariant and genuine p57 control
        run: |
          node --check sims/lp2_2016_dihedral_ngram_original_plaintext_island_sft.cjs
          node sims/lp2_2016_dihedral_ngram_original_plaintext_island_sft.cjs
