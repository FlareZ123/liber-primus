name: Agent39 original full-height LP2 initial glyph classifier
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-p56-template:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-image readers
        shell: pwsh
        run: |
          & python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read giant capitals without unknown-page training labels
        shell: pwsh
        run: |
          & python sims/lp2_round9_fullcaps_p56_template_sft.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
