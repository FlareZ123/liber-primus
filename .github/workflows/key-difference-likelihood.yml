name: LP2 substitution-invariant key difference likelihood

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Optimize and compare label-free hidden-pad likelihood
        run: node sims/key_difference_likelihood.cjs
