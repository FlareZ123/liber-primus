name: Agent36 original-grid255 page pair key inverse (isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid255:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original 255 runes against original 256-byte grid key
        run: |
          node --check sims/grid255_alternating_pages_inverse.cjs
          node sims/grid255_alternating_pages_inverse.cjs
