name: Agent36 tree-linked original-page rune pad test (isolated branch)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-key:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact source-derived tree page 32 to page 55 GP pad inverse
        run: |
          node --check sims/tree_linked_crosspage_pad_inverse.cjs
          node sims/tree_linked_crosspage_pad_inverse.cjs
