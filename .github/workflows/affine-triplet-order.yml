name: LP2 affine triplet order
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affine-triplet-order:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run affine-triplet scan and planted-control check
        run: node sims/affine_triplet_order.cjs
