name: Agent 5 original p22 and 2015 source-key tests verified
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent5-new-source-locked-two-sft.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-p22-and-2015:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original p22 unique 32 fragments and EAR equal rune
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path trial-output | Out-Null
          node sims/lp2_p22_ear_32row_p50_direct_sft.cjs *>&1 | Tee-Object -FilePath trial-output/p22-fragments.log
          if ($LASTEXITCODE -ne 0) { throw 'Original p22 test failure, see captured artifact' }
      - name: Historical EAR stanza original p22 cipher inverse
        shell: pwsh
        continue-on-error: true
        run: |
          node sims/lp2_p22_ear_rune_poem_stanza_original_sft.cjs *>&1 | Tee-Object -FilePath trial-output/p22-stanza.log
          if ($LASTEXITCODE -ne 0) { throw 'Original p22 stanza failure, see captured artifact' }
      - name: Dated 2015 forty events and source p32 border
        shell: pwsh
        continue-on-error: true
        run: |
          node sims/lp2_2015_prime_delta_40_event_values_original_sft.cjs *>&1 | Tee-Object -FilePath trial-output/2015-events.log
          if ($LASTEXITCODE -ne 0) { throw '2015 events failure, see captured artifact' }
      - name: Preserve independent source results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-source-key-debug-original
          path: trial-output/
          if-no-files-found: warn
