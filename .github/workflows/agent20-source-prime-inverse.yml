name: Agent 20 source-prime exact inverse

on:
  workflow_dispatch:

jobs:
  source-prime-inverse:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original source-linked prime-triplet challenge
        shell: pwsh
        run: node sims/red_prime_gap_affine_echo.cjs
      - name: Original exact six-lane inverse and matched-key controls
        shell: pwsh
        run: node sims/red53_autoregressive_pad_inverse.cjs
      - name: Source-selected global six-lane key and original heldout
        shell: pwsh
        run: node sims/red53_global_pad_inverse.cjs
      - name: Original 2013 Instar source-seed GP28 inverse and planted control
        shell: pwsh
        run: node sims/instar2013_source_seed_inverse.cjs
      - name: Label invariant 168-position original key recurrence exclusion
        shell: pwsh
        run: node sims/red53_period168_label_invariant.cjs

      - name: CPython 2.7 original-source 720-way inverse and positive
        shell: pwsh
        run: node sims/instar2013_python_mt_inverse.cjs

      - name: Original lag-six orbit permutation invariant with native-GP controls
        shell: pwsh
        run: node sims/lag6_orbit_static_mapping_gate.cjs
