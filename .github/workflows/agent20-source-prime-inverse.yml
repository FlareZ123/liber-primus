name: Agent 20 source-prime exact inverse

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose existing source-prime suite or coordinate fractionation proof
        type: choice
        default: source
        required: true
        options:
          - source
          - coordinate
          - red32

jobs:
  source-prime-inverse:
    if: ${{ inputs.mode == 'source' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original source-linked prime-triplet challenge
        shell: pwsh
        run: node sims/red_prime_gap_affine_echo.cjs
      - name: Original exact six-lane inverse and matched-key controls
        shell: pwsh
        run: node sims/red53_autoregressive_pad_inverse.cjs
      - name: Source-selected global six-lane key and original heldout
        shell: pwsh
        run: node sims/red53_global_pad_inverse.cjs
      - name: Original 2013 Instar source-seed GP28 inverse and planted control
        shell: pwsh
        run: node sims/instar2013_source_seed_inverse.cjs
      - name: Label invariant 168-position original key recurrence exclusion
        shell: pwsh
        run: node sims/red53_period168_label_invariant.cjs

      - name: CPython 2.7 original-source 720-way inverse and positive
        shell: pwsh
        run: node sims/instar2013_python_mt_inverse.cjs

      - name: Original lag-six orbit permutation invariant with native-GP controls
        shell: pwsh
        run: node sims/lag6_orbit_static_mapping_gate.cjs

  coordinate-fractionation:
    if: ${{ inputs.mode == 'coordinate' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Key-independent original GP28 coordinate gate and secret-key plant
        shell: pwsh
        run: node sims/gp28_coordinate_fractionation_gate.cjs
      - name: All-secret 5x6 29-runes-plus-word-space coordinate capacity proof
        shell: pwsh
        run: node sims/gp30_space_fractionation_gate.cjs
      - name: Exhaustive all 41,471 nonzero full-book cyclic shifts of both alphabets
        shell: pwsh
        run: node sims/coordinate_fractionation_all_lag_gate.cjs

  red32-aes192-inverse:
    if: ${{ inputs.mode == 'red32' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original red32 base60 AES192 source-key, grid and rune inverses
        shell: pwsh
        run: node sims/red32_base60_aes192_inverse.cjs
