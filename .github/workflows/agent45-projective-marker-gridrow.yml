name: Agent45 manual original-LP2 source key probes
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Select a source-only original-input cryptanalytic gate"
        required: false
        type: choice
        options:
          - projective
          - 2013-cookie
          - 2013-wisdom
        default: projective
jobs:
  projective-marker-gridrow:
    if: ${{ inputs.probe == 'projective' || inputs.probe == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-anchored projective marker schedule
        run: node sims/projective_marker_gridrow_nonce_probe.cjs | tee projective-marker-gridrow-results.json
      - name: Preserve exact probe diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: projective-marker-gridrow-results
          path: projective-marker-gridrow-results.json
  historical-2013-cookie-source:
    if: ${{ inputs.probe == '2013-cookie' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-frozen 2013 cookie original cipher and native control
        run: node sims/cicada2013_cookies_original_inverse_sft.cjs | tee 2013-cookies-original-inverse.json
      - name: Preserve original-input diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: 2013-cookies-original-inverse
          path: 2013-cookies-original-inverse.json
      - name: Test cookies as literal keys for the original printed LP2 byte table
        run: node sims/cicada2013_cookie_grid256_sft.cjs | tee 2013-cookie-grid256-results.json
      - name: Preserve table/key original-input diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: 2013-cookie-grid256-original
          path: 2013-cookie-grid256-results.json

  historical-2013-wisdom-source:
    if: ${{ inputs.probe == '2013-wisdom' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exactly preserved 2013 ISO file against 9 original LP2 sections
        run: node sims/cicada2013_wisdom_source_key_sft.cjs | tee wisdom-original-inverse.json
      - name: Preserve original ciphertext and synthetic-control diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: 2013-wisdom-source-inverse
          path: wisdom-original-inverse.json
