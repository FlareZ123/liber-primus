name: Agent45 projective marker gridrow nonce probe
on:
  push:
    branches: [main]
    paths:
      - sims/projective_marker_gridrow_nonce_probe.cjs
      - .github/workflows/agent45-projective-marker-gridrow.yml
jobs:
  projective-marker-gridrow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-anchored projective marker schedule
        run: node sims/projective_marker_gridrow_nonce_probe.cjs | tee projective-marker-gridrow-results.json
      - name: Preserve exact probe diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: projective-marker-gridrow-results
          path: projective-marker-gridrow-results.json
