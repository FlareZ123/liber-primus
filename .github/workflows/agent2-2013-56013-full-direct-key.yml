name: Agent2 2013 original ISO full 560.13 direct LP2 key offset scan
on:
  push:
    paths:
      - '.github/workflows/agent2-2013-56013-full-direct-key.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-whole-byte-tape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original ISO decoder and array engine
        run: python -m pip install --disable-pip-version-check pycdlib==1.22.0 requests==2.32.5 numpy==1.26.4 filelock==3.20.0
      - name: Check complete original ISO and search every DATA/560.13 byte offset
        run: python sims/cicada2013_56013_full_literal_pad_scan_sft.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent2-2013-original-56013-full-offset-cryptanalytic-report
          path: |
            im-results/cicada2013_56013_full_direct_pad_scan.json
          if-no-files-found: warn
