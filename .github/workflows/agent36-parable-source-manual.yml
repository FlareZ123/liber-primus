name: Agent 36 Parable Source Route
on:
  workflow_dispatch:
jobs:
  source-route:
    runs-on: windows-latest
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check sims/lp2_2013_parable_table_xor_word20_sft.cjs
      - name: Run original-input test
        run: node sims/lp2_2013_parable_table_xor_word20_sft.cjs
      - name: Check whole-register radix test syntax
        run: node --check sims/lp2_p55_dh5_whole_base29_to761_sft.cjs
      - name: Test full original-p55 DH orbit serialization
        run: node sims/lp2_p55_dh5_whole_base29_to761_sft.cjs
      - name: Check source-mapped 43-to-43 inverse syntax
        run: node --check sims/lp2_p32_route43_p55_interior_peel_sft.cjs
      - name: Test original p32 compass key on p55 inner runes
        run: node sims/lp2_p32_route43_p55_interior_peel_sft.cjs
