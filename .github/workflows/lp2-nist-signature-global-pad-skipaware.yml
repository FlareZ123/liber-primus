name: LP2 NIST signature-global pad skip-aware gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lp2-nist-signature-global-pad-skipaware
  cancel-in-progress: false

jobs:
  bounded-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Liber Primus research repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout pinned public-pad decoder and NIST controls
        uses: actions/checkout@v4
        with:
          repository: Dukotah/cicada3301
          ref: fd13fe88a0bfef13f07c03c666b831e9ddae7f2d
          path: external
          fetch-depth: 1
          sparse-checkout: |
            liber-primus
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned decoder runtime dependencies
        run: |
          mkdir -p run-artifacts/lp2-nist-global-pad
          python -m pip install --upgrade pip
          python -m pip install numpy cryptography filelock
          python -m pip freeze | tee run-artifacts/lp2-nist-global-pad/pip-freeze.txt

      - name: Validate external trust anchor and exact decoder inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f external/liber-primus/analysis/round24/C8-date-indexed-pad/run_c8.py
          test -f external/liber-primus/analysis/campaign18_skip/skipdecode.py
          test -f external/liber-primus/analysis/round19/I1/driftbeam.py
          test -f external/liber-primus/analysis/round20/HITFN/hitfn20.py
          test -f external/liber-primus/data/english_quadgrams.txt
          python external/liber-primus/tests/validate.py

      - name: Build pinned register-panel model
        run: |
          python external/liber-primus/analysis/round19/I2/build_models.py

      - name: Run one timestamp-anchored NIST global-pad gate
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          python sims/lp2_nist_signature_global_pad_skipaware_sft.py \
            --external-root external/liber-primus \
            --output run-artifacts/lp2-nist-global-pad/report.json \
            2>&1 | tee run-artifacts/lp2-nist-global-pad/run.log

      - name: Preserve pulse records and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-nist-signature-global-pad-skipaware
          path: |
            run-artifacts/lp2-nist-global-pad/
            external/liber-primus/analysis/round24/C8-date-indexed-pad/cache/
          if-no-files-found: warn
