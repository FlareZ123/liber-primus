name: Agent26 solved-Cicada word-length order gate
on:
  push:
    paths:
      - '.github/workflows/agent26-wordlength-trigram-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-native:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Word-length trigram with independent solved-Cicada prose
        shell: pwsh
        run: |
          node sims/lp2_wordlength_trigram_solved_cicada_gate_sft.cjs *> sft-wordlength-output.txt
          $result = $LASTEXITCODE
          Get-Content sft-wordlength-output.txt
          exit $result
      - name: Preserve diagnostic stdout and stderr
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent26-wordlength-diagnostic
          path: sft-wordlength-output.txt
          if-no-files-found: error

