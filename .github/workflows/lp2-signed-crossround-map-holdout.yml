name: LP2 signed cross-round 58-word map holdout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-map:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout original source materials
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test frozen 2012, 2014 and 2016 signed-message addresses
        run: |
          node --check sims/lp2_signed_2012_2014_2016_wordmap_holdout_sft.cjs
          node sims/lp2_signed_2012_2014_2016_wordmap_holdout_sft.cjs
