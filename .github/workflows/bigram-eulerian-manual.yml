name: Higher-order LP2 bigram-conditional recurrence probe
on:
  workflow_dispatch:

jobs:
  higher-order:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact-constraint higher-order null and positive plant
        run: node sims/bigram_eulerian_null.cjs
