name: LP2 28-step secret phase permutation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gp-original-source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original LP2 heldout and solved-page native secret permutation inverses
        run: node sims/delta28_periodic_secret_permutation_gate.cjs
