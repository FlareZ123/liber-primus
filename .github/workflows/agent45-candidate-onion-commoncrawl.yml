name: Agent45 - candidate onion Common Crawl check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent45-candidate-onion-commoncrawl
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax and self-test
        run: |
          node --check sims/lp2_candidate_onion_commoncrawl_probe.cjs
          node sims/lp2_candidate_onion_commoncrawl_probe.cjs --selftest

      - name: Query the exact candidate host
        run: |
          mkdir -p probe-output
          node sims/lp2_candidate_onion_commoncrawl_probe.cjs > probe-output/lp2-candidate-onion-commoncrawl.json

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-candidate-onion-commoncrawl
          path: probe-output/lp2-candidate-onion-commoncrawl.json
          if-no-files-found: warn
