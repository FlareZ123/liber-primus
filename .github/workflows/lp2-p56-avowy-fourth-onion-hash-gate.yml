name: LP2 p56 avowy fourth-onion hash gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hash-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hash exact archived fourth-onion objects
        run: node sims/lp2_p56_avowy_fourth_onion_hash_gate.cjs
