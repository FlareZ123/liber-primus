name: Agent3 source-native original-cipher SFTs
on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Choose a bounded original-input test'
        required: true
        type: choice
        default: wordbreak
        options:
          - wordbreak
          - fib5-gromark
permissions:
  contents: read
jobs:
  original_source_sft:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: All-secret original-source word-break contradiction
        if: inputs.test == 'wordbreak'
        run: node sims/lp2_local_rune_pair_wordbreak_allsecret_sft.cjs
      - name: Exhaustive five-digit Fibonacci Gromark source-native gate
        if: inputs.test == 'fib5-gromark'
        run: node sims/lp2_gromark_fib5_allsecret_original_sft.cjs
