name: Agent 17 Calypne 2016 Later Pages Source Review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-page-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read dated source posts in remaining 2016 claim thread pages
        run: |
          node --check sims/lp2_2016_calypne_later_pages_witness_sft.cjs
          node sims/lp2_2016_calypne_later_pages_witness_sft.cjs
