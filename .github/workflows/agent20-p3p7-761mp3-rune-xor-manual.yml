name: Agent20 p3-p7 761 MP3 rune-byte XOR gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent20-p3p7-761mp3-rune-xor
  cancel-in-progress: false

jobs:
  source-fixed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and authenticate the original 2013 761.MP3
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/761.MP3 \
            https://raw.githubusercontent.com/rtkd/iddqd/f2267b0c2f1e1d2662806b90b9c3a2953b3a7023/2013/02/761.MP3
          echo '83008217439110c3b824898af73b99cb2cf0657dda88cb363c3aa34a4ec0a460  /tmp/761.MP3' | sha256sum -c -
      - name: Reproduce source chapter and checksum assertions
        run: node sims/lp2_p3_p7_809_761_1033_source_gate_sft.cjs
      - name: Run only the two canonical GP-byte XOR variants
        run: node sims/lp2_p3_p7_761_mp3_rune_xor_sft.cjs /tmp/761.MP3
