name: LP2 original p27 Moravia historical plates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-moravia-plate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source plate matching dependencies
        run: python -m pip install numpy opencv-python-headless pymupdf requests filelock
      - name: Test pre-2014 Moravia plates with fixed original p27 positive control
        run: python sims/lp2_p27_moravia_original_plate_sft.py
      - name: Save exact original-source plate metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-p27-moravia-historical-registration
          path: im-results/lp2-p27-moravia-original-plate-registration.json
          if-no-files-found: warn
          retention-days: 90
