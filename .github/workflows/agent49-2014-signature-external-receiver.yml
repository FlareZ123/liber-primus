name: Agent49 original 2014 signature exact external receiver
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-external-receiver:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe the exact signature-derived public video and Pastebin IDs
        run: node sims/lp2_2014_signature_exact_external_receiver_probe.cjs
