name: Agent16 LP2 source-zero 36-mark original gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-zero:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source-bracket and 36-mark SFT syntax
        run: node --check sims/lp2_grid_zero192_229_ink36_knownending_sft.cjs
      - name: Original grid and solved ending gate
        run: node sims/lp2_grid_zero192_229_ink36_knownending_sft.cjs
