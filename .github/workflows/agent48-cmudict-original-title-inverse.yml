name: Agent48 original p0 enlarged dictionary source-factor inverse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-p0-cmudict-source-inverse:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout original manuscript and read-only research script
        uses: actions/checkout@v7
      - name: Select Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install fixed external English pronunciation dictionary
        shell: pwsh
        run: |
          & python -m pip install --disable-pip-version-check cmudict==1.1.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute exhaustive source-factor inverse on original p0
        shell: pwsh
        run: |
          & python sims/lp2_p0_cmudict_quartic_degree9_native_wordshape_sft.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
