name: Agent30 p13 physical fold132 all-secret wordtree SFT
on:
  workflow_dispatch:

jobs:
  fold132:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fold physical original p13 lines under arbitrary GP29 pad
        run: node sims/lp2_p13_physical_fold132_allsecret_wordtree_sft.cjs
