name: LP2 five-passage MIX and p56 F-transparent SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run original-input SFT
        run: node sims/lp2_five_numbered_mix_primephi_sft.cjs
