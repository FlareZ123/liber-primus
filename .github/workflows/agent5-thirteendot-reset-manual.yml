name: Agent5 thirteen-dot reset-boundary gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reset-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sims/lp2_thirteendot_reset_boundary_sft.cjs
      - run: node sims/lp2_thirteendot_reset_boundary_sft.cjs
