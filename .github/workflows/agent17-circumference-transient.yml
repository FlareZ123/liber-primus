name: Agent17 LP2 original 13x133 circumference extraction SFT
on:
  workflow_dispatch:
jobs:
  shell-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate GP29 ring extraction
        run: node --check sims/lp2_onion7_133_perimeter_p32_grid_sft.cjs
      - name: Execute original and native GP plants
        run: node sims/lp2_onion7_133_perimeter_p32_grid_sft.cjs
