name: Agent7 p0 post-IDEA uniform checksum gate
on:
  workflow_dispatch:
jobs:
  sft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp2_p0_postidea_uniform_checksum_sft.cjs
