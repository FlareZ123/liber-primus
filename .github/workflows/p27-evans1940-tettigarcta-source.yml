name: LP2 p27 Evans 1940 Tettigarcta forewing source test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register-evans-forewing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source registration dependencies
        run: python -m pip install numpy opencv-python-headless pymupdf requests
      - name: Download and test the identified Evans Fig.12 source
        run: python sims/lp2_p27_evans1940_tettigarcta_source_sft.py
      - name: Preserve source bytes and rasterized pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-p27-evans1940-tettigarcta-registration
          path: |
            im-results/lp2-p27-evans1940-registration.json
            im-results/evans1940-pages/*.png
          if-no-files-found: warn
          retention-days: 90
