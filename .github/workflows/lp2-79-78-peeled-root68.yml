name: LP2 79-78 peel with Parable root 68

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-fixed 79/78 matrix probe
        run: node sims/lp2_79_78_peeled_primitive_root_probe.cjs
