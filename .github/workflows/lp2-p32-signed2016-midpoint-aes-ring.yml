name: LP2 p32 signed-2016 midpoint AES ring-key original-input gate

on:
  workflow_dispatch:

jobs:
  aes-ring:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-selected AES-128/192/256 ring-key inverse
        run: node sims/p32_2016_midpoint_aes_ring_key_sft.cjs
