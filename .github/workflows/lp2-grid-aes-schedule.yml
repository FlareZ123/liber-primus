name: LP2 grid exact AES schedule and round-state gate

on:
  workflow_dispatch:

jobs:
  aes-grid-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original 256-byte AES SFT
        run: node sims/lp2_grid_aes_schedule_round_state_sft.cjs
