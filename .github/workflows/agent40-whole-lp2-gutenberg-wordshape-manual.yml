name: Agent40 whole-LP2 original word-length Gutenberg source match

on:
  workflow_dispatch:
    inputs:
      shard_list:
        description: 'JSON list of fixed Gutenberg Parquet shards (0 through 58)'
        required: true
        default: '[0]'
        type: string

permissions:
  contents: read

jobs:
  source-literal-match:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(inputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public data and lock dependencies
        run: python -m pip install pyarrow huggingface_hub filelock
      - name: Search every original LP2 word start against a fixed Gutenberg shard
        run: python sims/lp2_fulltext_gutenberg_wordlength_sam_sft.py --shard ${{ matrix.shard }} --output reports/shard-${{ matrix.shard }}.json
      - name: Preserve exact match records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent40-fullword-gutenberg-${{ matrix.shard }}
          path: reports/*.json
          if-no-files-found: warn
