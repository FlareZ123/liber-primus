name: LP2 arbitrary outer-alphabet assignment controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assignment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact matching implementation
        run: node sims/test_outer_permutation.cjs
      - name: Measure planted controls and drift impact
        run: node sims/outer_permutation_assignment.cjs
      - name: Test joint alphabet and key-pointer Viterbi
        run: node sims/outer_permutation_alignment.cjs
      - name: Test word-context alpha matching
        run: node sims/outer_permutation_word_context.cjs
      - name: Scan actual LP2 against defined SHA stream candidates
        run: node sims/outer_permutation_sha_probe.cjs
      - name: Try prefix-bootstrapped joint key-pointer recovery
        run: node sims/outer_permutation_context_alignment.cjs
      - name: Measure 50 independent outer-permutation recovery controls
        run: node sims/outer_permutation_context_power.cjs
      - name: Joint skip-and-alphabet search against actual LP2
        run: node sims/outer_permutation_real_skip_scan.cjs
