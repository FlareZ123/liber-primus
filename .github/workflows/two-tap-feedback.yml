name: LP2 two-tap extended feedback
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependency
        run: python -m pip install numpy==2.3.5
      - name: Exhaust two-tap affine feedback and controls
        run: python sims/two_tap_feedback.py
