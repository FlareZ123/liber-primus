name: Agent40 WILL familywise and blind successor gate

on:
  push:
    paths:
      - "sims/agent40_will_familywise_blind_successor_sft.cjs"
      - ".github/workflows/agent40-will-familywise-blind-successor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frozen familywise and blind-successor audit
        run: node sims/agent40_will_familywise_blind_successor_sft.cjs
