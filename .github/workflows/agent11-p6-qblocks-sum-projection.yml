name: Agent11 q-block serializer gates

on:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frozen source-only families and post-freeze graders
        run: |
          node sims/lp2_p6_qblocks_sum_projected_decoder_sft.cjs > /dev/null
          node sims/lp2_p6_qblocks_outerH_sum_projected_decoder_sft.cjs > /dev/null
          node sims/lp2_p6_qblocks_sum_projection_grader_sft.cjs
          node sims/lp2_p6_qblocks_mirror_affine_sum_family_sft.cjs > /dev/null
          node sims/lp2_p6_qblocks_mirror_affine_position_sum_family_sft.cjs > /dev/null
          node sims/lp2_p6_qblocks_receiver_affine_grader_sft.cjs
          node sims/lp2_p6_qblocks_matrix_recurrence_pretarget_sft.cjs > /dev/null
          node sims/lp2_p6_qblocks_matrix_recurrence_checksum_gate_sft.cjs
          node sims/lp2_p6_qblocks_mobius_recurrence_pretarget_sft.cjs > /dev/null
          node sims/lp2_p6_qblocks_mobius_recurrence_checksum_gate_sft.cjs
