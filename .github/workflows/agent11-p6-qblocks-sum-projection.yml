name: Agent11 q-block sum projection gate

on:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pretarget generators and post-freeze grader
        run: |
          node sims/lp2_p6_qblocks_sum_projected_decoder_sft.cjs > /tmp/uniform.json
          node sims/lp2_p6_qblocks_outerH_sum_projected_decoder_sft.cjs > /tmp/outer.json
          node -e "const fs=require('fs'),a=require('assert').deepStrictEqual;a(JSON.parse(fs.readFileSync('/tmp/uniform.json')),JSON.parse(fs.readFileSync('im-results/lp2-p6-qblocks-sum-projected-pretarget-output.json')))"
          node -e "const fs=require('fs'),a=require('assert').deepStrictEqual;a(JSON.parse(fs.readFileSync('/tmp/outer.json')),JSON.parse(fs.readFileSync('im-results/lp2-p6-qblocks-outerH-sum-projected-pretarget-output.json')))"
          node sims/lp2_p6_qblocks_sum_projection_grader_sft.cjs
