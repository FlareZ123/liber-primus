name: Agent28 five-phase feedback all-secret original-inverse gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-stateful-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-native five-phase stateful feedback inverse and 750 controls
        run: |
          node --check sims/lp2_wordfive_cipherfeedback_secret_alphabet_sft.cjs
          node sims/lp2_wordfive_cipherfeedback_secret_alphabet_sft.cjs
