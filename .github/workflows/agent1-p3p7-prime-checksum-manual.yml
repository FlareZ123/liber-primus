name: Agent 1 original-source bounded cryptanalytic gates

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Choose a bounded, independently executable original-source SFT
        required: true
        default: p3p7
        type: choice
        options:
          - p3p7
          - boundary
          - terminal-hill6
          - ring-erasure
          - p0-block39

permissions:
  contents: read

jobs:
  original-source:
    if: ${{ inputs.suite == 'p3p7' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original p3-p7 checksum and strict-F gate
        run: node sims/lp2_p3_p7_809_761_1033_source_gate_sft.cjs

  original-boundary:
    if: ${{ inputs.suite == 'boundary' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original boundary-carried anti-repeat codec and 55 native plants
        run: node sims/lp2_no_repeat_boundary_enumerative_sft.cjs

  original-terminal-hill6:
    if: ${{ inputs.suite == 'terminal-hill6' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check full-secret original interior 30x6 Hill and affine rank
        run: node sims/lp2_grid256_terminal_inner180_hill6_sft.cjs

  original-ring-erasure:
    if: ${{ inputs.suite == 'ring-erasure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original GF257 terminal ring erasure gate
        run: node sims/lp2_terminal256_ring_gf257_erasure_sft.cjs

  p0-block39:
    if: ${{ inputs.suite == 'p0-block39' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the language-blind geometric branch census
        run: node --check sims/lp2_p0_27square_block39_frozen_branch_census_sft.cjs
      - name: Run original-input block39 census
        run: node sims/lp2_p0_27square_block39_frozen_branch_census_sft.cjs
