name: LP2 period-five original F-clock key exclusion
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-original-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact all-key original source test
        run: node sims/lp2_allsecret_period5_ftransparent_exact_sft.cjs
