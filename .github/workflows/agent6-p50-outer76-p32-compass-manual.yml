name: Agent6 p50 outer76 p32 compass original gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-exact p55 key falsifier
        run: node sims/lp2_p50_outer76_p32_compass_p55_original_sft.cjs
