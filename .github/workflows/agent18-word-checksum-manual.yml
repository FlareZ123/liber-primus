name: Agent18 original-input research gates

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Select the independently bounded original-input gate
        required: true
        type: choice
        default: legacy
        options:
          - legacy
          - rare-marker
          - previous-literal-word
          - four-dot-phi
          - p7-red-scy
          - table-sentence-pair
          - 3301-1033-sixphase

permissions:
  contents: read

jobs:
  exact-original-input:
    if: ${{ inputs.gate == 'legacy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact source-input reproducible scripts
        run: |
          node --check sims/lp2_running_checksum_anyalphabet_sft.cjs
          node --check sims/lp2_running_wordprime_anyalphabet_sft.cjs
          node sims/lp2_running_checksum_anyalphabet_sft.cjs
          node sims/lp2_running_wordprime_anyalphabet_sft.cjs

  rare-marker-original:
    if: ${{ inputs.gate == 'rare-marker' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test lossless 29-symbol rare-marker feedback against original LP2
        run: |
          node --check sims/lp2_raremarker_feedback29_original_sft.cjs
          node sims/lp2_raremarker_feedback29_original_sft.cjs

  previous-literal-word-original:
    if: ${{ inputs.gate == 'previous-literal-word' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test previous ciphertext-word literal Vigenere
        run: |
          node --check sims/lp2_previous_cipherword_literal_vigenere_original_sft.cjs
          node sims/lp2_previous_cipherword_literal_vigenere_original_sft.cjs

  four-dot-phi-original:
    if: ${{ inputs.gate == 'four-dot-phi' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact 138-stop source control and solved-p56 prime-clock check
        run: |
          node --check sims/lp2_138_fourdot_phi_reset_original_sft.cjs
          node sims/lp2_138_fourdot_phi_reset_original_sft.cjs

  p7-red-scy-original:
    if: ${{ inputs.gate == 'p7-red-scy' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original red scoped source key and six-eight split
        run: |
          node --check sims/lp2_p7_unique_redstop_scy_keyhandoff_sft.cjs
          node sims/lp2_p7_unique_redstop_scy_keyhandoff_sft.cjs

  table-sentence-pair-original:
    if: ${{ inputs.gate == 'table-sentence-pair' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test full original punctuation windows flanking the numeric table
        run: |
          node --check sims/lp2_p49_table_sentence_pair_sft.cjs
          node sims/lp2_p49_table_sentence_pair_sft.cjs

  sixphase-original:
    if: ${{ inputs.gate == '3301-1033-sixphase' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original GP29 3301/1033 full-word rotor and global-phase inverse
        run: |
          node --check sims/lp2_3301_1033_sixphase_rotor_original_sft.cjs
          node sims/lp2_3301_1033_sixphase_rotor_original_sft.cjs
