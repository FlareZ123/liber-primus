name: Agent 18 p7 ciphertext-driven projective long-word gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-projective:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original LP2 all-secret projective exclusion
        run: node sims/lp2_p7_cipherdriven_projective_word_sft.cjs
