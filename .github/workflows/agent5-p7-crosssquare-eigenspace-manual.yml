name: Agent 5 P7 square-eigenspace source gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-first-inverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original-p7 and 2014 square GF29 bridge
        run: node sims/lp2_p7_2014_a_square_gf29_scaled_eigenspace_p8_original_sft.cjs
