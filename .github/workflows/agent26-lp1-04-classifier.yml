name: Agent26 LP1 04 OutGuess original archive classifier
on:
  workflow_dispatch:
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp1_04_outguess_archive_classifier_sft.cjs
      - run: sudo apt-get update -qq && sudo apt-get install -y libjpeg-dev
      - run: python sims/lp1_04_outguess_native_header_sft.py
      - run: node sims/lp1_04_outguess_default_seed_source_sft.cjs
      - run: node sims/lp1_04_outguess_2014_override_witness_sft.cjs
      - run: python sims/lp1_outguess_default_seed_habit_sft.py
