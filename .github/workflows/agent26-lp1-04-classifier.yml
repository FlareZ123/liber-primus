name: Agent26 LP1 04 OutGuess original archive classifier
on:
  workflow_dispatch:
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp1_04_outguess_archive_classifier_sft.cjs
