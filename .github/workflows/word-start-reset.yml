name: LP2 word-start reset and periodic-key test

on:
  workflow_dispatch:

jobs:
  word-start-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Word-start concentration and period scan
        run: node sims/word_start_reset_scan.cjs
      - name: Arbitrary periodic alphabet phase sieve
        run: node sims/word_start_phase_permutation.cjs
      - name: Cross-word anti-repeat conditional nulls
        run: node sims/cross_word_repeat_invariant.cjs
