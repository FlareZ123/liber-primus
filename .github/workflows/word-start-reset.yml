name: LP2 word-start reset and periodic-key test

on:
  workflow_dispatch:

jobs:
  word-start-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Word-start concentration and period scan
        run: node sims/word_start_reset_scan.cjs
      - name: Arbitrary periodic alphabet phase sieve
        run: node sims/word_start_phase_permutation.cjs
      - name: Cross-word anti-repeat conditional nulls
        run: node sims/cross_word_repeat_invariant.cjs
      - name: Exact all-secret singleton-word capacity and planted inverse
        run: node sims/singleton_word_key_capacity.cjs
      - name: Original black singleton page-key and literal-F affine proof
        run: node sims/lp2_singleton_original_phase_invariant.cjs
      - name: Complete p17 cubic-key inversion of all Fehu masks with English control
        run: node sims/p17_cubic_all_f_crib_inverse.cjs
