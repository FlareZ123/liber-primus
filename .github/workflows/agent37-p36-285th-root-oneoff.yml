name: Agent37 original p36 285th-root inversion gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-p36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-field root and following-pages cipher test
        run: node sims/lp2_p36_redtriad_285th_root_sft.cjs
