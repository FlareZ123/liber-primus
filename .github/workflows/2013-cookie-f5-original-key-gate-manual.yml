name: Historical 2013 167-761 cookie F5 original-key bounded gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-cookie-f5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: false
      - name: Compile pinned external F5 reference-compatible extractor
        run: |
          set -eu
          go install github.com/0verkilll/f5/cmd/f5@v1.0.0
          "$(go env GOPATH)/bin/f5" version
          (cd sims/f5_detector_calibration && go build -mod=mod -o /tmp/lp2-2013-cookie-native-f5-embed native_f5_embed.go)
      - name: Exact native positives then source-selected 167-761 original-corpus key probes
        run: |
          set -eu
          node sims/2013_cookie_terminal_f5_probe_sft.cjs \
            --f5 "$(go env GOPATH)/bin/f5" \
            --embedder /tmp/lp2-2013-cookie-native-f5-embed \
            --root resources/liber-primus
