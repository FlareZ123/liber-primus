name: LP2 exact onecool 2014 transcription mirror (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect only one original-participant public repo and two exact filenames
        run: node sims/lp2_2014_onecool_gitlab_exactfiles_sft.cjs
