name: Numbered LP2 original source tests
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test explicitly numbered five-part source for shared key
        run: node sims/numbered_five_item_pad.cjs

      - name: Test seven 79-rune numbered packets and original window controls
        run: node sims/numbered_five_alignment.cjs --packet79
