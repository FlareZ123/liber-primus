name: Agent21 2017 OnionScan crawl URL p56 hash

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-onionscan-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install digest implementations
        run: python -m pip install --disable-pip-version-check 'pyskein==1.0' 'gostcrypto==1.2.5' 'pycryptodome==3.23.0'
      - name: Clone public 2017 OnionScan result corpus
        run: git clone --depth 1 https://github.com/mylamour/onion.scan.result.git "$RUNNER_TEMP/onion-scan-result"
      - name: Scan report-derived page URLs
        run: |
          python sims/agent21_onionscan_2016_p56_hash.py \
            "$RUNNER_TEMP/onion-scan-result/onion_scan_results" \
            "$RUNNER_TEMP/agent21-onionscan-2017-url-report.json"
      - name: Preserve exact scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent21-onionscan-2017-url-report
          path: ${{ runner.temp }}/agent21-onionscan-2017-url-report.json
          if-no-files-found: error
