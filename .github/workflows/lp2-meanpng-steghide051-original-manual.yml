name: LP2 Meanpng original-JPEG Steghide 0.5.1 finite gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-steg:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain pinned historical decoder and authentic fixtures
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/rickschaves/stegostudio.git stegostudio-upstream
          git -C stegostudio-upstream fetch --depth 1 origin 201689b5755c0f1267223cd881429e679230b835
          git -C stegostudio-upstream checkout --detach 201689b5755c0f1267223cd881429e679230b835
          if ((git -C stegostudio-upstream rev-parse HEAD).Trim() -ne '201689b5755c0f1267223cd881429e679230b835') { throw 'Unexpected upstream version' }
      - name: Authentic Steghide 0.5.1 source fixture and 75 original JPEGs
        shell: pwsh
        env:
          STEGOSTUDIO_DIR: ${{ github.workspace }}\stegostudio-upstream
        run: |
          node --expose-gc sims/lp2_p50_meanpng_steghide051_original_sft.cjs
