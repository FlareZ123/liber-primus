name: Manual reusable C++17 original-source SFT

on:
  workflow_dispatch:
    inputs:
      sft:
        description: 'Repository C++17 source test in sims/'
        required: true
        type: string
      args:
        description: 'Optional whitespace-separated arguments (letters, digits, underscores and hyphens only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  original-source-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out original research corpus
        uses: actions/checkout@v4
      - name: Compile and run one source-native test
        shell: bash
        env:
          SFT: ${{ inputs.sft }}
          SFT_ARGS: ${{ inputs.args }}
          SFT_OUTPUT: ${{ runner.temp }}/source-test-output.json
        run: |
          if [[ ! "$SFT" =~ ^sims/[A-Za-z0-9_-]+\.cpp$ ]]; then
            echo 'Select a flat sims/*.cpp file with safe path characters' >&2
            exit 2
          fi
          if [[ ! -f "$SFT" ]]; then
            echo 'Selected source test does not exist' >&2
            exit 2
          fi
          g++ -std=c++17 -O3 -pthread -o "$RUNNER_TEMP/source-test" "$SFT"
          if [[ -n "$SFT_ARGS" ]]; then
            if [[ ! "$SFT_ARGS" =~ ^[A-Za-z0-9_-]+( [A-Za-z0-9_-]+)*$ ]]; then
              echo 'Arguments must be whitespace-separated safe tokens' >&2
              exit 2
            fi
            read -r -a SFT_ARGV <<< "$SFT_ARGS"
            "$RUNNER_TEMP/source-test" "${SFT_ARGV[@]}"
          else
            "$RUNNER_TEMP/source-test"
          fi
      - name: Upload optional machine-readable SFT output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp17-sft-output
          path: ${{ runner.temp }}/source-test-output.json
          if-no-files-found: ignore
          retention-days: 7
