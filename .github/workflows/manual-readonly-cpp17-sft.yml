name: Manual reusable C++17 original-source SFT

on:
  workflow_dispatch:
    inputs:
      sft:
        description: 'Repository C++17 source test in sims/'
        required: true
        type: string
      args:
        description: 'Optional whitespace-separated arguments (letters, digits, underscores and hyphens only)'
        required: false
        default: ''
        type: string
      readback_run_id:
        description: 'Optional prior workflow run ID whose cpp17-sft-output artifact should be read back'
        required: false
        default: ''
        type: string
      readback_issue:
        description: 'Optional issue number to receive the artifact JSON summary'
        required: false
        default: ''
        type: string
      readback_artifact_name:
        description: 'Artifact name to download from the prior run'
        required: false
        default: 'cpp17-sft-output'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  original-source-test:
    if: ${{ inputs.readback_run_id == '' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out original research corpus
        uses: actions/checkout@v4
      - name: Compile and run one source-native test
        shell: bash
        env:
          SFT: ${{ inputs.sft }}
          SFT_ARGS: ${{ inputs.args }}
          SFT_OUTPUT: ${{ runner.temp }}/source-test-output.json
        run: |
          if [[ ! "$SFT" =~ ^sims/[A-Za-z0-9_-]+\.cpp$ ]]; then
            echo 'Select a flat sims/*.cpp file with safe path characters' >&2
            exit 2
          fi
          if [[ ! -f "$SFT" ]]; then
            echo 'Selected source test does not exist' >&2
            exit 2
          fi
          g++ -std=c++17 -O3 -pthread -o "$RUNNER_TEMP/source-test" "$SFT"
          if [[ -n "$SFT_ARGS" ]]; then
            if [[ ! "$SFT_ARGS" =~ ^[A-Za-z0-9_-]+( [A-Za-z0-9_-]+)*$ ]]; then
              echo 'Arguments must be whitespace-separated safe tokens' >&2
              exit 2
            fi
            read -r -a SFT_ARGV <<< "$SFT_ARGS"
            "$RUNNER_TEMP/source-test" "${SFT_ARGV[@]}"
          else
            "$RUNNER_TEMP/source-test"
          fi
      - name: Upload optional machine-readable SFT output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.readback_artifact_name }}
          path: ${{ runner.temp }}/source-test-output.json
          if-no-files-found: ignore
          retention-days: 7

  artifact-readback:
    if: ${{ inputs.readback_run_id != '' }}
    permissions:
      actions: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download prior C++ SFT artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp17-sft-output
          run-id: ${{ inputs.readback_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/readback
      - name: Publish artifact JSON to the issue
        uses: actions/github-script@v7
        env:
          READBACK_DIR: ${{ runner.temp }}/readback
          READBACK_RUN_ID: ${{ inputs.readback_run_id }}
          READBACK_ISSUE: ${{ inputs.readback_issue }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const runId = process.env.READBACK_RUN_ID;
            if (!/^[0-9]+$/.test(runId)) throw new Error('Invalid run ID');
            const files = [];
            function walk(dir) {
              for (const name of fs.readdirSync(dir)) {
                const full = path.join(dir, name);
                if (fs.statSync(full).isDirectory()) walk(full);
                else if (name.endsWith('.json')) files.push(full);
              }
            }
            walk(process.env.READBACK_DIR);
            if (files.length !== 1) throw new Error(`Expected one JSON artifact, found ${files.length}`);
            const data = JSON.parse(fs.readFileSync(files[0], 'utf8'));
            const body = [
              `Artifact readback for [workflow run ${runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}):`,
              '',
              '```json',
              JSON.stringify(data, null, 2),
              '```'
            ].join('\n');
            const issue = process.env.READBACK_ISSUE;
            if (issue) {
              if (!/^[0-9]+$/.test(issue)) throw new Error('Invalid issue number');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(issue),
                body
              });
            }
            core.info(body);
