name: LP2 GF29 source-grid lift-channel enumerative decoder
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-lift-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and execute original and source-native control
        run: |
          node --check sims/lp2_grid_gf29_lift_channel_sft.cjs
          node sims/lp2_grid_gf29_lift_channel_sft.cjs
