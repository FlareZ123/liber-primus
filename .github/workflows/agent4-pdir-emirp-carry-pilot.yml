name: Agent4 source-derived prime-reversal carry pdir pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-emirp-carry:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Pin independent pointer-direction reference
        uses: actions/checkout@v4
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external-cicada3301
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference dependencies and build exact pdir engine
        run: |
          python -m pip install numpy mpmath
          cargo build --release --manifest-path external-cicada3301/work/kscreen/Cargo.toml
      - name: Rebuild original LP2 windows, library and registered rules
        run: |
          python external-cicada3301/work/kscreen/export.py
          python external-cicada3301/work/kscreen/signrules.py
          python external-cicada3301/work/kscreen/dirrules.py
      - name: Validate exact reference engine, source plants and null controls
        run: python external-cicada3301/work/kscreen/pdir_selftest.py --quick --threads 4
      - name: Generate and screen the one source-derived emirp-carry rule
        run: python sims/lp2_pdir_emirp_carry_pilot.py external-cicada3301 --conv 000 --windows seg0.7,seg0.8 --streams all --null 6 --threads 4 --tag agent4-emirp-carry-pilot
      - name: Preserve original-window scores, matched nulls and p57 calibration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent4-emirp-carry-pdir-pilot
          path: |
            external-cicada3301/results/kscreen/pdir/agent4-emirp-carry-pilot/000/
            external-cicada3301/results/kscreen/agent4-emirp-carry-calibration.json
          if-no-files-found: warn
