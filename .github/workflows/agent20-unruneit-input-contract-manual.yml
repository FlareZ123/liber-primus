name: Agent20 original 2014 UnRuneIt2 static GUI prime-list audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-unruneit-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test no-execution parser and original-URL identity
        run: |
          node --check sims/lp2_2014_unruneit_input_contract_sft.cjs
          node sims/lp2_2014_unruneit_input_contract_sft.cjs --selftest
          node sims/lp2_2014_irc_nonpaste_live_recovery_sft.cjs --selftest
      - name: Acquire original 2014 participant jars from frozen live IDs
        run: node sims/lp2_2014_irc_nonpaste_live_recovery_sft.cjs --network --jars-only > unrune-2014-source-acquisition.jsonl
      - name: Inspect original class metadata without executing any untrusted Java
        run: node sims/lp2_2014_unruneit_input_contract_sft.cjs > unrune-2014-static-input-contract.json
      - name: Show original immutable user prompts and key handling bytecode
        run: |
          node -e 'const j=require("./unrune-2014-static-input-contract.json"); console.log("PROMPTS "+JSON.stringify(j.userFacingMessages)); for(const x of j.relevantMethodBytecode){if(/choiceManager|decipher|unShift|getRunePrime|run\(|main\(/.test(x.signature)){console.log("\nMETHOD "+x.signature);console.log(x.lines.join("\n"));}}'
      - name: Preserve source and static interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent20-unruneit-original-static-audit
          path: |
            unrune-2014-source-acquisition.jsonl
            unrune-2014-static-input-contract.json
          if-no-files-found: ignore
          retention-days: 30
