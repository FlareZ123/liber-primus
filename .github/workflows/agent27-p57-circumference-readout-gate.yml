name: Agent27 p57 circumference READ OUT authentication gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit p57 circumference selector and solved transfer
        shell: pwsh
        run: node sims/lp2_p57_circumference_readout_authentication_gate_sft.cjs
