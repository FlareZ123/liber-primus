name: Agent50 P33-P35 FOUND ROAD Map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  found-road-map:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p33-p35 FOUND ROAD map regression
        shell: pwsh
        run: node sims/lp2_p33_p35_found_road_map_sft.cjs
