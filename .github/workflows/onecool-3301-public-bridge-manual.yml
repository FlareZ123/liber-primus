name: Onecool 3301-public LP2 bridge probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run exact bridge probe
        run: node sims/lp2_onecool_3301_public_bridge_sft.cjs
      - name: Upload bridge result
        uses: actions/upload-artifact@v4
        with:
          name: onecool-3301-public-bridge-output
          path: ${{ runner.temp }}/source-test-output.json
          if-no-files-found: error
          retention-days: 7
      - name: Run custody chronology probe
        run: node sims/lp2_onecool_pre2018_custody_chronology_sft.cjs
      - name: Upload custody chronology
        uses: actions/upload-artifact@v4
        with:
          name: onecool-pre2018-custody-chronology
          path: ${{ runner.temp }}/custody-chronology-output.json
          if-no-files-found: error
          retention-days: 7
      - name: Run Software Heritage history probe
        run: node sims/lp2_onecool_swh_snapshot_history_sft.cjs
      - name: Upload Software Heritage result
        uses: actions/upload-artifact@v4
        with:
          name: onecool-swh-history
          path: ${{ runner.temp }}/swh-history-output.json
          if-no-files-found: error
          retention-days: 7
      - name: Extract 2017 text artifacts
        run: node sims/lp2_onecool_2017_text_artifacts_sft.cjs
      - name: Upload 2017 text artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onecool-2017-text-artifacts
          path: ${{ runner.temp }}/onecool-2017-text-artifacts.json
          if-no-files-found: error
          retention-days: 7
      - name: Compare 2017 LP2 numeric transcription with canonical
        run: node sims/lp2_onecool_2017_numeric_transcription_gate_sft.cjs
      - name: Upload numeric transcription comparison
        uses: actions/upload-artifact@v4
        with:
          name: onecool-2017-numeric-transcription-gate
          path: ${{ runner.temp }}/onecool-2017-numeric-transcription-gate.json
          if-no-files-found: error
          retention-days: 7
      - name: Recover 2017 source code
        run: node sims/lp2_onecool_2017_code_recovery_sft.cjs
      - name: Upload recovered 2017 source code
        uses: actions/upload-artifact@v4
        with:
          name: onecool-2017-code-recovery
          path: ${{ runner.temp }}/onecool-2017-code-recovery.json
          if-no-files-found: error
          retention-days: 7
      - name: Scan historical method code
        run: node sims/lp2_onecool_2017_historical_method_grep_sft.cjs
      - name: Upload historical method scan
        uses: actions/upload-artifact@v4
        with:
          name: onecool-2017-historical-method-grep
          path: ${{ runner.temp }}/onecool-2017-historical-method-grep.json
          if-no-files-found: error
          retention-days: 7
