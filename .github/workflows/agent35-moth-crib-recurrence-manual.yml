name: Agent35 original GF29 research gates (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-crib-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact p55 source-crib recurrence and affine certificate
        run: node sims/lp2_moth_grid16_crib_recurrence_sft.cjs
      - name: Exact 256-cell six-check affine code and distance
        run: node sims/lp2_grid_sixcheck_affine_code_sft.cjs
      - name: Three-object p15-p39-p50 matrix functional-calculus gate
        run: node sims/lp2_p15_p39_p50_matrix_function_sft.cjs
      - name: Full source CRT-completed invertible Hill4 original-text gate
        run: node sims/lp2_p15_p39_p50_crt_hill_original_sft.cjs
