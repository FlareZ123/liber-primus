name: "Agent44 original 2014 cluosh Python3.4 bytecode source gate"
on:
  workflow_dispatch:
jobs:
  original-pyc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact historical Python source and pyc and report unaccounted strings
        run: node sims/lp2_cluosh2014_ephemeral_pyc_string_gate_sft.cjs
