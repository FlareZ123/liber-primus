name: LP2 archived onion hash preimage
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-hash:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare pinned historical inputs with LP2 hash
        run: node sims/archive_hash_preimage_scan.cjs archive-hash-scan-output.json
      - name: Save independently auditable candidate ledger
        uses: actions/upload-artifact@v4
        with:
          name: archive-hash-scan-output
          path: archive-hash-scan-output.json
          retention-days: 90
