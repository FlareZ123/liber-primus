name: Red triangle primitive-29 discrete-log cipher inverse
on:
  workflow_dispatch:
jobs:
  source-defined-log-step-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove source arithmetic and scan original with an inverse control
        run: node sims/red_triangle_discrete_log_step.cjs
      - name: Challenge reversible F79 Fibonacci / F29 field successor cipher
        run: node sims/f79_f29_bijective_marker_inverse.cjs
      - name: Exact EA-anchored plaintext-feedback inverse and heldout native-language gate
        run: node sims/ea_anchored_plain_feedback_inverse.cjs
      - name: Recover a second-order 28-ary key from EA-transparent original-ciphertext steps
        run: node sims/ea_field29_order2_key_recovery.cjs
      - name: Exact contextual GP29 marker cipher source-key inversion and motif controls
        run: node sims/contextual_marker29_reversible.cjs
      - name: Recover 225 arbitrary contextual pad columns on untouched original pages
        run: node sims/contextual_marker29_period225_key_recovery.cjs
      - name: Recover full 225-digit pad using native GP bigram coordinate optimization
        run: node sims/contextual_marker29_bigram225_key_recovery.cjs
