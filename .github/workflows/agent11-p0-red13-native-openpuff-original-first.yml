name: Agent11 LP2 red13 original three-image native OpenPuff decision
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red13-absolute-source:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Prepare source-authentic OpenPuff v4 binary and native driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-v400-red13'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $file = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $file
            $actual = (& git hash-object -- $file).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Pinned original OpenPuff binary mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Probe exact three original LP2 opening scans, source red-title A-password
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $orig = @()
          foreach ($idx in 17..19) {
            $carrier = Join-Path $env:GITHUB_WORKSPACE ('resources/liber-primus/{0:D2}.jpg' -f $idx)
            if (-not (Test-Path -LiteralPath $carrier)) { throw "Missing original image $idx" }
            Write-Host "ORIGINAL_SCAN=$idx SHA256=$((Get-FileHash -LiteralPath $carrier -Algorithm SHA256).Hash)"
            $orig += @('--carrier', "$carrier")
          }
          $completed = $false
          foreach ($attempt in 1..3) {
            $out = "probe-output/original-red13-attempt-$attempt"
            $args = @(
              '--exe', "$env:OPENPUFF_EXE",
              '--password', 'SHEOGMIAFSYENGC',
              '--bit-format', 'Jpeg (Image)',
              '--bit-level', '1/2 (50%) - Maximum',
              '--out', $out,
              '--wait-seconds', '180'
            ) + $orig
            Write-Host "NATIVE_PROBE_ATTEMPT=$attempt"
            python sims/openpuff_v400_extract.py @args
            $status = $LASTEXITCODE
            $record = Join-Path $out 'result.json'
            if (Test-Path -LiteralPath $record) {
              $result = Get-Content -LiteralPath $record -Raw | ConvertFrom-Json
              $valid = $result.carrier_count -eq 3 -and
                $result.carrier_chain_verified -and $result.bit_selection_verified -and
                $result.attempted
              if ($valid -and $result.native_probe_outcome -ne 'inconclusive-timeout') {
                Write-Host "SOURCE_RED13_OPENPUFF_EXACT_NATIVE_RESULT $($result | Select-Object carrier_count, native_probe_outcome, output_present, outputs, completion_dialogs, error_dialogs | ConvertTo-Json -Depth 20 -Compress)"
                $completed = $true
                break
              }
              Write-Host "NATIVE_ATTEMPT_$($attempt)_INCOMPLETE GUI_STAT=$status $($result | Select-Object carrier_added, native_probe_outcome, error | ConvertTo-Json -Compress)"
            } else {
              Write-Host "NATIVE_ATTEMPT_$($attempt)_NO_RECORD GUI_STAT=$status"
            }
            Start-Sleep -Seconds 3
          }
          if (-not $completed) { throw 'GUI did not produce calibrated native outcome for this exact source hypothesis' }
      - name: Preserve original-scan extracted bytes and native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent11-original-red13-native-openpuff
          path: probe-output/
          if-no-files-found: warn
