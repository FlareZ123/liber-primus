name: Agent18 p33 2014 fourteen-column original SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-p33:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-locked original p33 SFT
        run: node sims/lp2_p33_historic_14column_transfer_sft.cjs
