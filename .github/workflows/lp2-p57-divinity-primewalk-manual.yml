name: LP2 p57 DIVINITY to p50 conditional graph circuit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-primewalk:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp2_p57_divinity_p50_primewalk_sft.cjs
