name: Agent6 SHED historical two-primitive original SFT
on:
  push:
    paths:
      - 'sims/lp2_shed_historical_program_original_sft.cjs'
      - 'sims/lp2_grid_inner180_memoryless_gp_ending_sft.cjs'
      - '.github/workflows/agent6-shed-historical-program.yml'
  workflow_dispatch:

jobs:
  source-original:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce two-primitive source-original program gate
        run: |
          node sims/lp2_shed_historical_program_original_sft.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node sims/lp2_grid_inner180_memoryless_gp_ending_sft.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
