name: LP2 word-fixed matrix every-block secret SFT
on:
  workflow_dispatch:
jobs:
  exact-middle-three:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source corpus
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original family, 29 independent per-packet keys and full native positive
        run: node sims/lp2_wordfixed_Bt_everyblock_secret_mid3_sft.cjs
