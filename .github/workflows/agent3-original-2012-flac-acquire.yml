name: Agent3 original 2012 rendered FLAC acquisition (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source lock
        run: python -m pip install filelock
      - name: Recover original archived FluidSynth output.flac and assert Git blob
        run: python sims/agent3_original_2012_flac_acquire.py
      - uses: actions/upload-artifact@v4
        with:
          name: agent3-source-hashed-2012-real-flac
          path: run-data/agent3-2012-original-render/output.flac
          retention-days: 7
