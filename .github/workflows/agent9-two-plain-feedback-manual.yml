name: Agent 9 independent original-source inverse gates

on:
  workflow_dispatch:

jobs:
  original-native-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact LP2 and matched native-GP plants
        run: node sims/lp2_two_plain_lag_feedback_allkey_sft.cjs
      - name: Test original p50 quotient Hill4 terminal pages
        run: node sims/lp2_p50_p39_signedp15_quotient_matrix_p55_sft.cjs
