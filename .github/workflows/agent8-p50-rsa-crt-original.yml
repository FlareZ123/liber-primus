name: Agent8 original p50 RSA CRT key-recovery gate
on:
  workflow_dispatch:

jobs:
  original-crt-exponent:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exact RSA CRT factor recovery from LP2 printed grid
        run: node sims/lp2_p50_rsa_crt_exponent_key_recovery_sft.cjs
