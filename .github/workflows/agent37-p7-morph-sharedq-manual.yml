name: Agent37 source-native morphology p7 sharedq original
on:
  workflow_dispatch:
jobs:
  gp29-morph:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact GP29 solved holdout and original seven-word p7 q
        run: node sims/lp2_p7_morph_native_sharedq_holdout_sft.cjs
