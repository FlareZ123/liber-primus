name: LP2 p50 soft-rejection full-book HMM gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact HMM gate and positive controls
        run: node sims/lp2_p50_soft_rejection_fullbook_hmm_sft.cjs
