name: Agent9 floral heading nonzero cursor SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original floral plus-one cursor and native GP pairs
        run: node sims/lp2_floral_heading_plus1_pad_sft.cjs
