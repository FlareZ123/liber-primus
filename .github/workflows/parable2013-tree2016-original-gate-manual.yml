name: PARABLE 2013 plus signed-tree 2016 original inverse gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact original source LCG and RSA tests
        run: node sims/parable2013_tree2016_prng_rsa_sft.cjs
