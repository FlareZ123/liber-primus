name: LP2 Jung Liber Primus section-only original word address (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-section-address:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction
        run: python -m pip install "pymupdf>=1.25,<2"
      - name: Read source-authored Liber Primus heading and original full LP2 address outputs
        run: python sims/lp2_jung_liberprimus_section_address_sft.py
