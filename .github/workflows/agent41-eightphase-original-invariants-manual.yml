name: Agent 41 eight-phase original-cipher invariants

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-eight-phase-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out original-cipher corpus
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-native eight-phase all-secret permutation gate and positive controls
        run: node sims/lp2_fibonacci_eightphase_bijection_sft.cjs
      - name: Verify calibrated ING and IO source spelling and English controls
        run: node sims/lp2_native_gp_source_orthography_sft.cjs
      - name: Test exact printed LP1 p5 moth key versus earlier approximate key
        run: node sims/lp2_lp1p5_moth_source81_corrected_sft.cjs
      - name: Source moth-linked p55 terminal seven-word historical crib
        run: node sims/lp2_p55_moth_p5_sevenword_crib_sft.cjs
