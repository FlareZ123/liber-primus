name: LP2 p56 printed digest fixed F5 JPEG gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-digest-f5:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Install pinned F5 extractor
        shell: pwsh
        run: |
          go install github.com/0verkilll/f5/cmd/f5@v1.0.0
          (Join-Path (go env GOPATH).Trim() "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute original-source F5 password and planted control
        shell: pwsh
        run: node sims/lp2_p56_digest_f5_moth_sft.cjs
