name: 2014 magic-square direction source gate

on:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node sims/2014_magic_square_direction_map.cjs
      - run: node sims/p55_wisdom_cardinal_route_sft.cjs
      - name: Check historic period-seven original LP2 operator and source controls
        run: node sims/2014_lp1_period7_lp2_p8to14_sft.cjs
      - name: Check fixed historic 2014 Vigenere plus column-inverse composition on original LP2
        run: node sims/2014_7column_textguide_original_sft.cjs
