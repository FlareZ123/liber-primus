name: 2013 original Cicada ISO free-sector source audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iso-free-space:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and hash original 2013 ISO
        shell: bash
        run: |
          curl -fLsS --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 300 "https://connortumbleson.com/uploads/2024/01/3301.iso" -o "$RUNNER_TEMP/3301.iso"
          echo "784643558799dd8bb3e172f31df6d6ca2f397fd61cb8fc371bf930f1e5ae6b7f  $RUNNER_TEMP/3301.iso" | sha256sum -c -
      - name: Inspect only unallocated ISO9660 sectors and last-sector slack
        shell: bash
        run: node sims/cicada2013_iso_free_sectors_sft.cjs "$RUNNER_TEMP/3301.iso" | tee "$RUNNER_TEMP/cicada2013-iso-unallocated.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cicada2013-original-iso-unallocated
          path: ${{ runner.temp }}/cicada2013-iso-unallocated.json
          if-no-files-found: warn
          retention-days: 14
