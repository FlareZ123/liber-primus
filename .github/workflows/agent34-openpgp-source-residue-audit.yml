name: Agent34 OpenPGP historical residue audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce OpenPGP historical residue audit
        shell: pwsh
        run: node sims/lp2_openpgp_keyid_source_number_residue_audit_sft.cjs
