name: LP2 red-title and grid-key inversion suite
on:
  workflow_dispatch:
jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Original red-heading additive pad discriminator
        run: node sims/red_title_body_key_reuse.cjs
      - name: Corrected numeric-seed whole-word shuffle inversion
        run: node sims/wordlength_seeded_shuffle.cjs
      - name: Corrected grid-key whole-word permutation inversion
        run: node sims/grid_word_order_inversion.cjs
      - name: Actual GP-rune grid-stream collision-skip Viterbi inversion
        run: node sims/grid_stream_collision_viterbi.cjs
      - name: Actual GP-rune red-title IV grid-stream collision-skip inversion
        run: node sims/red_title_nonce_grid_viterbi.cjs
