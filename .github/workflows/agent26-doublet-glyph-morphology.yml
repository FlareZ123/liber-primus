name: Agent26 original doublet glyph morphology
on:
  push:
    paths:
      - '.github/workflows/agent26-doublet-glyph-morphology.yml'
      - 'sims/lp2_doublet_glyph_morphology_sft.py'
      - 'sims/lp2_doublet_same_line_raster_control_sft.py'
  workflow_dispatch:
jobs:
  original-jpeg-source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned image dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'Pillow==11.0.0' 'opencv-python-headless==4.10.0.84'
      - name: Test source-aligned glyph morphology at 86 doublets
        run: python sims/lp2_doublet_same_line_raster_control_sft.py
