name: LP2 2014-keyword word-edge advance original SFT (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-word-edge-advance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source corpus and read-only SFT
        uses: actions/checkout@v4
      - name: Python for original GP29 language reference
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical dependency
        run: python -m pip install numpy==1.26.4
      - name: Pin original phase24 Rust exact marginalisation engine
        shell: bash
        run: |
          git clone --quiet --filter=blob:none https://github.com/pnotisdev/cicada3301.git "$RUNNER_TEMP/cicada3301"
          git -C "$RUNNER_TEMP/cicada3301" checkout --quiet 15200c67abee106913ba01ff504c5b6e88d16cc7
          test "$(git -C "$RUNNER_TEMP/cicada3301" rev-parse HEAD)" = "15200c67abee106913ba01ff504c5b6e88d16cc7"
          mkdir -p "$RUNNER_TEMP/cicada3301/work/chanscreen/v2/build"
          rustc --edition=2021 -O --crate-type=cdylib "$RUNNER_TEMP/cicada3301/work/chanscreen/v2/backward_edge.rs" -o "$RUNNER_TEMP/cicada3301/work/chanscreen/v2/build/libbackward_edge.so"
      - name: Run native plant and the two withheld original LP2 windows
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        shell: bash
        run: |
          python sims/lp2_wordedge_authentic_keyword_adv_sft.py "$RUNNER_TEMP/cicada3301"
