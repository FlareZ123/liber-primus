name: LP2 p50 keyed GP28 packet all-secret gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original p50 keyed GP28 all-secret packet gate and positive controls
        run: node sims/lp2_p50_keyed_gp28_packet_allsecret_sft.cjs
