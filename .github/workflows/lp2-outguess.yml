name: LP2 original-JPEG OutGuess message extraction

on:
  workflow_dispatch:
    inputs:
      xor_shares:
        description: Test original 2014 XOR-share model against extracted LP2 arrays
        type: boolean
        required: false
        default: false
      synthetic_only:
        description: Probe fake OutGuess headers using a generated payload-free JPEG
        type: boolean
        required: false
        default: false
      keyed_probe:
        description: Test 22 source-defined OutGuess passphrases against LP2 sources
        type: boolean
        required: false
        default: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out original JPEGs and extractor
        uses: actions/checkout@v4
      - name: Build OutGuess from maintained source
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential libjpeg-dev
          git clone --depth 1 https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          git -C /tmp/outguess fetch --depth 1 origin 24810e14327c2bbeedeaadd3e24491f2a4425c02
          git -C /tmp/outguess checkout --detach 24810e14327c2bbeedeaadd3e24491f2a4425c02
          cd /tmp/outguess
          ./autogen.sh
          CFLAGS='-O2 -std=gnu11' ./configure --with-generic-jconfig
          make -j2 CC='gcc -std=gnu11' CFLAGS='-O2 -std=gnu11'
          sudo make install
      - name: Retrieve hidden messages from every LP2 page
        if: ${{ (!inputs.keyed_probe && !inputs.synthetic_only) || inputs.xor_shares }}
        run: node sims/outguess_lp2_scan.cjs
      - name: Install Python for direct binary-stream pad testing
        if: ${{ !inputs.keyed_probe && !inputs.synthetic_only && !inputs.xor_shares }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependencies
        if: ${{ !inputs.keyed_probe && !inputs.synthetic_only && !inputs.xor_shares }}
        run: python -m pip install --disable-pip-version-check numpy numba
      - name: Scan original LP2 runes against all extracted pad-stream positions
        if: ${{ !inputs.keyed_probe && !inputs.synthetic_only && !inputs.xor_shares }}
        env:
          OUTGUESS_NULL_REPLICATES: 64
        run: python sims/outguess_lp2_directpad.py
      - name: Test the authentic historical XOR-share model against every extracted LP2 subset
        if: ${{ inputs.xor_shares }}
        run: |
          node --check sims/outguess_lp2_share_xor.cjs
          node sims/outguess_lp2_share_xor.cjs
      - name: Probe source-defined passwords for authentic hidden LP2 messages
        if: ${{ inputs.keyed_probe && !inputs.synthetic_only }}
        run: |
          node --check sims/outguess_lp2_keyed_probe.cjs
          node sims/outguess_lp2_keyed_probe.cjs
      - name: Verify synthetic JPEG false headers and real keyed embedding
        if: ${{ inputs.synthetic_only }}
        run: |
          node --check sims/outguess_header_synthetic_probe.cjs
          node sims/outguess_header_synthetic_probe.cjs
      - name: Preserve exact recovered payloads and summary
        if: ${{ always() && !inputs.keyed_probe && !inputs.synthetic_only }}
        uses: actions/upload-artifact@v4
        with:
          name: outguess-lp2-default-key
          path: outguess-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve source-key OutGuess extraction candidates
        if: ${{ always() && inputs.keyed_probe && !inputs.synthetic_only }}
        uses: actions/upload-artifact@v4
        with:
          name: outguess-lp2-keyed
          path: outguess-results-keyed/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve synthetic-image authentication test
        if: ${{ always() && inputs.synthetic_only }}
        uses: actions/upload-artifact@v4
        with:
          name: outguess-lp2-synthetic-header
          path: outguess-synthetic-results/summary.json
          if-no-files-found: warn
          retention-days: 30
