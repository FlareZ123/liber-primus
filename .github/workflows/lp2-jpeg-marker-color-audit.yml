name: LP2 original JPEG marker and color audit

on:
  push:
    paths:
      - "sims/lp2_jpeg_marker_color_audit.py"
      - ".github/workflows/lp2-jpeg-marker-color-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit LP2 original JPEG containers
        run: python sims/lp2_jpeg_marker_color_audit.py
