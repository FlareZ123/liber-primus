name: Adjacent-rewrite shared-key inverse (manual)
on:
  workflow_dispatch:
jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact channel and decode actual and matched controls
        run: node sims/relative_key_adjacent_repair_beam.cjs
