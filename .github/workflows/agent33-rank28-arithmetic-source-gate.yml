name: Agent33 rank28 source-framed arithmetic SFT
on:
  workflow_dispatch:
jobs:
  source-native-and-original:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact GP29 arithmetic and original rank-frame gate
        run: node sims/lp2_rank28_frame_arithmetic_sft.cjs
