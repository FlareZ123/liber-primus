name: LP2 word-shape secret-alphabet entropy gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research corpus
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original LP2 word-shape permutation family
        run: node sims/lp2_wordshape_secret_alphabet_entropy_sft.cjs
