name: LP2 word-shape secret-alphabet entropy gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research corpus
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original LP2 word-shape permutation family
        run: node sims/lp2_wordshape_secret_alphabet_entropy_sft.cjs
      - name: Test independently secret line and word alphabets
        run: node sims/lp2_independent_line_word_secret_alphabets_sft.cjs
      - name: Test higher-order ciphertext-context secret alphabets
        run: node sims/lp2_highorder_cipher_context_entropy_sft.cjs
      - name: Test all-secret independent per-word GP29 polynomial pads (degrees 0 through 8)
        run: node sims/lp2_word_independent_polynomial_allsecret_sft.cjs
