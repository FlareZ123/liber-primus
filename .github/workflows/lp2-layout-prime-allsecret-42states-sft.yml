name: LP2 layout-prime 42 statewise alphabet invariant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-state-invariant:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test 42 original prime and physical-layout state families with native controls
        shell: pwsh
        run: |
          node sims/lp2_layout_prime_allsecret_14state_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Exact 42-state source-shaped invariant failed' }
