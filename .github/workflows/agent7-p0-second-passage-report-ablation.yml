name: Agent7 p0 second-passage report ablation SFT

on:
  workflow_dispatch:

jobs:
  ablation:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check sims/lp2_p0_second_passage_report_ablation_sft.cjs
      - name: Reports 01-15
        run: node sims/lp2_p0_second_passage_report_ablation_sft.cjs 15
      - name: Reports 01-17
        run: node sims/lp2_p0_second_passage_report_ablation_sft.cjs 17
      - name: Reports 01-18
        run: node sims/lp2_p0_second_passage_report_ablation_sft.cjs 18
      - name: Reports 01-19
        run: node sims/lp2_p0_second_passage_report_ablation_sft.cjs 19
