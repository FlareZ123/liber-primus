name: LP2 Agent 1 exact inverse and source-locked key experiments
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Choose independently reproducible experiment
        required: true
        type: choice
        default: word-lag5
        options:
          - word-lag5
          - red-225
          - lossless-echo
          - native-ea-flanks
          - rsa-4096-terminal
          - p57-lsb-claim
          - afnd-paste-source
permissions:
  contents: read
jobs:
  decrypt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source word cross-page check
        if: ${{ inputs.experiment == 'word-lag5' }}
        run: node sims/test_lp2_word_pages.cjs
      - name: Find all exact affine autokey and English source candidates
        if: ${{ inputs.experiment == 'word-lag5' }}
        run: node sims/word_lag5_affine_keyfree_inverse.cjs
      - name: Test manuscript 15x15 red-square key on disjoint original pages
        if: ${{ inputs.experiment == 'red-225' }}
        run: node sims/red_225_square_key_holdout.cjs
      - name: Test exact invertible echo-state and original source-grid key
        if: ${{ inputs.experiment == 'lossless-echo' }}
        run: node sims/lossless_echo_table_inverse.cjs
      - name: Test original EA-anchor flank register against solved author source
        if: ${{ inputs.experiment == 'native-ea-flanks' }}
        run: node sims/native_ea_flank_original_gate.cjs
      - name: Test original numerical-table plus terminal-runes RSA-4096 signature encoding
        if: ${{ inputs.experiment == 'rsa-4096-terminal' }}
        run: node sims/lp2_grid_terminal_rsa4096_signature_sft.cjs
      - uses: actions/setup-python@v7
        if: ${{ inputs.experiment == 'p57-lsb-claim' }}
        with:
          python-version: '3.12'
      - name: Install pinned image-analysis dependencies
        if: ${{ inputs.experiment == 'p57-lsb-claim' }}
        run: python -m pip install numpy==2.2.6 pillow==11.3.0
      - name: Original Page57 LSB claim and real-page controls
        if: ${{ inputs.experiment == 'p57-lsb-claim' }}
        run: python sims/lp2_p57_lsb_external_claim_control_sft.py
      - name: One-shot first-onion AfndPJa0 archive-source acquisition
        if: ${{ inputs.experiment == 'afnd-paste-source' }}
        run: node sims/afnd_paste_archive_gate.cjs
