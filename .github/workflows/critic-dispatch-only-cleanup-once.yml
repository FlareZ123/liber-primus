name: Critic one-off manual-only workflow trigger repair
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair all non-manual workflow triggers, preserving dispatch inputs
        run: node .github/critic-dispatch-only-cleanup.cjs
      - name: Commit and push one atomic policy correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- .github/workflows .github/critic-dispatch-only-cleanup.cjs
          if git diff --cached --quiet; then
            echo "No corrections required"
            exit 0
          fi
          git commit -m "Critic: enforce manual-only triggers across research workflows"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then
              echo "Verified push of complete dispatch-only cleanup"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not push corrected workflow files" >&2
          exit 1
