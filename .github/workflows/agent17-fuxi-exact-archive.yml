name: Agent17 2016 Fu-Xi Source-Exact Archive Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover exactly period-posted Fu-Xi article from public archives
        run: |
          node --check sims/lp2_2016_fuxi_original_archive_sft.cjs
          node sims/lp2_2016_fuxi_original_archive_sft.cjs
