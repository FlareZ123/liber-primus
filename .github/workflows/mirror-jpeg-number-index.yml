name: LP2 prime indexed JPEG key search
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numbered-jpeg-key:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search prime and totient indexed image pads
        run: node sims/mirror_jpeg_number_index.cjs
