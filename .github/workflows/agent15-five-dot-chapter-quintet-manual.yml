name: Agent15 source-selected five-dot chapter quintet transport
on:
  workflow_dispatch:
    inputs:
      gate:
        description: Select an original-source five-dot gate
        required: true
        type: choice
        default: chapter-quintet
        options:
          - chapter-quintet
          - local-delimiter
          - red9-hill3-terminal
          - cofactor16-hill4-terminal
permissions:
  contents: read
jobs:
  five-dot:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original chapter-grouped 5-GP-rune 24-bit packing
        if: ${{ inputs.gate == 'chapter-quintet' }}
        shell: pwsh
        run: |
          node --check sims/lp2_five_dot_chapter_body_quintet_sft.cjs
          node sims/lp2_five_dot_chapter_body_quintet_sft.cjs
          node --check sims/lp2_p40_fivedot_grid256_byte_sft.cjs
          node sims/lp2_p40_fivedot_grid256_byte_sft.cjs
          node --check sims/lp2_p40_flower_bacon_allsecret_sft.cjs
          node sims/lp2_p40_flower_bacon_allsecret_sft.cjs
          node --check sims/lp2_p40_eight_rune_five_byte_transport_sft.cjs
          node sims/lp2_p40_eight_rune_five_byte_transport_sft.cjs
          node --check sims/lp2_p40_red8_grid256_rowselector_sft.cjs
          node sims/lp2_p40_red8_grid256_rowselector_sft.cjs
          node --check sims/lp2_p40_red8_grid_rc4_sft.cjs
          node sims/lp2_p40_red8_grid_rc4_sft.cjs
      - name: Test exact all-secret five-back delimiter obstruction
        if: ${{ inputs.gate == 'local-delimiter' }}
        shell: pwsh
        run: |
          node --check sims/lp2_lag5_local_delimiter_allsecret_sft.cjs
          node sims/lp2_lag5_local_delimiter_allsecret_sft.cjs
      - name: Test original terminal red-nine 3x3 Hill inverse
        if: ${{ inputs.gate == 'red9-hill3-terminal' }}
        shell: pwsh
        run: |
          node --check sims/lp2_p54_red9_hill3_terminal_sft.cjs
          node sims/lp2_p54_red9_hill3_terminal_sft.cjs
      - name: Test original p50 cofactor16 Hill4 terminal inverse
        if: ${{ inputs.gate == 'cofactor16-hill4-terminal' }}
        shell: pwsh
        run: |
          node --check sims/lp2_p50_cofactor16_hill4_terminal_sft.cjs
          node sims/lp2_p50_cofactor16_hill4_terminal_sft.cjs
