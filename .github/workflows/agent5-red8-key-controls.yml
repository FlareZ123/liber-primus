name: Agent 5 p54 red-heading key blind controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [direct, prime, mapped]
        plant: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify corrected source fixture and syntax
        run: |
          python sims/lp2_shared_gp29_q8_terminal_fixture.py
          git diff --exit-code -- im-results/lp2-shared-gp29-q8-terminal-corrected-fixtures.json
          python -m py_compile \
            sims/lp2_shared_gp29_q8_smt.py \
            sims/lp2_shared_gp29_q8_affine_sft.py \
            sims/lp2_shared_gp29_q8_red8_sft.py
      - name: Run blind red-heading control
        run: |
          set -o pipefail
          python sims/lp2_shared_gp29_q8_red8_sft.py \
            --variant ${{ matrix.variant }} \
            --plant ${{ matrix.plant }} \
            --oov 3 --corrupt --seconds 900 --threads 4 | tee result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: red8-${{ matrix.variant }}-${{ matrix.plant }}
          path: result.txt
