name: Word-affine cryptanalysis

on:
  workflow_dispatch:

jobs:
  interword-affine-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical whole-word corpus
        run: node sims/test_lp2_word_pages.cjs
      - name: Run calibrated interword affine scan
        run: node sims/word_affine_probe.cjs

      - name: Run calibrated nonlinear word-map scan
        run: node sims/word_nonlinear_probe.cjs
