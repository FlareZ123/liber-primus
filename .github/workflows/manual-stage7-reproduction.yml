name: Manual 2014 Stage 7 reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Install GnuPG from MSYS2 without an interactive installer
        shell: pwsh
        run: |
          $bash = "C:/msys64/usr/bin/bash.exe"
          if (-not (Test-Path $bash)) { throw "MSYS2 bash is missing from the Windows runner image" }
          $proc = Start-Process -FilePath $bash -ArgumentList '-lc "pacman -Sy --noconfirm gnupg"' -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(300000)) {
            Get-Process pacman -ErrorAction SilentlyContinue | Stop-Process -Force
            try { $proc.Kill() } catch {}
            throw "MSYS2 GnuPG installation exceeded five minutes"
          }
          if ($proc.ExitCode -ne 0) { throw "MSYS2 pacman failed with exit code $($proc.ExitCode)" }
          $gpg = "C:/msys64/usr/bin/gpg.exe"
          if (-not (Test-Path $gpg)) { throw "MSYS2 installation did not expose gpg.exe" }
          Split-Path $gpg | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $gpg --version | Select-Object -First 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UI automation dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pywinauto

      - name: Reproduce signed carrier and OpenPuff extraction
        shell: pwsh
        run: python sims/cicada2014_stage7_reproduction.py

      - name: Preserve exact reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-reproduction
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/liber-primus-stage7-reproduction/report.json
            ${{ runner.temp }}/liber-primus-stage7-reproduction/openpuff-output/**
            ${{ runner.temp }}/liber-primus-stage7-reproduction/openpuff-*-controls.json
