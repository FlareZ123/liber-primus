name: Manual 2014 Stage 7 reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Install GnuPG
        shell: pwsh
        run: |
          choco install gnupg --yes --no-progress
          $candidates = @(
            "C:\Program Files (x86)\GnuPG\bin\gpg.exe",
            "C:\Program Files\GnuPG\bin\gpg.exe"
          )
          $gpg = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gpg) {
            $gpg = (Get-Command gpg.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $gpg) { throw "GnuPG installation did not expose gpg.exe" }
          Split-Path $gpg | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $gpg --version | Select-Object -First 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UI automation dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pywinauto

      - name: Reproduce signed carrier and OpenPuff extraction
        shell: pwsh
        run: python sims/cicada2014_stage7_reproduction.py

      - name: Preserve exact reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-reproduction
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/liber-primus-stage7-reproduction/report.json
            ${{ runner.temp }}/liber-primus-stage7-reproduction/openpuff-output/**
            ${{ runner.temp }}/liber-primus-stage7-reproduction/openpuff-*-controls.json
