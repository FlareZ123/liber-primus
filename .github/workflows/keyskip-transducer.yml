name: Exact soft key-skip transducer tests

on:
  workflow_dispatch:

jobs:
  transducer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact normalization and planted key discrimination
        run: node sims/test_keyskip_transducer.cjs
