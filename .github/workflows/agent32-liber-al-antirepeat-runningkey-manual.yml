name: Agent32 historical-source collision-skip SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run historical-source original-cipher gate
        run: node sims/lp2_liber_al_antirepeat_runningkey_sft.cjs
      - name: Run authentic LP1 13-rune key collision-reject target gate
        run: node sims/lp2_firfumferenfe_collision_skip_original_sft.cjs
