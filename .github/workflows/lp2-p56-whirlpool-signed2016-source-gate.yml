name: LP2 p56 Whirlpool against exact 2016 signed-source candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-whirlpool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify OpenSSL 3 legacy Whirlpool provider
        run: |
          openssl version
          openssl list -digest-algorithms -provider legacy | grep -i whirlpool
      - name: Run exact-source Whirlpool gate
        run: |
          python3 -m py_compile sims/lp2_p56_whirlpool_signed2016_original_sources_sft.py
          python3 sims/lp2_p56_whirlpool_signed2016_original_sources_sft.py | tee "$RUNNER_TEMP/p56-whirlpool-signed2016.json"
      - name: Preserve raw result
        uses: actions/upload-artifact@v4
        with:
          name: p56-whirlpool-signed2016-source-gate
          path: ${{ runner.temp }}/p56-whirlpool-signed2016.json
          if-no-files-found: error
