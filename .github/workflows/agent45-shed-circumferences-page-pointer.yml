name: Agent45 Shed Circumferences Page Pointer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shed-pointer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run shed-circumferences page-pointer SFT
        shell: pwsh
        run: node sims/lp2_shed_circumferences_page_pointer_sft.cjs
