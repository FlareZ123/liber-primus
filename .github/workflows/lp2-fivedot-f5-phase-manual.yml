name: LP2 five-dot exact F5 phase-transfer calibration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lp2-five-dot-f5-phase
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout primary original-source repository
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: false
      - name: Install pinned authenticated F5 implementation
        shell: pwsh
        run: |
          go install github.com/0verkilll/f5/cmd/f5@v1.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $goBin = Join-Path (go env GOPATH) "bin"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $goBin
          & (Join-Path $goBin "f5.exe") version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact JPEG raster library
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare extraction of 32-byte real F5 positive before and after original five-dot transforms
        shell: pwsh
        run: |
          python sims/lp2_fivedot_f5_phase_calibration_sft.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
