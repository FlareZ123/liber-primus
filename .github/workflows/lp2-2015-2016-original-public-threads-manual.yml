name: LP2 Original 2015–16 Public Thread Source Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-public-threads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original dated Freenode blobs and emit historical discussion URLs
        run: |
          node --check sims/lp2_2015_2016_original_public_thread_locator_sft.cjs
          node sims/lp2_2015_2016_original_public_thread_locator_sft.cjs
      - name: Acquire five frozen 2015–16 public discussions, native period revisions
        run: |
          node --check sims/lp2_2015_2016_five_frozen_public_threads_sft.cjs
          node sims/lp2_2015_2016_five_frozen_public_threads_sft.cjs
