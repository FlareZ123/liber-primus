name: Source phonemic GP29 controls (manual only)
on:
  workflow_dispatch:
    inputs:
      script:
        description: Committed source phonemic research SFT
        required: true
        type: choice
        options:
          - sims/lp2_phonemic_register_capacity_sft.py
          - sims/lp2_phonemic_wordphase_allsecret_original_sft.py
          - sims/lp2_phonemic_primeclock_lm_sft.py

permissions:
  contents: read

jobs:
  phonemic-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned pronunciation dictionary
        run: python -m pip install --disable-pip-version-check "cmudict==1.1.3"
      - name: Execute selected source-original experiment
        env:
          TEST_SCRIPT: ${{ inputs.script }}
        run: python "$TEST_SCRIPT"
      - name: Preserve phone-class prime-clock result
        if: ${{ inputs.script == 'sims/lp2_phonemic_primeclock_lm_sft.py' }}
        uses: actions/upload-artifact@v4
        with:
          name: lp2-phonemic-primeclock-lm-sft
          path: im-results/lp2-phonemic-primeclock-lm-sft.json
