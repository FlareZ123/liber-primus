name: OpenPuff v4.00 native two-carrier calibration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpuff-v400-twojpeg-native-calibration
  cancel-in-progress: false

jobs:
  two-jpeg-positive:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Install dependencies and verify 32-bit native driver
        shell: pwsh
        run: |
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py

      - name: Retrieve original OpenPuff 4.00 (pinned Git objects)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "OpenPuff-v400-two-carrier"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = "https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff"
          $expected = @{
            "OpenPuff.exe" = "466e03c792075313ce533a5dc7a789e8a41209f9"
            "libObfuscate.dll" = "f3b1c3315f8286346416fefd6141410f422f2454"
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original OpenPuff file mismatch: $name"
            }
          }
          $exe = Join-Path $root "OpenPuff.exe"
          $v = (Get-Item $exe).VersionInfo
          if ("$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)" -ne "4.0.0.0") {
            throw "Unexpected original OpenPuff version"
          }
          "OPENPUFF_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate original-tool two-JPEG split plant
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python sims/openpuff_v400_native_twocarrier_plant.py --exe "$env:OPENPUFF_EXE" --out probe-output/two-carrier --password 33011033
          if ($LASTEXITCODE -ne 0) { throw "Original OpenPuff two-carrier hiding failed" }
          $meta = Get-Content probe-output/two-carrier/hide-result.json -Raw | ConvertFrom-Json
          if ($meta.status -ne "hidden-two-carriers") { throw "Two-carrier output not confirmed" }
          if ($meta.payload_size -le $meta.first_capacity -or $meta.payload_size -ge $meta.total_capacity) {
            throw "Plant is not proven to require the second native carrier"
          }
          if (@($meta.stego_paths).Count -ne 2) { throw "Unexpected carrier-chain length" }
          "STEGO_CARRIER_A=$($meta.stego_paths[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STEGO_CARRIER_B=$($meta.stego_paths[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_SHA256=$($meta.payload_sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_SIZE=$($meta.payload_size)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Recover planted secret with actual ordered two-image OpenPuff Unhide
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$env:STEGO_CARRIER_A" --carrier "$env:STEGO_CARRIER_B" --password 33011033 --bit-format "Jpeg (Image)" --bit-level "1/5 (20%) - Medium" --out probe-output/ordered-recovery --wait-seconds 120 --expected-size $env:EXPECTED_SIZE
          if ($LASTEXITCODE -ne 0) { throw "Native ordered recovery could not execute" }
          $result = Get-Content probe-output/ordered-recovery/result.json -Raw | ConvertFrom-Json
          if (-not $result.carrier_chain_verified -or $result.carrier_count -ne 2) {
            throw "Native two-carrier list/order was not verified"
          }
          $matches = @($result.outputs | Where-Object { $_.sha256 -eq $env:EXPECTED_SHA256 })
          if ($matches.Count -ne 1) { throw "Native OpenPuff did not recover exact planted payload" }
          $processed = @($result.completion_dialogs | Where-Object { $_.message -match '2\s*/\s*2\s+carriers?\s+processed' })
          if ($processed.Count -eq 0) { throw "Native 2/2 completion not witnessed" }
          Write-Host "GENUINE MULTICARRIER CONTROL PASS: exact payload recovered, and native 2/2 chain processed"

      - name: Test reversed order as a separately labeled negative control
        if: success()
        shell: pwsh
        run: |
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$env:STEGO_CARRIER_B" --carrier "$env:STEGO_CARRIER_A" --password 33011033 --bit-format "Jpeg (Image)" --bit-level "1/5 (20%) - Medium" --out probe-output/reversed-control --wait-seconds 45
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Host "Reversed-order native probe hit UI failure; this is an inconclusive negative control"
          } else {
            $result = Get-Content probe-output/reversed-control/result.json -Raw | ConvertFrom-Json
            $matches = @($result.outputs | Where-Object { $_.sha256 -eq $env:EXPECTED_SHA256 })
            if ($matches.Count -ne 0) {
              Write-Host "Reversed order also recovered planted secret; inspect native behavior before using order as discriminator"
            } else {
              Write-Host "Reversed order did not recover the known secret; preserve the native outcome"
            }
          }

      - name: Upload original GUI and exact-byte control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpuff-v400-native-twocarrier-evidence
          path: probe-output/
          if-no-files-found: warn
