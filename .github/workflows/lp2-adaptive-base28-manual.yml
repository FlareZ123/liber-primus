name: LP2 adaptive radix-28 binary probe (manual)
on:
  workflow_dispatch:

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Invert base-28 no-repeat output and check impossible byte codewords
        run: node sims/lp2_adaptive_base28_binary.cjs
      - name: Test global secret glyph and modular-difference order sieves
        run: node sims/lp2_adaptive_radix28_permutation_sieve.cjs
      - name: Construct and verify stateful byte-capacity witness
        run: node sims/radix28_stateful_byte_capacity_witness.cjs
      - name: Enumerate all state-dependent byte-code capacity cases
        run: node sims/stateful_28rank_allwidth.cjs
      - name: Exact ASCII-octet necessary bound for 29-row stateful radix28
        run: node sims/stateful_28rank_ascii_octet_bound.cjs
      - name: Exact Latin-square previous-state capacity matchings
        run: node sims/stateful_28rank_latin_matching.cjs
      - name: Install pinned CP-SAT solver for last framing
        run: python -m pip install --disable-pip-version-check ortools==9.14.6206
      - name: Test final framing's two ASCII top octets with full row-key constraints
        run: python sims/stateful_ascii_survivor_cp.py
