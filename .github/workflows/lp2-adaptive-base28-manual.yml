name: LP2 adaptive radix-28 binary probe (manual)
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Select existing binary probes or source-aligned 79/78 radix gate"
        required: true
        type: choice
        options: [standard, prime79, prime79prefix2, prime79cpsat, prime79trigram, prime79terminal]
        default: standard
      cpsat_seconds:
        description: "Per-alignment CP-SAT timeout in seconds"
        required: true
        type: string
        default: '540'
      page_shuffle_seed:
        description: "Nonzero CP-SAT matched-null seed; shuffle whole original LP2 pages"
        required: true
        type: string
        default: '0'
      prefix_samples:
        description: "Bounded source-language inverse candidates for surviving phase35; 0 disables"
        required: true
        type: string
        default: '0'
      prefix_nodes:
        description: "Exact prefix2 CSP node cap (manual only)"
        required: true
        type: string
        default: '100000'
      prefix_direction:
        description: "For prefix2, original rune read orientation"
        required: true
        type: choice
        options: [both, forward, reverse]
        default: both
      phase_start:
        description: "First 79-packet phase to test"
        required: true
        type: string
        default: '0'
      phase_end:
        description: "Last 79-packet phase to test"
        required: true
        type: string
        default: '0'

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exclude stationary stateful base29 fixed-packet byte codecs
        if: ${{ inputs.probe == 'standard' }}
        run: node sims/stateful_29rank_byte_capacity_sieve.cjs
      - name: Invert base-28 no-repeat output and check impossible byte codewords
        if: ${{ inputs.probe == 'standard' }}
        run: node sims/lp2_adaptive_base28_binary.cjs
      - name: Test global secret glyph and modular-difference order sieves
        if: ${{ inputs.probe == 'standard' }}
        run: node sims/lp2_adaptive_radix28_permutation_sieve.cjs
      - name: Construct and verify stateful byte-capacity witness
        if: ${{ inputs.probe == 'standard' }}
        run: node sims/radix28_stateful_byte_capacity_witness.cjs
      - name: Enumerate all state-dependent byte-code capacity cases
        if: ${{ inputs.probe == 'standard' }}
        run: node sims/stateful_28rank_allwidth.cjs
      - name: Exact ASCII-octet necessary bound for 29-row stateful radix28
        if: ${{ inputs.probe == 'standard' }}
        run: node sims/stateful_28rank_ascii_octet_bound.cjs
      - name: Exact Latin-square previous-state capacity matchings
        if: ${{ inputs.probe == 'standard' }}
        run: node sims/stateful_28rank_latin_matching.cjs
      - name: Construct Latin-square five-digit packet witnesses
        if: ${{ inputs.probe == 'standard' }}
        run: node sims/stateful_28rank_latin_five.cjs
      - name: Test exact base29-78 to base28-79 block inverse over any fixed rune alphabet
        if: ${{ inputs.probe == 'prime79' }}
        env:
          PHASE_START: ${{ inputs.phase_start }}
          PHASE_END: ${{ inputs.phase_end }}
        run: node sims/prime79_radix29_28_exact_gate.cjs
      - name: Exclude fixed GF79 glyph checksum on every possible 79-rune packet origin
        if: ${{ inputs.probe == 'prime79' }}
        run: node sims/prime79_glyph_checksum_rank.cjs
      - name: Exact 79/78 two-leading-digit secret-cyclic-alphabet necessary gate
        if: ${{ inputs.probe == 'prime79prefix2' }}
        env:
          PREFIX_TWO_DIGIT: '1'
          PHASE_START: ${{ inputs.phase_start }}
          PHASE_END: ${{ inputs.phase_end }}
          PREFIX_TWO_MAX_NODES: ${{ inputs.prefix_nodes }}
          PREFIX_TWO_DIRECTION: ${{ inputs.prefix_direction }}
          PREFIX_TWO_LANGUAGE_SAMPLES: ${{ inputs.prefix_samples }}
        run: node sims/prime79_radix29_28_exact_gate.cjs
      - name: Train-frozen GP trigram key recovery for sole phase35 cyclic order
        if: ${{ inputs.probe == 'prime79trigram' }}
        env:
          PRIME79_ENUMERATE: ${{ inputs.prefix_samples }}
          PRIME79_NODES: ${{ inputs.prefix_nodes }}
        run: node sims/prime79_trigram_keysearch.cjs
      - name: Derive exact F29 terminal-pad exclusion and hidden-order plant recovery
        if: ${{ inputs.probe == 'prime79terminal' }}
        run: node sims/prime79_terminal_linear_gate.cjs
      - uses: actions/setup-python@v5
        if: ${{ inputs.probe == 'prime79cpsat' || inputs.probe == 'prime79gp' }}
        with:
          python-version: '3.11'
      - name: Install exact finite-domain CP-SAT solver
        if: ${{ inputs.probe == 'prime79cpsat' || inputs.probe == 'prime79gp' }}
        run: python -m pip install ortools
      - name: Resolve unknown rune-cycle order at a formerly open 79-packet phase
        if: ${{ inputs.probe == 'prime79cpsat' || inputs.probe == 'prime79gp' }}
        env:
          PHASE_START: ${{ inputs.phase_start }}
          PREFIX_TWO_DIRECTION: ${{ inputs.prefix_direction }}
          CPSAT_SECONDS: ${{ inputs.cpsat_seconds }}
          PHASE_END: ${{ inputs.phase_end }}
          PAGE_SHUFFLE_SEED: ${{ inputs.page_shuffle_seed }}
        run: python sims/prime79_prefix2_cpsat.py
      - name: Optimize first native GP rune under every fixed cyclic order
        if: ${{ inputs.probe == 'prime79gp' }}
        env:
          GP_SECONDS: ${{ inputs.cpsat_seconds }}
          GP_OBJECTIVE: 'top8'
        run: python sims/prime79_first_rune_cpsat.py
