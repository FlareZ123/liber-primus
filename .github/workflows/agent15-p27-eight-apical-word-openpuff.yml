name: Agent15 p27 eight-apical first-word original OpenPuff gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-one-carrier:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        level: [medium, maximum]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Assert original apical8 marker and exact first printed GP word
        shell: pwsh
        run: |
          node sims/lp2_p27_apical8_marker_fbracket_source_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Original source locator did not reproduce' }
      - name: Obtain SHA1-pinned native OpenPuff v4.00 and verify 32-bit driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native capture SFT failed' }
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-Agent15-Apical8'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Pinned native binary mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Recover independent published known JPEG payload before original target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Known published JPEG not retrieved' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format 'Jpeg (Image)' --bit-level '1/2 (50%) - Maximum' --out probe-output/public-recovery --wait-seconds 70
          if ($LASTEXITCODE -ne 0) { throw 'Native known-positive extraction failed to execute' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file() and p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('KNOWN_PLAINTEXT_POSITIVE_35_BYTES')"
          if ($LASTEXITCODE -ne 0) { throw 'Known original JPEG payload mismatch' }
      - name: Probe original p27 wing JPEG with exact 8-ASCII first-body-word password
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $choice = '${{ matrix.level }}'
          $level = if ($choice -eq 'maximum') { '1/2 (50%) - Maximum' } else { '1/5 (20%) - Medium' }
          $carrier = Join-Path $env:GITHUB_WORKSPACE 'resources/liber-primus/44.jpg'
          $out = 'probe-output/apical8-' + $choice
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$carrier" --password NHGUIAHU --bit-format 'Jpeg (Image)' --bit-level $level --out "$out" --wait-seconds 150
          if ($LASTEXITCODE -ne 0) { throw 'Original carrier native extraction failed to execute' }
          $r = Get-Content -LiteralPath "$out/result.json" -Raw | ConvertFrom-Json
          if ($r.carrier_count -ne 1 -or -not $r.carrier_added -or -not $r.bit_selection_verified -or -not $r.attempted) { throw 'Original source carrier operation not verified' }
          if ($r.native_probe_outcome -eq 'inconclusive-timeout') { throw 'Original native probe timed out' }
          Write-Host "APICAL8_ORIGINAL_RESULT $($r | Select-Object carrier_count,native_probe_outcome,output_present,outputs,selected_capacity_bytes_after_level,completion_dialogs,error_dialogs | ConvertTo-Json -Compress -Depth 12)"
          if ($r.output_present) { Write-Host 'POTENTIAL_ORIGINAL_LP2_PAYLOAD_REQUIRES_AUTHENTICATION' }
      - name: Preserve original output and native GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent15-apical8-original44-${{ matrix.level }}
          path: probe-output/
          if-no-files-found: warn
