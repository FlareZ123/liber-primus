name: Agent3 source-pinned 2014 unknown-page executable link hunt
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-2014-links:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check single-file source miner and planted controls
        run: |
          node --check sims/lp2_2014_original_unknownpage_linkhunt_sft.cjs
          node sims/lp2_2014_original_unknownpage_linkhunt_sft.cjs
      - name: Mine three exact historical Git blobs
        run: node sims/lp2_2014_original_unknownpage_linkhunt_sft.cjs --network
      - name: Seek source-era unknown-key and program receipts without page labels
        run: |
          node --check sims/lp2_2014_original_codehost_nopage_hunt_sft.cjs
          node sims/lp2_2014_original_codehost_nopage_hunt_sft.cjs --selftest
          node sims/lp2_2014_original_codehost_nopage_hunt_sft.cjs

