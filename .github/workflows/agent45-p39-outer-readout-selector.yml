name: Agent45 P39 Outer READ OUT Selector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p39-readout-selector:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p39 outer READ OUT selector SFT
        shell: pwsh
        run: node sims/lp2_p39_outer_readout_selector_sft.cjs
