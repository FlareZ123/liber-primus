name: Agent22 prime-ordinal modulo-29 F-skip source gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frozen original-input test
        run: node sims/lp2_cuneiform_primeordinal_mod29_fskip_sft.cjs
