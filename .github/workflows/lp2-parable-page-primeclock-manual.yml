name: LP2 source-graph page prime-clock original SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-cipher-gate:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce 56-page source-selected prime-totient inverse
        run: node sims/lp2_parable_graph_page_primeclock_original_sft.cjs
