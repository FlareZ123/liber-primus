name: Agent20 source-seed PRF skip-aware gate

on:
  workflow_dispatch:
    inputs:
      seed_source:
        description: "Select one source-derived seed construction"
        required: true
        type: choice
        options:
          - lp1-first17
          - p49-51-grid256
        default: lp1-first17

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Liber Primus research
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy cryptography filelock

      - name: Fetch pinned Campaign XVIII skip-aware decoder
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Dukotah/cicada3301.git /tmp/cicada3301
          git -C /tmp/cicada3301 checkout f63501d8f2d835b80c30230eb89a1110fb9197d2

      - name: Supply deterministic wrong-key control omitted from pinned decoder checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/cicada3301/liber-primus/analysis/campaign18_skip/sweep.py
          test -f /tmp/cicada3301/liber-primus/analysis/campaign18_skip/skipdecode.py
          test -f /tmp/cicada3301/liber-primus/data/english_quadgrams.txt
          test -f /tmp/cicada3301/liber-primus/data/keys/self_reliance.txt
          test -f /tmp/cicada3301/liber-primus/data/keys/solved_plaintext.txt
          python - <<'PY'
          from pathlib import Path
          import random
          tokens = [
              "F", "U", "TH", "O", "R", "C", "G", "W", "H", "N", "I", "J",
              "EO", "P", "X", "S", "T", "B", "E", "M", "L", "NG", "OE",
              "D", "A", "AE", "Y", "IA", "EA",
          ]
          rng = random.Random(0x33013301)
          target = Path("/tmp/cicada3301/liber-primus/data/keys/mabinogion.txt")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              "# synthetic wrong-key control only; not historical Mabinogion text" + chr(10)
              + " ".join(rng.choice(tokens) for _ in range(12000)) + chr(10),
              encoding="ascii",
          )
          print(f"synthetic_wrong_key_control={target}; GP tokens=12000; seed=0x33013301")
          PY

      - name: Run selected source-derived seed test
        env:
          SEED_SOURCE: \${{ inputs.seed_source }}
          PYTHONUTF8: "1"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          case "$SEED_SOURCE" in
            lp1-first17)
              python sims/agent20_lp1_first17_sha_prf_skipaware.py \
                --external-root /tmp/cicada3301/liber-primus \
                --output im-results/agent20_lp1_first17_sha_prf_skipaware.json
              ;;
            p49-51-grid256)
              python sims/agent20_p50_grid_prf_skipaware.py \
                --external-root /tmp/cicada3301/liber-primus \
                --output im-results/agent20_p50_grid_prf_skipaware.json
              ;;
            *)
              echo "Unknown seed source: $SEED_SOURCE" >&2
              exit 2
              ;;
          esac

      - name: Upload LP1 report
        if: \${{ inputs.seed_source == 'lp1-first17' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-lp1-first17-sha-prf-skipaware
          path: im-results/agent20_lp1_first17_sha_prf_skipaware.json
          if-no-files-found: error

      - name: Upload p49-p51 grid report
        if: \${{ inputs.seed_source == 'p49-51-grid256' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-p50-grid-prf-skipaware
          path: im-results/agent20_p50_grid_prf_skipaware.json
          if-no-files-found: error
