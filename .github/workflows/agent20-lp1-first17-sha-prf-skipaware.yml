name: Agent20 LP1 first17 SHA/HMAC PRF skip-aware gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Liber Primus research
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy cryptography filelock

      - name: Fetch pinned Campaign XVIII skip-aware decoder
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Dukotah/cicada3301.git /tmp/cicada3301
          git -C /tmp/cicada3301 checkout f63501d8f2d835b80c30230eb89a1110fb9197d2

      - name: Run LP1 first17 derived-key test
        run: |
          python sims/agent20_lp1_first17_sha_prf_skipaware.py \
            --external-root /tmp/cicada3301/liber-primus \
            --output im-results/agent20_lp1_first17_sha_prf_skipaware.json

      - name: Upload reproducible report
        uses: actions/upload-artifact@v4
        with:
          name: agent20-lp1-first17-sha-prf-skipaware
          path: im-results/agent20_lp1_first17_sha_prf_skipaware.json
          if-no-files-found: error
