name: Original 2014 IRC SKY UDP command audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact pinned public 2014 IRC archive and inspect UDP/port lines
        run: node sims/lp2_2014_udp_irc_source_audit_sft.cjs
      - name: Audit additional timestamped community channels for UDP commands
        run: node sims/lp2_2014_udp_laterchannels_archive_sft.cjs
