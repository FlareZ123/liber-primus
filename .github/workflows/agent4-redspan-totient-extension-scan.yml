name: Agent4 Red-Span Totient Extension Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run precommitted red-span extension scan
        shell: pwsh
        run: node sims/lp2_redspan_totient_extension_scan_sft.cjs
