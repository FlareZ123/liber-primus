name: Agent28 balanced ghost-tree original JPEG packet
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image dependencies
        run: python -m pip install pillow==12.3.0 filelock==3.29.0
      - name: Regenerate source-hash-pinned art-only reviewer packet
        run: python sims/lp2_p55_ghosttree_balanced_v2_packet.py
      - name: Verify public ZIP contains no answer map
        run: python -c "from pathlib import Path; import zipfile; p=Path('im-results/ghost-tree-blinded-review-v2.zip'); z=zipfile.ZipFile(p); assert 'private-reveal.json' not in z.namelist(); assert len(z.namelist())==13; print('PASS public archive entries',len(z.namelist()))"
