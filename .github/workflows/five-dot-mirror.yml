name: LP2 image stencil and punctuation source audit
on:
  workflow_dispatch:
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install image geometry dependencies
        run: python -m pip install numpy opencv-python-headless pillow scipy
      - name: Detect five-dot motif and fit axis reflections
        run: python sims/five_dot_mirror.py
      - name: Verify 58-page rune ink and all 36 large punctuation marks
        run: python sims/lp2_ink_annotation_audit.py
      - name: Test full 2D GIMP at actual LP2 printed-glyph source pixels
        run: |
          set -o pipefail
          python sims/gimp_dissolve_printed_glyph_2d_source.py | tee gimp-2d-native-glyphs.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test all GIMP row seeds with independent plaintext plants
        run: |
          set -o pipefail
          node sims/gimp_dissolve_all_row_seed_inversion.cjs | tee gimp-dissolve-all-row-seeds.json
      - name: Exact invertible GP28-step and EA GIMP all-row original-source attack
        run: |
          set -o pipefail
          node sims/gimp_dissolve_fullstep_source_inverse.cjs | tee gimp-gp28-step.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gimp-dissolve-all-row-seeds
          retention-days: 60
          path: |
            gimp-dissolve-all-row-seeds.json
            gimp-gp28-step.json
            gimp-2d-native-glyphs.json
