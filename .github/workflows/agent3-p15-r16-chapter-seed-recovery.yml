name: Agent 3 p15 chapter sixteen-state full-key recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent3-p15-r16-chapter-seed-recovery.yml

jobs:
  source-chapter-inversion:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 1903-rune p15 chapter, complete 18-crib seed enumeration
        run: node sims/lp2_p15_r16_chapter_seed_recovery_sft.cjs
