name: Agent 15 p8 tree-side original-source test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p8-tree-side:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source page seam, line geometry and original GP controls
        run: node sims/lp2_p8_tree_side_line_reversal_original_sft.cjs
