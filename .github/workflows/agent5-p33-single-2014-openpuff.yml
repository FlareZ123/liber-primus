name: Agent 5 p33 historically typed or printed numeric OpenPuff Maximum
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent5-p33-single-2014-openpuff.yml'
  workflow_dispatch:
    inputs:
      password_source:
        description: Exact p33 glyphs in physical top-to-bottom order, or authentic 2014 A
        required: true
        type: choice
        default: image-10333301
        options:
          - image-10333301
          - 2014-33011033
      carrier_mode:
        description: Source-original seven cuneiform JPGs 50-56 or p33 alone
        required: true
        type: choice
        default: seven
        options:
          - seven
          - single
permissions:
  contents: read
jobs:
  p33-single-exact-historical:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Prepare pinned historical OpenPuff v4 and native public JPEG control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Original GUI regression failed' }
          $directory = Join-Path $env:RUNNER_TEMP 'OpenPuff-v400-original-p33-single'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $file = Join-Path $directory $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $file
            $actual = (& git hash-object -- $file).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) { throw "Historical binary mismatch: $name" }
          }
          "OPENPUFF_EXE=$(Join-Path $directory 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Confirm original native JPEG extractor recovers publisher's exact 35 bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Original public carrier unavailable' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format 'Jpeg (Image)' --bit-level '1/2 (50%) - Maximum' --out probe-output/public-positive --wait-seconds 65
          if ($LASTEXITCODE -ne 0) { throw 'Native positive failed to execute' }
          python -c "from pathlib import Path; p=Path('probe-output/public-positive/extracted/hidden.txt'); assert p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('ORIGINAL_NATIVE_JPEG_POSITIVE_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Original public JPEG positive bytes not recovered' }
      - name: Probe seven original cuneiform JPGs 50-56 with top-down printed A and Maximum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $single = ('${{ inputs.carrier_mode }}' -eq 'single')
          $images = if ($single) { @(50) } else { @(50..56) }
          $password = if ('${{ inputs.password_source }}' -eq '2014-33011033') { '33011033' } else { '10333301' }
          $arguments = @('--exe', "$env:OPENPUFF_EXE", '--password', "$password", '--bit-format', 'Jpeg (Image)', '--bit-level', '1/2 (50%) - Maximum', '--out', 'probe-output/original-cuneiform', '--wait-seconds', '900')
          foreach ($idx in $images) {
            $carrier = Join-Path $env:GITHUB_WORKSPACE ('resources/liber-primus/{0:D2}.jpg' -f $idx)
            if (-not (Test-Path -LiteralPath $carrier)) { throw "Missing original source scan $idx" }
            $digest = (Get-FileHash -LiteralPath $carrier -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "SOURCE_ORIGINAL_CUNEIFORM_JPEG index=$idx sha256=$digest"
            $arguments += @('--carrier', "$carrier")
          }
          Write-Host "LOCKED_SOURCE_A=$password CARRIER_IDS=$($images -join ',') COUNT=$(@($images).Count)"
          python sims/openpuff_v400_extract.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Native source extraction failed to execute' }
          $result = Get-Content -LiteralPath 'probe-output/original-cuneiform/result.json' -Raw | ConvertFrom-Json
          if ($result.carrier_count -ne @($images).Count -or -not $result.bit_selection_verified -or -not $result.attempted -or (-not $single -and -not $result.carrier_chain_verified)) {
            throw 'Native original source chain, depth or attempt not verified'
          }
          Write-Host "LOCKED_SOURCE_NATIVE_RESULT $($result | Select-Object carrier_count, native_probe_outcome, output_present, outputs, completion_dialogs, error_dialogs | ConvertTo-Json -Depth 15 -Compress)"
          if ($result.native_probe_outcome -eq 'inconclusive-timeout') { throw 'Native source outcome inconclusive' }
          if ($result.output_present) { Write-Host 'POTENTIAL_LP2_PAYLOAD_FOUND_NEEDS_EXACT_VALIDATION' }
      - name: Retain screenshots, native error/completion dialogs and exact output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-p33-original-openpuff-single-maximum
          path: probe-output/
          if-no-files-found: warn
