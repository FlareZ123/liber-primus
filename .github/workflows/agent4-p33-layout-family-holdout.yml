name: Agent4 P33 Layout Family and THEIR RISE Holdout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p33 layout family and holdout audit
        shell: pwsh
        run: node sims/lp2_p33_layout_family_holdout_sft.cjs
