name: LP2 author-native prime-clause full-state inverse
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-state-prime-clause:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        model: [red16, visible, printed]
        output: [step, direct]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exhaust 29^4 keys on original and prime-authored GP-native control
        env:
          LP_MATRIX: ${{ matrix.model }}
          LP_OUTPUT: ${{ matrix.output }}
        run: node sims/source_4d_prime_clause_fullkey.cjs
      - name: Exhaust original radix29 binary pairs and positive gzip inverse
        if: matrix.output == 'direct'
        env:
          LP_MATRIX: ${{ matrix.model }}
        run: node sims/source_4d_radix29_bytes.cjs
      - name: Exact 5GP29-to-3-byte compressed-binary all-key sweep
        if: matrix.output == 'direct'
        env:
          LP_MATRIX: ${{ matrix.model }}
        run: node sims/source_4d_radix29_packed3.cjs
      - name: Key-independent per-page secret-alphabet 5rune-to-3byte source bound
        if: matrix.model == 'red16' && matrix.output == 'direct'
        run: node sims/radix29_packed3_page_permutation_invariant.cjs
