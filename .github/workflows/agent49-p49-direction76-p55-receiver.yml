name: Agent49 p49 DIRECTION76 to p55 receiver

on:
  workflow_dispatch:

jobs:
  sft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run p49 DIRECTION76 p55 receiver SFT
        run: node sims/lp2_p49_direction76_p55_receiver_sft.cjs
