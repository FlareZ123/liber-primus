name: Agent39 2013 parable totient BASE29 key on original p55 JPEG
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent39-parable-totient-base29-p55-openpuff
  cancel-in-progress: false
jobs:
  source-derived-single-carrier:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Install native OpenPuff UI requirements and validate capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native OpenPuff capture control failed' }
      - name: Verify source-derived parable totient and BASE29 password
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node sims/instar_metadata_totient_p55_gate.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Original p57 prime-product/totient source gate failed' }
          python -c "import json; c=json.load(open('resources/liber-primus/lp2-corpus.json',encoding='utf-8')); d=[2,19,16,20,7,2,26]; k=''.join(c['translit'][i] for i in d); assert k=='THMTLWTHY', (d,k); print('SOURCE_DERIVED_PHI_N_BASE29_KEY=THMTLWTHY')"
          if ($LASTEXITCODE -ne 0) { throw 'BASE29 key transliteration mismatch' }
          $carrier = Join-Path $env:GITHUB_WORKSPACE 'resources/liber-primus/72.jpg'
          if (-not (Test-Path -LiteralPath $carrier)) { throw 'Original LP2 p55 JPEG72 missing' }
          $hash = (Get-FileHash -LiteralPath $carrier -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'a80191592add93a86ed3868f9e4e6ba3944ec20c9ffccc7d3e221b461344beba') { throw "Original p55 carrier hash mismatch: $hash" }
          Write-Host "ORIGINAL_P55_JPEG72_SHA256=$hash"
      - name: Pin historical OpenPuff v4.00 binary and DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-v400-Agent39-PhiN'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original OpenPuff binary mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Recover published single-JPEG positive at the exact native JPEG level
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Published single-JPEG positive source unavailable' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format 'Jpeg (Image)' --bit-level '1/2 (50%) - Maximum' --out probe-output/public-recovery --wait-seconds 70
          if ($LASTEXITCODE -ne 0) { throw 'Native single-JPEG positive execution failed' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file() and p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('NATIVE_SINGLE_JPEG_35BYTE_POSITIVE_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Exact published single-JPEG payload mismatch' }
      - name: One A-only Unhide of original p55 JPEG72 with the frozen BASE29 totient key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $carrier = Join-Path $env:GITHUB_WORKSPACE 'resources/liber-primus/72.jpg'
          $out = 'probe-output/original-p55-phi-n-base29'
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$carrier" --password 'THMTLWTHY' --bit-format 'Jpeg (Image)' --bit-level '1/2 (50%) - Maximum' --out $out --wait-seconds 150
          if ($LASTEXITCODE -ne 0) { throw 'Native original p55 extraction did not execute' }
          $r = Get-Content -LiteralPath "$out/result.json" -Raw | ConvertFrom-Json
          if ($r.carrier_count -ne 1 -or -not $r.carrier_added -or -not $r.bit_selection_verified -or -not $r.attempted) {
            throw 'Native GUI did not verify the single original carrier, JPEG level, and actual extraction'
          }
          if ($r.native_probe_outcome -eq 'inconclusive-timeout') { throw 'Native OpenPuff result inconclusive' }
          Write-Host "PHI_N_BASE29_P55_NATIVE_RESULT $($r | Select-Object carrier_count,native_probe_outcome,output_present,outputs,selected_capacity_bytes_after_level,completion_dialogs,error_dialogs | ConvertTo-Json -Depth 12 -Compress)"
          if ($r.output_present) { Write-Host 'POTENTIAL_ORIGINAL_LP2_PAYLOAD_REQUIRES_EXACT_BYTE_AND_CONTENT_VALIDATION' }
      - name: Preserve exact native evidence and any extracted bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent39-phi-n-base29-p55-openpuff-native-evidence
          path: probe-output/
          if-no-files-found: warn
