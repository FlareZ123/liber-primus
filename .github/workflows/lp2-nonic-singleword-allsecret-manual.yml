name: LP2 nonic all-secret singleton recovery
on:
  workflow_dispatch:
jobs:
  original-singleton-lfsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover all 9-state seeds from original single-rune words
        run: node sims/lp2_nonic_singleword_allseed_gf29_sft.cjs
