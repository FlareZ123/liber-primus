name: Agent 22 original-source inverse gates
on:
  workflow_dispatch:
jobs:
  original-source-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original GP29 parity inversion and shuffled null
        run: |
          node sims/lp2_prime_clause_secret_even_rune_sft.cjs
          node sims/lp2_wordmap23_cycle_p55_native_inverse_sft.cjs
          node sims/lp2_23cycle_74interiors_74successors_sft.cjs
