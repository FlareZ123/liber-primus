name: Agent3 original p22 text-reading direction source gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-text-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-image dependencies
        run: python -m pip install numpy pillow
      - name: Source-pinned p22 text-line placement and reading-direction check
        run: python sims/lp2_p22_original_text_reading_direction_sft.py
