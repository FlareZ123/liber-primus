name: Agent12 original p27 Fibonacci761 one-key OutGuess image gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-original:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: resurrecting-open-source-projects/outguess
          ref: 24810e14327c2bbeedeaadd3e24491f2a4425c02
          path: outguess-src
          persist-credentials: false
      - name: Build pinned historical OutGuess 0.4 C extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool gnupg
          cd outguess-src
          ./autogen.sh
          ./configure --with-generic-jconfig
          sed -i 's/^#undef HAVE_PROTOTYPES/#define HAVE_PROTOTYPES/' src/jpeg-6b-steg/jconfig.h
          make -j2
          echo "$GITHUB_WORKSPACE/outguess-src/src" >> "$GITHUB_PATH"
      - name: Exact original 2016 signed control, source-key plant, and three original JPEG checks
        run: |
          node --check sims/lp2_fib761_source_outguess_original_sft.cjs
          node sims/lp2_fib761_source_outguess_original_sft.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent12-fib761-outguess-original-results
          path: outguess-fib761-source-results/
          if-no-files-found: warn
          retention-days: 30
