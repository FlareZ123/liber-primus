name: Agent12 original 2014 LP2 OutGuess observation source gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-observation-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and planted source-selection controls
        run: |
          node --check sims/lp2_2014_outguess_observation_sft.cjs
          node sims/lp2_2014_outguess_observation_sft.cjs --selftest
      - name: Download exact original 2014 IRC Git blobs and scan OutGuess evidence
        shell: bash
        run: |
          set -euo pipefail
          commit='ade9a02889ef8acbc8cde8edbfd0a785c369f4c3'
          for name in '#cicadasolvers.freenode.log' '#cicadasolvers.freenode.2.log' '#33012014.freenode.log'; do
            encoded="%23$(printf '%s' "$name" | sed 's/^#//')"
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/neuroretransmit/cicada/$commit/irc-logs/$encoded" \
              --output "$RUNNER_TEMP/$name"
          done
          node sims/lp2_2014_outguess_observation_sft.cjs \
            "$RUNNER_TEMP/#cicadasolvers.freenode.log" \
            "$RUNNER_TEMP/#cicadasolvers.freenode.2.log" \
            "$RUNNER_TEMP/#33012014.freenode.log"
      - name: Preserve source-pinned historical observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent12-2014-lp2-outguess-observations
          path: outguess-2014-source-results/
          if-no-files-found: ignore
          retention-days: 90
