name: Agent3 p28 DH shared-secret OutGuess test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outguess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the original repository inputs
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake build-essential git libjpeg-dev

      - name: Build pinned OutGuess 0.4
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 0.4 https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          cd /tmp/outguess
          ./autogen.sh
          CFLAGS="-O2 -std=gnu17" ./configure --with-generic-jconfig
          sed -i 's/^#undef HAVE_PROTOTYPES/#define HAVE_PROTOTYPES/' src/jpeg-6b-steg/jconfig.h
          sed -i 's/^#undef HAVE_UNSIGNED_CHAR/#define HAVE_UNSIGNED_CHAR/' src/jpeg-6b-steg/jconfig.h
          sed -i 's/^#undef HAVE_UNSIGNED_SHORT/#define HAVE_UNSIGNED_SHORT/' src/jpeg-6b-steg/jconfig.h
          sed -i 's/^#undef HAVE_STDDEF_H/#define HAVE_STDDEF_H/' src/jpeg-6b-steg/jconfig.h
          sed -i 's/^#undef HAVE_STDLIB_H/#define HAVE_STDLIB_H/' src/jpeg-6b-steg/jconfig.h
          make -j2
          sudo make install
          command -v outguess

      - name: Pin p28 source and run the single DH-derived key
        shell: bash
        env:
          LP2_OUTGUESS_PASSWORD: '2'
          LP2_OUTGUESS_SOURCE_IMAGE: '45'
        run: |
          set -euo pipefail
          actual="$(sha256sum resources/liber-primus/45.jpg | cut -d' ' -f1)"
          echo "p28_scan45_sha256=$actual"
          test "$actual" = "318bb587f4dcab11b4db7ba3b8bb13b7913ca79bb409e1c987595503a22e0522"
          node sims/outguess_lp2_keyed_probe.cjs

      - name: Preserve exact extraction and calibration outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-p28-dh-k2-outguess
          path: outguess-results-keyed/
          if-no-files-found: warn
