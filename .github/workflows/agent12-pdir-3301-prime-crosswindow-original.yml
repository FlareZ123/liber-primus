name: Agent12 source-registered 3301-times-prime cross-window whole original gate
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-two-window-key-transfer:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external-cicada3301
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy mpmath
      - name: Rebuild immutable original 3301 GP29 Rust and source segments
        run: |
          cargo build --release --manifest-path external-cicada3301/work/kscreen/Cargo.toml
          python external-cicada3301/work/kscreen/export.py
          python external-cicada3301/work/kscreen/signrules.py
          python external-cicada3301/work/kscreen/dirrules.py
          python sims/lp2_pdir_issue1329_gate.py external-cicada3301
      - name: Recover only frozen registered pdir000 original TSV
        uses: actions/download-artifact@v4
        with:
          run-id: "44006868510"
          name: pdir-stage1-000-0
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: frozen-original
      - name: Test paired 3301-times-prime against both entire original sections
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tsv = 'frozen-original/pdir/issue1329-stage1/000/real/A_prev_f_fwd.tsv'
          if (-not (Test-Path -LiteralPath $tsv)) { throw 'Missing original source-registered A_prev_f_fwd TSV' }
          $rows = @(Get-Content -LiteralPath $tsv -Encoding UTF8 | Where-Object { $_ -match '^1\.3[12]\d\d\t3301 \* p_n\t' })
          if ($rows.Count -ne 2) { throw "Expected exactly two top-registered prime-product original hits, got $($rows.Count)" }
          if ($rows[0] -notmatch '15360\t28\t0\tseg0\.8\t300' -or $rows[1] -notmatch '10754\t28\t0\tseg0\.7\t300') {
            throw 'Two original source-frozen keystream offsets or model changed'
          }
          $env:KSCREEN_BIN = (Resolve-Path 'external-cicada3301/work/kscreen/target/release/kscreen.exe').Path
          New-Item -Path 'prime-crosswindow-result' -ItemType Directory -Force | Out-Null
          python external-cicada3301/work/kscreen/verify.py $tsv --top 6 --controls 20 --out prime-crosswindow-result/whole-original-two-window.txt
          if ($LASTEXITCODE -ne 0) { throw 'Original reference inverse failed' }
          $report = Get-Content -LiteralPath 'prime-crosswindow-result/whole-original-two-window.txt' -Raw -Encoding UTF8
          $primeMentions = @([regex]::Matches($report, "3301 \* p_n' offset="))
          if ($primeMentions.Count -ne 2) { throw "Original two-section key reuse was not re-decoded twice: $($primeMentions.Count)" }
          Write-Host "ORIGINAL_3301_PRIME_TWO_WINDOW_COMPLETE_INTERPRET_EXACT_TEXTS"
          Write-Host $report
      - name: Preserve original 3301 prime key reuse complete text and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-3301-times-prime-two-segment-full-inverse
          if-no-files-found: warn
          path: prime-crosswindow-result/
