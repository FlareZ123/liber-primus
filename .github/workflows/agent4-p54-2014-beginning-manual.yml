    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Recover source-frozen original p54 crib and numeric vector
        run: node sims/lp2_p54_2014_beginning_source_sft.cjs
      - name: Test exact original p54 key and p56-style F bypass holdout
        run: node sims/lp2_p54_2014_beginning_original_key_sft.cjs
