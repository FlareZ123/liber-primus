name: Agent5 - original GEB title-crib full-source key gate
on:
  push:
    paths:
      - .github/workflows/agent5-2014-geb-title-key-source.yml
  workflow_dispatch:

jobs:
  original-geb-title-source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-authentic GEB and original GP29 p0 title-crib gate
        run: node sims/lp2_p0_2014geb_two_crib_key_source_sft.cjs
