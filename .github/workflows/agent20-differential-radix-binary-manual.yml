name: Agent20 GP29 differential radix binary decoder
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential-binary:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Positive controls and original 55-page binary-inverse test
        run: node sims/lp2_differential_radix_binary_sft.cjs
