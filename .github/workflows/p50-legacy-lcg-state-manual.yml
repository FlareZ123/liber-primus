name: LP2 original P50 exhaustive legacy LCG hidden-state source test

on:
  workflow_dispatch:

jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact full-source state inversion and planted positive
        run: |
          node --check sims/p50_2014_lcg_highbyte_state_sft.cjs
          node sims/p50_2014_lcg_highbyte_state_sft.cjs
          node --check sims/p50_lcg_all_increment_difference_sft.cjs
          node sims/p50_lcg_all_increment_difference_sft.cjs
