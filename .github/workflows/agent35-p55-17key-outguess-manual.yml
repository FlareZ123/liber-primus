name: Agent35 original p55 17-key OutGuess gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-key-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare original JPEG coefficient reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjpeg-dev
          mkdir -p evidence
      - name: Verify authentic LP1 03 OutGuess positive on original JPEG
        run: |
          python sims/outguess_extract.py resources/liber-primus/03.jpg "Default key" --output evidence/lp1-03-positive.pgp | tee evidence/lp1-03-positive.json
          python -c "from pathlib import Path; p=Path('evidence/lp1-03-positive.pgp'); assert p.stat().st_size == 31809 and p.read_bytes().startswith(b'-----BEGIN PGP SIGNED MESSAGE-----'); print('AUTHENTIC_LP1_03_OUTGUESS_CONTROL_PASS')"
      - name: Test only the forward source-derived 17-symbol key on original p55
        id: forward
        continue-on-error: true
        run: |
          python sims/outguess_extract.py resources/liber-primus/72.jpg "FIRFUMFERENFEDEEP" --output evidence/p55-forward-17key.bin | tee evidence/p55-forward-17key.json
      - name: Test only the reverse source-derived 17-symbol key on original p55
        id: reverse
        continue-on-error: true
        run: |
          python sims/outguess_extract.py resources/liber-primus/72.jpg "DEEPFIRFUMFERENFE" --output evidence/p55-reverse-17key.bin | tee evidence/p55-reverse-17key.json
      - name: Preserve both frozen attempts and summarize
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for stem in ("forward", "reverse"):
              p = Path(f"evidence/p55-{stem}-17key.json")
              b = Path(f"evidence/p55-{stem}-17key.bin")
              print(stem.upper(), "metadata_present", p.exists(), "payload_present", b.exists(),
                    "payload_bytes", b.stat().st_size if b.exists() else 0)
              if p.exists():
                  m = json.loads(p.read_text())
                  print(stem.upper(), "header_forced", m.get("header_is_source_forced"),
                        "header", m.get("header_hex"), "seed", m.get("seed"),
                        "length", m.get("length"), "magic", m.get("magic"),
                        "pgp", m.get("possible_openpgp_armor"),
                        "entropy", m.get("entropy_bits_per_byte"),
                        "printable", m.get("printable_fraction"),
                        "sha256", m.get("payload_sha256"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent35-p55-firfumferenfe-deep-outguess-original
          path: evidence/
          retention-days: 90
