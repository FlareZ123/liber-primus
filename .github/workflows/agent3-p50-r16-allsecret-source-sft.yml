name: Agent 3 p50 R16 all-secret source singleton SFT

on:
  workflow_dispatch:
jobs:
  single-file-test:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source factor, all-state singleton exclusions, positive controls
        run: node sims/lp2_p50_r16_allsecret_singleton_source_sft.cjs
      - name: P39 red-5 and p50 degree-238 quotient lag16 original-source SFT
        run: node sims/lp2_p39_p50_r238_red5_lag16_sft.cjs
