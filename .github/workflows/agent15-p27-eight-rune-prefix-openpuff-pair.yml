name: Agent15 marker-to-F eight rune p55-to-p27 native OpenPuff pair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p55-moth-to-p27-wing-original-pair:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        level: [medium, maximum]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Check exact source key and terminal seven-rune anchor
        shell: pwsh
        run: |
          node sims/lp2_p27_apical8_marker_fbracket_source_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Original source key/anchor check failed' }
      - name: Install native OpenPuff and prove x86-capable driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Original native capture test failed' }
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-Agent15-SourceChain'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Native binary source pin mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Decode authentic published 35-byte original-tool positive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Known source carrier unavailable' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format 'Jpeg (Image)' --bit-level '1/2 (50%) - Maximum' --out probe-output/public-recovery --wait-seconds 70
          if ($LASTEXITCODE -ne 0) { throw 'Native positive tool error' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file() and p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('EXACT_35_BYTE_POSITIVE_RECOVERED')"
          if ($LASTEXITCODE -ne 0) { throw 'Known hidden positive mismatch' }
      - name: Original p55 to p27 image sequence from exact repeated terminal text
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $choice = '${{ matrix.level }}'
          $level = if ($choice -eq 'maximum') { '1/2 (50%) - Maximum' } else { '1/5 (20%) - Medium' }
          $image55 = Join-Path $env:GITHUB_WORKSPACE 'resources/liber-primus/72.jpg'
          $image27 = Join-Path $env:GITHUB_WORKSPACE 'resources/liber-primus/44.jpg'
          $out = 'probe-output/source-chain-p55-p27-' + $choice
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$image55" --carrier "$image27" --password NHGUIAHUB --bit-format 'Jpeg (Image)' --bit-level $level --out "$out" --wait-seconds 160
          if ($LASTEXITCODE -ne 0) { throw 'Original two-carrier extraction did not run' }
          $r = Get-Content -LiteralPath "$out/result.json" -Raw | ConvertFrom-Json
          if ($r.carrier_count -ne 2 -or -not $r.carrier_chain_verified -or -not $r.bit_selection_verified -or -not $r.attempted) { throw 'Original source-ordered carrier chain or selection not verified' }
          if ($r.native_probe_outcome -eq 'inconclusive-timeout') { throw 'Original pair native probe inconclusive timeout' }
          Write-Host "APICAL8_ORIGINAL_PAIR_RESULT $($r | Select-Object carrier_count,native_probe_outcome,output_present,outputs,selected_capacity_bytes_after_level,completion_dialogs,error_dialogs | ConvertTo-Json -Compress -Depth 12)"
          if ($r.output_present) { Write-Host 'POTENTIAL_ORIGINAL_LP2_P55_P27_PAYLOAD_REQUIRES_VALIDATION' }
      - name: Persist original native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent15-eight-rune-p55-p27-${{ matrix.level }}
          path: probe-output/
          if-no-files-found: warn
