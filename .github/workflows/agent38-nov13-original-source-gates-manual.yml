name: Agent 38 source-key and word-IV gates (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original bookend cross-ratio source-key inverse with native plant
        run: node sims/lp2_bookend_crossratio_sourcekey_sft.cjs
      - name: Original word-edge IV all-secret invariant with native controls
        run: node sims/lp2_word_edge_iv_allsecret_sft.cjs
      - name: Original predecessor-rank word-state all-secret gate
        run: node sims/lp2_predecessor_rank_wordstate_allsecret_sft.cjs
      - name: Onion7 133/331 complete-cycle 256-cell readout original SFT
        run: node sims/lp2_onion7_133331_lcg256_carrier_sft.cjs
