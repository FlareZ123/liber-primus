name: Original grid source-key inverse challenge
on:
  workflow_dispatch:
    inputs:
      register:
        description: Fixed source language for rune decoding
        required: true
        type: choice
        default: english
        options:
          - english
          - latin
      attack:
        description: GP rune inverse or binary radix28 capacity test
        required: true
        type: choice
        default: unigram
        options:
          - unigram
          - binary
jobs:
  source-csprng:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source-key additive GP inverse with frozen assignment and heldout
        if: ${{ inputs.attack == 'unigram' }}
        env:
          GP_REGISTER: ${{ inputs.register }}
        run: node sims/grid_csprng_keyskip_heldout.cjs
      - name: Source-key GP28 binary capacity inverse with byte-control
        if: ${{ inputs.attack == 'binary' }}
        run: node sims/grid_csprng_radix28_binary.cjs
