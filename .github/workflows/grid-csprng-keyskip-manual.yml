name: Original grid AES ChaCha20 eight-key inverse challenge
on:
  workflow_dispatch:
jobs:
  source-csprng:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source-key standard CSPRNG inverse with frozen assignment and heldout
        run: node sims/grid_csprng_keyskip_heldout.cjs
