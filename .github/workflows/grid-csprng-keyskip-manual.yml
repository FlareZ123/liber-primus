name: Source-key inverses and exact ciphertext row bound
on:
  workflow_dispatch:
    inputs:
      register:
        description: Fixed source language for rune decoding
        required: true
        type: choice
        default: english
        options:
          - english
          - latin
      attack:
        description: Grid rune/binary inverse or exact book-wide S-box row capacity
        required: true
        type: choice
        default: unigram
        options:
          - unigram
          - binary
          - sbox_bound
jobs:
  source-csprng:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source-key additive GP inverse with frozen assignment and heldout
        if: ${{ inputs.attack == 'unigram' }}
        env:
          GP_REGISTER: ${{ inputs.register }}
        run: node sims/grid_csprng_keyskip_heldout.cjs
      - name: Source-key GP28 binary capacity inverse with byte-control
        if: ${{ inputs.attack == 'binary' }}
        run: node sims/grid_csprng_radix28_binary.cjs
      - name: Exact book-wide predecessor-ciphertext S-box row bound and synthetic controls
        if: ${{ inputs.attack == 'sbox_bound' }}
        run: node sims/previous_cipher_row_symbol_bound.cjs
