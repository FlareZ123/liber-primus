name: Agent1 p32 prime-axis p15 exact original replay
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent1-p32-primeaxis-p15-onpush.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-exact p32 p15 four-square
        run: node sims/lp2_p32_primeaxis4_p15_hill_source_sft.cjs
