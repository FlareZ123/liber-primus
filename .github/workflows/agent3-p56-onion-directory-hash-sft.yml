name: Agent 3 p56 historical onion-directory hash SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-direct-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the exact 15 September 2014 candidate corpus
        run: |
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/kenorb/cicada-2014/2e0cb5ace2f4172cda402489201bbbe27dd19999/stage11/scripts/onions-list.txt" \
            --output "$RUNNER_TEMP/onions-list.txt"
      - name: Verify source bytes and test direct p56 hash candidates
        run: node sims/lp2_p56_onion_directory_hash_sft.cjs "$RUNNER_TEMP/onions-list.txt"
      - name: Test exact archived 2014 Stage11 index bytes against p56
        run: node sims/lp2_p56_stage11_index_direct_hash_sft.cjs
