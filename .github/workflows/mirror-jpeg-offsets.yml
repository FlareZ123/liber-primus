name: LP2 mirrored JPEG exhaustive offset search
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-offsets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search every byte offset of LP1 image mirror
        run: node sims/mirror_jpeg_offsets.cjs
