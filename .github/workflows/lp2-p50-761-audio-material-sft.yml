name: LP2 p50 original 2013 instar audio exact-source key gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-761-source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve original 2013 audio with immutable archive ref
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/761.MP3 \
            https://raw.githubusercontent.com/rtkd/iddqd/f2267b0c2f1e1d2662806b90b9c3a2953b3a7023/2013/02/761.MP3
          test "$(git hash-object /tmp/761.MP3)" = "7e2bd299fbc7b96283219cf15e2904641daf631f"
      - name: Test source-exact byte relationship and planted positive
        run: node sims/lp2_p50_761_audio_exact_material_sft.cjs /tmp/761.MP3
