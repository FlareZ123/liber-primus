name: Agent1 perimeter checksum and bookend source-key tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate CommonJS source
        run: node --check sims/lp2_p50_rim76_p55_r4_74check_source_sft.cjs
      - name: Check 48 original source-key receivers and native-GP packet plant
        run: node sims/lp2_p50_rim76_p55_r4_74check_source_sft.cjs
      - name: Validate 76-geometry source crib CommonJS
        run: node --check sims/lp2_p57_our_own_76_bookend_crib_sft.cjs
      - name: Recover all anchored F-transparent p55 and p27 candidates
        run: node sims/lp2_p57_our_own_76_bookend_crib_sft.cjs
      - name: Validate six-rune echo three-tape GF29 code
        run: node --check sims/lp2_p27_echo6_three76_p55_affine_inverse_sft.cjs
      - name: Invert all 8 three-tape source affine models with positive controls
        run: node sims/lp2_p27_echo6_three76_p55_affine_inverse_sft.cjs
