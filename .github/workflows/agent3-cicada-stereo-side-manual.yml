name: Agent3 source-stereo historical audio key gate (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-stereo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install signal, MIDI and lock packages
        run: python -m pip install filelock imageio-ffmpeg librosa numpy scipy mido
      - name: Acquire authenticated original Cicada audio
        run: python sims/agent3_fetch_audio_sources.py
      - name: Test stereo side under original note-duration and published GP29 R4 receivers
        run: python sims/lp2_cicada_audio_stereo_side_sft.py
      - uses: actions/upload-artifact@v4
        with:
          name: agent3-audio-stereo-side-original
          path: run-data/agent3-authentic-audio/stereo-side-timing-results.json
          retention-days: 14
