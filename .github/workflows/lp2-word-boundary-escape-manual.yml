name: LP2 source word-gap escape decoder SFT

on:
  workflow_dispatch:

jobs:
  source-boundary-gate:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout original source and reproducible program
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute original-input and positive-control tests
        run: node sims/lp2_word_boundary_escape_sft.cjs
