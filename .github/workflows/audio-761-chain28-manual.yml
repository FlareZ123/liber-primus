name: 2013 761 MP3 as 28-state LP2 chain key
on:
  workflow_dispatch:
jobs:
  source-gated-chain-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download pinned original 2013 audio
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/761.MP3 \
            https://raw.githubusercontent.com/rtkd/iddqd/f2267b0c2f1e1d2662806b90b9c3a2953b3a7023/2013/02/761.MP3
      - name: Run the fixed 32-model original-cipher and planted-positive gate
        run: node sims/audio_761_chain28_source_gate.cjs /tmp/761.MP3
