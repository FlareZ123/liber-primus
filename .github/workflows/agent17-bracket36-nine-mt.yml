name: Agent17 36-Byte Nine-Chapter MT Key Source Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chapter-mt:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check direct original GP29 inverses against nine chapter keys
        run: python sims/lp2_p50_bracket36_nine_mt_sft.py
