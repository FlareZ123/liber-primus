name: LP2 original grid two-skip frozen heldout (manual)
on:
  workflow_dispatch:
jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen first300 source-key search and original second300 heldout
        run: node sims/grid_two_skip_frozen_secondblock.cjs
