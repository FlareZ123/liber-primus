name: Agent20 source-select RSA179 LP1 squares p50 inverse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rsa179-original:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original table RSA inverse and source-shaped positive control
        run: node sims/lp2_lp1_magic_square_rsa179_p50_sft.cjs
