name: Agent4 root201 page-prime exact inverse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  root201-pageprime:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sims/lp2_root201_pageprime_exact_sft.cjs
      - run: node sims/lp2_root201_pageprime_exact_sft.cjs
