name: Agent5 p55 serializer-family gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  serializer-family:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sims/lp2_p55_quintet_serializer_family_sft.cjs
      - run: node sims/lp2_p55_quintet_serializer_family_sft.cjs
