name: 2012-2014 public archive media OCR scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-public-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Scan public archive images and DOCX
        run: python3 sims/cicada_public_archive_media_scan.py

      - name: Upload sanitized candidate report
        uses: actions/upload-artifact@v4
        with:
          name: cicada-public-archive-media-scan
          path: artifacts/cicada-public-archive-media-scan/
          if-no-files-found: error
          retention-days: 30
