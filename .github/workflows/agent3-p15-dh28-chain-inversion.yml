name: Agent 3 p15 DH28 nonzero-step complete source-key recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent3-p15-dh28-chain-inversion.yml

jobs:
  nonzero-group-chain:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 1903 rune DH28 CRT key reconstruction and exact native plant
        run: node sims/lp2_p15_dh28_r16_chapter_key_recovery_sft.cjs
