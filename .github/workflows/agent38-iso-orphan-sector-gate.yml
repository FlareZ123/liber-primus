name: Agent38 original 2013 ISO unclaimed-sector audit
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source reader
        run: python -m pip install pycdlib==1.22.0 filelock==3.20.0 requests==2.32.5
      - name: Audit byte-verified original ISO and exact sector complement
        run: python sims/cicada2013_iso_unclaimed_sector_sft.py --iso 3301-2013.iso --report cicada2013-iso-sector-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent38-cicada2013-iso-sector-audit
          path: cicada2013-iso-sector-audit.json
          if-no-files-found: ignore
