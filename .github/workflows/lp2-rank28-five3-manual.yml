name: LP2 rank28 five-to-three-byte original gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank28-five3:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Original source and native binary plant
        run: node sims/lp2_rank28_five_to_three_byte_sft.cjs
