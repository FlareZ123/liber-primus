name: Agent11 LP2 source-anchored framing identifiability
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-framing-proof:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove exact original-source boundary ambiguity and authentic positive
        run: node sims/lp2_anchored_frame_identifiability_sft.cjs
