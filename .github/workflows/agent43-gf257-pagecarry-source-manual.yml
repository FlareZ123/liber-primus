name: Agent43 original GF257 and page-carry native controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-original-sfts:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test original 256-cell GF257 evaluation-code hypothesis
        run: node sims/agent43_p50_gf257_rs240_original_sft.cjs
      - name: Test original 32-carry state and exact repeated-sum pairs
        run: node sims/lp2_pagecarry_source_update_original_sft.cjs
