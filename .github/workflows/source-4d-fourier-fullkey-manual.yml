name: LP2 source-4D Fourier exact full-key inverse
on:
  workflow_dispatch:
  push:
    paths:
      - 'sims/source_4d_fourier_fullkey_inverse.cjs'
      - '.github/workflows/source-4d-fourier-fullkey-manual.yml'
jobs:
  exhaustive-source-4d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exhaustive original and blind native GP control
        run: node sims/source_4d_fourier_fullkey_inverse.cjs | tee /tmp/source-4d-native-gp.json

      - name: Exhaustive independent Latin GP register on same original
        run: GP_REGISTER=latin node sims/source_4d_fourier_fullkey_inverse.cjs | tee /tmp/source-4d-latin-gp.json

      - name: All-key direct GP29 additive source-state inversion, native Cicada
        run: GP_DIRECT=1 node sims/source_4d_fourier_fullkey_inverse.cjs | tee /tmp/source-4d-native-direct.json
      - name: All-key direct GP29 additive source-state inversion, Latin Vulgate
        run: GP_DIRECT=1 GP_REGISTER=latin node sims/source_4d_fourier_fullkey_inverse.cjs | tee /tmp/source-4d-latin-direct.json

      - name: Upload machine-readable exhaustive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-4d-fourier-fullkey
          path: /tmp/source-4d-*.json
          if-no-files-found: error
          retention-days: 7
