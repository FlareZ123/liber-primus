name: 2016 oak stock native dimensions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare published stock-image metadata with signed 2016 carrier
        run: node sims/cicada2016_oak_stock_intrinsic_size_sft.cjs
