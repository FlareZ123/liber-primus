name: LP2 Jung title-only original multisets (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  titled-source-inverse:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extraction
        run: python -m pip install "pymupdf>=1.25,<2"
      - name: Inspect original LP2 against source-title chapter or page word permutations
        run: python sims/lp2_jung_multiset_source_inverse_sft.py
