name: Agent4 original-source cryptanalytic gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical LP2 source
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact Fibonacci page lag-eight collision and 64-lag familywise gate
        run: node sims/lp2_fibonacci_page_step_lag8_sft.cjs
      - name: Run original Fibonacci-page GP29 differential-spectrum and eight-column inverse gate
        run: node sims/lp2_fibonacci_page_delta_spectrum_sft.cjs
      - name: Run frozen p15 1903-rune Josephus gate
        run: node sims/p15_spiral_josephus_sft.cjs
      - name: Run frozen p55 75-rune Wisdom matrix gate
        run: node sims/p55_wisdom5_hill75_sft.cjs
      - name: Run exact original-page and chapter GF29 shared-factor exclusion
        run: node sims/lp2_crosspage_gf29_gcd_sft.cjs
      - name: Test exact physical page-boundary root enrichment under chapter-wise familywise null
        run: node sims/lp2_page_roots_original_boundary_sft.cjs
