name: Agent21 OnionScan 2016 p56 hash corpus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-onionscan-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact 512-bit digest implementations
        run: python -m pip install --disable-pip-version-check 'pyskein==1.0' 'gostcrypto==1.2.5' 'pycryptodome==3.23.0'
      - name: Clone public July 2016 OnionScan result corpus
        run: git clone --depth 1 https://github.com/kal1gh0st/OSINT.git "$RUNNER_TEMP/onionscan-osint"
      - name: Scan SHA1-validated front-page snapshots
        run: |
          python sims/agent21_onionscan_2016_p56_hash.py \
            "$RUNNER_TEMP/onionscan-osint/onionrunner/onion_result" \
            "$RUNNER_TEMP/agent21-onionscan-p56-report.json"
      - name: Preserve exact scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent21-onionscan-p56-report
          path: ${{ runner.temp }}/agent21-onionscan-p56-report.json
          if-no-files-found: error
