name: Agent8 original LP2 57 word-number all-secret affine-ramp SFT
on:
  push:
    paths:
      - '.github/workflows/agent8-wordnumeric-allsecret-original.yml'
  workflow_dispatch:
jobs:
  original-source-test:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 57 source-word ramp inverse families with native GP29 controls
        run: node sims/lp2_wordnumeric_affine_ramp_allsecret_source_sft.cjs
      - name: Test all secret word offset and slope via original second differences
        run: node sims/lp2_wordaffine_twofree_second_difference_original_sft.cjs
      - name: Test original base60 grid 32x32 ECC200 mandatory finder source projection
        run: node sims/lp2_p50_base60_low2_datamatrix32_original_sft.cjs
