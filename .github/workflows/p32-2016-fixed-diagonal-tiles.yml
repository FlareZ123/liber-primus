name: p32 2016 fixed diagonal tile source gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Run frozen six-tile path against all 36 southeast diagonals
        shell: bash
        run: |
          set -o pipefail
          python sims/p32_2016_fixed_diagonal_tiles_sft.py | tee p32-2016-fixed-diagonal-result.json
      - name: Preserve exact source-gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p32-2016-fixed-diagonal-result
          path: p32-2016-fixed-diagonal-result.json
          if-no-files-found: warn
