name: Agent12 p57 LP3 original LP1 page03 OutGuess
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lp1-original-p03:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned original OutGuess
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool build-essential libjpeg-dev
          git clone --depth 1 https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          git -C /tmp/outguess fetch --depth 1 origin 24810e14327c2bbeedeaadd3e24491f2a4425c02
          git -C /tmp/outguess checkout --detach 24810e14327c2bbeedeaadd3e24491f2a4425c02
          cd /tmp/outguess
          ./autogen.sh
          CFLAGS='-O2 -std=gnu11' ./configure --with-generic-jconfig
          make -j2 CC='gcc -std=gnu11' CFLAGS='-O2 -std=gnu11'
          sudo make install
      - name: Run source-frozen test and exact original positive controls
        run: |
          node --check sims/lp2_p57_lp3_lp1p03_outguess_source_sft.cjs
          node sims/lp2_p57_lp3_lp1p03_outguess_source_sft.cjs
      - name: Preserve raw extraction and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent12-lp3-lp1-p03-outguess
          path: outguess-results-keyed/
          if-no-files-found: warn
          retention-days: 30
