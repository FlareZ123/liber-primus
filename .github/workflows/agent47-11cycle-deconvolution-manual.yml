name: Agent47 p50 11cycle p32 deconvolution test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp2_p32_p50_11cycle_circular_deconvolution_sft.cjs
