name: LP2 81x81 to 80x80 border peel allsecret (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bordered:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source square border deletion with every missing-five gap and unknown alphabet
        run: node sims/lp2_81square_borderpeel_allgap_allsecret_original_sft.cjs
