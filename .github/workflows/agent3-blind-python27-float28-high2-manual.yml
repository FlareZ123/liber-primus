name: Agent3 blind Python27 float28 high-bit original-input gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-python27-float28:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile original-input all-state GF2 inference
        run: g++ -std=c++17 -O3 -march=native -Wall -Wextra sims/lp2_blind_python27_float28_high2_sft.cpp -o /tmp/lp2_blind_python27_float28_high2
      - name: Test 4 untouched LP2 ranks and 2 complete MT53 plants
        run: /tmp/lp2_blind_python27_float28_high2 | tee python27-float28-original.log
      - name: Preserve source-original result log
        uses: actions/upload-artifact@v4
        with:
          name: python27-float28-fullstate-original-gate
          path: python27-float28-original.log
          retention-days: 90
