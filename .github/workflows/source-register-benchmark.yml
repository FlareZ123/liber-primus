name: Source register GP29 benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic GP29 source-register benchmark
        run: node sims/source_register_benchmark.cjs
      - name: Re-evaluate exact plaintext-history cipher gates with authenticated ING/IO spellings
        run: node sims/lp2_plain_history_native_orthography_sft.cjs
      - name: Test LP1-p5 moth-linked 30-rune crib with keyless plaintext feedback
        run: node sims/lp2_p55_moth_p5_crib_autokey_lag30_sft.cjs
