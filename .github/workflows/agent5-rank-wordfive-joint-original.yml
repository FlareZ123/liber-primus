name: Agent5 rank28 and word-five original inverse
on:
  workflow_dispatch:

jobs:
  source-original-validated:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact GP29 source and planted original-doublet control
        run: node sims/lp2_predecessor_rank_word5_affine_joint_sft.cjs
