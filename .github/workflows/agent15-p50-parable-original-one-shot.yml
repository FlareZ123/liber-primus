name: Agent 15 original p50/Parable source keys (one-shot)
on:
  workflow_dispatch:
jobs:
  original-source:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: p50 GF2 linear-generator gate
        run: node sims/lp2_p50_linear_generator_original_sft.cjs
      - name: all-state Parable Blum-Blum-Shub table gate
        run: node sims/lp2_p50_parable_bbs_allstate_original_sft.cjs
      - name: 2013 Parable Blum-Blum-Shub original gate
        run: node sims/lp2_2013_parable_bbs_original_sft.cjs

      - name: full-state p55 GP29 language inverse
        run: node sims/lp2_p55_parable_bbs_allstate_gp29_original_sft.cjs
      - name: all-state p55 six GP29 register transports
        run: node sims/lp2_p55_parable_bbs_allstate_register_modes_sft.cjs
      - name: universal 153-key GP29 original language cancellation
        run: node sims/lp2_p50_parable_universal153_gp29_lag_sft.cjs
      - name: allstate p55 F transparent real source invert
        run: node sims/lp2_p55_parable_bbs_allstate_ftransparent_sft.cjs
