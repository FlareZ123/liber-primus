name: Agent4 p50 functional graph source-selector SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check SFT syntax
        run: node --check sims/lp2_p50_functional_graph_2016_wordmap_sft.cjs
      - name: Reproduce original-image transcription, 2+11 graph, and source selector
        run: node sims/lp2_p50_functional_graph_2016_wordmap_sft.cjs
