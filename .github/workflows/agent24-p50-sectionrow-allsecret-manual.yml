name: Agent24 P50 eight-section predecessor lookup bound
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce original source 16-case all-secret bound
        run: node sims/lp2_p50_sectionrow_cprev_allsecret_original_sft.cjs
