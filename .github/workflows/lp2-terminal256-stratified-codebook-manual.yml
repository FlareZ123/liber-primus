name: LP2 256-cell secret codebook collision gate
on:
  workflow_dispatch:

jobs:
  original-source-codebook:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original GP29 source, 512 ring layouts and planted controls
        shell: pwsh
        run: node sims/lp2_terminal256_stratified_codebook_sft.cjs
