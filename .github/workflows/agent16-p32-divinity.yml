name: Agent16 P32 Historical DIVINITY Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  divinity:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact historical DIVINITY transfer gate
        shell: pwsh
        run: node sims/agent16_p32_inner_divinity_historical_sft.cjs
