name: LP2 physical-line start glyph-width audit (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widths:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and numerical libraries
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Evaluate image-rune horizontal advances on source-disjoint physical pages
        run: python sims/physical_line_start_width_probe.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce independent first-ink-run mode widths from source JPEGs
        run: python sims/physical_line_start_ink_modes.py
      - name: Test untouched manuscript pages against frozen glyph widths
        run: node sims/lp2_line_start_size_bias.cjs

  gimp-original-fullglyph:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-image and numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pillow
      - name: Test locked GIMP pixel-derived keys on original LP2 with planted inverses
        run: python sims/gimp_fullglyph_source_inverse.py
