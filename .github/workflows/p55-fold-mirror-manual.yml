name: Original LP2 p55 mirrored vine fold (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sims/p55_fold_fragment18_p27_title_sft.cjs"
      - "resources/liber-primus/lp2-corpus.json"
      - "resources/control/duko_round27_english_quadgrams.txt"
      - "resources/control/gibran_prophet_58585.txt"
permissions:
  contents: read
jobs:
  p55-image-fold:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image comparison dependencies
        run: python -m pip install pillow numpy
      - name: Verify source p55 image fold and ring exceptions
        run: python sims/p55_fold_mirror_original_image_sft.py

  p27-bookend-reverse76:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fold-selected p27 anchored reverse 76-rune window on p55
        run: node sims/p55_p27_bookend_reverse76_gate.cjs

  p27-13col-translation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fixed p27-to-p55 13-column translation key
        run: node sims/p55_p27_13col_translation_gate.cjs

  p27-title-key-sft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce fold-selected p27 title and p55 title-key gates
        run: node sims/p55_fold_fragment18_p27_title_sft.cjs
