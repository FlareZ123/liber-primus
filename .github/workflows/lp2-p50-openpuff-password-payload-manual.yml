name: LP2 historical OpenPuff password as original-grid AES payload
on:
  workflow_dispatch:
jobs:
  source-input:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original-grid password AES payload hypothesis
        run: node sims/lp2_p50_openpuff_password_payload_sft.cjs
