name: 2014 cluosh original solver recovered-input replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install period module's two imports
        run: python -m pip install numpy==2.2.6 matplotlib==3.10.7
      - name: Load immutable 2014 Git blob and execute on original p0/p54 and authentic p56
        run: python sims/lp2_2014_cluosh_original_tool_replay_sft.py
