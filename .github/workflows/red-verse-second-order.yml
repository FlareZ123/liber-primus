name: LP2 red 51-rune second-order keystream inversion
on:
  workflow_dispatch:
jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify planted recovery under every two-symbol edit pattern
        run: node sims/test_red_verse_second_order_key.cjs
      - name: Invert marked stanza from eleven-rune anchor
        run: node sims/red_verse_second_order_key.cjs
