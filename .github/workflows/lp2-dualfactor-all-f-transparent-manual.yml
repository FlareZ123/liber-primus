name: LP2 source dual-factor literal-F transparency gate
on:
  workflow_dispatch:
jobs:
  original-all-f:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exact original all-F transparent H/G and p57 control
        run: node sims/lp2_dualfactor_allF_transparent_original_sft.cjs
