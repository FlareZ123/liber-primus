name: Agent5 original-source red256 and numbered-five gates
on:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Which original-source gate to execute'
        type: choice
        required: true
        default: all
        options:
          - all
          - numbered-index
          - literary
          - scroll

permissions:
  contents: read

jobs:
  original-source-pointer:
    if: inputs.gate == 'all'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Direct source byte-indexed red-event lookup
        run: node sims/lp2_red256_p50_byteindexed_bookcode_sft.cjs

  numbered-five-feedback:
    if: inputs.gate == 'all'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original five-source-label GP29 feedback inverse
        run: node sims/lp2_p36_38_five_numbered_feedback_sft.cjs

  historical-2015-2014-composite:
    if: inputs.gate == 'all'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historical 2015 prime-delta and solved 2014 14-column cipher test
        run: node sims/lp2_2015_prime_delta_2014col14_phi_sft.cjs

  numbered-five-literal-index:
    if: inputs.gate == 'numbered-index' || inputs.gate == 'all'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-number literal indexing and five-share interpolation
        run: node sims/lp2_p36_38_numbered_index_lagrange_sft.cjs

  source-literary-gutenberg:
    if: inputs.gate == 'literary' || inputs.gate == 'all'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned public-domain NLTK Gutenberg literal-GP wordlength source test
        run: python sims/lp2_nltk_gutenberg_wordlength_literal_gate_sft.py

  source-scroll-red-cap:
    if: inputs.gate == 'scroll' || inputs.gate == 'all'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-image Python dependencies
        run: python -m pip install numpy pillow opencv-python-headless
      - name: Exact original-image margins and red initials gate
        run: python sims/lp2_p3_p7_scroll_cap_source_geometry_sft.py
