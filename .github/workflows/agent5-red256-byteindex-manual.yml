name: Agent5 source red256 to p50 byte-index gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-pointer:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Direct source byte-indexed red-event lookup
        run: node sims/lp2_red256_p50_byteindexed_bookcode_sft.cjs
