name: Agent23 nonlinear zero-map original full-secret gate
on:
  push:
    paths:
      - '.github/workflows/agent23-nonlinear-zero-map-original.yml'
      - 'sims/lp2_nonlinear_zero_map_allsecret_source_gate_sft.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-nonlinear-zero-map:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and run fully key-independent original-input gate
        run: |
          node --check sims/lp2_nonlinear_zero_map_allsecret_source_gate_sft.cjs
          node sims/lp2_nonlinear_zero_map_allsecret_source_gate_sft.cjs
