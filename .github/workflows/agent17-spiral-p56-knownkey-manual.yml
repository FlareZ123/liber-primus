name: LP2 spiral table to authentic p56 known key gate
on:
  workflow_dispatch:
jobs:
  original-known-key-source-gate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact original p56 key with positive plant
        run: |
          node --check sims/lp2_spiral_table_p56_authentic_key_sft.cjs
          node sims/lp2_spiral_table_p56_authentic_key_sft.cjs
