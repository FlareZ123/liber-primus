name: LP2 base60 grid keyskip probe
on:
  workflow_dispatch:
jobs:
  grid-keyskip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run constrained-grid search with controls
        run: node sims/grid_keyskip_viterbi.cjs
