name: LP2 base60 grid cryptanalytic probes
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Select source-derived grid experiment'
        type: choice
        required: true
        default: keyskip
        options:
          - keyskip
          - fullword-prng
          - corrected-grid-inverse
jobs:
  grid-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original constrained-grid keyskip search
        if: ${{ inputs.probe == 'keyskip' }}
        run: node sims/grid_keyskip_viterbi.cjs
      - name: Exact fullword PRNG source inversions
        if: ${{ inputs.probe == 'fullword-prng' }}
        run: node sims/grid_fullword_prng_exact_inversion.cjs
      - name: Five-cell original-source direct-grid inversion and native English controls
        if: ${{ inputs.probe == 'corrected-grid-inverse' }}
        run: node sims/grid_five_cell_corrected_inversion.cjs
      - name: Five-cell corrected-grid hidden-skip shared-alphabet inverse
        if: ${{ inputs.probe == 'corrected-grid-inverse' }}
        env:
          LP2_GRID_FIVE_CORRECTIONS: '1'
        run: node sims/outer_permutation_unknown_column_assignment.cjs
