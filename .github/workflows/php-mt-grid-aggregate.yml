name: Aggregate PHP MT direct-grid seed search

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed grid sweep workflow run
        type: string
        required: true
        default: '0'
      start:
        description: Inclusive seed
        type: string
        required: true
        default: '0'
      end:
        description: Exclusive seed
        type: string
        required: true
        default: '4294967296'
      shards:
        description: Shard count
        type: string
        required: true
        default: '128'

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact original shard records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --dir downloaded
      - name: Reconcile all 256 byte-shape orientations and seed intervals
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          SHARDS: ${{ inputs.shards }}
        run: |
          node sims/aggregate_php_mt_grid.cjs downloaded php-mt-grid-exhaustive.json "$START" "$END" "$SHARDS"
      - name: Preserve audited grid-generator search
        uses: actions/upload-artifact@v4
        with:
          name: php-mt-grid-exact-domain-aggregate
          retention-days: 90
          path: php-mt-grid-exhaustive.json
