name: LP2 Cicada public-key modulus skip-aware key recovery
on:
  workflow_dispatch:
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/pgp_modulus_skip_attack.cjs
