name: Signed 2016 visible-word to p32 tile probe

on:
  workflow_dispatch:

jobs:
  visible-word-tile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image reader
        run: python -m pip install --disable-pip-version-check --quiet Pillow
      - name: Run frozen visible-word tile readout
        run: python sims/signed2016_visible_word_tile_sft.py
