name: Agent 10 p15 spiral BASE29 key original gate
on:
  workflow_dispatch:

jobs:
  source-base29-p15:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check SFT syntax and execute original data with positive controls
        run: |
          node --check sims/lp2_p15_spiral_base29_fkey_source_sft.cjs
          node sims/lp2_p15_spiral_base29_fkey_source_sft.cjs
