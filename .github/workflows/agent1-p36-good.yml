name: Agent1 p36 GOOD Same-Index Shell

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  good:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p36 GOOD same-index shell SFT
        shell: pwsh
        run: node sims/lp2_p36_good_sameindex_state_shell_sft.cjs
