name: LP2 p2/p27 original JPEG 2013 MP3 XOR source gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-original-xor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve exact archived 2013 MP3
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/761.MP3 \
            https://raw.githubusercontent.com/rtkd/iddqd/f2267b0c2f1e1d2662806b90b9c3a2953b3a7023/2013/02/761.MP3
          echo '83008217439110c3b824898af73b99cb2cf0657dda88cb363c3aa34a4ec0a460  /tmp/761.MP3' | sha256sum -c -
      - name: Retrieve exact archived 2013 Gematria JPEG
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/gematria.jpg \
            https://raw.githubusercontent.com/neuroretransmit/cicada/ade9a02889ef8acbc8cde8edbfd0a785c369f4c3/2013/003-twitter/gematria.jpg
      - name: Check historical positive and test original p27 versus two controls
        run: |
          node --check sims/lp2_p27_761mp3_originaljpeg_xor_sft.cjs
          node sims/lp2_p27_761mp3_originaljpeg_xor_sft.cjs /tmp/761.MP3
      - name: Resolve p27 scalar 280 against original 2013 byte boundaries
        run: |
          node --check sims/lp2_p27_instar_280_byte_boundary_sft.cjs
          node sims/lp2_p27_instar_280_byte_boundary_sft.cjs /tmp/761.MP3 /tmp/gematria.jpg

      - name: Test the source-motivated original p2 cicada-nymph JPEG
        run: node sims/lp2_p27_761mp3_originaljpeg_xor_sft.cjs /tmp/761.MP3 2
