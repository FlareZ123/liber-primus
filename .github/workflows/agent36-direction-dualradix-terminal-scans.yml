name: Agent36 DIRECTION dual-radix terminal scan SFT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal-scans:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 2016 signed-word and original p50 scan check
        shell: pwsh
        run: |
          node --check sims/lp2_signed_direction_dualradix_terminal_scans_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'syntax' }
          node sims/lp2_signed_direction_dualradix_terminal_scans_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'source regression' }
