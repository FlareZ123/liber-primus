name: LP2 affine feedback exhaustive
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affine-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependency
        run: python -m pip install numpy==2.3.5
      - name: Exhaust order-1 through order-3 affine feedback, with controls
        run: python sims/affine_feedback.py
