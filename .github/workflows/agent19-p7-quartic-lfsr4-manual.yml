name: Agent19 P7 irreducible quartic original LFSR gate
on:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-exact GF29 quartic test
        run: node sims/lp2_p7_quartic_irreducible_lfsr4_original_sft.cjs
      - name: Run p56 F-transparent source-clock recipient gate
        run: node sims/lp2_p7_quartic_lfsr4_Ftransparent_original_sft.cjs
      - name: Adjacent source GF29 quartic four-rune block multiplier
        run: node sims/lp2_p7_gf29quartic_p8_red4_blockmul_original_sft.cjs
