name: Agent43 Tao 81-chapter word-map gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tao81-wordmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the source-selected 81-chapter word map
        run: node sims/lp2_tao81_chapter_wordmap.cjs
