name: Agent1 phonemic-register capacity original SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install historical pronunciation dictionary adapter
        run: python -m pip install --disable-pip-version-check "cmudict==1.1.3"
      - name: Source-original phonemic control and exact capacity gate
        run: python sims/lp2_phonemic_register_capacity_sft.py
