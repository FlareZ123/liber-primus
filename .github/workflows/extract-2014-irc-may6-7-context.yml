name: Extract pinned 2014 IRC May 6-7 context
on:
  workflow_dispatch:
jobs:
  extract_context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned original log blob
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/cicada-solvers/neuroretransmit-cicada/main/irc-logs/%23cicadasolvers.freenode.log' \
            --output /tmp/cicadasolvers.freenode.log
          actual="$(git hash-object /tmp/cicadasolvers.freenode.log)"
          test "$actual" = "bdd277c14f94c34b5ae714cd00c238065beeed4e"
          printf 'Pinned Git blob SHA verified: %s\n' "$actual"
      - name: Extract original line windows
        run: |
          {
            printf 'Source: https://github.com/cicada-solvers/neuroretransmit-cicada/blob/main/irc-logs/%%23cicadasolvers.freenode.log\n'
            printf 'Pinned Git blob SHA: bdd277c14f94c34b5ae714cd00c238065beeed4e\n'
            printf 'Line windows are the original one-based source line numbers. Participant speculation is not author instruction.\n\n'
            printf '=== May 6 context, lines 168985-169010 ===\n'
            sed -n '168985,169010p' /tmp/cicadasolvers.freenode.log
            printf '\n=== May 7 context, lines 170970-170995 ===\n'
            sed -n '170970,170995p' /tmp/cicadasolvers.freenode.log
          } | tee 2014-irc-may6-7-excerpts.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 2014-irc-may6-7-excerpts
          path: 2014-irc-may6-7-excerpts.txt
          if-no-files-found: error
