name: LP2 Q8 independent clue-budget SFT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clue-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Run unrestricted clue-budget experiment
        run: |
          python sims/lp2_q8_independent_clue_budget_sft.py \
            --dict resources/control/english_wordfreq_textblob.txt \
            --profile resources/liber-primus/lp2-page-groups-54-55-derived.json \
            --out lp2-q8-independent-clue-budget.json \
            --steps 200 --restarts 2 --threads 4 --clue-weight 12
      - uses: actions/upload-artifact@v4
        with:
          name: lp2-q8-independent-clue-budget
          path: lp2-q8-independent-clue-budget.json
          if-no-files-found: error
