name: LP2 GP29 two-tap nonlinear all-secret original gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nonlinear-two-tap:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exhaust original two-tap coefficients and secret alphabet ranks
        run: node sims/lp2_two_tap_nonlinear_allsecret_rank_sft.cjs
