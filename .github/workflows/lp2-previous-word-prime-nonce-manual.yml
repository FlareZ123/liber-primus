name: LP2 previous-cipherword GP-prime original nonce inverse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 2013-derived prior-cipherword prime-sum inverse on two original LP2 chapters and p57 positive
        run: node sims/lp2_previous_word_prime_nonce_sft.cjs
      - name: Recover secret wordprime phi offset on blind native-GP plants and reject original
        run: node sims/lp2_wordprime_phi_smallstate_identifiability_sft.cjs
