name: Signed 2016 tree inner-five ring original-input test
on:
  workflow_dispatch:
jobs:
  inner-five-ring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source circumference and lossless original inverses
        run: node sims/tree121_outguess1136_ring_sft.cjs
      - name: Verify signed 2016 43-word compass original source route
        run: node sims/lp2_2016_43word_compass_sft.cjs
      - name: Verify p32 signature payload boundary and whole-book direct inverse
        run: node sims/p32_2016_signed_wordmap_sft.cjs
      - name: Test signed 2016 canvas and p53 red-51 source-prime boundary relation
        run: node sims/p53_red51_signed2016_corner_paths_sft.cjs
