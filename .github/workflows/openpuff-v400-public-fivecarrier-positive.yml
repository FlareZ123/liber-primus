name: OpenPuff v4 original public five-carrier positive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpuff-v400-public-fivecarrier-native-positive
  cancel-in-progress: false

jobs:
  native-five-carrier:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: cyberianwilderness/CMP110
          ref: bc823f0126345bf240e41ca5c918ef2f786666bd
          path: external-cmp110

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Verify published five-carrier Git objects and exact author chain note
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_public_fivecarrier_source_sft.py --source-root external-cmp110 --out probe-output/public-five-source
          if ($LASTEXITCODE -ne 0) { throw "Exact original five-carrier source identities or order failed" }

      - name: Retrieve pinned original OpenPuff v4.00 binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "OpenPuff-v400-five-carrier"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = "https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff"
          $expected = @{
            "OpenPuff.exe" = "466e03c792075313ce533a5dc7a789e8a41209f9"
            "libObfuscate.dll" = "f3b1c3315f8286346416fefd6141410f422f2454"
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) { throw "Original OpenPuff file mismatch: $name" }
          }
          $exe = Join-Path $root "OpenPuff.exe"
          $v = (Get-Item $exe).VersionInfo
          if ("$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)" -ne "4.0.0.0") {
            throw "Unexpected original OpenPuff version"
          }
          "OPENPUFF_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Original five-carrier Unhide using precisely published passwords and mixed bit levels
        shell: pwsh
        run: |
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "external-cmp110/Carrier_Files/Bible.pdf" --carrier "external-cmp110/Carrier_Files/aurora_borealis.png" --carrier "external-cmp110/Carrier_Files/KJ_Bible.pdf" --carrier "external-cmp110/Carrier_Files/KJ_Bible_Annotated.pdf" --carrier "external-cmp110/Carrier_Files/Moonlight_Sonata_MP3.mp3" --password "Security" --password-b "Assignment" --password-c "Practical" --bit-format "Pdf (File)" --bit-level "1/2 (50%) - Maximum" --extra-bit-selection "Png (Image)" "1/2 (50%) - Maximum" --extra-bit-selection "Mp3 (Audio)" "1/5 (20%) - Medium" --out probe-output/public-five-recovery --output-name message.txt --wait-seconds 120
          if ($LASTEXITCODE -ne 0) { throw "Native 5-carrier Unhide did not complete; preserve GUI evidence" }
          $result = Get-Content probe-output/public-five-recovery/result.json -Raw | ConvertFrom-Json
          if (-not $result.carrier_chain_verified -or $result.carrier_count -ne 5 -or -not $result.attempted) {
            throw "Native original five-carrier order or execution not verified"
          }
          if (-not $result.output_present) { throw "Native source five-carrier output file absent" }
          python -c "from pathlib import Path;from hashlib import sha256;a=Path('probe-output/public-five-recovery/extracted/message.txt').read_bytes();b=Path('external-cmp110/message.txt').read_bytes();print('NATIVE_FIVE_CARRIER_BYTES',len(a),'SHA256',sha256(a).hexdigest(),'PUBLISHED_SOURCE_SHA256',sha256(b).hexdigest());assert a==b,'Native five-carrier output is not exactly the author's published message.txt';print('GENUINE FIVE-CARRIER NATIVE UNHIDE POSITIVE PASS')"
          if ($LASTEXITCODE -ne 0) { throw "Five-carrier recovered output mismatched source bytes" }

      - name: Preserve original source identification, exact result and native GUI states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpuff-v400-public-five-carrier-positive-evidence
          path: probe-output/
          if-no-files-found: warn
