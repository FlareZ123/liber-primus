name: Agent36 Sefer Yetzirah original book-key gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-original word-length and running-key SFT
        run: |
          node --check sims/lp2_sefer_yetzirah_bookkey_crib_sft.cjs
          node sims/lp2_sefer_yetzirah_bookkey_crib_sft.cjs
