name: Historical column-14 plus solved-p56 totient original LP2
on:
  workflow_dispatch:
jobs:
  source-composition-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
