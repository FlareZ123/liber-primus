name: LP1 04.jpg residual OutGuess original-payload key-lead
on:
  workflow_dispatch:

jobs:
  independent-original-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build original quantized-DCT reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjpeg-dev build-essential
      - name: Extract authenticated LP1 03 control and uncertain 04
        run: |
          python sims/outguess_extract.py resources/liber-primus/03.jpg "Default key" --output lp1-03-control.bin
          python sims/outguess_extract.py resources/liber-primus/04.jpg "Default key" --output lp1-04-candidate.bin
      - name: Check whether 04 reveals a self-identifying new source key
        run: |
          python -c "from pathlib import Path;import hashlib,re; a=Path('lp1-04-candidate.bin').read_bytes();b=Path('lp1-03-control.bin').read_bytes();print({'control_03_ascii_pgp':b.startswith(b'-----BEGIN PGP SIGNED MESSAGE-----'),'candidate_04_bytes':len(a),'candidate_04_first256':a[:256].hex(),'candidate_04_ascii_decoded':a[:512].decode('ascii','replace'),'candidate_04_runs_ascii20':[m.group().decode('latin-1') for m in list(re.finditer(rb'[ -~]{20,}',a))[:10]],'candidate_04_pgp_armor_offset':a.find(b'-----BEGIN PGP'),'candidate_04_gzip_magic_offset':a.find(bytes([0x1f,0x8b])),'candidate_04_sha256':hashlib.sha256(a).hexdigest()})"
      - name: Preserve recovered original candidate for future encryption tests
        uses: actions/upload-artifact@v4
        with:
          name: lp1-04-original-outguess-candidate
          path: lp1-04-candidate.bin
          retention-days: 30
