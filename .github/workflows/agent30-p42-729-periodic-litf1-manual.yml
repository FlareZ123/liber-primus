name: Agent30 LP2 p42-44 original 729 F-transparent periodic screen

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent30-p42-729-periodic1
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        side: [real, "null"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: layer2-prepared
          run-id: 44062412799
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prepared
      - uses: actions/download-artifact@v4
        with:
          name: layer2-controls
          run-id: 44062412799
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: controls
      - name: Enforce source-native long control gate and original p42-44 checksum
        run: |
          node sims/agent30_layer2_periodic_opening_control_gate.cjs controls/controls.json
          node sims/agent30_p42_729_window_source_sft.cjs > prepared/upstream/work/layer2/data/p42_729.txt
          chmod +x prepared/upstream/work/layer2/target/release/layer2
          mkdir -p prepared/upstream/work/layer2/results
      - name: Source-original GP29 historical period2-14 F-transparent search, exact null parity
        run: |
          cd prepared/upstream/work/layer2
          case "${{ matrix.side }}" in
            real) keyfile=core20 ;;
            null) keyfile=null_core20 ;;
          esac
          target/release/layer2 screen data/p42_729.txt file:data/${keyfile}.ksb results/p42_729_periodic1_${{ matrix.side }}.tsv mode=periodic ms=2:14 litf=1 abort=150:2.5 n=729 beam=16 mults=1,28 models=0,1 threads=4
          python verify.py results/p42_729_periodic1_${{ matrix.side }}.tsv --top 20 --controls 20 --out results/p42_729_periodic1_${{ matrix.side }}_verify.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('results')
          n='p42_729_periodic1_${{ matrix.side }}'
          h={suffix:hashlib.sha256((p/(n+suffix)).read_bytes()).hexdigest() for suffix in ('.tsv','_verify.txt')}
          (p/(n+'.json')).write_text(json.dumps({'original_sha256':'728115bbc13b381be31f0ba93dd193e3108e2af9534a97ffdb000011d6020b6e','n':729,'literal_f':1,'side':'${{ matrix.side }}','sha256':h},indent=2)+'\n')
          print(json.dumps(h,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: agent30-p42-729-periodic1-${{ matrix.side }}
          path: |
            prepared/upstream/work/layer2/results/p42_729_periodic1_${{ matrix.side }}.tsv
            prepared/upstream/work/layer2/results/p42_729_periodic1_${{ matrix.side }}_verify.txt
            prepared/upstream/work/layer2/results/p42_729_periodic1_${{ matrix.side }}.json
          retention-days: 30
          if-no-files-found: error
