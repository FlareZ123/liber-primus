name: Agent5 zero-F specificity gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specificity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sims/lp2_zeroF_specificity_controls_sft.cjs
      - run: node sims/lp2_zeroF_specificity_controls_sft.cjs
