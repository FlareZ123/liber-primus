name: AN-END exact-onion-label wildcard CDX probe

on:
  push:
    paths:
      - 'sims/anend_tor2web_wildcard_cdx.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cdx:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query exact onion label across all archived suffixes
        run: node sims/anend_tor2web_wildcard_cdx.cjs > anend-tor2web-wildcard-cdx.json
      - name: Preserve exact CDX response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: an-end-tor2web-wildcard-cdx
          path: anend-tor2web-wildcard-cdx.json
          if-no-files-found: error
