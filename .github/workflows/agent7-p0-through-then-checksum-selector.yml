name: Agent7 p0 through-THEN checksum selector SFT

on:
  workflow_dispatch:

jobs:
  selector:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check sims/lp2_p0_through_then_checksum_selector_sft.cjs
      - name: Run through-THEN selector
        run: node sims/lp2_p0_through_then_checksum_selector_sft.cjs
