name: LP2 Java Random 48-bit full-state original inverse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-state-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install finite-lattice library
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Invert all 49 original-source streams and planted controls
        run: python sims/lp2_p50_java_random48_fullstate_sft.py
