name: LP2 OE A phase matched original ink source test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-rune-allograph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out original corpus and scripts
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-image dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 pillow==11.3.0 opencv-python-headless==4.12.0.88
      - name: Run frozen high-frequency rune original-image SFT
        run: python sims/lp2_oe_a_phase_allograph_original_sft.py
