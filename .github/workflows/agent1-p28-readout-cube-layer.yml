name: Agent1 p28 READ OUT cube-layer candidate
on:
  workflow_dispatch:
jobs:
  source-and-control:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify p28 READ OUT candidate and whole-book family control
        run: |
          node sims/lp2_p28_readout_cube_layer_candidate_sft.cjs
          node sims/lp2_p28_readout_p0_receiver_sft.cjs
