name: LP2 Jung Liber Primus full-word book-address inverse (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-word-address:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF extraction
        run: python -m pip install "pymupdf>=1.25,<2"
      - name: Read full original LP2 words as source-selected Jung donor words
        run: python sims/lp2_jung_fullword_address_original_sft.py
