name: LP2 complete GF29 numerical grid factorization (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documented SymPy finite-field polynomial factorizer
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Exact source polynomial factorization and direct-payload check
        run: python sims/lp2_grid_gf29_factorization_sft.py
      - name: Independent original-source GF841 norm and byte-register gates
        run: |
          node sims/red_triad_grid_affine_factors_sft.cjs
          node sims/red_triad_51x127_byte_register_sft.cjs
          node sims/red_triad_gf841_127cycle_inverse.cjs
          node sims/grid238_allseed_feedback_original_inverse.cjs
          node sims/grid_full_gf29_factor_sft.cjs
          node sims/grid_cubic_nonary_seed_inverse_sft.cjs
          node sims/grid_cubic_allseed_original_lm_sft.cjs
          node sims/grid_nonary_source_crib_inverse_sft.cjs
          node sims/grid_cubic_allseed_ea_original_sft.cjs
          node sims/grid_cubic_order12194_keyfree_sft.cjs
