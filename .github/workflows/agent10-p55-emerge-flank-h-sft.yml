name: Agent10 p55 emerge-flank H readout SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce p55 17+9+17 flank H readout
        run: node sims/lp2_p33_p55_divinity_state_geometry_sft.cjs
