name: Noisy shared-key inversion (manual)
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Select source-reuse inversion experiment
        type: choice
        default: noisy-beam
        options:
          - noisy-beam
          - dual-section
          - ea-autokey
jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Previous noisy shared-key dictionary beam
        if: ${{ inputs.probe != 'dual-section' }}
        run: node sims/relative_key_noisy_dictionary_beam.cjs
      - name: Original dual-section difference inverse
        if: ${{ inputs.probe == 'dual-section' }}
        run: node sims/dual_section_difference_inversion.cjs
      - name: Original F29 transparent EA autokey inverse
        if: ${{ inputs.probe == 'ea-autokey' }}
        run: node sims/ea_transparent_autokey_inverse.cjs
