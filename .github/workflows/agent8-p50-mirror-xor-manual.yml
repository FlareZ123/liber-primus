name: Agent8 p50 mirror-paired XOR receiver SFT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and run p50 43-token typed receiver SFT
        shell: pwsh
        run: |
          node --check sims/lp2_p50_43token_typed_receiver_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Syntax' }
          node sims/lp2_p50_43token_typed_receiver_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'SFT' }
