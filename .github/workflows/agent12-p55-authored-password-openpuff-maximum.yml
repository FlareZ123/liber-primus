name: Agent 12 original p55 2014 native OpenPuff A33011033 JPEG maximum
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-selected-native-image:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Verify native driver and pin historical 2014 executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native capture SFT failed' }
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-Agent12-P55'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Native original binary SHA1 Git blob mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Mandatory independently published JPEG 35-byte native extraction positive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Pinned public JPEG positive source missing' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format 'Jpeg (Image)' --bit-level '1/2 (50%) - Maximum' --out probe-output/public-recovery --wait-seconds 70
          if ($LASTEXITCODE -ne 0) { throw 'Native original JPEG known-positive extract failed' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('NATIVE_ORIGINAL_PUBLISHED_35BYTE_POSITIVE_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Original JPG known payload mismatch' }
      - name: One author-attested A33011033 p55 original scan at JPEG maximum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $carrier = Join-Path $env:GITHUB_WORKSPACE 'resources/liber-primus/72.jpg'
          if (-not (Test-Path -LiteralPath $carrier)) { throw 'Original p55 image not found' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$carrier" --password 33011033 --bit-format 'Jpeg (Image)' --bit-level '1/2 (50%) - Maximum' --out probe-output/original-p55 --wait-seconds 150
          if ($LASTEXITCODE -ne 0) { throw 'Native p55 original execution failed' }
          $r = Get-Content -LiteralPath 'probe-output/original-p55/result.json' -Raw | ConvertFrom-Json
          if ($r.carrier_count -ne 1 -or -not $r.carrier_added -or -not $r.bit_selection_verified -or -not $r.attempted) { throw 'Native GUI failed to verify original receiver and selection' }
          if ($r.native_probe_outcome -eq 'inconclusive-timeout') { throw 'The source-shaped native original test timed out' }
          Write-Host "ORIGINAL_P55_HISTORICAL_PASSWORD_DECISION $($r | Select-Object carrier_count,native_probe_outcome,output_present,outputs,selected_capacity_bytes_after_level,error_dialogs,completion_dialogs | ConvertTo-Json -Compress -Depth 12)"
          if ($r.output_present) { Write-Host 'POTENTIAL_AUTHORED_STEGO_PAYLOAD_REQUIRE_PGP_VALIDATION' }
      - name: Archive native GUI original rejection or any true extracted bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent12-33011033-p55-native-jpeg-maximum
          path: probe-output/
          if-no-files-found: warn
