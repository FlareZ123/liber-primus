name: P56 2014 source-test artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run pinned 2014 source tests
        shell: pwsh
        run: |
          node sims/lp2_p56_2014_html_corpus_hash_sft.cjs > p56-html.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node sims/lp2_p56_2014_server_status_hash_sft.cjs > p56-server-status.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node sims/lp2_p56_2014_stage07_frame_extract_sft.cjs > p56-stage07-frames.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Persist machine-readable results
        uses: actions/upload-artifact@v4
        with:
          name: p56-2014-source-test-results
          path: |
            p56-html.json
            p56-server-status.json
            p56-stage07-frames.json
          retention-days: 30
