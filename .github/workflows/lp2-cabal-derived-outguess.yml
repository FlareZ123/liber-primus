name: LP2 CABAL-derived OutGuess passphrase gate

on:
  push:
    paths:
      - "sims/lp2_cabal_derived_outguess_sft.cjs"
      - ".github/workflows/lp2-cabal-derived-outguess.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-key-three-carriers:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out original manuscript and historical sources
        uses: actions/checkout@v4
      - name: Set Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned maintained OutGuess extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential libjpeg-dev
          git clone --depth 1 https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          git -C /tmp/outguess fetch --depth 1 origin 24810e14327c2bbeedeaadd3e24491f2a4425c02
          git -C /tmp/outguess checkout --detach 24810e14327c2bbeedeaadd3e24491f2a4425c02
          cd /tmp/outguess
          ./autogen.sh
          CFLAGS='-O2 -std=gnu11' ./configure --with-generic-jconfig
          make -j2 CC='gcc -std=gnu11' CFLAGS='-O2 -std=gnu11'
          sudo make install
      - name: Execute fixed CABALUOIDFORM source-key test
        run: |
          node --check sims/lp2_cabal_derived_outguess_sft.cjs
          node sims/lp2_cabal_derived_outguess_sft.cjs
      - name: Preserve exact source-key extraction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-cabal-derived-outguess
          path: outguess-cabal-derived-results/
          if-no-files-found: warn
          retention-days: 30
