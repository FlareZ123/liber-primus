name: LP2 EPIPHANY p32 EMPTY-X bridge

on:
  push:
    paths:
      - 'sims/lp2_epiphany_p32_empty_x_bridge_sft.cjs'
      - '.github/workflows/lp2-epiphany-p32-empty-x-bridge.yml'
  workflow_dispatch:

jobs:
  sft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp2_epiphany_p32_empty_x_bridge_sft.cjs