name: Onion7 original HTML page-index arithmetic gate
on:
  workflow_dispatch:
jobs:
  source-page-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate original May 2014 Stage11 HTML and 58 JPEG hashes
        run: node sims/lp2_stage11_2014_release_index_sft.cjs
      - name: Check source labels, 58-page cycles, and exact original punctuation boundaries
        run: node sims/onion7_133331_page_cycle_sft.cjs
      - name: Test prime49 / seven-by-227 source-clock original inverse
        run: node sims/onion7_prime49_227_clock_sft.cjs
      - name: Check source-selected root-24 29-rune cyclic inverse
        run: node sims/red_span_root24_circulant29_original_sft.cjs
      - name: Test 7 x (133 + 331) red-51 floral original-input inverse
        run: node sims/lp2_onion7_133331_red51_floral3248_sft.cjs
