name: Agent43 original cuneiform diagonal inverse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original LP2 diagonal source and planted inverses
        run: node sims/lp2_1033_3301_diagonal_original_sft.cjs
