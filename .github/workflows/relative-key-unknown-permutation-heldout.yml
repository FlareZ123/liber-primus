name: LP2 nonlinear shared-key heldout rotations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate second-half nonlinear map and word constraints
        run: node sims/relative_key_unknown_permutation_heldout.cjs
