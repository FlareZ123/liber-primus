name: Padded word-length literary corpus search
on:
  workflow_dispatch:
    inputs:
      max_books:
        description: 'Maximum preselected books to scan'
        required: false
        default: '140'
      scan_mode:
        description: 'Choose independent source search without repeating the other scan'
        required: false
        default: 'wordlength'
        type: choice
        options:
          - wordlength
          - ea-fingerprint
          - red51-length

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAX_BOOKS: ${{ inputs.max_books }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search public-domain plaintext word-length cribs
        if: ${{ inputs.scan_mode == 'wordlength' }}
        run: node sims/padded_wordlength_corpus.cjs
      - name: Search exact red51 stanza source quotations
        if: ${{ inputs.scan_mode == 'red51-length' }}
        run: node sims/red51_source_phrase_crib.cjs
      - name: Test original-section EA zero-step literary source fingerprints
        if: ${{ inputs.scan_mode == 'ea-fingerprint' }}
        run: node sims/ea_zero_step_literary_fingerprint.cjs
