name: LP2 p50 printed digit-zero repeat chapter gate
on:
  workflow_dispatch:
jobs:
  source-original:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-original repeated-rune chapter and five-digit clock gate
        run: node sims/lp2_p50_digit0_chapter_repeat_sft.cjs
