name: Agent7 p0 post-THEN mirror-to-phi baseline

on:
  workflow_dispatch:

jobs:
  selector:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check sims/lp2_p0_post_then_fixed_source_mirror_phi_sft.cjs
      - name: Run mirror-to-phi prospective baseline
        run: node sims/lp2_p0_post_then_fixed_source_mirror_phi_sft.cjs
