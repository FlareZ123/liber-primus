name: Agent1 DIRECTION SEEK YOU Numbered Route

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numbered-route:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run DIRECTION SEEK YOU numbered-route SFT
        shell: pwsh
        run: node sims/lp2_direction_seek_you_numbered_route_sft.cjs
