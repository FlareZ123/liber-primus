name: Exact five-rune all-secret Hill capacity
on:
  workflow_dispatch:
jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install numeric FFT dependency
        run: python -m pip install numpy scipy
      - name: Exact all-secret original five-phase bound with source-key positive
        run: python sims/hill5_allsecret_topk_fft.py --positive
