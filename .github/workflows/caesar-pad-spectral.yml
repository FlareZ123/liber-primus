name: LP2 spectral Caesar-shift common pad

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fourier common-pad synchronization, heldout and planted controls
        run: node sims/caesar_pad_spectral.cjs
