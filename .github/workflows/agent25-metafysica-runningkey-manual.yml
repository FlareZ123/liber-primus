name: Agent25 mayfly source webpage all-offset GP29 running-key gate
on:
  workflow_dispatch:

jobs:
  original-source-inverse:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vectorized original-source inverse
        run: python -m pip install numpy requests filelock
      - name: Test original LP2 p23-26 against exact mayfly article GP29 running text
        run: python sims/lp2_metafysica_wings14_runningkey_sft.py
      - name: Save complete GP29 source-key scan evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp2-metafysica-wings14-original-running-key
          path: im-results/lp2-metafysica-wings14-running-key-original.json
          if-no-files-found: warn
