name: Authentic known-Cicada decryption regressions

on:
  workflow_dispatch:

jobs:
  authentic-known-decryption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify LP1 Atbash against independently recorded plaintext
        run: node sims/authentic_lp1_p01_atbash_regression.cjs
      - name: Verify LP2 totient cipher, F interrupter, and holdout
        run: node sims/authentic_lp2_p56_totient_regression.cjs
      - name: Recover LP1 Vigenere key from first 100 runes, verify held-out 415
        run: node sims/authentic_lp1_p03_p04_vigenere_recovery.cjs
