name: Agent18 deterministic source-word-advance phase invariant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-word-advance:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate CommonJS syntax
        run: node --check sims/lp2_wordadvance256_allsecret_samephase_sft.cjs
      - name: Run original GP29 all-secret word-advance gate
        run: node sims/lp2_wordadvance256_allsecret_samephase_sft.cjs
