name: Agent18 source word-advance original GP29 gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  word-advance:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone CommonJS files
        run: |
          node --check sims/lp2_wordadvance256_allsecret_samephase_sft.cjs
          node --check sims/lp2_prime_wordadvance_Fallbranch_source_sft.cjs
          node --check sims/lp2_wordadvance256_original_wordlength_control_sft.cjs
      - name: All-secret 256-position original phase invariant
        run: node sims/lp2_wordadvance256_allsecret_samephase_sft.cjs
      - name: Matched original printed-word-length native GP29 controls
        run: node sims/lp2_wordadvance256_original_wordlength_control_sft.cjs
      - name: Authentic prime-totient exact F-bypass inverse
        run: node sims/lp2_prime_wordadvance_Fallbranch_source_sft.cjs
