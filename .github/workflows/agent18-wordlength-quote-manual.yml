name: Agent18 original LP2 quotation word-length SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-quotation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check CommonJS syntax
        run: node --check sims/lp2_original_wordlength_quote_source_sft.cjs
      - name: Exact original-source word-length and punctuation crib
        run: node sims/lp2_original_wordlength_quote_source_sft.cjs
