name: LP2 CHANGE eigenmode all-secret collision SFT
on:
  workflow_dispatch:
jobs:
  exact-source-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout original source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original matrix and GP controls
        run: node sims/lp2_change_eigenmode_allsecret_collision_sft.cjs
