name: LP2 May 2014 original p55 next-prime strict F gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nextprime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone original-cipher proof
        run: |
          node --check sims/lp2_2014_p55_nextprime_ftransparent_original_sft.cjs
          node sims/lp2_2014_p55_nextprime_ftransparent_original_sft.cjs
