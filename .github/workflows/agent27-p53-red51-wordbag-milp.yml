name: Agent27 p53 red51 exact GP word-bag MILP
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-native-wordbag:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained scipy MILP library
        shell: pwsh
        run: python -m pip install --disable-pip-version-check scipy==1.17.0
      - name: Test exact native-source red51 rune-bag feasibility
        shell: pwsh
        run: |
          python sims/lp2_p53_red51_native_wordbag_milp_sft.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
