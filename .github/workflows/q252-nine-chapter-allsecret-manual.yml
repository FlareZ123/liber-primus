    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen Q252 exact original inverse and source-native positive
        run: node sims/q252_nine_chapter_gp28_sft.cjs
      - name: Key-independent chapter-phase GP28 all-secret capacity
        run: node sims/q252_nine_chapter_gp28_allsecret_sft.cjs
      - name: Direct raw-rune additive Q252 chapter-key control
        run: node sims/lp2_q252_ninechapter_28key_sft.cjs
