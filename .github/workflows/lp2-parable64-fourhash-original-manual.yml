name: LP2 PARABLE-449 original64 alternate digest test

on:
  workflow_dispatch:

jobs:
  source-parable64:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install 2014-era 512-bit digest implementations
        run: python -m pip install --disable-pip-version-check 'pyskein==1.0' 'gostcrypto==1.2.5' 'pycryptodome==3.23.0'
      - name: Hash exact p57-heading-addressed 64-rune source streams
        run: python sims/lp2_p56_parable64_address_alt512_sft.py
