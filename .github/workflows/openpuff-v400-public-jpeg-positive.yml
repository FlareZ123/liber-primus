name: OpenPuff v4.00 independent public JPEG positive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpuff-v400-public-jpeg-positive
  cancel-in-progress: false

jobs:
  public-jpeg-positive:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Install native controls and verify original driver
        shell: pwsh
        run: |
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py

      - name: Download unchanged publicly published JPEG with documented hidden text
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw "Public original JPEG carrier could not be resolved and retrieved" }
          if (-not (Test-Path -LiteralPath "probe-output/public-source/openpuff.jpg")) {
            throw "Exact source-linked OpenPuff carrier absent"
          }

      - name: Retrieve original OpenPuff 4.00 from pinned public Git objects
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "OpenPuff-v400-public-positive"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = "https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff"
          $expected = @{
            "OpenPuff.exe" = "466e03c792075313ce533a5dc7a789e8a41209f9"
            "libObfuscate.dll" = "f3b1c3315f8286346416fefd6141410f422f2454"
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original OpenPuff file mismatch: $name"
            }
          }
          $exe = Join-Path $root "OpenPuff.exe"
          $v = (Get-Item $exe).VersionInfo
          if ("$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)" -ne "4.0.0.0") {
            throw "Unexpected native OpenPuff version"
          }
          "OPENPUFF_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Unhide published A-only OpenPuff JPG at source-specified 1/2 Maximum
        shell: pwsh
        run: |
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "probe-output/public-source/openpuff.jpg" --password "12345678" --bit-format "Jpeg (Image)" --bit-level "1/2 (50%) - Maximum" --out "probe-output/public-recovery" --wait-seconds 55
          if ($LASTEXITCODE -ne 0) { throw "Native JPEG unhide could not execute; inspect original UI captures" }
          $result = Get-Content "probe-output/public-recovery/result.json" -Raw | ConvertFrom-Json
          if (-not $result.bit_selection_verified -or -not $result.attempted) {
            throw "Public JPEG native source settings or Unhide execution were not witnessed"
          }
          $hidden = "probe-output/public-recovery/extracted/hidden.txt"
          if (-not (Test-Path -LiteralPath $hidden)) {
            throw "Documented hidden.txt was not recovered from the published JPEG"
          }
          python -c "from pathlib import Path; from hashlib import sha256; p=Path('probe-output/public-recovery/extracted/hidden.txt'); b=p.read_bytes(); expected=b'Dies ist eine versteckte Nachricht!'; print('NATIVE_PUBLIC_JPEG_SECRET',len(b),sha256(b).hexdigest(),repr(b)); assert b.rstrip(b'\r\n')==expected, 'Exact published secret content mismatch'; print('GENUINE JPEG A-ONLY UNHIDE POSITIVE PASS')"
          if ($LASTEXITCODE -ne 0) { throw "Published hidden.txt bytes differ from source-declared plaintext" }

      - name: Preserve native screenshots, original source bytes and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpuff-v400-public-jpeg-positive-evidence
          path: probe-output/
          if-no-files-found: warn
