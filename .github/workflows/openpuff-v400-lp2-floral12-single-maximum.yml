name: OpenPuff v4 LP2 floral original single-JPEG Maximum 12 missing carriers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-floral-single:
    strategy:
      fail-fast: false
      matrix:
        scan: [57, 58, 59, 60, 61, 62, 63, 64, 65, 69, 70, 71]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Prepare pinned native OpenPuff GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native output-capture regression failed' }
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-v400-floral-single'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "OpenPuff v4 original blob mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Same-v4 original JPEG known-file positive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Cannot source byte-pinned JPEG positive' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format "Jpeg (Image)" --bit-level "1/2 (50%) - Maximum" --out probe-output/public-recovery --wait-seconds 70
          if ($LASTEXITCODE -ne 0) { throw 'Same-v4 positive extraction did not execute' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file() and p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('NATIVE_JPEG_POSITIVE_EXACT_BYTES_35')"
          if ($LASTEXITCODE -ne 0) { throw 'Source-authored 35-byte positive not recovered' }
      - name: Untested individual floral original at JPEG Maximum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scan = [int]'${{ matrix.scan }}'
          $set = @(57,58,59,60,61,62,63,64,65,69,70,71)
          if ($scan -notin $set) { throw 'Not a previously untested original floral single-JPEG Maximum image' }
          $carrier = Join-Path $env:GITHUB_WORKSPACE ('resources/liber-primus/{0:D2}.jpg' -f $scan)
          if (-not (Test-Path -LiteralPath $carrier)) { throw 'Original source JPEG missing' }
          $out = 'probe-output/floral-single-maximum-' + ('{0:D2}' -f $scan)
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$carrier" --password 33011033 --bit-format "Jpeg (Image)" --bit-level "1/2 (50%) - Maximum" --out "$out" --wait-seconds 90
          if ($LASTEXITCODE -ne 0) { throw "Native OpenPuff invocation failed on original scan $scan" }
          $result = Get-Content -LiteralPath (Join-Path $out 'result.json') -Raw | ConvertFrom-Json
          if (-not $result.attempted -or -not $result.bit_selection_verified -or $result.carrier_count -ne 1) {
            throw "Original native carrier selection not verified on scan $scan"
          }
          Write-Host "FLORAL_SINGLE_MAXIMUM_RESULT scan=$scan lp2page=$($scan-17) $($result | Select-Object native_probe_outcome,output_present,outputs,error_dialogs,completion_dialogs | ConvertTo-Json -Compress -Depth 8)"
          if ($result.native_probe_outcome -eq 'inconclusive-timeout') { throw "Native scan $scan timed out" }
          if ($result.output_present) { Write-Host "POTENTIAL_ORIGINAL_LP2_PAYLOAD_FOUND_SCAN_$scan" }
      - name: Preserve GUI evidence and recovered candidate bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v400-floral-single-maximum-${{ matrix.scan }}
          path: probe-output/
          if-no-files-found: warn
