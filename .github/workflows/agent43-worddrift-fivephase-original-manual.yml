name: Agent43 word-drift five-phase original invariant
on:
  workflow_dispatch:

jobs:
  original-worddrift:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original GP29 worddrift affine invariant and native plants
        run: node sims/lp2_worddrift_fivephase_affine_invariant_sft.cjs
