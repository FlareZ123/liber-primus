name: Agent8 signed-2016 literal semantic route SFT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and run literal semantic route SFT
        shell: pwsh
        run: |
          node --check sims/lp2_signed2016_literal_semantic_route_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Syntax' }
          node sims/lp2_signed2016_literal_semantic_route_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'SFT' }
