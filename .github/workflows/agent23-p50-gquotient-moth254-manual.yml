name: Agent23 p50-G quotient moth-register direct-key gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original-input SFT
        run: node sims/lp2_moth_p50_gquotient_direct_key_sft.cjs
