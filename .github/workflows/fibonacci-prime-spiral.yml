name: Fibonacci prime spiral and direct-key regression
on:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact LP2 numeric spiral and test key interpretation
        run: node sims/fibonacci_prime_spiral.cjs
      - name: Test p15 red-heading checksum on original ink spans with heldout null
        run: node sims/red_span_prime_checksum_holdout.cjs
      - name: Evaluate square-derived 16-word routes with full-family randomized null
        run: node sims/fibonacci_wordroute_length_test.cjs
      - name: Test 16-step multiplicative and affine field-29 keys with planted control
        run: node sims/fibonacci_affine_field29_heldout.cjs
      - name: Challenge twin-prime 3299/3301 prime-totient offsets with heldout seed null
        run: node sims/twin_prime_totient_holdout.cjs
      - name: Reuse exact red GP quotients as authentic solved-page prime-totient key starts
        run: node sims/red_quotient_totient_key_holdout.cjs
      - name: Test red-title-selected prime79 primitive-root field-29 stream on heldout pages
        run: node sims/red_prime79_field_cycle.cjs
      - name: Test Cicada 2013 Parable-prime BBS original inverse and source plant
        run: node sims/parable_threeprime_bbs_source_inverse.cjs
      - name: Test Parable modular-squaring source with collision-only hidden key skips
        run: node sims/parable_bbs_keyskip_inverse.cjs
      - name: Exhaust every historical Parable Blum-square state on original LP2 and blinded source text
        run: node sims/parable_blum_exhaustive_state_inverse.cjs
      - name: Test 153 and 1224 modulus-forced GP cipher equality on original ciphertext
        run: node sims/parable_blum_keyless_period_gate.cjs
      - name: Exhaust every Parable Blum state under exact hidden collision-keyskip GP29 inverse
        run: node sims/parable_blum_allstate_keyskip.cjs
