name: Agent4 YOU33 boundary and p40 holdout SFTs

on:
  workflow_dispatch:

jobs:
  sft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run YOU33 boundary SFT
        run: node sims/lp2_p32_you33_boundary_p33_their_rise_sft.cjs
      - name: Run p40 EMPTY-center holdout SFT
        run: node sims/lp2_p40_empty_center_state_holdout_sft.cjs
