name: Agent8 p23-p56 large-red initial census
on:
  push:
    paths:
      - ".github/workflows/agent8-p23-p56-large-red-census.yml"
      - "sims/lp2_p23_p56_large_red_initial_census_sft.py"
      - "resources/liber-primus/*.jpg"
      - "resources/liber-primus/lp2-corpus.json"
      - "resources/liber-primus/lp2-transcription.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed analysis dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Run original-image census and assertions
        run: python sims/lp2_p23_p56_large_red_initial_census_sft.py
