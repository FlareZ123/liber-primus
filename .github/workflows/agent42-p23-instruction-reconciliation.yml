name: Agent42 P23 Instruction Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p23-reconcile:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p23 instruction reconciliation
        shell: pwsh
        run: node sims/lp2_p23_instruction_reconciliation_sft.cjs
