name: Agent17 p55 lag3 all-secret word gate

on:
  workflow_dispatch:

jobs:
  word-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dictionary
        run: python -m pip install cmudict==1.1.3
      - name: Execute original-input single-file test
        run: python sims/lp2_p55_lag3_allsecret_dictionary_sft.py
