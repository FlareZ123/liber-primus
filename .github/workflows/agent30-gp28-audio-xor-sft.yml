name: Agent30 original GP28 packet 761 audio XOR
on:
  push:
    paths:
      - sims/lp2_761_base28_packet_xor_sft.cjs
      - .github/workflows/agent30-gp28-audio-xor-sft.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch original 2013 audio by pinned commit
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/rtkd/iddqd/f2267b0c2f1e1d2662806b90b9c3a2953b3a7023/2013/02/761.MP3' -OutFile '761.MP3'
          $sha = (Get-FileHash -Path '761.MP3' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '83008217439110c3b824898af73b99cb2cf0657dda88cb363c3aa34a4ec0a460') { throw "Unexpected source MP3 hash: $sha" }
      - name: Test original GP28 packets and authentic XOR
        shell: pwsh
        run: node sims/lp2_761_base28_packet_xor_sft.cjs 761.MP3
