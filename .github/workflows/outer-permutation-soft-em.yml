name: LP2 skip-marginalized outer-alphabet controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soft-em:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and matched synthetic recovery
        run: |
          node --check sims/outer_permutation_soft_em.cjs
          node sims/outer_permutation_soft_em.cjs
