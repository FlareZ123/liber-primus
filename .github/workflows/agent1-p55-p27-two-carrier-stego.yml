name: Agent1 p55 moth / p27 wing two-original JPEG OpenPuff bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pair:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        order: [published, return]
        level: [medium, maximum]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Install original native driver and source-password assertions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI capture SFT failed' }
          node sims/lp2_p55_p27_seam_openpuff_password_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'The source-linked original eight-rune candidate is missing' }
      - name: Retrieve pinned 2014 OpenPuff 4.00 binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-Agent1-TwoSource'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) { throw "OpenPuff original binary mismatch: $name" }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Recover independently published exact 35-byte original JPEG payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Public original OpenPuff JPEG source unavailable' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format 'Jpeg (Image)' --bit-level '1/2 (50%) - Maximum' --out probe-output/public-recovery --wait-seconds 70
          if ($LASTEXITCODE -ne 0) { throw 'Independent original JPEG OpenPuff positive invocation failed' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('NATIVE_OPENPUFF_JPEG_35BYTE_CONTROL_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Independent control payload does not match original bytes' }
      - name: Attempt precisely the linked original two-carrier JPEGs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $order = '${{ matrix.order }}'
          $levelname = '${{ matrix.level }}'
          if ($order -notin @('published','return')) { throw 'Unselected carrier order' }
          if ($levelname -notin @('medium','maximum')) { throw 'Unselected native level' }
          $images = if ($order -eq 'published') { @(44,72) } else { @(72,44) }
          $level = if ($levelname -eq 'maximum') { '1/2 (50%) - Maximum' } else { '1/5 (20%) - Medium' }
          $args = @('--exe', "$env:OPENPUFF_EXE", '--password', 'DJUBEIAEF',
             '--bit-format', 'Jpeg (Image)', '--bit-level', $level,
             '--out', ('probe-output/two-source-' + $order + '-' + $levelname),
             '--wait-seconds', '160')
          foreach ($scan in $images) {
            $carrier = Join-Path $env:GITHUB_WORKSPACE ('resources/liber-primus/{0:D2}.jpg' -f $scan)
            if (-not (Test-Path -LiteralPath $carrier)) { throw "Original source JPEG missing: $scan" }
            $args += @('--carrier', "$carrier")
          }
          python sims/openpuff_v400_extract.py @args
          if ($LASTEXITCODE -ne 0) { throw 'Native two-carrier OpenPuff invocation failed' }
          $r = Get-Content -LiteralPath ('probe-output/two-source-' + $order + '-' + $levelname + '/result.json') -Raw | ConvertFrom-Json
          if ($r.carrier_count -ne 2 -or -not $r.carrier_chain_verified -or -not $r.bit_selection_verified -or -not $r.attempted) {
            throw 'Native GUI did not confirm both original carriers in exact requested order, bit level, and extraction'
          }
          if ($r.native_probe_outcome -eq 'inconclusive-timeout') { throw 'Original two-source test inconclusive after timeout' }
          Write-Host "TWO_SOURCE_BRIDGE_RESULT $($r | Select-Object carrier_count, native_probe_outcome,output_present,outputs,selected_capacity_bytes_after_level,completion_dialogs,error_dialogs | ConvertTo-Json -Compress -Depth 12)"
          if ($r.output_present) { Write-Host 'ORIGINAL_TWO_SOURCE_STEGO_PAYLOAD_CANDIDATE' }
      - name: Preserve actual original pair native GUI evidence and recovered bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-bridge-pair-${{ matrix.order }}-${{ matrix.level }}
          path: probe-output/
          if-no-files-found: warn
