name: Agent39 source prefix predecessor backlinks

on:
  workflow_dispatch:
  push:
    paths:
      - "sims/lp2_source_prefix_predecessor_backlinks_sft.cjs"
      - ".github/workflows/agent39-source-prefix-backlinks.yml"

jobs:
  sft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run source-prefix backlink SFT
        run: node sims/lp2_source_prefix_predecessor_backlinks_sft.cjs
