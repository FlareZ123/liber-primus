name: avowy-stage5-archive-gzip-audit

on:
  push:
    paths:
      - ".github/workflows/avowy-stage5-gzip-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download archived Stage 5 object
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/iBotPeaches/cicada_3301/master/onions/avowyfgl5lkzfj3n.onion/post/index.html \
            -o stage5-object.hex
          sha256sum stage5-object.hex
          wc -c stage5-object.hex
          file stage5-object.hex
          grep -vE '^[[:xdigit:]]*$' stage5-object.hex | head -5 || true
      - name: Decode hex and decompress gzip object
        run: |
          set -euo pipefail
          tr -d '[:space:]' < stage5-object.hex > stage5-object.hex.clean
          hex_chars=$(wc -c < stage5-object.hex.clean)
          echo "hex characters: $hex_chars"
          test $((hex_chars % 2)) -eq 0
          xxd -r -p stage5-object.hex.clean > stage5-object.gz
          file stage5-object.gz
          gzip -t stage5-object.gz
          gzip -lv stage5-object.gz
          gzip -dc stage5-object.gz > data.out
          sha256sum data.out
          wc -c data.out
          file data.out
          xxd -l 128 data.out
      - name: Inspect signatures and printable strings
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee audit.txt
          from pathlib import Path
          import hashlib, math, re, collections
          b=Path("data.out").read_bytes()
          print("bytes",len(b),"sha256",hashlib.sha256(b).hexdigest())
          print("magic",b[:32].hex())
          sigs={
            "JPEG":b"\\xff\\xd8\\xff","PNG":b"\\x89PNG\\r\\n\\x1a\\n",
            "PDF":b"%PDF-","ZIP":b"PK\\x03\\x04","GZIP":b"\\x1f\\x8b",
            "7z":b"7z\\xbc\\xaf\\x27\\x1c","RAR":b"Rar!\\x1a\\x07",
            "MP3-ID3":b"ID3","Ogg":b"OggS","SQLite":b"SQLite format 3\\x00",
            "ELF":b"\\x7fELF","BMP":b"BM","GIF":b"GIF8"
          }
          for name,sig in sigs.items():
            hits=[m.start() for m in re.finditer(re.escape(sig),b)]
            if hits: print("signature",name,"count",len(hits),"offsets",hits[:30])
          printable=re.findall(rb"[\\x20-\\x7e]{8,}",b)
          print("printable_runs",len(printable))
          for x in printable[:150]:
            print("STR",x[:300].decode("ascii","replace"))
          counts=collections.Counter(b)
          H=-sum((n/len(b))*math.log2(n/len(b)) for n in counts.values())
          print("byte_entropy",H,"distinct_bytes",len(counts))
          PY
          strings -a -n 8 data.out | head -150 >> audit.txt
      - name: Build maintained OutGuess 0.4
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential libjpeg-dev file
          git clone --depth 1 https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          git -C /tmp/outguess fetch --depth 1 origin 24810e14327c2bbeedeaadd3e24491f2a4425c02
          git -C /tmp/outguess checkout --detach 24810e14327c2bbeedeaadd3e24491f2a4425c02
          cd /tmp/outguess
          ./autogen.sh
          CFLAGS='-O2 -std=gnu11' ./configure --with-generic-jconfig
          make -j2 CC='gcc -std=gnu11' CFLAGS='-O2 -std=gnu11'
          sudo make install
      - name: Split the two archived tablet images and test source-fixed OutGuess modes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          b=Path("data.out").read_bytes()
          # The two adjacent 2400x3600 JPEGs are independently decoded and verified.
          bounds=[0,823807,1647321]
          assert b[:2]==bytes.fromhex("ffd8") and b[bounds[1]-2:bounds[1]]==bytes.fromhex("ffd9")
          assert b[bounds[1]:bounds[1]+2]==bytes.fromhex("ffd8") and b[bounds[2]-2:bounds[2]]==bytes.fromhex("ffd9")
          Path("tablet-front.jpg").write_bytes(b[bounds[0]:bounds[1]])
          Path("tablet-back.jpg").write_bytes(b[bounds[1]:bounds[2]])
          Path("trailer.bin").write_bytes(b[bounds[2]:])
          print("front",bounds[1]-bounds[0],"back",bounds[2]-bounds[1],"trailer",len(b)-bounds[2])
          PY
          OUTGUESS=$(find /tmp/outguess /usr/local/bin -type f -name outguess -perm -111 2>/dev/null | head -1)
          test -n "$OUTGUESS"
          echo "OutGuess executable: $OUTGUESS"
          for image in tablet-front.jpg tablet-back.jpg; do
            for mode in default divinity; do
              out="outguess-$image-$mode.bin"
              if [ "$mode" = default ]; then
                "$OUTGUESS" -r "$image" "$out" >"$out.log" 2>&1 || true
              else
                "$OUTGUESS" -k divinity -r "$image" "$out" >"$out.log" 2>&1 || true
              fi
              echo "=== $image $mode ===" | tee -a outguess-audit.txt
              cat "$out.log" | tee -a outguess-audit.txt
              if [ -f "$out" ]; then
                wc -c "$out" | tee -a outguess-audit.txt
                sha256sum "$out" | tee -a outguess-audit.txt
                file "$out" | tee -a outguess-audit.txt
                strings -a -n 5 "$out" | head -40 | tee -a outguess-audit.txt || true
              fi
            done
          done
      - name: Upload source and decoded object with audit
        uses: actions/upload-artifact@v4
        with:
          name: avowy-stage5-object-audit
          path: |
            stage5-object.hex
            stage5-object.hex.clean
            stage5-object.gz
            data.out
            audit.txt
            tablet-front.jpg
            tablet-back.jpg
            trailer.bin
            outguess-*
            outguess-audit.txt
          retention-days: 14
