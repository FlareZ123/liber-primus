name: LP2 terminal180 Instar XOR consumer gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce source-selected XOR candidate and bounded p55 consumers
        run: node sims/lp2_terminal180_instar_xor_consumer_gate_sft.cjs
