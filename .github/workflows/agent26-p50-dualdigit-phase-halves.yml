name: Agent26 p50 dual-digit phase-half original test
on:
  push:
    paths:
      - 'sims/lp2_p50_dualdigit_twohalf_phase_sft.cjs'
      - '.github/workflows/agent26-p50-dualdigit-phase-halves.yml'
  workflow_dispatch:
jobs:
  original-source-halves:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact p50 half-split and whole-token shuffle source controls
        run: node sims/lp2_p50_dualdigit_twohalf_phase_sft.cjs
