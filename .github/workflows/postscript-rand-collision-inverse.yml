name: LP2 PostScript RAND collision inverse
on:
  workflow_dispatch:

jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search exact original LP2 with synthetic source-positive
        run: node sims/postscript_rand_collision_inverse.cjs
