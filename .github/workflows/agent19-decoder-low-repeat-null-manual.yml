name: Agent19 frozen 27x27 decoder matched low-repeat controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve previously executed, byte-identical public decoder
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 90 'https://raw.githubusercontent.com/2retooz270703/Liber-Primus-27x27-Map-3-Rune-Nodes-Totient-Decryption/3c7921629065a4688aae02403b14c8eb6e12e3d6/liber_primus_decoder_cpp.zip' --output /tmp/agent19-decoder.zip
          echo '39c6364e5f1a23d685690bbea40089c6837b76296cba6b333c2c80fb3312430d  /tmp/agent19-decoder.zip' | sha256sum --check
          mkdir /tmp/agent19-decoder
          unzip -qq /tmp/agent19-decoder.zip -d /tmp/agent19-decoder
      - name: Run isolated frozen decoder and matched controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent19-research/sims /tmp/agent19-research/resources/liber-primus
          cp sims/agent19_2026_decoder_low_repeat_null_sft.cjs /tmp/agent19-research/sims/
          cp resources/liber-primus/lp2-corpus.json /tmp/agent19-research/resources/liber-primus/
          docker pull node:22-bookworm
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --memory 4g --cpus 2 -v /tmp/agent19-decoder:/decoder:ro -v /tmp/agent19-research:/research:ro node:22-bookworm bash -c 'set -euo pipefail; cp -r /decoder/liber_primus_decoder /tmp/decoder; cd /tmp/decoder; g++ -O2 -std=c++20 -o decoder-external decode.cpp -lz; node /research/sims/agent19_2026_decoder_low_repeat_null_sft.cjs /tmp/decoder/decoder-external /tmp/decoder/matrix.txt'
