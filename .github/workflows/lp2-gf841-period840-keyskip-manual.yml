name: LP2 GF841 Period840 Cipher Channels
on:
  workflow_dispatch:
jobs:
  original-source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-native GF841 additive rejection-clock inverse
        run: node sims/lp2_gf841_period840_collision_keyskip_sft.cjs
      - name: Source-native GF841 nonrepeating GP28 transition inverse
        run: node sims/lp2_gf841_period840_gp28_transition_sft.cjs
      - name: Source-native GF841 literal F and reserved-output rejection inverse
        run: node sims/lp2_gf841_period840_ftransparent_rejection_sft.cjs
