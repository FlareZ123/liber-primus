name: Agent16 retrieve Interconnectedness archive copy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download the archived Onion 5 MP3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/cicada-solvers/The-Complete-Cicada3301-Archive/main/2014/Websites/Interconnectedness%20fron%20onion%205/3301%20-%20Interconnectedness.mp3' \
            --output out/3301-Interconnectedness.mp3
          python3 - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path("out/3301-Interconnectedness.mp3")
          data = p.read_bytes()
          git_blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          sha256 = hashlib.sha256(data).hexdigest()
          def syncsafe(b):
              return (b[0] << 21) | (b[1] << 14) | (b[2] << 7) | b[3]
          frames = []
          id3 = None
          if data[:3] == b"ID3" and len(data) >= 10:
              major, minor, flags = data[3], data[4], data[5]
              tag_size = syncsafe(data[6:10])
              tag_end = min(len(data), 10 + tag_size + (10 if flags & 0x10 else 0))
              pos = 10
              while pos + (6 if major == 2 else 10) <= tag_end:
                  if major == 2:
                      fid = data[pos:pos+3].decode("latin1")
                      if data[pos:pos+3] == b"\0\0\0":
                          break
                      size = int.from_bytes(data[pos+3:pos+6], "big")
                      header = 6
                  else:
                      fid = data[pos:pos+4].decode("latin1")
                      if data[pos:pos+4] == b"\0\0\0\0":
                          break
                      raw_size = data[pos+4:pos+8]
                      size = syncsafe(raw_size) if major == 4 else int.from_bytes(raw_size, "big")
                      header = 10
                  if size < 0 or pos + header + size > tag_end:
                      break
                  frames.append({"id": fid, "size": size})
                  pos += header + size
              id3 = {"major": major, "minor": minor, "flags": flags, "tag_size": tag_size, "frames": frames}
          result = {
              "archive_repository": "cicada-solvers/The-Complete-Cicada3301-Archive",
              "archive_path": "2014/Websites/Interconnectedness fron onion 5/3301 - Interconnectedness.mp3",
              "archive_git_blob_sha1_expected": "09fe068192b76a3697c47ec1d604b527703db798",
              "archive_git_blob_sha1_downloaded": git_blob,
              "git_blob_sha1_matches": git_blob == "09fe068192b76a3697c47ec1d604b527703db798",
              "bytes": len(data),
              "sha256": sha256,
              "id3": id3,
              "first_64_bytes_hex": data[:64].hex(),
              "last_128_bytes_hex": data[-128:].hex()
          }
          pathlib.Path("out/source-metadata.json").write_text(json.dumps(result, indent=2) + "\n")
          if not result["git_blob_sha1_matches"]:
              raise SystemExit("Downloaded bytes do not match the archive Git blob SHA-1")
          PY
      - name: Inspect MP3 stream metadata
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          file out/3301-Interconnectedness.mp3 | tee out/file-identification.txt
          ffprobe -v error -count_frames \
            -show_entries format=duration,bit_rate,size,format_name:stream=codec_name,sample_rate,channels,channel_layout,bit_rate,duration,nb_frames,nb_read_frames \
            -of json out/3301-Interconnectedness.mp3 > out/ffprobe.json
          sha256sum out/3301-Interconnectedness.mp3 | tee out/sha256.txt
      - name: Upload the raw carrier and inspection results
        uses: actions/upload-artifact@v4
        with:
          name: interconnectedness-archive-copy
          path: out/
          retention-days: 14
