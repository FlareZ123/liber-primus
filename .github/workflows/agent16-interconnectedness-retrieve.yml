name: Agent16 retrieve Interconnectedness archive copy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the archived Onion 5 MP3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/cicada-solvers/The-Complete-Cicada3301-Archive/main/2014/Websites/Interconnectedness%20fron%20onion%205/3301%20-%20Interconnectedness.mp3' \
            --output out/3301-Interconnectedness.mp3
          python3 - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path("out/3301-Interconnectedness.mp3")
          data = p.read_bytes()
          git_blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          sha256 = hashlib.sha256(data).hexdigest()
          def syncsafe(b):
              return (b[0] << 21) | (b[1] << 14) | (b[2] << 7) | b[3]
          frames = []
          id3 = None
          if data[:3] == b"ID3" and len(data) >= 10:
              major, minor, flags = data[3], data[4], data[5]
              tag_size = syncsafe(data[6:10])
              tag_end = min(len(data), 10 + tag_size + (10 if flags & 0x10 else 0))
              pos = 10
              while pos + (6 if major == 2 else 10) <= tag_end:
                  if major == 2:
                      fid = data[pos:pos+3].decode("latin1")
                      if data[pos:pos+3] == b"\0\0\0":
                          break
                      size = int.from_bytes(data[pos+3:pos+6], "big")
                      header = 6
                  else:
                      fid = data[pos:pos+4].decode("latin1")
                      if data[pos:pos+4] == b"\0\0\0\0":
                          break
                      raw_size = data[pos+4:pos+8]
                      size = syncsafe(raw_size) if major == 4 else int.from_bytes(raw_size, "big")
                      header = 10
                  if size < 0 or pos + header + size > tag_end:
                      break
                  frames.append({"id": fid, "size": size})
                  pos += header + size
              id3 = {"major": major, "minor": minor, "flags": flags, "tag_size": tag_size, "frames": frames}
          result = {
              "archive_repository": "cicada-solvers/The-Complete-Cicada3301-Archive",
              "archive_path": "2014/Websites/Interconnectedness fron onion 5/3301 - Interconnectedness.mp3",
              "archive_git_blob_sha1_expected": "09fe068192b76a3697c47ec1d604b527703db798",
              "archive_git_blob_sha1_downloaded": git_blob,
              "git_blob_sha1_matches": git_blob == "09fe068192b76a3697c47ec1d604b527703db798",
              "bytes": len(data),
              "sha256": sha256,
              "id3": id3,
              "first_64_bytes_hex": data[:64].hex(),
              "last_128_bytes_hex": data[-128:].hex()
          }
          pathlib.Path("out/source-metadata.json").write_text(json.dumps(result, indent=2) + "\n")
          if not result["git_blob_sha1_matches"]:
              raise SystemExit("Downloaded bytes do not match the archive Git blob SHA-1")
          PY
      - name: Inspect MP3 stream metadata
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg gnupg poppler-utils
          file out/3301-Interconnectedness.mp3 | tee out/file-identification.txt
          ffprobe -v error -count_frames \
            -show_entries format=duration,bit_rate,size,format_name:stream=codec_name,sample_rate,channels,channel_layout,bit_rate,duration,nb_frames,nb_read_frames \
            -of json out/3301-Interconnectedness.mp3 > out/ffprobe.json
          sha256sum out/3301-Interconnectedness.mp3 | tee out/sha256.txt
      - name: Retrieve and split the signed Onion 5 message payload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/cicada-solvers/The-Complete-Cicada3301-Archive/main/2014/additional%20docs/onion%205%20signed%20message.txt' \
            --output out/onion5-signed-message.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          p = pathlib.Path("out/onion5-signed-message.txt")
          raw = p.read_bytes()
          git_blob = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
          expected = "e0ed3d728782d9d42dab82fb7a54b8d07ae2cea3"
          if git_blob != expected:
              raise SystemExit("Signed message bytes do not match the archive Git blob SHA-1")
          lines = raw.decode("utf-8", errors="replace").replace("\r", "").split("\n")
          blocks, current = [], []
          for line_no, line in enumerate(lines):
              value = line.strip()
              if re.fullmatch(r"[0-9a-fA-F]+", value or "!"):
                  current.append((line_no + 1, value))
              elif current:
                  blocks.append(current)
                  current = []
          if current:
              blocks.append(current)
          large = []
          for block in blocks:
              hex_text = "".join(item[1] for item in block)
              if len(hex_text) >= 1000 and len(hex_text) % 2 == 0:
                  data = bytes.fromhex(hex_text)
                  large.append((block[0][0], block[-1][0], data))
          if len(large) != 3:
              raise SystemExit("Expected 3 embedded binary blocks; got " + str(len(large)))
          manifest = {
              "archive_repository": "cicada-solvers/The-Complete-Cicada3301-Archive",
              "archive_path": "2014/additional docs/onion 5 signed message.txt",
              "archive_git_blob_sha1_expected": expected,
              "archive_git_blob_sha1_downloaded": git_blob,
              "signed_message_bytes": len(raw),
              "signed_message_sha256": hashlib.sha256(raw).hexdigest(),
              "blocks": []
          }
          for i, (first_line, last_line, data) in enumerate(large):
              if data.startswith(b"\xff\xd8\xff"):
                  ext = ".jpg"
              elif data.startswith(b"\xff\xf3") or data.startswith(b"\xff\xfb"):
                  ext = ".mp3-fragment.bin"
              else:
                  ext = ".bin"
              name = "onion5-embedded-" + str(i) + ext
              pathlib.Path("out", name).write_bytes(data)
              manifest["blocks"].append({
                  "index": i,
                  "first_line": first_line,
                  "last_line": last_line,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "prefix_hex": data[:32].hex(),
                  "suffix_hex": data[-32:].hex(),
                  "filename": name
              })
          last_line = large[-1][1]
          signature_at = next((i for i, line in enumerate(lines) if "-----BEGIN PGP SIGNATURE-----" in line), len(lines))
          code_lines = [line for line in lines[last_line:signature_at] if line.strip()]
          pathlib.Path("out/onion5-code-block.txt").write_text("\n".join(code_lines) + "\n")
          pathlib.Path("out/onion5-embedded-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          file out/onion5-embedded-* | tee out/onion5-embedded-file-types.txt
          ffprobe -v error -show_format -show_streams \
            -of json out/onion5-embedded-2.mp3-fragment.bin \
            > out/onion5-embedded-audio-ffprobe.json 2> out/onion5-embedded-audio-ffprobe.err || true
      - name: Verify the PGP-signed Onion 5 source
        shell: bash
        run: |
          set -euo pipefail
          gpg --batch --import resources/cicada-3301-authentic-public-key.asc
          gpg --batch --status-fd 1 --verify out/onion5-signed-message.txt > out/onion5-gpg-verification.txt 2>&1
      - name: Download companion Gödel Escher Bach archive images
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/cicada-solvers/The-Complete-Cicada3301-Archive/main/2014/additional%20images/godel%20escher%20bach'
          curl --fail --location --retry 3 "$base/Goedel.png" --output out/Goedel.png
          curl --fail --location --retry 3 "$base/Eyebyext.png" --output out/Eyebyext.png
          curl --fail --location --retry 3 "$base/Brotherboxportrait.jpg" --output out/Brotherboxportrait.jpg
          curl --fail --location --retry 3 "$base/Img_diff2.jpg" --output out/Img_diff2.jpg
          sha256sum out/Goedel.png out/Eyebyext.png out/Brotherboxportrait.jpg out/Img_diff2.jpg > out/geb-companion-sha256.txt
          file out/Goedel.png out/Eyebyext.png out/Brotherboxportrait.jpg out/Img_diff2.jpg > out/geb-companion-file-types.txt
      - name: Download related 2014 magic-square and audio images
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/cicada-solvers/The-Complete-Cicada3301-Archive/main/2014/additional%20images'
          curl --fail --location --retry 3 "$base/Magicsquare.jpg" --output out/Magicsquare.jpg
          curl --fail --location --retry 3 "$base/DIAGupdated.jpg" --output out/DIAGupdated.jpg
          curl --fail --location --retry 3 "$base/spectogram.jpg" --output out/spectogram.jpg
          curl --fail --location --retry 3 "$base/42VKTWB.png" --output out/42VKTWB.png
          sha256sum out/Magicsquare.jpg out/DIAGupdated.jpg out/spectogram.jpg out/42VKTWB.png > out/2014-related-image-sha256.txt
          file out/Magicsquare.jpg out/DIAGupdated.jpg out/spectogram.jpg out/42VKTWB.png > out/2014-related-image-file-types.txt
      - name: Download 2014 coordinate-source documents
        shell: bash
        run: |
          set -euo pipefail
          docs='https://raw.githubusercontent.com/cicada-solvers/The-Complete-Cicada3301-Archive/main/2014/additional%20docs'
          curl --fail --location --retry 3 "$docs/Self-Reliance%20and%20Other%20Essays/Self-Reliance%20and%20Other%20Essays.pdf" --output out/Self-Reliance-and-Other-Essays.pdf
          curl --fail --location --retry 3 "$docs/Self-Reliance%20and%20Other%20Essays/Self-Reliance%20-%20Wikipedia.pdf" --output out/Self-Reliance-Wikipedia.pdf
          curl --fail --location --retry 3 "$docs/5x5%20Magic%20Squares%20based%20on%20numbers%20from%20onion5%20portrait.jpg.txt" --output out/5x5-magic-squares-onion5-portrait.txt
          sha256sum out/Self-Reliance-and-Other-Essays.pdf out/Self-Reliance-Wikipedia.pdf out/5x5-magic-squares-onion5-portrait.txt > out/2014-coordinate-source-sha256.txt
      - name: Extract coordinate-source PDF text
        shell: bash
        run: |
          set -euo pipefail
          pdfinfo out/Self-Reliance-and-Other-Essays.pdf > out/Self-Reliance-and-Other-Essays.pdfinfo.txt
          pdfinfo out/Self-Reliance-Wikipedia.pdf > out/Self-Reliance-Wikipedia.pdfinfo.txt
          pdftotext -layout out/Self-Reliance-and-Other-Essays.pdf out/Self-Reliance-and-Other-Essays.txt
          pdftotext -layout out/Self-Reliance-Wikipedia.pdf out/Self-Reliance-Wikipedia.txt
      - name: Upload the raw carrier and inspection results
        uses: actions/upload-artifact@v4
        with:
          name: interconnectedness-archive-copy
          path: out/
          retention-days: 14
