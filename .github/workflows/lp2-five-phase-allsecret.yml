name: LP2 five-phase all-secret GP29 invariant
on:
  push:
    paths:
      - 'sims/lp2_five_phase_allsecret_sft.cjs'
      - 'sims/lp2_f31_fragment_key_inverse.cjs'
      - 'sims/grid_keyskip_viterbi.cjs'
      - '.github/workflows/lp2-five-phase-allsecret.yml'
      - 'resources/liber-primus/lp2-corpus.json'
      - 'resources/liber-primus/lp2-ink-annotations.json'
      - 'resources/control/gibran_prophet_58585.txt'
      - 'resources/control/shakespeare_first300k.txt'
      - 'resources/control/emerson_essays_2944.txt'
      - 'resources/control/latin-vulgate-gp-wholewords.txt'
      - 'resources/control/beowulf_oe_gp_profile.json'
  workflow_dispatch:
jobs:
  invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source-derived five-state GP29 substitution families
        run: node sims/lp2_five_phase_allsecret_sft.cjs
