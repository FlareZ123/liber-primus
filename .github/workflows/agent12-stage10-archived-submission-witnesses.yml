name: Agent12 Stage10 archived submission witnesses
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search disjoint original 2014 time range
        run: node sims/stage10-archived-submission-witnesses.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent12-square-response-witnesses
          path: agent12-square-response-witnesses.json
