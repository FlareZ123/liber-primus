name: Agent43 P37 LUCK Double-Index State

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p37-luck:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p37 LUCK double-index state regression
        shell: pwsh
        run: node sims/lp2_p37_luck_doubleindex_state_sft.cjs
