name: Agent43 Cuneiform Sexagesimal Wordmap SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuneiform-wordmap:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run cuneiform sexagesimal word-map state selector SFT
        shell: pwsh
        run: node sims/lp2_cuneiform_sexagesimal_wordmap_p50_state_sft.cjs
