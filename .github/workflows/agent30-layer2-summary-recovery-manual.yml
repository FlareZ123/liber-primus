name: Agent30 recover original two-layer summary after dirty rebase

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: agent30-layer2-summary-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current research repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download exact original-run source and manifest
        uses: actions/download-artifact@v4
        with:
          name: layer2-prepared
          run-id: 44062412799
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prepared
      - name: Download exact original-run independent planted controls
        uses: actions/download-artifact@v4
        with:
          name: layer2-controls
          run-id: 44062412799
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: controls
      - name: Download all 12 completed original-run score/null/verification triplets
        uses: actions/download-artifact@v4
        with:
          pattern: layer2-screen-*
          run-id: 44062412799
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results
          merge-multiple: true
      - name: Consolidate original evidence and source-native power gate
        run: |
          mkdir -p im-results/agent2_layer2_p0_2_p42_raw
          python sims/agent2_layer2_sft.py analyze results controls/controls.json im-results/agent2_layer2_p0_2_p42_original_screen.md
          cp prepared/upstream/work/layer2/data/manifest.json im-results/agent2_layer2_p0_2_p42_manifest.json
          cp controls/controls.json im-results/agent2_layer2_p0_2_p42_controls.json
          cp im-results/layer2_summary.json im-results/agent2_layer2_p0_2_p42_summary.json
          rm im-results/layer2_summary.json
          cp results/* im-results/agent2_layer2_p0_2_p42_raw/
          mkdir -p im-results/agent2_layer2_p0_2_p42_raw/controls
          cp controls/controls/* im-results/agent2_layer2_p0_2_p42_raw/controls/
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('im-results/agent2_layer2_p0_2_p42_summary.json')
          s = json.loads(p.read_text())
          assert s['controls']['serial_pass'] and s['controls']['combined_pass']
          assert sorted(map(tuple,s['missing'])) == [('opening','periodic0'),('opening','periodic1'),('p42','periodic0'),('p42','periodic1')]
          assert not s['survivors']
          assert len(list(Path('im-results/agent2_layer2_p0_2_p42_raw').glob('*_verify.txt'))) == 12
          PY
      - name: Commit before updating branch so generated unstaged files cannot block rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent2_layer2_p0_2_p42_original_screen.md \
                  im-results/agent2_layer2_p0_2_p42_manifest.json \
                  im-results/agent2_layer2_p0_2_p42_controls.json \
                  im-results/agent2_layer2_p0_2_p42_summary.json \
                  im-results/agent2_layer2_p0_2_p42_raw
          if ! git diff --cached --quiet; then
            git commit -m "Agent 30: Preserve completed historical two-layer original/null evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
