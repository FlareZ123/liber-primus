name: LP2 word substitution invariant
on:
  workflow_dispatch:
jobs:
  word-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run word-level permutation-invariant collision test
        run: node sims/word_partition_invariant.cjs
