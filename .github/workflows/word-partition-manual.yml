name: LP2 word substitution invariant
on:
  workflow_dispatch:
jobs:
  word-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run word-level permutation-invariant collision test
        run: node sims/word_partition_invariant.cjs
      - name: Check lossless wordwise 29-to-28-radix nonce inverse and all-key two-symbol bound
        run: node sims/wordwise_radix_nonce_inverse.cjs
      - name: Test exact state-count lower bounds and periodic-clock obstruction
        run: node sims/lp2_word_state_budget_sft.cjs
      - name: Test signed 2013 DH6 and BASE29 source bridge
        run: node sims/lp2_signed2013_dh6_lag6_bridge_sft.cjs
