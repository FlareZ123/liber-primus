name: LP2 p32 121-state source all-secret gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce original all-secret entropy bound and native-GP controls
        run: node sims/lp2_p32_11x11_previous_mod11_allsecret_sft.cjs
