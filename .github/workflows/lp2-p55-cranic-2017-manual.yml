name: LP2 fixed p55 onion candidate in 2017 public Tor graph
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-v2-host-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic fixed-host stream and split-boundary controls
        run: python sims/lp2_p55_cranic2017_v2hosts_sft.py --selftest
      - name: Retrieve the public 2017 CRANIC graph archive
        shell: bash
        run: |
          curl --fail --location --retry 2 --retry-delay 3 --max-time 360 --max-filesize 200000000 \
            --output "$RUNNER_TEMP/cranic-2017.tar.gz" \
            'https://www.cranic.it/data/supporting_material.tar.gz'
          sha256sum "$RUNNER_TEMP/cranic-2017.tar.gz"
          ls -lh "$RUNNER_TEMP/cranic-2017.tar.gz"
      - name: Check one frozen candidate and two known 2014 Cicada controls
        shell: bash
        run: |
          python sims/lp2_p55_cranic2017_v2hosts_sft.py "$RUNNER_TEMP/cranic-2017.tar.gz"
