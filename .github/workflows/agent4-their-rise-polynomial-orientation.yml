name: Agent4 THEIR RISE Polynomial Orientation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orientation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p39/p29/p50 orientation bridge
        shell: pwsh
        run: node sims/lp2_their_rise_polynomial_orientation_sft.cjs
