name: Agent20 p8 red H state circuit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p8-red-state:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-only p15 to p7 to p8 state circuit
        run: node sims/lp2_p8_red_h_state_circuit_sft.cjs
