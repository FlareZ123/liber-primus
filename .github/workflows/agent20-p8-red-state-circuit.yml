name: Agent20 p8 source-state circuits

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p8-source-state:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify p15 to p7 to p8 H state circuit
        run: node sims/lp2_p8_red_h_state_circuit_sft.cjs
      - name: Verify p8 7x7 fragment and chapter page-length state serialization
        run: node sims/lp2_p8_fragment7_chapter_state_sft.cjs
