name: Agent28 authentic 2015 D all-primary BWT histogram gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bwt-all-primary-source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original 729-rune first-stage and all-index BWT frequency exclusions
        shell: pwsh
        run: node sims/lp2_2015_primeD_mtf_source_original_sft.cjs
