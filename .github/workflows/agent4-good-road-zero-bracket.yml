name: Agent4 GOOD ROAD FALSE PATHS Zero Bracket

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run GOOD ROAD zero-bracket loop
        shell: pwsh
        run: node sims/lp2_good_road_false_paths_zero_bracket_sft.cjs
