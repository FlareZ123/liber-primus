name: Agent3 source doublet versus allograph bit-carrier
on:
  workflow_dispatch:
jobs:
  original-physical-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - run: python sims/lp2_doublet_original_allograph_sidechannel_sft.py
