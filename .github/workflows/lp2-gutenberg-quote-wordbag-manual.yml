name: LP2 Gutenberg unordered marked quote source search (manual)

on:
  workflow_dispatch:
    inputs:
      shard_list:
        description: "JSON array of Gutenberg Parquet shards 0..58"
        required: true
        type: string
        default: "[0]"

jobs:
  wordbag-quote-search:
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(inputs.shard_list) }}
    steps:
      - name: Checkout pinned original GP29 research
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-streaming and atomic-output dependencies
        run: python -m pip install pyarrow huggingface_hub filelock
      - name: Search exact source-marked 34-word and 47-word permutation-compatible cribs
        env:
          LP2_QUOTEBAG_SHARD: ${{ matrix.shard }}
          LP2_QUOTEBAG_OUTPUT: quotebag-artifacts/shard-${{ matrix.shard }}.json
        run: python sims/lp2_quote_wordbag_gutenberg_sft.py
      - name: Preserve original-source quote hits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-quotebag-shard-${{ matrix.shard }}
          path: quotebag-artifacts/*.json
          if-no-files-found: warn
