name: LP2 source-fixed GF81 bookend inverse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-gf81:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover source quartic and test original registers
        run: node sims/lp2_p7_gf81_bookend_original_sft.cjs
