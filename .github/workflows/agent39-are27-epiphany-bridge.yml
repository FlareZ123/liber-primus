name: Agent39 ARE27 shed-H EPIPHANY bridge
on:
  workflow_dispatch:
  push:
    paths:
      - "sims/lp2_are27_shed_h_epiphany_seeks_bridge_sft.cjs"
      - ".github/workflows/agent39-are27-epiphany-bridge.yml"
jobs:
  sft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run ARE27 bridge SFT
        run: node sims/lp2_are27_shed_h_epiphany_seeks_bridge_sft.cjs
