name: Terminal 256 table 180-by-76 polynomial product gate

on:
  workflow_dispatch:

jobs:
  original-polynomial-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test GF29 180-by-76 terminal factor on original source and planted native GP
        run: |
          node --check sims/lp2_terminal256_known180_polynomial_inverse_sft.cjs
          node sims/lp2_terminal256_known180_polynomial_inverse_sft.cjs
