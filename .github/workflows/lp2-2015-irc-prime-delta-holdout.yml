name: Original 2015 IRC prime-delta inverse and chapter holdout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-prime-delta:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned original prime-delta exact inversion and nine-section control
        shell: pwsh
        run: |
          node --check sims/lp2_2015_irc_prime_delta_inverse_sft.cjs
          node sims/lp2_2015_irc_prime_delta_inverse_sft.cjs
      - name: Agent41 five-lane inverse original word gate
        shell: pwsh
        run: |
          node --check sims/lp2_wordfive_lane_original_sft.cjs
          node sims/lp2_wordfive_lane_original_sft.cjs
      - name: Agent41 source-selected original p15 Hill4 stage after prime-delta
        shell: pwsh
        run: |
          node --check sims/lp2_prime_delta_p15_literal_hill_sft.cjs
          node sims/lp2_prime_delta_p15_literal_hill_sft.cjs
      - name: p0 red13 key after prime-delta and second-difference registers
        shell: pwsh
        run: |
          node --check sims/lp2_p0_red13_prime_delta_composite_sft.cjs
          node sims/lp2_p0_red13_prime_delta_composite_sft.cjs
      - name: Agent13 source-frozen red13 13-bonacci original-body gate
        shell: pwsh
        run: |
          node --check sims/lp2_p0_red13_13bonacci_prime_delta_sft.cjs
          node sims/lp2_p0_red13_13bonacci_prime_delta_sft.cjs
