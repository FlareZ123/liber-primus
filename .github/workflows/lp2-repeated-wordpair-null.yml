name: Check LP2 repeated two-word cipher phrase

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which source-original square model to test
        type: choice
        default: legacy
        options:
          - legacy
          - allalphabet
          - qr36
          - qr36-twobit
          - ninetile
          - ninetile-quads

permissions:
  contents: read

jobs:
  ninetile:
    if: inputs.mode == 'ninetile'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove nine-tile all-secret D4 / GP29 Caesar/S-box bound and run independent controls
        run: node sims/lp2_ninetile_d4_caesar_sbox_gate.cjs

  ninetile-quads:
    if: inputs.mode == 'ninetile-quads'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate exact source-original affine/D4 four-panel bounds
        run: node sims/lp2_ninetile_affine_quads.cjs all

  qr36-twobit:
    if: inputs.mode == 'qr36-twobit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test authentic two-bit-per-rune QR36 function pattern and secret row-column pads
        run: node sims/lp2_161_qr36_twobit_gate.cjs

  qr36:
    if: inputs.mode == 'qr36'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original QR36 source checkerboard and all-secret GF2 contradiction
        run: node sims/lp2_161_checkerboard_qr36_gate.cjs

  allalphabet:
    if: inputs.mode == 'allalphabet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exact source-square all-secret-alphabet capacity and English plant
        run: node sims/bookend_dual_square_allalphabet_capacity.cjs
  simulate:
    if: inputs.mode == 'legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Section-local length-preserving matched Monte Carlo
        run: node sims/lp2_repeated_wordpair_probe.cjs resources/lp2-transcription.txt 20000
      - name: Exact 81-square QR finder feasibility and source-shuffled control
        run: node sims/lp2_81square_qr_finder_gate.cjs
      - name: Test exact 81-to-80 nested-square GP29 correspondence and controls
        run: node sims/lp2_nested_squares_correspondence.cjs
      - name: Source-square 81x81 versus 80x80 crossblock static-key gate
        run: node sims/lp2_square_crossblock_channel.cjs
