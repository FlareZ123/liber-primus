name: Agent6 authenticated LP1 key on original LP2 publisher-order 58 JPEGs
on:
  workflow_dispatch:
    inputs:
      bit_level:
        description: Native JPEG bit selection
        type: choice
        required: true
        default: medium
        options:
          - medium
          - maximum
permissions:
  contents: read
concurrency:
  group: agent6-lp1-circumference-original58-${{ github.event.inputs.bit_level }}
  cancel-in-progress: false
jobs:
  lp1-circumference58-source:
    runs-on: windows-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Install original OpenPuff native UI requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native capture regression failed' }
      - name: Obtain source-pinned OpenPuff 4.00 executable and DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-v400-Agent14-Divinity'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original OpenPuff binary mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Recover exact independently published v4 JPEG payload first
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Source-published JPEG unavailable' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format "Jpeg (Image)" --bit-level "1/2 (50%) - Maximum" --out probe-output/public-recovery --wait-seconds 60
          if ($LASTEXITCODE -ne 0) { throw 'Original OpenPuff JPEG positive execution failed' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file() and p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('ORIGINAL_JPEG_35_BYTE_POSITIVE_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Exact published 35-byte positive missing' }
      - name: One authentic LP1 circumference key-sourced A-key on publisher-order original 58 JPEGs at native Medium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $index = Get-Content -LiteralPath resources/historical/stage11-2014-index.html -Raw
          if ($index -notmatch '<title>133</title>' -or $index -notmatch '<div id="331">') {
            throw 'Original 2014 source does not contain the frozen 133/331 selectors'
          }
          $sourcePages = [regex]::Matches($index, '<img src="([0-9]+).jpg"') | ForEach-Object {
            [int]$_.Groups[1].Value
          }
          if (@($sourcePages).Count -ne 58 -or @($sourcePages | Sort-Object -Unique).Count -ne 58) {
            throw 'Original published LP2 index has a non-58-page image set'
          }
          for ($i = 0; $i -lt 58; $i++) {
            if ($sourcePages[$i] -ne $i) { throw 'Original published image order is not 0..57' }
          }
          $out = 'probe-output/source-lp1-circumference58-${{ github.event.inputs.bit_level }}'
          $arguments = @(
            '--exe', "$env:OPENPUFF_EXE",
            '--password', 'FIRFUMFERENFE',
            '--bit-format', 'Jpeg (Image)',
            '--bit-level', $(if ('${{ github.event.inputs.bit_level }}' -eq 'maximum') { '1/2 (50%) - Maximum' } else { '1/5 (20%) - Medium' }),
            '--out', $out, '--wait-seconds', '960'
          )
          python -c "import json; d=json.load(open('resources/liber-primus/lp2-corpus.json',encoding='utf-8')); p=next(p for p in d['pages'] if p['page']==57); s=''.join(d['translit'][i] for i in p['indices']); assert 'CIRCUMFERENCES' in s and 'CIRCUMFERENCE'.replace('C','F')=='FIRFUMFERENFE'; print('AUTHENTIC_LP1_KEY_AND_P57_CLUE_VERIFIED')"
          if ($LASTEXITCODE -ne 0) { throw 'Original clear p57 keyword absent' }
          $selected = @()
          $manifest = @()
          for ($i = 0; $i -lt 58; $i++) {
            # Only the author-published p0..p57 order. No alternative ordering or key sweep.
            $sourceIndex = $i
            $originalScan = 17 + $sourceIndex
            $carrier = Join-Path $env:GITHUB_WORKSPACE ('resources/liber-primus/{0:D2}.jpg' -f $originalScan)
            if (-not (Test-Path -LiteralPath $carrier)) { throw "Missing original publisher image $originalScan" }
            $selected += $sourceIndex
            $manifest += [pscustomobject]@{
              ordinal=$i; original_publisher_page=$sourceIndex; canonical_scan=$originalScan
            }
            $arguments += @('--carrier', "$carrier")
          }
          if (@($selected | Sort-Object -Unique).Count -ne 58 -or $selected[0] -ne 0 -or $selected[1] -ne 1) {
            throw 'Publisher order did not produce the expected unique 58-image chain'
          }
          New-Item -ItemType Directory -Force -Path probe-output | Out-Null
          $manifest | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath probe-output/lp1-circumference-original58-order.json -Encoding utf8
          Write-Host "LP1_CIRCUMFERENCE_ORIGINAL58_ORDER $($selected -join ',')"
          python sims/openpuff_v400_extract.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Native 58-JPEG extraction failed to execute' }
          $result = Get-Content -LiteralPath "$out/result.json" -Raw | ConvertFrom-Json
          if ($result.carrier_count -ne 58 -or -not $result.carrier_chain_verified -or -not $result.bit_selection_verified -or -not $result.attempted) {
            throw 'Native GUI did not prove exact 58-carrier order, bit level and actual extraction'
          }
          if ($result.native_probe_outcome -eq 'inconclusive-timeout') {
            throw 'Native extraction result is inconclusive'
          }
          Write-Host "LP1_CIRCUMFERENCE_NATIVE_RESULT $($result | Select-Object native_probe_outcome, carrier_count, output_present, outputs, completion_dialogs, error_dialogs | ConvertTo-Json -Depth 12 -Compress)"
          if ($result.output_present) { Write-Host 'POTENTIAL_ORIGINAL_LP2_PAYLOAD_REQUIRES_BYTEWISE_VALIDATION' }
      - name: Preserve original-source order, GUI evidence and any recovered bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent6-lp1-circumference-original58-evidence
          path: probe-output/
          if-no-files-found: warn
