name: Agent22 P7 source root7 Fourier botanical original SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Evaluate source-root seven-point Fourier on original LP2
        shell: cmd
        run: node sims\lp2_p7_root7_fourier_botanical_sft.cjs
