name: 2017 ArchiveBot original HTML source check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WARC parser
        run: python -m pip install warcio
      - name: Retrieve and inspect exact two historical ArchiveBot WARCs
        run: python sims/lp2_p56_2017_archivebot_warc_http_sft.py
