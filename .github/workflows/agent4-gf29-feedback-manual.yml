name: Agent4 GF29 multiplicative feedback original-source gate
on:
  workflow_dispatch:
    inputs:
      gate:
        description: Select original-source test
        required: true
        type: choice
        default: legacy
        options:
          - legacy
          - q252-flanks
          - grid256-allsecret
jobs:
  sft:
    if: inputs.gate == 'legacy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original-source single-file feedback test
        run: node sims/lp2_gf29_delta_multiplicative_original_sft.cjs

      - name: Run original-table AES256 feedback key consumer
        run: node sims/lp2_gf29_delta_table_aes256_direct_sft.cjs

      - name: Run solved-p56 prime-totient source-key multiplicative feedback test
        run: node sims/lp2_gf29_delta_p56_totient_group_source_sft.cjs

      - name: Run exact 76-cell source outer ring against p55 feedback inverse
        run: node sims/lp2_p55_outer76_gf29_feedback_sft.cjs

      - name: Run signed BASE29 3301 direct GF841 field-power inverse
        run: node sims/lp2_2013_base29_3301_gf841_direct_power_sft.cjs

      - name: Run original terminal-ring known-interior linear-key prediction SFT
        run: node sims/lp2_terminal_ring_linear_predictor_sft.cjs

      - name: Run original five-back feedback all-secret English/Latin gate
        run: node sims/lp2_lagfive_feedback_allsecret_original_sft.cjs

      - name: Verify complete-word five-back equality partitions and native holdouts
        run: |
          node --check sims/lp2_fiveback_fullword_partition_sft.cjs
          node sims/lp2_fiveback_fullword_partition_sft.cjs

  q252-flanks:
    if: inputs.gate == 'q252-flanks'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact p50 H-G quotient original flanking-text inverse
        run: |
          node --check sims/lp2_p50_hg_q252_flanking_direct_sft.cjs
          node sims/lp2_p50_hg_q252_flanking_direct_sft.cjs

  grid256-allsecret:
    if: inputs.gate == 'grid256-allsecret'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source 256-cell all-secret periodic-GP29 and transparent-F clock
        run: |
          node --check sims/lp2_grid256_allsecret_keyclock_sft.cjs
          node sims/lp2_grid256_allsecret_keyclock_sft.cjs
