name: Agent4 GF29 multiplicative feedback original-source gate
on:
  workflow_dispatch:
jobs:
  sft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original-source single-file feedback test
        run: node sims/lp2_gf29_delta_multiplicative_original_sft.cjs

      - name: Run original-table AES256 feedback key consumer
        run: node sims/lp2_gf29_delta_table_aes256_direct_sft.cjs

      - name: Run solved-p56 prime-totient source-key multiplicative feedback test
        run: node sims/lp2_gf29_delta_p56_totient_group_source_sft.cjs

      - name: Run exact 76-cell source outer ring against p55 feedback inverse
        run: node sims/lp2_p55_outer76_gf29_feedback_sft.cjs
