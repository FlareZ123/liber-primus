name: LP2 GP-English word-start fixed-digram null

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed English lexicon
        run: python -m pip install cmudict==1.1.3
      - name: Sample original-digram preserving 29-rune trails
        run: python sims/lp2_gp4_wordstart_firstorder_euler_null_sft.py
