name: LP2 p56 lost 2012 eq6 onion Wayback CDX gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eq6-archive-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query exact host and previously tested onion-proxy suffixes
        run: python3 sims/lp2_p56_eq6_wayback_cdx_gate.py
      - name: Preserve raw CDX responses and summary
        uses: actions/upload-artifact@v4
        with:
          name: eq6-wayback-cdx-results
          path: eq6-cdx-output/
          if-no-files-found: error
