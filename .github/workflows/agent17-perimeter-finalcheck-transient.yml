name: Agent17 source 13x133 ring, byte and ASCII inverse final check
on:
  workflow_dispatch:
jobs:
  source-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Original GP29 and ASCII bridge regression
        run: node sims/lp2_onion7_133_perimeter_p32_grid_sft.cjs
