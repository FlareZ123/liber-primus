name: LP2 Jung 2012 Red Book word-length crib (manual)

on:
  workflow_dispatch:

jobs:
  jung-source-crib:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout unchanged LP2 source transcription
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current supported PDF text reader
        run: python -m pip install "pymupdf>=1.25,<2"
      - name: Download independently dated Jung source and test all original LP2 words
        run: python sims/lp2_jung_liberprimus_wordlength_source_sft.py
