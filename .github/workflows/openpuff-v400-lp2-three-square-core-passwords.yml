name: OpenPuff v4.00 LP2 three-square peeled-core password trial
on:
  workflow_dispatch:
    inputs:
      bit_level:
        description: Native JPEG bit-selection level
        type: choice
        required: true
        default: medium
        options:
          - medium
          - maximum
permissions:
  contents: read
concurrency:
  group: openpuff-v400-lp2-three-square-core-${{ github.event.inputs.bit_level }}
  cancel-in-progress: false
jobs:
  original-seven-carrier-trial:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Install original-tool native UI prerequisites
        shell: pwsh
        run: |
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
      - name: Retrieve original pinned OpenPuff v4.00
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-original-three-square'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original OpenPuff executable mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Derive the three source-constrained passwords
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_three_square_core_passwords.py --out probe-output/three-square-passwords.json
          if ($LASTEXITCODE -ne 0) { throw 'Three-square password derivation failed' }
          $pw = Get-Content -LiteralPath 'probe-output/three-square-passwords.json' -Raw | ConvertFrom-Json
          foreach ($field in @('A','B','C')) {
            $value = [string]$pw.passwords.$field
            if ($value.Length -lt 8 -or $value.Length -gt 32) { throw "Password $field violates 8..32 chars" }
            Write-Host "SQUARE_PASSWORD_FIELD $field length=$($value.Length) value=$value"
          }
          "SQUARE_PASSWORD_A=$($pw.passwords.A)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQUARE_PASSWORD_B=$($pw.passwords.B)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQUARE_PASSWORD_C=$($pw.passwords.C)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Reproduce independently authored A-only JPEG positive on this runner
        shell: pwsh
        run: |
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Source-pinned public OpenPuff JPEG unavailable' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format "Jpeg (Image)" --bit-level "1/2 (50%) - Maximum" --out probe-output/public-recovery --wait-seconds 45
          if ($LASTEXITCODE -ne 0) { throw 'Known JPEG maximum positive failed to execute' }
          python -c "from pathlib import Path; from hashlib import sha256; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file(); b=p.read_bytes(); assert b==b'Dies ist eine versteckte Nachricht!'; print('ORIGINAL_NATIVE_JPEG_MAXIMUM_POSITIVE_PASS',len(b),sha256(b).hexdigest())"
          if ($LASTEXITCODE -ne 0) { throw 'Known plaintext JPEG positive not recovered' }
      - name: Test original seven cuneiform-section JPEGs with all three square-derived passwords
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $level = if ('${{ github.event.inputs.bit_level }}' -eq 'maximum') { '1/2 (50%) - Maximum' } else { '1/5 (20%) - Medium' }
          $out = 'probe-output/original-cuneiform-seven-three-square-' + '${{ github.event.inputs.bit_level }}'
          $arguments = @(
            '--exe', "$env:OPENPUFF_EXE",
            '--password', "$env:SQUARE_PASSWORD_A",
            '--password-b', "$env:SQUARE_PASSWORD_B",
            '--password-c', "$env:SQUARE_PASSWORD_C",
            '--bit-format', 'Jpeg (Image)',
            '--bit-level', $level,
            '--out', "$out",
            '--wait-seconds', '1100'
          )
          foreach ($idx in 50..56) {
            $carrier = Join-Path $env:GITHUB_WORKSPACE ('resources/liber-primus/{0:D2}.jpg' -f $idx)
            if (-not (Test-Path -LiteralPath $carrier)) { throw "Original source image missing: $idx" }
            $arguments += @('--carrier', "$carrier")
          }
          python sims/openpuff_v400_extract.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Native original seven-image three-password chain execution failed' }
          $result = Get-Content -LiteralPath "$out/result.json" -Raw | ConvertFrom-Json
          if ($result.carrier_count -ne 7 -or -not $result.carrier_chain_verified -or -not $result.bit_selection_verified -or -not $result.attempted) {
            throw 'Native OpenPuff did not verify the exact seven-carrier chain and selected bit level'
          }
          if ($result.native_probe_outcome -eq 'inconclusive-timeout') {
            throw 'Seven-image three-password chain reached timeout without a native outcome'
          }
          Write-Host "THREE_SQUARE_PASSWORD_STATUS $($result.password_status)"
          Write-Host "THREE_SQUARE_NATIVE_RESULT $($result | Select-Object carrier_count, native_probe_outcome, output_present, outputs, selected_capacity_bytes_after_level, completion_dialogs, error_dialogs | ConvertTo-Json -Depth 12 -Compress)"
          if ($result.output_present) { Write-Host 'POTENTIAL_LP2_STEGO_PAYLOAD_DETECTED' }
      - name: Preserve original-tool evidence and any extracted output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpuff-v400-lp2-three-square-${{ github.event.inputs.bit_level }}-evidence
          path: probe-output/
          if-no-files-found: warn
