name: LP2 five numbered Gutenberg source crib scan (manual)

on:
  workflow_dispatch:
    inputs:
      shard_list:
        description: 'JSON array of Gutenberg Parquet shard numbers (0-58), e.g. [0] or [0,1,2,3]'
        required: true
        type: string
        default: '[0]'

jobs:
  five-numbered-source-search:
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(inputs.shard_list) }}
    steps:
      - name: Checkout exact research files
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public Parquet streaming libraries
        run: python -m pip install pyarrow huggingface_hub filelock
      - name: Positive control and five numbered source length scan
        env:
          LP2_GUTENBERG_SHARD: ${{ matrix.shard }}
          LP2_GUTENBERG_OUTPUT: five-crib-artifacts/shard-${{ matrix.shard }}.json
        run: python sims/lp2_fivepassage_gutenberg_shard_sft.py
      - name: Save exact source results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-five-crib-shard-${{ matrix.shard }}
          path: five-crib-artifacts/*.json
          if-no-files-found: warn
