name: Agent48 LP2 original pdir live score-screen checkpoint
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-score-checkpoint:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve completed original-cipher score shards without rerunning search
        shell: pwsh
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          $ErrorActionPreference = "Stop"
          gh run download 44075903575 --repo FlareZ123/liber-primus --dir raw-shards --pattern "pdir-sixsections-*"
          if ($LASTEXITCODE -ne 0) { throw "Original completed shard download failed" }
          gh run download 44247310794 --repo FlareZ123/liber-primus --dir fixed-shard --pattern "pdir-sixsections-010-3-verified-replacement"
          if ($LASTEXITCODE -ne 0) { throw "Verified failed-shard download failed" }
      - name: Assemble exact score ZIPs and reject incomplete original parts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path score-zips -Force | Out-Null
          foreach ($shard in (Get-ChildItem -Path raw-shards -Directory)) {
            if ($shard.Name -cnotmatch '^pdir-sixsections-[01][012][012]-(?:[0-9]|10|11)$') { throw "Unexpected original shard: $($shard.Name)" }
            if ($shard.Name -ceq "pdir-sixsections-010-3") { continue }
            Compress-Archive -Path (Join-Path $shard.FullName "*") -DestinationPath (Join-Path "score-zips" "$($shard.Name).zip") -CompressionLevel Optimal
          }
          $recovery = "fixed-shard/pdir-sixsections-010-3-verified-replacement/pdir-sixsections-010-3.zip"
          if (-not (Test-Path -LiteralPath $recovery -PathType Leaf)) { throw "Verified replacement ZIP missing" }
          Copy-Item -LiteralPath $recovery -Destination score-zips/pdir-sixsections-010-3.zip
          python sims/lp2_pdir_1329_incremental_artifact_gate.py score-zips | Out-File -FilePath score-zips/checkpoint.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Original-source strict score gate rejected an artifact" }
          python -c "import json; x=json.load(open('score-zips/checkpoint.json',encoding='utf-8-sig')); print(json.dumps({k:x[k] for k in ('downloaded_completed_shards','pending_or_missing_slots','vectors_tested','original_threshold_hits_so_far','highest_observed_IoC','top_completed_shards','full_matched_null_shards')},indent=2))"
          if ($LASTEXITCODE -ne 0) { throw "Compact score report failed" }
      - name: Preserve full exact original-score checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent48-original-pdir-live-checkpoint
          path: score-zips/checkpoint.json
          if-no-files-found: warn
