name: Agent43 p33 Stage10 Order-7 1033 Square Key SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p33-square-key-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original-p33 square-key SFT
        shell: pwsh
        run: node sims/lp2_p33_stage10_order7_1033_square_key_gate_sft.cjs
