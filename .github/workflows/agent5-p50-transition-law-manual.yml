name: Agent5 p50 full-transition discriminator
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transition-law:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sims/lp2_p50_transition_law_discriminator_sft.cjs
      - run: node sims/lp2_p50_transition_law_discriminator_sft.cjs
