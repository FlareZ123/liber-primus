name: LP2 Jung Liber Primus word-address original readout (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  word-address:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extractor
        run: python -m pip install "pymupdf>=1.25,<2"
      - name: Exact planted address and complete original LP2 word-address readouts
        run: python sims/lp2_jung_liberprimus_wordaddress_sft.py
