name: Temporary OpenPuff 4.00 Windows UI probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-openpuff-v400-ui-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare output
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path probe-output | Out-Null

      - name: Retrieve pinned historical OpenPuff v4.00 and verify Git blobs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff"
          $folder = Join-Path $env:RUNNER_TEMP "OpenPuffv400"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $expected = @{
            "OpenPuff.exe" = "466e03c792075313ce533a5dc7a789e8a41209f9"
            "libObfuscate.dll" = "f3b1c3315f8286346416fefd6141410f422f2454"
            "OpenPuff_license.txt" = "b0bab97d3c9906caada26fbb890a2a6fe028baa4"
          }
          foreach ($name in $expected.Keys) {
            $path = Join-Path $folder $name
            Invoke-WebRequest -Uri "$source/$name" -OutFile $path
            $blob = (& git hash-object -- $path).Trim().ToLowerInvariant()
            Write-Host "$name: git blob $blob; SHA256 $((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ($LASTEXITCODE -ne 0 -or $blob -ne $expected[$name]) {
              throw "Historical OpenPuff blob mismatch: $name"
            }
          }
          $exe = Join-Path $folder "OpenPuff.exe"
          if (-not (Select-String -LiteralPath (Join-Path $folder "OpenPuff_license.txt") -Pattern "OpenPuff v4.00" -Quiet)) {
            throw "Historical source license lacks v4.00 identity"
          }
          Write-Host "File version: $((Get-Item $exe).VersionInfo.FileVersion)"
          "OPENPUFF_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install UI inspection dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pywinauto

      - name: Inspect OpenPuff main and Unhide panels
        shell: pwsh
        run: python sims/openpuff_ui_probe.py --exe "$env:OPENPUFF_EXE" --out probe-output

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpuff-v400-ui-probe
          path: probe-output/
          if-no-files-found: warn
