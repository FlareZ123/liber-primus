name: Agent8 p54 red9 reverse GF29 LFSR original chapter
on:
  workflow_dispatch:

jobs:
  source-frozen-reverse-chapter:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Invert original nine-state LFSR across pp40 to 53 with native GP controls
        run: |
          node --check sims/lp2_p54_red9_p50_n9_reverse_chapter_sft.cjs
          node sims/lp2_p54_red9_p50_n9_reverse_chapter_sft.cjs
          node --check sims/lp2_p54_red9_reverse_n9_allsecret_holdout_sft.cjs
          node sims/lp2_p54_red9_reverse_n9_allsecret_holdout_sft.cjs
