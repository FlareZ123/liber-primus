name: LP2 standard Trifid period729 all-secret partition bound

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Select exact equality invariant or extended ternary CP-SAT relaxation
        required: true
        type: choice
        options:
          - triple-invariant
          - axis-optimizer
          - all-multiple3
        default: triple-invariant

jobs:
  all-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ inputs.probe == 'triple-invariant' || inputs.probe == 'all-multiple3' }}
        with:
          node-version: '22'
      - name: Source-native exact Trifid triple equality invariant
        if: ${{ inputs.probe == 'triple-invariant' }}
        run: node sims/trifid_triple_equality_invariant_sft.cjs
      - name: Source-native universal multiples-of-three Trifid triple invariant
        if: ${{ inputs.probe == 'all-multiple3' }}
        run: node sims/trifid_all_multiple3_invariant_sft.cjs
      - uses: actions/setup-python@v5
        if: ${{ inputs.probe == 'axis-optimizer' }}
        with:
          python-version: '3.11'
      - name: Install documented CP-SAT solver
        if: ${{ inputs.probe == 'axis-optimizer' }}
        run: python -m pip install ortools==9.14.6206
      - name: Original-source all-secret Trifid period729 bound and source-native control
        if: ${{ inputs.probe == 'axis-optimizer' }}
        run: python -u sims/trifid_729_axis_partition_bound.py
        env:
          TRIFID729_SECONDS_PER_AXIS: '18'
