name: LP2 moth-linked shared-pad native gate

on:
  workflow_dispatch:

jobs:
  exact-original:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source-original shared-pad and native plants
        run: node sims/lp2_moth_p53_p55_sharedpad_native_gate_sft.cjs
