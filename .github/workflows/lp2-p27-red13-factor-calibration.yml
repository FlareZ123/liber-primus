name: Manual p27 red13 factor calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v7
      - name: Use Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned SymPy
        run: python -m pip install "sympy==1.14.0"
      - name: Run calibration
        run: python sims/lp2_p27_red13_factor_calibration.py
