name: LP2 p55 self-wordfold9 original ciphertext and heldout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-wordfold9:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original p55 fold9, p27 cross-page holdout and matched source controls
        run: node sims/lp2_p55_self_wordfold9_source_sft.cjs
