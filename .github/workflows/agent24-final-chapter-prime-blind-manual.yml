name: Agent24 blind final-chapter authentic prime-source gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind-final-chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies from existing prime-source gate
        run: python -m pip install "numpy==2.2.6" "numba==0.61.2"
      - name: Search unknown literal-F prime starts on original p54–55
        run: |
          set -o pipefail
          python sims/lp2_p54_55_prime_totient_unknown_F_source_scan.py | tee lp2-p54-p55-prime-scan.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp2-p54-p55-prime-source-blind
          retention-days: 30
          path: lp2-p54-p55-prime-scan.log
