name: LP2 Latin register authentic grid-key inversion (manual)
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Manual research path
        required: true
        type: choice
        default: latin-original
        options:
          - latin-original
          - anend-hash-grid-nonces
          - anend-hash-direct-gp28
          - fragment-grid-des
          - biaxial-section-fragment
          - final16-border-rank28
          - fivedot-32row-bitmap
jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-pinned Latin GP model, original LP2 rune Viterbi, Latin controls
        if: ${{ inputs.suite == 'latin-original' }}
        run: node sims/grid_latin_register_inverse.cjs
      - name: AN END exact 512-bit hash as source-derived nonce for eight original numeric grid keys
        if: ${{ inputs.suite == 'anend-hash-grid-nonces' }}
        run: node sims/anend_hash_grid_nonce_inverse.cjs
      - name: Derive SHAKE/HMAC direct stream from solved AN END digest and invert original GP29/GP28 runes
        if: ${{ inputs.suite == 'anend-hash-direct-gp28' }}
        run: node sims/anend_hash_direct_29stream_inverse.cjs
      - name: Original 13-dot punctuation fragments paired to 32 eight-byte grid DES keys
        if: ${{ inputs.suite == 'fragment-grid-des' }}
        run: node sims/fragment_grid_des_inverse.cjs
      - name: Source-paired eight AES/ChaCha section keys and thirty-two thirteen-dot-fragment nonces
        if: ${{ inputs.suite == 'biaxial-section-fragment' }}
        run: node sims/grid_biaxial_section_fragment_inverse.cjs

      - name: Final sixteen decorated LP2 pages grid-AES128 source GP28 repeat-state inverse
        if: ${{ inputs.suite == 'final16-border-rank28' }}
        run: node sims/final16_border_grid_rank28_inverse.cjs

      - name: Source-locked five-bit 13/31 row traversals for directly visible binary grid image
        if: ${{ inputs.suite == 'fivedot-32row-bitmap' }}
        run: node sims/lp2_grid_bitplane_source_order_sft.cjs
