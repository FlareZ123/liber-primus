name: Agent37 p0 three-crib source-key fingerprint scan
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-key-scan:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan finite checked-in source-key family
        run: |
          node --check sims/lp2_p0_threecrib_source_key_scan_sft.cjs
          node sims/lp2_p0_threecrib_source_key_scan_sft.cjs
