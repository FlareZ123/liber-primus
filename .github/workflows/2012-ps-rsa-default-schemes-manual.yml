name: 2012 P.S. RSA default-scheme reuse gate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rsa-default-schemes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pinned LP2 default-key OutGuess artifact
        uses: actions/download-artifact@v4
        with:
          name: outguess-lp2-default-key
          run-id: 42755426574
          github-token: ${{ github.token }}
          path: /tmp/outguess

      - name: Test original LP2 p49-p51 table and p55 numeral
        run: node sims/lp2_2012_ps_rsa_reuse_sft.cjs > /tmp/ps-rsa-original.json

      - name: Test 2013 and 2014 cross-round artifacts
        run: python sims/ps_rsa_oaep_crossround_gate.py --outguess-zip /tmp/outguess > /tmp/ps-rsa-crossround.json

      - name: Preserve machine-readable results
        uses: actions/upload-artifact@v4
        with:
          name: ps-rsa-default-scheme-results
          path: |
            /tmp/ps-rsa-original.json
            /tmp/ps-rsa-crossround.json
          if-no-files-found: error
