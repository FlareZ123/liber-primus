name: One-off original p32 tree direction gate

on:
  push:
    branches: [main]
    paths:
      - workplace/.tree-direction-run.trigger

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image reader
        run: python -m pip install --quiet Pillow
      - name: Test source-locked p32 direction field on original signed image
        run: python sims/tree121_directional_field_sft.py
