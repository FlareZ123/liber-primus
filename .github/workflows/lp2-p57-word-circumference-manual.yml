name: LP2 literal word circumference source test
on:
  workflow_dispatch:
jobs:
  original-source-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact word interiors, exteriors, reconstruction, and controls
        run: node sims/lp2_p57_literal_word_circumference_sft.cjs
      - name: Test p55 direct exterior-to-interior key inverses
        run: node sims/p55_exterior_interior_direct_key_sft.cjs
      - name: Test signed-2016 SHA1 p55 exterior crib transfer
        run: node sims/p55_2016_sha1_exterior_crib_inner_sft.cjs
