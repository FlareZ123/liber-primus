name: LP2 literal word circumference source test
on:
  workflow_dispatch:
jobs:
  original-source-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test p55 exterior32 keys and grid row selectors against AES containers
        run: node sims/p55_exterior32_grid_aes_sft.cjs
      - name: Test original all-20-word shed75 key against corrected p55 body
        run: node sims/p55_p57_title20_shed75_source_sft.cjs
      - name: Test original p57 19-word shed76 key and table perimeter gate
        run: node sims/p55_p57_shed19_key_bridge_sft.cjs
      - name: Test exact word interiors, exteriors, reconstruction, and controls
        run: node sims/lp2_p57_literal_word_circumference_sft.cjs
      - name: Test p55 direct exterior-to-interior key inverses
        run: node sims/p55_exterior_interior_direct_key_sft.cjs
      - name: Test signed-2016 SHA1 p55 exterior crib transfer
        run: node sims/p55_2016_sha1_exterior_crib_inner_sft.cjs
      - name: Check source-locked p55 16-prime-word AES inverse of table256
        run: node sims/p55_wisdom_wordprime_aes_grid_sft.cjs
      - name: Check p55 center-401 solved-p56 totient inverse
        run: node sims/p55_prime401_p56_totient_direct_sft.cjs
      - name: Check 23-dot nested row-column invertibility and p57 native plant
        run: node sims/lp2_p55_23dot_nested_rowcol_inverse_sft.cjs
      - name: Test source GP prime512 run-length direct hash preimage
        run: node sims/p55_prime512_rle_hash_preimage_sft.cjs
