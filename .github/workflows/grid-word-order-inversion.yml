name: Base60 grid word-order inversion
on:
  workflow_dispatch:
jobs:
  recover-permutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run original grid-key word-order inversion and matched controls
        run: node sims/grid_word_order_inversion.cjs
