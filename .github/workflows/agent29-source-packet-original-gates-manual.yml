name: Agent29 source-packet original-input SFTs
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-packets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historical 14-column full-word inverse
        run: node sims/lp2_p40_stage05_14column_wholeword_sft.cjs
      - name: Thirty-two page-carry table packet and direct GP29 consumer
        run: node sims/lp2_pagecarry_grid32_packet_sft.cjs
      - name: Public WEATHER mirror-source null, 2048 controls
        run: node sims/lp2_nov2026_27grid_weather_mirror_null_sft.cjs
