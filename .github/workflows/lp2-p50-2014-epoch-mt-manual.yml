name: LP2 P50 2014 timestamp MT original gate
on:
  workflow_dispatch:
jobs:
  original-mt:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Python MT 2014 source-exact seeded inversion
        run: python sims/lp2_p50_2014_python_mt_epoch_sft.py
