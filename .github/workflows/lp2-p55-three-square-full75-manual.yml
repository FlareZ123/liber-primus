name: LP2 p55 three historical square full75 Hill gate
on:
  workflow_dispatch:
jobs:
  source-locked-hill75:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute original-source GP29 Hill5 full75 gate
        run: node sims/lp2_p55_three_squares_full75_hill_sft.cjs
