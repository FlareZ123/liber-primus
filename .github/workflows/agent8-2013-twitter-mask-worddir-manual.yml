name: Agent8 historical 2013 Twitter-mask word-directed LP2 original
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-source-pdir:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-authenticated 2013 byte-key and first300 word-direction native plants
        run: node sims/lp2_2013_twitter_mask_pdir_original_sft.cjs
