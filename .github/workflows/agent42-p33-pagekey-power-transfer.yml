name: Agent42 P33 Page-Key Power Transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p33-page-key:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact p33 page-key power transfer
        shell: pwsh
        run: node sims/lp2_p33_pagekey_power_transfer_sft.cjs
