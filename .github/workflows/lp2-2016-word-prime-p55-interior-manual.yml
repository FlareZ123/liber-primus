name: Signed 2016 GP word numbers to p55 original interior
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gp:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp2_signed2016_gematria_word_p55_interior_sft.cjs
