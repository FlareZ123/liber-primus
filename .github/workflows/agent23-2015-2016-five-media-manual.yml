name: Agent23 frozen 2015-16 LP2 source-linked image acquisition
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-period-images:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire five original period-linked images
        env:
          LP2_MEDIA_OUT: ${{ runner.temp }}/lp2_frozen_five_images
          LP2_EMIT_BASE64: '1'
        run: |
          node --check sims/lp2_2015_2016_frozen_five_media_sft.cjs
          node sims/lp2_2015_2016_frozen_five_media_sft.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent23-2015-2016-five-media
          path: ${{ runner.temp }}/lp2_frozen_five_images
          retention-days: 7
