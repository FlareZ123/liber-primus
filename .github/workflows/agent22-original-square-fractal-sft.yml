name: Agent22 original 27-square fractal tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run original 729 Sierpinski chapter gate
        shell: cmd
        run: node sims\lp2_27square_sierpinski_p3_p50_sft.cjs
      - name: Run full Peano totient regression gate
        shell: cmd
        run: node sims\lp2_p0_27square_peano_p56_phi_sft.cjs
