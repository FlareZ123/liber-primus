name: Agent10 p28 ROAD23 five-dot 180-degree phi gate
on:
  workflow_dispatch:

jobs:
  original-p23:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce authenticated p28 route and original p23 rotation gate
        run: |
          node --check sims/lp2_p28_road23_fivedot_rotated_phi_sft.cjs
          node sims/lp2_p28_road23_fivedot_rotated_phi_sft.cjs
