name: OpenPuff v4.00 LP2 clue-selected JPEG carrier-chain tests
on:
  workflow_dispatch:
    inputs:
      bit_level:
        description: Original native JPEG extraction depth
        type: choice
        required: true
        default: medium
        options:
          - medium
          - maximum
      carrier_order:
        description: Exact original source-page traversal
        type: choice
        required: true
        default: printed
        options:
          - printed
          - p15-spiral
          - p49-p51-table
          - p55-single
      password_source:
        description: Historically or source-derived password to test on original floral carriers
        type: choice
        required: true
        default: historic-mp3
        options:
          - historic-mp3
          - lp1-divinity
          - p50-center
          - p55-16word-base32
permissions:
  contents: read
concurrency:
  group: openpuff-v400-lp2-floral16-${{ inputs.carrier_order }}-${{ inputs.bit_level }}-${{ inputs.password_source }}
  cancel-in-progress: false
jobs:
  source-selected-chain:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Install original native GUI dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native output-capture SFT failed' }
      - name: Fetch and pin original OpenPuff 4.00
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-v400-original-floral16'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original OpenPuff blob mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prove this executable can extract known authentic v4 JPEG payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Public exact-JPEG reference retrieval failed' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format "Jpeg (Image)" --bit-level "1/2 (50%) - Maximum" --out probe-output/public-recovery --wait-seconds 65
          if ($LASTEXITCODE -ne 0) { throw 'Known original-v4.00 JPEG calibration failed to run' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file() and p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('NATIVE_PUBLIC_JPEG_POSITIVE_35_BYTE_EXACT_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Known original-v4.00 JPEG positive did not recover the exact 35 bytes' }
      - name: Test original source-selected JPEG carrier chain at selected native depth
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $level = if ('${{ inputs.bit_level }}' -eq 'maximum') { '1/2 (50%) - Maximum' } else { '1/5 (20%) - Medium' }
          $out = 'probe-output/original-floral16-' + '${{ inputs.carrier_order }}' + '-' + '${{ inputs.bit_level }}' + '-' + '${{ inputs.password_source }}'
          # The source-printed 32x8 table's central 2x2 tokens are 0s 0D / 20 2n.
          # Direct concatenation selects one eight-character native A password.
          $password = switch ('${{ inputs.password_source }}') {
            'lp1-divinity' { 'DIVINITY' }
            'p50-center' { '0s0D202n' }
            'p55-16word-base32' { '6sws36unkmvdy4b7' }
            default { '33011033' }
          }
          $arguments = @(
            '--exe', "$env:OPENPUFF_EXE",
            '--password', $password,
            '--bit-format', 'Jpeg (Image)',
            '--bit-level', $level,
            '--out', $out,
            '--wait-seconds', '1300'
          )
          $manifest = @()
          # Source p15 center-out clockwise flat positions: 5,6,10,9,8,4,0,1,2,3,7,11,15,14,13,12.
          # The numeric-table set is exact printed order on physical pp49-51.
          $sourceIndices = switch ('${{ inputs.carrier_order }}') {
            'p15-spiral' { @(62,63,67,66,65,61,57,58,59,60,64,68,72,71,70,69) }
            'p49-p51-table' { @(66,67,68) }
            'p55-single' { @(72) }
            default { @(57..72) }
          }
          $expected = switch ('${{ inputs.carrier_order }}') {
            'p49-p51-table' { 3 }
            'p55-single' { 1 }
            default { 16 }
          }
          $allowed = switch ($expected) {
            3 { @(66..68) }
            1 { @(72) }
            default { @(57..72) }
          }
          foreach ($idx in $sourceIndices) {
            $source = Join-Path $env:GITHUB_WORKSPACE ('resources/liber-primus/{0:D2}.jpg' -f $idx)
            if (-not (Test-Path -LiteralPath $source)) { throw "Missing fixed source image $source" }
            $manifest += [pscustomobject]@{scan=$idx; lp2_physical_page=($idx-17); name=[System.IO.Path]::GetFileName($source)}
            $arguments += @('--carrier', "$source")
          }
          if (@($manifest).Count -ne $expected -or @($manifest | Select-Object -ExpandProperty scan | Sort-Object -Unique).Count -ne $expected -or
            @($manifest | Where-Object { $_.scan -notin $allowed }).Count -ne 0) {
            throw 'Source-selected carrier chain differs from its locked original JPEG inventory'
          }
          New-Item -ItemType Directory -Force -Path probe-output | Out-Null
          $manifest | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath probe-output/floral16-original-manifest.json -Encoding utf8
          Write-Host "ORIGINAL_FLORAL16_SOURCE_MANIFEST key_source=${{ inputs.password_source }} $($manifest | ConvertTo-Json -Compress)"
          python sims/openpuff_v400_extract.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Native floral16 chain extraction script failed' }
          $result = Get-Content -LiteralPath (Join-Path $out 'result.json') -Raw | ConvertFrom-Json
          if (($expected -gt 1 -and -not $result.carrier_chain_verified) -or $result.carrier_count -ne $expected -or -not $result.bit_selection_verified -or -not $result.attempted) {
            throw 'Native source-selected chain/bit-level execution not established'
          }
          Write-Host "ORIGINAL_SOURCE_CHAIN_NATIVE_RESULT source=${{ inputs.carrier_order }} $($result | Select-Object carrier_count, native_probe_outcome, output_present, outputs, completion_dialogs, error_dialogs | ConvertTo-Json -Depth 12 -Compress)"
          if ($result.native_probe_outcome -eq 'inconclusive-timeout') { throw 'Native outcome inconclusive' }
          if ($result.output_present) { Write-Host 'POTENTIAL_LP2_FLORAL16_PAYLOAD_FOUND' }
      - name: Preserve native GUI screenshots, extraction result and files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-v400-floral16-${{ inputs.carrier_order }}-${{ inputs.bit_level }}-${{ inputs.password_source }}-evidence
          path: probe-output/
          if-no-files-found: warn
