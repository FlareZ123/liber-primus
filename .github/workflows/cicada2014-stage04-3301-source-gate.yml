name: Cicada 2014 Stage04 3301 source gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cicada2014-stage04-3301-source-gate.yml'
      - 'sims/stage04_original_server_status_square_sft.py'

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce Stage04 image inventory and page-03/04 objects
        run: node sims/cicada2014_stage04_3301_object_inventory_sft.cjs
      - name: Reproduce complete page-05 server-status binary and OOB matrix
        run: python3 sims/stage04_original_server_status_square_sft.py
      - name: Verify the page-03 OutGuess clear-signature
        shell: bash
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          chmod 700 "$home"
          gpg --homedir "$home" --batch --import resources/control/cicada-3301-public-key.asc
          gpg --homedir "$home" --batch --verify resources/external/derived/2014-stage04/03-outguess.asc
