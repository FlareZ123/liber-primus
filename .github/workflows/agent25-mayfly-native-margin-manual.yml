name: Agent25 LP2 repeated mayfly native margin pixel comparison
on:
  workflow_dispatch:

jobs:
  original-mayfly-margins:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original-image comparison
        run: python -m pip install opencv-python-headless numpy filelock
      - name: Compare all three original mayfly page images by artwork-only band
        run: python sims/lp2_p24_p26_mayfly_original_margin_difference_sft.py
      - name: Retain exact margin pixel comparison evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp2-mayfly-margin-native-pixel-difference
          path: im-results/lp2-p24-p26-mayfly-margin-original-pixel-difference.json
          if-no-files-found: warn
