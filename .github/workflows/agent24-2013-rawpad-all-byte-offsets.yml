name: Agent24 original 2013 raw-pad all-byte-offset GP29 keyskip scan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent24-2013-rawpad-all-byte-offsets
  cancel-in-progress: false

jobs:
  rawpad-offsets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Liber Primus research
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch pinned original Cicada 2013 binary sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-artifacts/rawpad
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/rtkd/iddqd/f2267b0c2f1e1d2662806b90b9c3a2953b3a7023/2013/02/761.MP3" \
            -o /tmp/761.MP3
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/neuroretransmit/cicada/ade9a02889ef8acbc8cde8edbfd0a785c369f4c3/2013/003-twitter/twitter.bin" \
            -o /tmp/twitter.bin
          sha256sum /tmp/761.MP3 /tmp/twitter.bin | tee run-artifacts/rawpad/source-sha256.txt
          test "$(stat -c%s /tmp/761.MP3)" = "4010732"
          test "$(stat -c%s /tmp/twitter.bin)" = "64167"

      - name: Run exhaustive raw-byte offset screen and independent holdouts
        shell: bash
        env:
          LP761_RAW_MP3: /tmp/761.MP3
          LP761_TWITTER_BIN: /tmp/twitter.bin
          LP761_REPORT: run-artifacts/rawpad/lp2-2013-rawpad-offset-scan.json
        run: |
          set -euo pipefail
          node sims/lp2_2013_raw_761_twitter_mod29_offset_scan.cjs \
            2>&1 | tee run-artifacts/rawpad/run.log

      - name: Upload reproducible raw-pad scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent24-2013-rawpad-all-byte-offsets
          path: run-artifacts/rawpad/
          if-no-files-found: warn
          retention-days: 30
