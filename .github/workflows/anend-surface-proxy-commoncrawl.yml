name: AN-END original proxy-host archive source gates

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source-fixed historical target set
        required: true
        default: 2015-onioncity
        type: choice
        options:
          - 2015-onioncity
          - 2014-2016-nu-rip

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query seven source-named Cicada onions via independently dated 2015 Onion.City
        if: inputs.source == '2015-onioncity'
        run: node sims/lp2_2015_onioncity_source_cdx_sft.cjs lp2-2015-onioncity-cdx.json
      - name: Legacy two-proxy source gate
        if: inputs.source == '2014-2016-nu-rip'
        run: node sims/anend_surface_proxy_commoncrawl.cjs anend-surface-proxy-commoncrawl.json
      - name: Preserve exact index metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anend-source-${{ inputs.source }}
          path: |
            anend-surface-proxy-commoncrawl.json
            lp2-2015-onioncity-cdx.json
          if-no-files-found: warn
          retention-days: 90
