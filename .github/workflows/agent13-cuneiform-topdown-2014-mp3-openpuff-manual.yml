name: Agent 13 source-topdown cuneiform password on authentic 2014 Interconnectedness MP3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-mp3:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Install native OpenPuff UI and source code prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check filelock pywinauto Pillow
          python sims/openpuff_output_capture_sft.py
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-v400-agent13-cuneiform-mp3'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $checks = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $checks.Keys) {
            $file = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $file
            $blob = (& git hash-object -- $file).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $blob -ne $checks[$name]) { throw "Historical native binary mismatch: $name" }
          }
          $exe = Join-Path $root 'OpenPuff.exe'
          if ((Get-Item $exe).VersionInfo.FileMajorPart -ne 4) { throw 'Historical OpenPuff major version mismatch' }
          "OPENPUFF_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Authenticate original 2014 Interconnectedness MP3 byte identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'https://raw.githubusercontent.com/iBotPeaches/cicada_3301/a0a616d85717af59f8b806875b43d51e06e1e874/tool/storage/interconnected.mp3'
          $file = Join-Path $env:RUNNER_TEMP 'interconnected.mp3'
          Invoke-WebRequest -Uri $src -OutFile $file
          if ((Get-Item $file).Length -ne 6651873) { throw 'Original MP3 byte length mismatch' }
          $blob = (& git hash-object -- $file).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $blob -ne '09fe068192b76a3697c47ec1d604b527703db798') { throw 'Original MP3 archive Git blob mismatch' }
          "INTERCONNECTEDNESS_MP3=$file" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Recover authentic historical OpenPuff 2014 magic squares with A 33011033
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$env:INTERCONNECTEDNESS_MP3" --password '33011033' --bit-format 'Mp3 (Audio)' --bit-level '1/2 (50%) - Maximum' --out 'probe-output/historical-positive' --output-name 'magicsquares.txt' --wait-seconds 45 --expected-crc32 '6A8C41E3' --expected-size 745
          if ($LASTEXITCODE -ne 0) { throw 'Native historical positive execution failed' }
          $p = Get-Content 'probe-output/historical-positive/result.json' -Raw | ConvertFrom-Json
          if (-not $p.expected_match) { throw 'Original 745-byte magic squares positive failed' }
          Write-Host 'HISTORICAL_MAGIC_SQUARES_POSITIVE_PASS original length745 CRC32 6A8C41E3'
      - name: Test literal original cuneiform top-to-bottom password on same 2014 MP3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$env:INTERCONNECTEDNESS_MP3" --password '10333301' --bit-format 'Mp3 (Audio)' --bit-level '1/2 (50%) - Maximum' --out 'probe-output/cuneiform-reversed-original-mp3' --wait-seconds 90
          if ($LASTEXITCODE -ne 0) { throw 'Native source candidate execution failed' }
          $x = Get-Content 'probe-output/cuneiform-reversed-original-mp3/result.json' -Raw | ConvertFrom-Json
          if (-not $x.carrier_added -or -not $x.bit_selection_verified -or $x.native_probe_outcome -eq 'inconclusive-timeout') { throw 'Original source candidate settings or completion inconclusive' }
          Write-Host "ORIGINAL_CUNEIFORM_ON_MP3 $($x | Select-Object native_probe_outcome, output_present, outputs, selected_capacity_bytes_after_level, error_dialogs | ConvertTo-Json -Depth 10 -Compress)"
          if ($x.output_present) { Write-Host 'POTENTIAL_ORIGINAL_CICADA_SECOND_PAYLOAD' }
      - name: Preserve original native GUI evidence and any recovered files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent13-cuneiform-topdown-2014-mp3-evidence
          path: probe-output/
          if-no-files-found: warn
