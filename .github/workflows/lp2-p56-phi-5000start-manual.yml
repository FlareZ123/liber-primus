name: LP2 native p56 F-transparent 5000-prime-start chapter gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-original-5000start:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check sims/lp2_p56_phi_ftransparent_5000start_sft.cjs
      - name: Recover original p56 and exhaust legal prime starts on nine unknown chapters
        run: node sims/lp2_p56_phi_ftransparent_5000start_sft.cjs
