name: Agent11 quote-word prime-product repeat sidecar SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run exact original-source inverse and positive control
        run: node sims/lp2_quote_word_primeproduct_repeat_sidecar_sft.cjs
