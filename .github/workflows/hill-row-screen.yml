name: Hill projective-row exhaustive scan
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Finite original-LP2 inverse family to test
        type: choice
        required: true
        default: standard
        options:
          - standard
          - quarter79
          - ea-anchor
          - red225
          - red225stream
          - fourier5
          - lag7triple
          - rankhill
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Screen all GP Hill decoder rows and positive controls
        if: inputs.experiment == 'standard'
        run: node sims/hill_row_screen.cjs
      - name: Screen four-quarter F29 and phase-79 nuisance pad
        if: inputs.experiment == 'quarter79'
        run: node sims/quarter79_linear_phase_invariant.cjs
      - name: Invert physically red-marked 225-rune 15x15 Hill key
        if: inputs.experiment == 'red225'
        run: node sims/red225_hill15_inverse.cjs
      - name: Decode with 225-red-rune evolving F29 15-state matrix
        if: inputs.experiment == 'red225stream'
        run: node sims/red225_matrix_stream_inverse.cjs
      - name: Set up Python for finite-field Fourier inverse
        if: inputs.experiment == 'fourier5' || inputs.experiment == 'rankhill'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Recover five-symbol Hill inverse rows from original LP2
        if: inputs.experiment == 'fourier5'
        run: |
          python -m pip install numpy scipy
          python sims/hill_fourier_blind_inverse.py
          python sims/sliding_five_linear_recurrence_fft.py
      - name: Exhaustive three-support seven-position affine-feedback inverse
        if: inputs.experiment == 'lag7triple'
        run: node sims/sparse_lag7_affine_triples.cjs
      - name: Invert rank28 anti-repeat layer then blind recover five-rune Hill keys
        if: inputs.experiment == 'rankhill'
        run: |
          python -m pip install numpy scipy
          python sims/no_repeat_rank_hill_fourier.py
      - name: Test exact reversible zero-step EA model and native source
        if: inputs.experiment == 'ea-anchor'
        run: node sims/ea_zero_step_reversible.cjs
