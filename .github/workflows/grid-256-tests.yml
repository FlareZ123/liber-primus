name: LP2 complete base60 grid extraction regression

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Choose full regression or one source-locked finite audit"
        required: false
        type: choice
        options:
          - full
          - state-class
          - jpeg05-p53
          - onion7-magic
          - hensel29
          - crossround
          - hensel-skip
          - jet
          - terminal
          - affine-byte
          - p36-crib
          - nine-section
          - byte-packet
          - redspan-zero
          - tree-tiling
          - tree-home
          - tree-direction
          - tree-continuous-degrees
          - tree-corner-ownership
          - tree-inclusive-cube
          - tree-inclusive-cube-null
          - tree-wordmap
          - signed2016-derivative
          - terminal-circumference
          - terminal-known-tail
          - terminal-shed-43
          - quartic-annihilator
          - byte-pointer
          - collision-quote
          - signed-message-map
          - stipple-241-331
          - source-dh-log
          - source-base29-literal
          - image-dim-page
          - microqr-finder
          - signed-trifold
          - tree-inner7
        default: full

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 11x11 tree-page inner7 to historical 7x7 magic-square decoder
        if: ${{ inputs.probe == 'tree-inner7' }}
        run: node sims/p32_inner7_historical_magic_inverse_sft.cjs

      - name: Three source-led FOLDs to 32 binary keys, original-GP29 AEAD gate
        if: ${{ inputs.probe == 'signed-trifold' }}
        run: node sims/signed2016_trifold_parity_aead_sft.cjs

      - name: All-secret original p32 Micro QR finder obstruction
        if: ${{ inputs.probe == 'microqr-finder' }}
        run: node sims/lp2_p32_microqr_allsecret_finder_sft.cjs

      - name: Source image GP29 page-edge and dimension-selected page-pair SFTs
        if: ${{ inputs.probe == 'image-dim-page' }}
        run: |
          node sims/lp2_2016_dimension_page_arc_sft.cjs
          node sims/2016_image_dimensions_mod58_pagepair_gate.cjs

      - name: Literal 2013 BASE29 quotient and 1033 polynomial control
        if: ${{ inputs.probe == 'source-base29-literal' }}
        run: node sims/base29_protocol_literal_quotient_sft.cjs

      - name: Source-locked 2013 DH / solved-prime-84 F29-square logarithm inverse
        if: ${{ inputs.probe == 'source-dh-log' }}
        run: |
          node sims/lp2_2013_p56_prime84_field_basis_sft.cjs
          node sims/lp2_2013_dh_prime_field_log_inverse_sft.cjs

      - name: Original p57 cicada-stipple 241/331 selector and 51x127 field-clock gate
        if: ${{ inputs.probe == 'stipple-241-331' }}
        run: node sims/lp2_stipple_241_331_field_clock_gate.cjs

      - name: Full authenticated 2016 signed-message base-58 word map
        if: ${{ inputs.probe == 'signed-message-map' }}
        run: |
          node sims/lp2_2016_message_base58_word_map.cjs
          node sims/gp29_193_signed_source_aead_sft.cjs

      - name: Test red-event collision/quote cross-track inversion
        if: ${{ inputs.probe == 'collision-quote' }}
        run: node sims/ink256_lcg_collision_quote_bridge_sft.cjs

      - name: Verify 256-token payload, token cases and SHA-256
        if: ${{ inputs.probe == 'full' || inputs.probe == '' }}
        run: |
          node sims/test_lp2_grid.cjs
          node sims/red_run_grid_affine_membership.cjs
          node sims/grid_radix59_rc4_inverse.cjs
          node sims/grid_shamir_rs_inverse.cjs
          node sims/onion256_shamir_cross_source_gate.cjs
          node sims/grid_coordinate_free_share_rank.cjs
          node sims/onion256_fourshare_ascii_rank.cjs
          node sims/onion256_magic_share_inverse.cjs
          node sims/grid_anend_hash_bridge.cjs
          node sims/grid_fibonacci_macro_key.cjs
          node sims/fibonacci_square_grid_unwrap.cjs
          node sims/circumference_corner_key_inverse.cjs
          node sims/red16_grid_epoch_aes128_inverse.cjs
          node sims/grid_byte_split_nonlinearity_sft.cjs
          node sims/lp2_grid_rank_state_original_inverse.cjs
          node sims/lp2_grid_eight_section_digest_gate.cjs
          node sims/grid_red53_euclid_quotient_gate.cjs
          node sims/grid_two_channel_serial_order_sft.cjs
          node sims/grid_boolean_mobius_gp28_inverse_sft.cjs
          node sims/grid_missing_f_prime179_sft.cjs
      - name: Cross-artifact p55/p57 shed-circumferences 43-rune source gate
        if: ${{ inputs.probe == 'terminal-shed-43' }}
        run: node sims/lp2_p55_shed_circumference_43_source_gate.cjs

      - name: All-secret stationary byte/rune mapping on independently solved terminal pages
        if: ${{ inputs.probe == 'terminal-known-tail' }}
        run: node sims/terminal_grid_known_tail_lookup_gate.cjs

      - name: Original source terminal table border and solved-page known-plaintext gate
        if: ${{ inputs.probe == 'terminal-circumference' }}
        run: node sims/lp2_terminal_grid_border_ring_sft.cjs

      - name: Source-red quartic all-secret word-local LFSR annihilator
        if: ${{ inputs.probe == 'quartic-annihilator' }}
        run: node sims/red_triad_quartic_annihilator_sft.cjs

      - name: Original 256-byte grid self-pointer 11-cycle and source-jet joint test
        if: ${{ inputs.probe == 'byte-pointer' }}
        run: node sims/lp2_grid_byte_pointer_11cycle_sft.cjs

      - name: Original tree-page sentence-aligned HOME source and Vigenere gate
        if: ${{ inputs.probe == 'tree-home' }}
        run: node sims/tree121_sentence_home_source_gate.cjs

      - name: Original signed-image source-prime 11x11 tiling test
        if: ${{ inputs.probe == 'tree-tiling' }}
        run: |
          python3 -m pip install --quiet Pillow
          python3 sims/tree121_image_tiling_gate.py

      - name: P32 signed-2016 word-prime navigation and conditional original-source gate
        if: ${{ inputs.probe == 'tree-wordmap' }}
        run: node sims/p32_2016_signed_wordmap_sft.cjs

      - name: Original 2016 prime image and GF29 grid derivative source bridge
        if: ${{ inputs.probe == 'signed2016-derivative' }}
        run: node sims/2016_prime_area_gf29_derivative_gate.cjs

      - name: Source-locked p32 GP-prime direction field against 2016 oak-tree branches
        if: ${{ inputs.probe == 'tree-direction' }}
        run: |
          python3 -m pip install --quiet Pillow
          python3 sims/tree121_directional_field_sft.py

      - name: Original signed tree continuous GP-prime degree-bearing test
        if: ${{ inputs.probe == 'tree-continuous-degrees' }}
        run: |
          python3 -m pip install --quiet Pillow
          python3 sims/tree121_continuous_direction_sft.py

      - name: Original p32 ring projective corner-ownership finite gate
        if: ${{ inputs.probe == 'tree-corner-ownership' }}
        run: node sims/tree121_mobius_corner_conventions_sft.cjs

      - name: LP1 paired squares to original p32 inclusive Möbius cube and exact GP28 inverse
        if: ${{ inputs.probe == 'tree-inclusive-cube' }}
        run: node sims/tree121_inclusive_mobius_lp1_cube_inverse_sft.cjs

      - name: Original p32 inclusive Möbius cube conditional source null
        if: ${{ inputs.probe == 'tree-inclusive-cube-null' }}
        run: node sims/tree121_inclusive_mobius_cube_null_sft.cjs

      - name: Red GP prime-sum page-conditioned circular-control audit
        if: ${{ inputs.probe == 'redspan-zero' }}
        run: node sims/red_span_gp29_zero_test.cjs

      - name: Nine-section dual-quadratic source-register original test
        if: ${{ inputs.probe == 'nine-section' }}
        run: |
          node sims/grid_double_quadratic_nine_section_sft.cjs
          node sims/base29_2013_252phase_allsecret_register_sft.cjs
      - name: All-secret five base28 ranks to three bytes input obstruction
        if: ${{ inputs.probe == 'byte-packet' }}
        run: node sims/lp2_base28_five_to_three_allsecret_sft.cjs
      - name: Source-locked state/class capacity and Base32 padding audit
        if: ${{ inputs.probe == 'state-class' }}
        run: node sims/state_class_nongp_register_audit.cjs
      - name: LP1 hidden 179-byte key transfer to LP2 physical page 53
        if: ${{ inputs.probe == 'jpeg05-p53' }}
        run: node sims/jpeg05_hidden179_p53_direct_key_sft.cjs

      - name: Seventh onion center, digit reversal, and original source-prime gate
        if: ${{ inputs.probe == 'onion7-magic' }}
        run: |
          node sims/onion7_magic_center_reversal_sft.cjs
          node sims/onion7_reverse_square_hill7_sft.cjs
          node sims/onion7_parable19_nestedprime_sft.cjs

      - name: Original-grid 29-adic marked-root inverse
        if: ${{ inputs.probe == 'hensel29' }}
        run: |
          node sims/lp2_grid_hensel29_inverse_sft.cjs
          node sims/lp2_grid_marked_newton_sft.cjs

      - name: Original marked-root skip-aware repeat-filter inverse
        if: ${{ inputs.probe == 'hensel-skip' }}
        run: node sims/lp2_grid_hensel29_skipbeam_sft.cjs
      - name: P39 value-derivative jet autonomous-state original gate
        if: ${{ inputs.probe == 'jet' }}
        run: |
          node sims/p39_grid_jet_autonomous_state_sft.cjs
          node sims/p39_newton_field_clock_original_sft.cjs

      - name: 238-factor page36 additive-key small-factor recurrence crib
        if: ${{ inputs.probe == 'p36-crib' }}
        run: node sims/grid238_p36_knownplain_factor_recurrence_sft.cjs

      - name: Source-selected GF841 all-secret 127-terminal-symbol register gate
        if: ${{ inputs.probe == 'terminal' }}
        run: node sims/red_triad_terminal_linear_state_allsecret_sft.cjs

      - name: All-secret source-quotient affine byte capacity gate
        if: ${{ inputs.probe == 'affine-byte' }}
        run: node sims/grid_quotient_allsecret_affine_byte_gate.cjs

      - name: Archived 2014 onion-2 and original LP2 grid direct bridge
        if: ${{ inputs.probe == 'crossround' }}
        run: node sims/onion2_grid256_crossround_sft.cjs
