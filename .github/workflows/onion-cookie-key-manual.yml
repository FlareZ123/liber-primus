name: LP2 historical onion-cookie key test

on:
  workflow_dispatch:

jobs:
  cookie-key-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute fixed 2013 historical keys and planted control
        run: node sims/onion_cookie_key_probe.cjs
      - name: Run source-key inverse with ciphertext collision rejects
        run: node sims/onion_cookie_keyskip_inverse.cjs
