name: LP2 historical-source key inverse

on:
  workflow_dispatch:
    inputs:
      source:
        description: Historical cryptographic key source
        required: true
        type: choice
        default: cookie
        options:
          - cookie
          - rsa2014
          - modular-square
          - rank28-parity
          - rank28-secret-parity
          - rank28-secret-parity-pilot
          - rank28-secret-parity-exact
          - rank28-primekey-sigma-pilot
          - rank28-primekey-sigma-full
          - rank28-primekey-signed-global-pilot
          - rank28-primekey-signed-global-full
          - rsa432-block

jobs:
  original-cipher-source-inverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test 2013 onion-cookie source keys
        if: ${{ inputs.source == 'cookie' }}
        run: node sims/onion_cookie_key_probe.cjs
      - name: Run exact 2013 cookie keyskip inverse
        if: ${{ inputs.source == 'cookie' }}
        run: node sims/onion_cookie_keyskip_inverse.cjs
      - name: Run exact 2014 RSA-source keyskip inverse
        if: ${{ inputs.source == 'rsa2014' }}
        run: node sims/rsa2014_factored_key_inverse.cjs
      - name: Run historical RSA modular-squaring original inverse
        if: ${{ inputs.source == 'modular-square' }}
        run: node sims/rsa2014_modular_square_inverse.cjs
      - name: Test source-independent prime totient 28-rank parity
        if: ${{ inputs.source == 'rank28-parity' }}
        run: node sims/prime_totient_rank28_parity_invariant.cjs
      - name: Test every-source-mask search for secret-alphabet totient rank28 with source-native inverse controls
        if: ${{ inputs.source == 'rank28-secret-parity' }}
        run: node sims/prime_totient_secret_parity_wordfit.cjs 90 1000
      - name: Check exact secret GP mask iterator on first 100000 masks
        if: ${{ inputs.source == 'rank28-secret-parity-pilot' }}
        run: node sims/prime_totient_secret_parity_exact.cjs 100000
      - name: Exhaust all 40116600 secret GP parity masks
        if: ${{ inputs.source == 'rank28-secret-parity-exact' }}
        run: node sims/prime_totient_secret_parity_exact.cjs
      - name: Recover blinded prime starts on authentic source-shaped GP controls and test real LP2 pilot
        if: ${{ inputs.source == 'rank28-primekey-sigma-pilot' }}
        run: node sims/prime_totient_rank28_unknown_sigma_keysearch.cjs 50000
      - name: Search 2000000 prime starts under every fixed hidden alphabet and four 28-rank models
        if: ${{ inputs.source == 'rank28-primekey-sigma-full' }}
        run: node sims/prime_totient_rank28_unknown_sigma_keysearch.cjs 2000000
      - name: Pilot signed prime key starts and global source clocks for all hidden-alphabet rank28 modes
        if: ${{ inputs.source == 'rank28-primekey-signed-global-pilot' }}
        run: node sims/prime_totient_rank28_global_phase_sigma.cjs 50000
      - name: Search all two-million prime starts with both signs and global clocks
        if: ${{ inputs.source == 'rank28-primekey-signed-global-full' }}
        run: node sims/prime_totient_rank28_global_phase_sigma.cjs 2000000
      - name: Prove all-phase original RSA432 rank28 block contradiction
        if: ${{ inputs.source == 'rsa432-block' }}
        run: node sims/rsa432_rank28_block_impossibility.cjs
