name: LP2 exact marginal scaled-pair check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-marginal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Forward-sum scaled pair and exact brute-force regression
        run: node sims/relative_key_exact_marginal.cjs
