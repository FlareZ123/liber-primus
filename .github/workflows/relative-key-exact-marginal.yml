name: LP2 exact marginal scaled-pair check
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Exact independent-register model to run
        required: true
        type: choice
        default: latin-bigram
        options:
          - latin-bigram
          - original-trigram
          - continuous-trigram
permissions:
  contents: read
jobs:
  exact-marginal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Existing forward-summed English trigram and brute-force regression
        if: ${{ inputs.variant == 'original-trigram' }}
        run: node sims/relative_key_exact_marginal.cjs
      - name: Independent Vulgate-Latin exact bigram marginal and constructive two-stream inverse
        if: ${{ inputs.variant == 'latin-bigram' }}
        run: node sims/relative_key_latin_exact_bigram.cjs
      - name: Continuous unspaced shared-key forward-sum (all shifts and true-key plant)
        if: ${{ inputs.variant == 'continuous-trigram' }}
        run: node sims/relative_key_continuous_marginal.cjs
