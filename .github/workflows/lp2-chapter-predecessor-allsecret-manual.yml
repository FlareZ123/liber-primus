name: LP2 chapter predecessor GP29 all-secret capacity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original and native-plant all-secret gate
        run: node sims/lp2_chapter_predecessor_allsecret_capacity_sft.cjs
      - name: Original all-secret GP29 direct-plaintext majorization bound
        run: node sims/lp2_firstorder_gp29_capacity_sft.cjs
