name: Agent5 historical MIDI tick and c.mp3 periodic audio keys (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent5-audio-historical-note-clock
  cancel-in-progress: false

jobs:
  midi-locked-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source audio and atomic result dependencies
        run: python -m pip install --disable-pip-version-check "librosa==0.11.0" "mido==1.3.3" "numpy==2.2.6" "scipy==1.16.2" "imageio-ffmpeg==0.6.0" "filelock==3.20.0"
      - name: Validate source programs and native Rust compiler
        run: |
          python -m py_compile sims/lp2_cicada_audio_note_2012_source_sft.py
          python -m py_compile sims/lp2_cicada_audio_note_r4_source_sft.py
          python -m py_compile sims/lp2_cicada_audio_historical_timing_and_short_period_sft.py
          rustc --version
      - name: Execute source-locked MIDI note-plus-timing and periodic short clip hypothesis
        run: python -u sims/lp2_cicada_audio_historical_timing_and_short_period_sft.py
      - name: Preserve source hashes, wrong-track controls and all original LP2 scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-historical-midi-clock-source-results
          path: lp2-audio-note-historical-ticks-results.json
          if-no-files-found: warn
          retention-days: 30
