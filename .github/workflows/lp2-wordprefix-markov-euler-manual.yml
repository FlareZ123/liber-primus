name: LP2 exact-bigram word-prefix leakage null

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen CMU pronunciation dictionary
        run: python -m pip install cmudict==1.1.3
      - name: Exact first-order LP2 source surrogate and positive plant
        run: python sims/lp2_wordstart_markov_euler_sft.py
