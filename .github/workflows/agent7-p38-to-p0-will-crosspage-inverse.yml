    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run p38 to p0 WILL cross-page inverse
        shell: cmd
        run: node sims\lp2_p38_to_p0_will_crosspage_inverse_sft.cjs
