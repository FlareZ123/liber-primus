name: Agent32 extract signed Interconnectedness JPEG payloads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract JPEGs from signed MP3 payload
        run: node sims/agent32_extract_interconnectedness_jpegs.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: interconnectedness-jpegs
          path: artifacts/interconnectedness-jpegs/
          if-no-files-found: error
