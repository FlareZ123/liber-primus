name: Agent13 original LP2 prime-totient secret-alphabet gate

on:
  workflow_dispatch:

jobs:
  source-exact-prime-key:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original secret-state invariant
        run: |
          node --check sims/lp2_prime_totient_allsecret_state_permutation_sft.cjs
          node sims/lp2_prime_totient_allsecret_state_permutation_sft.cjs
      - name: Verify original secret-key recovery and native planted controls
        run: |
          node --check sims/lp2_prime_totient_secret_alphabet_assignment_sft.cjs
          node sims/lp2_prime_totient_secret_alphabet_assignment_sft.cjs
      - name: Verify original GP28 predecessor excluding cipher with all secret alphabets
        run: |
          node --check sims/lp2_prime_totient_rank28_allsecret_state_sft.cjs
          node sims/lp2_prime_totient_rank28_allsecret_state_sft.cjs
