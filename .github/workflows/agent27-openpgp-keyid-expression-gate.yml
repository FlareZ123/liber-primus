name: Agent27 OpenPGP key-ID expression family gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Charge key-ID state-expression family
        shell: pwsh
        run: node sims/lp2_openpgp_keyid_expression_family_gate_sft.cjs
