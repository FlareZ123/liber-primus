name: Page-shift synchrony
on:
  workflow_dispatch:
jobs:
  shift-synchrony:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/page_shift_synchrony.cjs
