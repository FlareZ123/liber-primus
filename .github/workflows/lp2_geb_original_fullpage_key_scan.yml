name: LP2 historical GEB running-key original-page scan
on:
  push:
    paths:
      - 'sims/lp2_geb_original_runningkey_fullpage_sft.cjs'
  workflow_dispatch:
jobs:
  original_input:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original LP2 p0 against historical GEB key text
        shell: pwsh
        run: node sims/lp2_geb_original_runningkey_fullpage_sft.cjs
