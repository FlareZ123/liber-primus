name: Agent14 source-word-prime 32x8 original SFT (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run prior-word GP-prime indexed original inverse and plants
        run: node sims/lp2_grid_prevwordprime_length_sft.cjs
