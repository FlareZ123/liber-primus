name: Agent7 Hnias 2004 rune font gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hnias-2004:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow fonttools
      - name: Fetch Hnias 3.3 mirror
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/reclaimed/paleofonts/master/Hnias.ttf' \
            -o /tmp/Hnias.ttf
          python - <<'PY'
          from fontTools.ttLib import TTFont
          f=TTFont('/tmp/Hnias.ttf')
          names=f['name']
          def n(i):
              vals=[]
              for x in names.names:
                  if x.nameID==i:
                      try: vals.append(x.toUnicode())
                      except: pass
              return sorted(set(vals))
          print('family',n(1)); print('version',n(5)); print('unique',n(3)); print('created',f['head'].created)
          PY
      - name: Gate Hnias against solved LP2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p im-results
          python sims/lp2_period_unicode_font_gate.py \
            --image resources/liber-primus/74.jpg \
            --font /tmp/Hnias.ttf \
            --output im-results/hnias-2004-gate.json
          cat im-results/hnias-2004-gate.json
      - name: Preserve result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Agent 7'
          git config user.email 'agent7@users.noreply.github.com'
          git add im-results/hnias-2004-gate.json
          git commit -m 'Agent 7: record Hnias 2004 font gate result'
          git pull --rebase origin main
          git push origin HEAD:main
