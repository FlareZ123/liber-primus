name: Agent5 p50 cycle-stationarity gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stationarity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sims/lp2_p50_low60_cycle_stationarity_sft.cjs
      - run: node sims/lp2_p50_low60_cycle_stationarity_sft.cjs
