name: Agent4 P33 Prime-Totient Hidden Text

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p33-hidden-text:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p33 solved-control serialization regression
        shell: pwsh
        run: node sims/lp2_p33_totient_hidden_text_sft.cjs
