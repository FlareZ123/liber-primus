name: Agent 4 word-clock GP29 original inverse SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original LP2 and planted solved p57
        run: node sims/lp2_wordlength_twohistory_original_sft.cjs
      - name: Exact all-secret per-word offset, original source and planted controls
        run: node sims/lp2_twohistory_allsecret_wordshift_sft.cjs
