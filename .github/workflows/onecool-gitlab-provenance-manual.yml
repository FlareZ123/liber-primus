name: onecool GitLab provenance manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public GitLab provenance
        run: node sims/lp2_onecool_gitlab_provenance_sft.cjs
