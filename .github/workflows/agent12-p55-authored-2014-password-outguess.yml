name: Agent 12 original LP2 p55 2014-authored 33011033 OutGuess gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-single-password:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Prepare original historical JPEG coefficient reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjpeg-dev
          mkdir -p evidence
      - name: Verify authentic 2014 LP1 OutGuess retrieval with original source bytes
        run: |
          python sims/outguess_extract.py resources/liber-primus/03.jpg "Default key" --output evidence/historical-03-control.pgp | tee evidence/historical-03-control.json
          python -c "from pathlib import Path; p=Path('evidence/historical-03-control.pgp'); assert p.stat().st_size == 31809 and p.read_bytes().startswith(b'-----BEGIN PGP SIGNED MESSAGE-----'); print('AUTHENTIC_LP1_HISTORICAL_OUTGUESS_CONTROL_PASS')"
      - name: Attempt one original p55 JPEG with exact historical 33011033 password
        id: unknown-original
        continue-on-error: true
        run: |
          python sims/outguess_extract.py resources/liber-primus/72.jpg "33011033" --output evidence/p55-33011033.bin | tee evidence/p55-33011033-metadata.json
      - name: Preserve binary finding or source-correct failure, with no password search
        if: always()
        run: |
          python -c "from pathlib import Path; p=Path('evidence/p55-33011033.bin'); print('UNKNOWN_ORIGINAL_PAYLOAD_PRESENT',p.is_file()); print('UNKNOWN_ORIGINAL_PAYLOAD_LENGTH',p.stat().st_size if p.is_file() else 0)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent12-p55-33011033-single-source-original-outguess
          path: evidence/
          retention-days: 90
