name: LP2 rotor phase recovery (manual)
on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover six-lane phase key on genuine and held-out planted streams
        run: node sims/orbit_phase_vote_recovery.cjs
      - name: Check rotor fixed-point English-position invariant
        run: node sims/lag6_rotor_consistency.cjs
      - name: Check literal rune passthrough on all rune associations
        run: node sims/rune_passthrough_word_position.cjs
      - name: Test arbitrary delayed public-state row keys against native GP plaintext
        run: node sims/delayed_motif_row_invariant.cjs
