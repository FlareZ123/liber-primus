name: Agent9 source-keyword word-rotation autokey gate
on:
  workflow_dispatch:

jobs:
  original-keyword-inverse:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source-original word-rotation inverse and planted controls
        run: node sims/lp2_keyword_autokey_wordrotation_sft.cjs
