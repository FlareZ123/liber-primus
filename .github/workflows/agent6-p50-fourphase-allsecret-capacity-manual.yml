name: Agent6 p50 two-shed four-phase all-secret capacity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-native-capacity:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact GP29 four-phase all-bijection bounds and native controls
        shell: pwsh
        run: node sims/lp2_p50_twoshed_fourphase_allsecret_capacity_sft.cjs
