name: LP2 pooled grid-column cipher inversion (manual)
on:
  workflow_dispatch:
jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eight-section unknown-alphabet and key-skip inference
        run: node sims/global_grid_sigma_em.cjs
