name: LP2 Section 8 period-14 exact F-hold bound
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q14:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lo: 0, hi: 6 }
          - { lo: 7, hi: 13 }
          - { lo: 14, hi: 20 }
          - { lo: 21, hi: 28 }
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile exact F-hold solver
        run: g++ -std=c++17 -O3 -pthread -o "$RUNNER_TEMP/q14" sims/lp2_section8_q9plus_fhold_bitset.cpp
      - name: Run disjoint root-key shard
        run: node sims/lp2_section8_q14_fhold_sft.cjs "$RUNNER_TEMP/q14" "${{ matrix.lo }}" "${{ matrix.hi }}" 600 "$RUNNER_TEMP/q14.json"
      - name: Upload exact shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section8-q14-${{ matrix.lo }}-${{ matrix.hi }}
          path: ${{ runner.temp }}/q14.json
          if-no-files-found: ignore
          retention-days: 7
