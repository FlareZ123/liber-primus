name: Agent14 GP28 phi-prime original-input SFT (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact GP28 phi-prime + F-skip original gate
        run: node sims/lp2_gp28_phi_skipf_direct_sft.cjs
