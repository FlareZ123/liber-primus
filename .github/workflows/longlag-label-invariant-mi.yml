name: LP2 long-lag label-invariant dependence
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test repeat-lag mutual information under unknown alphabets
        run: node sims/longlag_label_invariant_mi.cjs
