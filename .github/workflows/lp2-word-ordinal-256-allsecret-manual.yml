name: LP2 word-ordinal 256-phase all-secret source gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  word-ordinal-allsecret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original GP29 word-clock phase 256 and native-language plants
        run: node sims/lp2_word_ordinal_256_allsecret_sft.cjs
