name: Agent9 Floral49 Original SFT (manual one-shot)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original-source 49-word square and all-secret word-invariant gate
        run: node sims/lp2_floral49_magic_square_word_spiral_sft.cjs
