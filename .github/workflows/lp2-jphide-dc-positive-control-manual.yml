name: LP2 JPHide DC positive-control calibration
on:
  workflow_dispatch:
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install JPEG build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libjpeg-dev
      - name: Run matched JPHide and historical fixture controls
        run: python3 sims/lp2_jphide_dc_positive_control_sft.py
      - name: Preserve machine-readable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-jphide-dc-positive-control
          path: |
            sims/lp2_jphide_dc_metric.c
