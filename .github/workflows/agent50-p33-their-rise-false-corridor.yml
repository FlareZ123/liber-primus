name: Agent50 P33 Their-Rise False Corridor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p33-their-rise:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p33 THEIR RISE corridor regression
        shell: pwsh
        run: node sims/lp2_p33_their_rise_false_corridor_sft.cjs
