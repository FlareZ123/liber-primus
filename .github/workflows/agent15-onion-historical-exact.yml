name: Agent15 exact historical onion-host audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
      - uses: actions/checkout@v4
        with:
          ref: e3698631fdee3884bffbfbee20e7a651bd5698b4
          path: pre-candidate
      - uses: actions/checkout@v4
        with:
          repository: cicada-solvers/neuroretransmit-cicada
          ref: ade9a02889ef8acbc8cde8edbfd0a785c369f4c3
          path: external-cicada
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Search exact frozen host
        run: node runner/sims/lp2_candidate_onion_historical_exact_sft.cjs pre-candidate external-cicada
