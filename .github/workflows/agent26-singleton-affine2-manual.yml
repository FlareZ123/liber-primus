name: Agent26 original affine2 singleton all-secret gate
on:
  workflow_dispatch:
jobs:
  original-and-plant:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original 29^5 family and independent native positive
        run: node sims/lp2_singleton_affine2_allsecret_sft.cjs
