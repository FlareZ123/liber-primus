name: Agent35 p6-p32 DH23 key-skip SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run source-constrained SFT
        run: node sims/lp2_p6_p32_dh23_keyskip_sft.cjs
