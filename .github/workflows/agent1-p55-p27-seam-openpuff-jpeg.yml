name: Agent1 source-linked DJUBEI/AEF original-JPEG OpenPuff gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-original-two-carriers:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scan: [44, 72]
        level: [medium, maximum]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Check the source-selected password and original bridge
        shell: pwsh
        run: |
          node sims/lp2_p55_p27_seam_openpuff_password_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Original LP2 candidate derivation failed' }
      - name: Install and pin native 2014 OpenPuff 4.00
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native capture regression failed' }
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-Agent1-Bridge'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original tool pin mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Recover published independent JPEG positive with the same native tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Pinned public JPEG source unavailable' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format 'Jpeg (Image)' --bit-level '1/2 (50%) - Maximum' --out probe-output/public-recovery --wait-seconds 70
          if ($LASTEXITCODE -ne 0) { throw 'Original JPEG known-positive extraction failed to execute' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file() and p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('NATIVE_POSITIVE_35_BYTES_RECOVERED')"
          if ($LASTEXITCODE -ne 0) { throw 'Independent published payload mismatch' }
      - name: Test original JPEG at frozen A-only 8-rune bridge candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scan = [int]'${{ matrix.scan }}'
          $choice = '${{ matrix.level }}'
          if ($scan -notin @(44,72)) { throw 'Unselected original scan' }
          $level = if ($choice -eq 'maximum') { '1/2 (50%) - Maximum' } else { '1/5 (20%) - Medium' }
          $carrier = Join-Path $env:GITHUB_WORKSPACE ('resources/liber-primus/{0:D2}.jpg' -f $scan)
          if (-not (Test-Path -LiteralPath $carrier)) { throw 'Selected original JPEG missing' }
          $out = 'probe-output/bridge-' + ('{0:D2}' -f $scan) + '-' + $choice
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$carrier" --password DJUBEIAEF --bit-format 'Jpeg (Image)' --bit-level $level --out "$out" --wait-seconds 150
          if ($LASTEXITCODE -ne 0) { throw 'Native original JPEG test did not execute' }
          $r = Get-Content -LiteralPath "$out/result.json" -Raw | ConvertFrom-Json
          if ($r.carrier_count -ne 1 -or -not $r.carrier_added -or -not $r.bit_selection_verified -or -not $r.attempted) {
            throw 'Native program did not verify source carrier, bit selection and execution'
          }
          if ($r.native_probe_outcome -eq 'inconclusive-timeout') { throw 'Native original-target probe timed out' }
          Write-Host "BRIDGE_ORIGINAL_RESULT $($r | Select-Object carrier_count,native_probe_outcome,output_present,outputs,selected_capacity_bytes_after_level,completion_dialogs,error_dialogs | ConvertTo-Json -Compress -Depth 12)"
          if ($r.output_present) { Write-Host 'POTENTIAL_ORIGINAL_LP2_STEGANOGRAPHIC_PAYLOAD' }
      - name: Preserve evidence and any actual extracted bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-djubeiaef-${{ matrix.scan }}-${{ matrix.level }}
          path: probe-output/
          if-no-files-found: warn
