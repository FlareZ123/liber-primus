name: Agent43 Large Punctuation Source Index

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  punctuation-index:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run large-punctuation source-index regression
        shell: pwsh
        run: node sims/lp2_large_punctuation_source_index_sft.cjs
