name: Parable 449 modulo seventh-onion metadata source check
on:
  workflow_dispatch:
jobs:
  original-historical-relation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source-native GP prime sums and original HTML values
        run: node sims/parable_449_onion7_header_modulo_sft.cjs
      - name: Verify cellwise 2013 NUMBER factor map and 41x316 candidate
        run: node sims/onion7_parable19_nestedprime_sft.cjs
