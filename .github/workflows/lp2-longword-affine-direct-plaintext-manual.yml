name: LP2 Native Long Word Affine Recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-plaintext:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Direct 8-14 rune word plaintext search under all 812 GP29 affine maps
        run: |
          node --check sims/lp2_original_longword_affine_dictionary_recovery_sft.cjs
          node sims/lp2_original_longword_affine_dictionary_recovery_sft.cjs
