name: LP2 Original Linewrap and Dropcap Geometry

on:
  push:
    paths:
      - .github/workflows/agent42-original-linewrap-sfts.yml
      - sims/lp2_original_linewrap_greedy_geometry_sft.cjs
      - sims/lp2_original_linewrap_dropcap_geometry_sft.cjs
      - sims/line_start_raster_width_control.cjs
      - resources/liber-primus/lp2-corpus.json
      - resources/liber-primus/lp2-transcription.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-breaks:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact native GP29 original greedy compositor
        shell: pwsh
        run: node sims/lp2_original_linewrap_greedy_geometry_sft.cjs
      - name: Original 2014 JPEG dropcap footprint holdout
        shell: pwsh
        run: node sims/lp2_original_linewrap_dropcap_geometry_sft.cjs
