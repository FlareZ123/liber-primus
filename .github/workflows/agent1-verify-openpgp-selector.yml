name: Agent1 VERIFY Numbered OpenPGP Selector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-openpgp:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run VERIFY numbered OpenPGP selector SFT
        shell: pwsh
        run: node sims/lp2_verify_numbered_openpgp_selector_sft.cjs
