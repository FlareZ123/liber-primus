name: H5 flat-library campaign

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h5-block:
    name: H5 offsets ${{ matrix.start }}..${{ matrix.end }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 0
            end: 400
            id: 1
          - start: 400
            end: 800
            id: 2
          - start: 800
            end: 1200
            id: 3
          - start: 1200
            end: 1600
            id: 4
          - start: 1600
            end: 2000
            id: 5
    steps:
      - name: Checkout research repo
        uses: actions/checkout@v4

      - name: Checkout pinned H5 implementation
        uses: actions/checkout@v4
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external/cicada

      - name: Build H5 library and windows
        working-directory: external/cicada
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check numpy mpmath
          python3 work/kscreen/export.py
          python3 work/h5rs/gen_windows.py
          test -s work/kscreen/data/library_flat.ksb
          test -s work/h5rs/data/lp2_windows.txt
          python3 - <<'PY'
          import struct
          p="work/kscreen/data/library_flat.ksb"
          b=open(p,"rb").read()
          assert b[:4]==b"KSB1"
          n=struct.unpack_from("<I",b,4)[0]
          assert n==581, n
          print("library_flat.ksb streams:", n)
          PY

      - name: Build H5 Rust engine
        working-directory: external/cicada/work/h5rs
        run: cargo build --release

      - name: Run H5 block
        working-directory: external/cicada
        shell: bash
        env:
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          BLOCK: ${{ matrix.id }}
        run: |
          mkdir -p campaign
          THREADS="$(nproc)"
          ./work/h5rs/target/release/h5rs sweep \
            work/h5rs/data/lp2_windows.txt \
            file:work/kscreen/data/library_flat.ksb \
            "$START" "$END" 2 20 2 "$THREADS" \
            "campaign/h5rs_flat_block${BLOCK}.tsv" \
            --hits 1.5 --chunk 10 --progress 1 --best \
            2>&1 | tee "campaign/h5rs_flat_block${BLOCK}.log"
          test -s "campaign/h5rs_flat_block${BLOCK}.tsv"

      - name: Upload H5 block
        uses: actions/upload-artifact@v4
        with:
          name: h5-flat-block-${{ matrix.id }}
          path: external/cicada/campaign/h5rs_flat_block${{ matrix.id }}.*

  h5-null:
    name: Matched null control
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research repo
        uses: actions/checkout@v4

      - name: Checkout pinned H5 implementation
        uses: actions/checkout@v4
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external/cicada

      - name: Build H5 library and controls
        working-directory: external/cicada
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check numpy mpmath
          python3 work/kscreen/export.py
          python3 work/h5rs/gen_windows.py
          python3 work/h5rs/gen_nulls.py
          cargo --version
          cd work/h5rs
          cargo build --release

      - name: Run matched null
        working-directory: external/cicada
        shell: bash
        run: |
          mkdir -p campaign
          THREADS="$(nproc)"
          ./work/h5rs/target/release/h5rs sweep \
            work/h5rs/data/lp2_windows.txt \
            file:work/h5rs/data/null8.ksb \
            0 2000 2 20 2 "$THREADS" \
            campaign/h5rs_flat_null.tsv \
            --hits 0 --chunk 10 --progress 1 --best \
            2>&1 | tee campaign/h5rs_flat_null.log
          test -s campaign/h5rs_flat_null.tsv

      - name: Upload matched null
        uses: actions/upload-artifact@v4
        with:
          name: h5-flat-null
          path: external/cicada/campaign/h5rs_flat_null.*

  merge:
    name: Merge and score campaign
    needs: [h5-block, h5-null]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research repo
        uses: actions/checkout@v4

      - name: Checkout pinned H5 implementation
        uses: actions/checkout@v4
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external/cicada

      - name: Download campaign artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: h5-flat-*
          path: campaign
          merge-multiple: true

      - name: Merge blocks
        working-directory: external/cicada
        shell: bash
        run: |
          mkdir -p campaign
          cp ../../campaign/h5rs_flat_block*.tsv campaign/
          python3 work/h5rs/merge_blocks.py \
            campaign/h5rs_flat_sweep.tsv \
            campaign/h5rs_flat_block1.tsv campaign/h5rs_flat_block2.tsv \
            campaign/h5rs_flat_block3.tsv campaign/h5rs_flat_block4.tsv \
            campaign/h5rs_flat_block5.tsv

      - name: Extract campaign maxima and candidates
        working-directory: external/cicada
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          real=Path("campaign/h5rs_flat_sweep.tsv")
          null=Path("../../campaign/h5rs_flat_null.tsv")
          best_real={}
          for line in real.read_text().splitlines():
              if line.startswith("best\\t"):
                  _,s,off,L,m,w,ioc=line.split("\\t")
                  key=(w,int(m))
                  best_real[key]=max(best_real.get(key,0.0),float(ioc))
          best_null={}
          for line in null.read_text().splitlines():
              if line.startswith("best\\t"):
                  _,s,off,L,m,w,ioc=line.split("\\t")
                  key=(w,int(m))
                  best_null[key]=max(best_null.get(key,0.0),float(ioc))
          rows=[]
          for line in real.read_text().splitlines():
              if not line or line.startswith("#") or line.startswith("best\\t"):
                  continue
              s,off,L,m,w,ioc=line.split("\\t")
              ioc=float(ioc)
              floor=max(1.6,best_null.get((w,int(m)),0.0)+0.15)
              if ioc>=floor:
                  rows.append((ioc,s,int(off),int(L),int(m),w,floor))
          rows.sort(reverse=True)
          out=Path("campaign/candidates.tsv")
          out.write_text("\n".join("\t".join(map(str,r)) for r in rows)+"\n")
          print("candidate rows:",len(rows))
          for r in rows[:100]:
              print(r)
          print("null floors:",sorted(best_null.items()))
          PY

      - name: Upload merged campaign
        uses: actions/upload-artifact@v4
        with:
          name: h5-flat-campaign-merged
          path: |
            external/cicada/campaign/h5rs_flat_sweep.tsv
            external/cicada/campaign/candidates.tsv
            ../../campaign/h5rs_flat_null.tsv
