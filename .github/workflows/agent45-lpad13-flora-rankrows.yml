name: Agent 45 LPAD rank-keyed floral original-source SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-cipher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert 20 reversible source-keyed variants and p57 positive plants
        run: node sims/lp2_lpad13_flora3315_rankedrows_original_sft.cjs
