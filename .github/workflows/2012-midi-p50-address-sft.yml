name: Source-gated 2012 MIDI to LP2 p50 address SFT

on:
  workflow_dispatch:

jobs:
  original-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check sims/2012_midi_49word_p50_address_sft.cjs
      - name: Complete 49-word map and deterministic controls
        run: node sims/2012_midi_49word_p50_address_sft.cjs
      - name: Fixed source-order Mersenne path and corrected conditional nulls
        run: |
          node --check sims/2012_midi_p50_mersenne_order_sft.cjs
          node sims/2012_midi_p50_mersenne_order_sft.cjs
