name: LP2 mirrored JPEG rejection key search
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jpeg-rejection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search byte-rejection pad across every key offset
        run: node sims/mirror_jpeg_rejection_offsets.cjs
