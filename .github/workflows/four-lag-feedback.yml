name: LP2 four-lag affine feedback
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-lag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependency
        run: python -m pip install numpy==2.3.5
      - name: Exhaust order-four feedback and controls
        run: python sims/four_lag_feedback.py
