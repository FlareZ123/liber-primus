name: LP2 original affine-feedback all-key tests
on:
  workflow_dispatch:
    inputs:
      family:
        description: 'Choose a distinct original-cipher family'
        required: true
        type: choice
        options:
          - five-tap-spectral
          - five-tap-all-ioc
          - five-tap-ninechapter
          - four-lag-legacy
        default: five-tap-spectral

permissions:
  contents: read

jobs:
  four-lag:
    if: ${{ inputs.family == 'four-lag-legacy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependency
        run: python -m pip install numpy==2.3.5
      - name: Exhaust order-four feedback and controls
        run: python sims/four_lag_feedback.py

  five-tap-spectral:
    if: ${{ inputs.family == 'five-tap-spectral' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact DFT dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: All 20,511,149 keys, heldout original and planted control
        run: python sims/lp2_fivetap_allsecret_spectral_original_sft.py

  five-tap-all-ioc:
    if: ${{ inputs.family == 'five-tap-all-ioc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact DFT dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: All 20,511,149 keys, unrestricted output-alphabet invariant
        run: python sims/lp2_fivetap_allsecret_ioc_original_sft.py

  five-tap-ninechapter:
    if: ${{ inputs.family == 'five-tap-ninechapter' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact FFT dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Independently keyed chapter inversion and source-native heldout
        run: python sims/lp2_fivetap_chapter_allkey_holdout_sft.py
