name: Agent25 original mark-local allsecret direct GP29 capacity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  allsecret:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test all-key GP29 capacity on original mark intervals
        shell: pwsh
        run: |
          node --check sims/lp2_markseg_direct_allsecret_27phase_capacity_sft.cjs
          node sims/lp2_markseg_direct_allsecret_27phase_capacity_sft.cjs
