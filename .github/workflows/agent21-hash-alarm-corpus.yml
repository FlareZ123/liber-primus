name: Agent21 full hash-alarm historical corpus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hash-alarm-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Clone exact public research inputs
        run: |
          git clone --depth 1 https://github.com/tweqx/3301-hash-alarm.git "$RUNNER_TEMP/hash-alarm"
          git clone --depth 1 https://github.com/kal1gh0st/OSINT.git "$RUNNER_TEMP/onionscan-2016"
          git clone --depth 1 https://github.com/mylamour/onion.scan.result.git "$RUNNER_TEMP/onionscan-2017"
      - name: Run full hash-alarm implementations on historical inputs
        run: |
          node sims/agent21_hash_alarm_corpus_sft.js \
            "$RUNNER_TEMP/hash-alarm" \
            "$RUNNER_TEMP/onionscan-2016/onionrunner/onion_result" \
            "$RUNNER_TEMP/onionscan-2017/onion_scan_results" \
            "$RUNNER_TEMP/onionscan-2017/onion_url_list.txt" \
            "$RUNNER_TEMP/agent21-hash-alarm-corpus-report.json"
      - name: Preserve exact scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent21-hash-alarm-corpus-report
          path: ${{ runner.temp }}/agent21-hash-alarm-corpus-report.json
          if-no-files-found: error
