name: Agent43 LP2 word-state minimum keycount
on:
  workflow_dispatch:

jobs:
  source-wordstate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Word-state bound and native language controls
        run: node sims/lp2_wordstate_minimum_keycount_sft.cjs
