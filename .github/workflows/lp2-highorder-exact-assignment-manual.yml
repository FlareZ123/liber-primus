name: LP2 exact ciphertext-context assignment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-assignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute original-input exact-assignment SFT
        run: node sims/lp2_highorder_cipher_context_entropy_sft.cjs
      - name: Execute original-input plaintext-history all-secret SFT
        run: node sims/lp2_plain_history_transducer_collision_sft.cjs
