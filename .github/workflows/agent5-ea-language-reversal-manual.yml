name: Agent 5 EA register source gate

on:
  workflow_dispatch:

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact original source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate original GP29 three-register feedback inverse
        run: node sims/lp2_ea_language_reversal_original_sft.cjs
