name: LP2 p15 exact 16-column word transposition
on:
  workflow_dispatch:
jobs:
  exact-word-dp:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce source and native controls
        run: node sims/lp2_p15_spiral_16column_word_dp_sft.cjs
