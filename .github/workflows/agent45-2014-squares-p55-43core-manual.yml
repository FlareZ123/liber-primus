name: Agent45 2014 squares to p55 original 43-core SFTs

on:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: All-permutation invariant and original-word-shape controls
        run: node sims/lp2_p55_inner43_square_permutation_invariant_sft.cjs
      - name: Original 2014 inner-square GF29 Hill inverses and native plants
        run: node sims/lp2_p55_2014_three_inner_squares_hill_sft.cjs
      - name: Seventeen original square rows on every p55 rune with native positive controls
        run: node sims/lp2_p55_2014_three_squares_17row_full76_sft.cjs
      - name: Source-prime holes in original 2014 squares against complete p55 76-rune input
        run: node sims/lp2_2014_primeholes_p55_99cell_sft.cjs
      - name: Key-independent p55 word9-to-word10 source-value prediction on original ciphertext
        run: node sims/lp2_2014_primeholes_p55_word9_10_keyfree_sft.cjs
      - name: All-secret 37 same-value pair invariant across 858983 original GP native windows
        run: node sims/lp2_2014_primeholes_p55_allsecret_equalvalue_sft.cjs
