name: Agent40 p22 seven-dot p23 five-dot source test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Execute source-native seven-dot and rotation gate
        run: python sims/lp2_p22_3plus4_p23_five_original_sft.py
