name: Agent20 original 2014 MP3-byte LP2 decryption candidate (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-byte-mp3-lp2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native planted invertibility and original corpus controls
        run: |
          node --check sims/lp2_2014_interconnectedness_bytekey_sft.cjs
          node sims/lp2_2014_interconnectedness_bytekey_sft.cjs --selftest
      - name: Byte-authenticate historical 2014 MP3 and invert complete original LP2
        run: node sims/lp2_2014_interconnectedness_bytekey_sft.cjs --network > mp3-2014-lp2-original-results.jsonl
      - name: Print complete experimental result
        run: cat mp3-2014-lp2-original-results.jsonl
      - name: Preserve original input reports and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent20-interconnectedness-original-bytepad
          path: mp3-2014-lp2-original-results.jsonl
          if-no-files-found: ignore
          retention-days: 30
