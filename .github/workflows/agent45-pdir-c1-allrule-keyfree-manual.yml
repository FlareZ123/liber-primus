name: Agent45 LP2 pdir c1 all-rule keyfree source gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pin external pdir implementation
        uses: actions/checkout@v4
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external-cicada3301
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate exact external section tables and kept direction rules
        shell: pwsh
        run: |
          python -m pip install numpy mpmath
          if ($LASTEXITCODE -ne 0) { throw "Python dependency failure" }
          python external-cicada3301/work/kscreen/export.py
          if ($LASTEXITCODE -ne 0) { throw "External export failed" }
          python external-cicada3301/work/kscreen/signrules.py
          if ($LASTEXITCODE -ne 0) { throw "Sign-rule generation failed" }
          python external-cicada3301/work/kscreen/dirrules.py
          if ($LASTEXITCODE -ne 0) { throw "Direction-rule generation failed" }
      - name: Assert local source identity
        run: python sims/lp2_pdir_issue1329_gate.py external-cicada3301
      - name: Run keyfree c1 all-rule source census
        shell: pwsh
        run: |
          python sims/lp2_pdir_c1_allrule_keyfree_source_sft.py external-cicada3301 | Tee-Object -FilePath pdir-c1-allrule-source.json
          if ($LASTEXITCODE -ne 0) { throw "c1 all-rule source census failed" }
      - name: Run section-exact A_prev_G native controls
        shell: pwsh
        run: |
          python sims/lp2_pdir_c1_sectionexact_aprevg_controls_sft.py external-cicada3301 | Tee-Object -FilePath pdir-c1-aprevg-controls.json
          if ($LASTEXITCODE -ne 0) { throw "section-exact A_prev_G calibration failed" }
      - name: Calibrate all positive c1 source-census vectors
        shell: pwsh
        run: |
          python sims/lp2_pdir_c1_sectionexact_survivor_controls_sft.py external-cicada3301 | Tee-Object -FilePath pdir-c1-survivor-controls.json
          if ($LASTEXITCODE -ne 0) { throw "c1 survivor calibration failed" }
      - name: Preserve exact source census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdir-c1-allrule-keyfree-source
          path: |
            pdir-c1-allrule-source.json
            pdir-c1-aprevg-controls.json
            pdir-c1-survivor-controls.json
          if-no-files-found: error
