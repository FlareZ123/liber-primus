name: Source-square matrix-state keystream challenge
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Source-square attack to execute'
        required: true
        type: choice
        default: baseline
        options:
          - baseline
          - source27

jobs:
  matrix-state:
    if: ${{ inputs.probe == 'baseline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original LP2 and planted page-reset inverse
        run: node sims/clue_square_matrix_stream.cjs
      - name: Recover original-source GP crib keys from hidden four-dimensional matrix state
        run: node sims/source_native_4d_matrix_crib_attack.cjs
      - name: Test red-16 Fibonacci spiral Hill key on original LP2 and positive source
        run: node sims/red16_spiral_hill_inverse.cjs
      - name: Solve red-16 spiral 4D source state from native EA cribs
        run: node sims/red16_spiral_4d_native_crib.cjs
      - name: Calibrate original-only unfitted red16 source-state word predictions
        run: node sims/red16_spiral_4d_native_crib_calibration.cjs

  bookend-81square-source-invariant:
    if: ${{ inputs.probe == 'baseline' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical library
        run: python -m pip install --disable-pip-version-check numpy
      - name: Test 81x81 bookend and 80x80 missing-five original GP source invariants
        run: python sims/lp2_81square_bookend_fourier.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Invert Fibonacci bilinear 81x81 and 80x80 source-key squares
        run: node sims/fibonacci_bilinear_square_inverse.cjs
      - name: Test all-secret period-16 per-column square permutation invariant
        run: node sims/p15_period16_square_collision.cjs
      - name: Compare proposed 6561 reset against all neighboring original-cipher cuts
        run: node sims/bookend_6561_changepoint.cjs

  source27-direction-inverse:
    if: ${{ inputs.probe == 'source27' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Invert original LP2 with source-keyed direction walkers and blind planted control
        run: node sims/source27_cipher_direction_inverse.cjs
