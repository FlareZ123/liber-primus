name: Source-square matrix-state keystream challenge
on:
  workflow_dispatch:

jobs:
  matrix-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original LP2 and planted page-reset inverse
        run: node sims/clue_square_matrix_stream.cjs
      - name: Recover original-source GP crib keys from hidden four-dimensional matrix state
        run: node sims/source_native_4d_matrix_crib_attack.cjs
      - name: Test red-16 Fibonacci spiral Hill key on original LP2 and positive source
        run: node sims/red16_spiral_hill_inverse.cjs
      - name: Solve red-16 spiral 4D source state from native EA cribs
        run: node sims/red16_spiral_4d_native_crib.cjs
