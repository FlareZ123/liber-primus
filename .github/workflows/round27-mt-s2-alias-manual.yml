name: Agent 40 MT crosslane original inverse
on:
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 128 published source controls and 240-runic original candidate
        run: node sims/round27_s2_crosslane_alias.cjs
      - name: Rescore all 1024 S2 candidate keys on 240 original runes
        run: node sims/round27_s2_top1024_holdout.cjs
      - name: Retest complete S2 top1024 against independent native GP-Latin language
        run: node sims/round27_s2_top1024_latin.cjs
