name: Agent2 original word-phase full-pattern crossfit
on:
  workflow_dispatch:

jobs:
  original-lp2-crossfit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original source SFT
        run: node sims/lp2_wordlocal_fullpattern_crossfit_sft.cjs
