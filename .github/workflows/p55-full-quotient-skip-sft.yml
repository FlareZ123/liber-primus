name: LP2 p55 full quotient skip-aware SFT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p55-quotient-skip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frozen original-input inverse and synthetic controls
        run: node sims/p55_full_quotient_skip_sft.cjs
