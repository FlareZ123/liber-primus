name: LP2 original-source exact capacity tests
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Select an independently bounded original-source capacity test
        type: choice
        required: true
        default: red79
        options:
          - red79
          - hidden-mode
          - binary47
jobs:
  source-red79-byte-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate exact original invalid packet leaders and byte positive
        if: inputs.probe == 'red79'
        run: node sims/red79_base28_byte_capacity.cjs
      - name: Prove exact book-wide two-mode predecessor S-box bound and native source tail
        if: inputs.probe == 'hidden-mode'
        run: node sims/hidden_mode_predecessor_capacity.cjs
      - name: Recover unknown GP cyclic alphabet for 78-rank to 47-byte source-English ASCII
        if: inputs.probe == 'binary47'
        run: |
          node sims/prime78_ascii_order_inversion.cjs
          node sims/prime78_ascii_order_inversion.cjs --lowercase
