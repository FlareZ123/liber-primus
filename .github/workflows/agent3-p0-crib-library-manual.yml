name: Agent 3 p0 EPIPHANY SEEKS pinned source-key crib gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crib-gate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pin independent source-key library
        uses: actions/checkout@v4
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external-cicada3301
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact library dependencies
        run: python -m pip install numpy mpmath
      - name: Build frozen 581-stream source library
        run: python external-cicada3301/work/kscreen/export.py
      - name: Test exact conditional p0 title crib against every source stream
        run: python sims/lp2_p0_epiphany_seeks_581key_crib_sft.py external-cicada3301
