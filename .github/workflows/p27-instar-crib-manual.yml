name: 2013 Instar p27 original source-locked crib
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-crib:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original p27 and wrong-image p53 against 2013 title
        run: node sims/p27_instar_title_source_crib_sft.cjs
      - name: Test frozen period17 and both autokey17 original-cipher holdouts
        run: node sims/lp2_2013_instar_p27_autokey17_sft.cjs
      - name: Test all-secret monoalphabetic shell impossibility and modulo-29 base rates
        run: node sims/lp2_p27_instar_bijection_shell_sft.cjs
      - name: Test 2013 source DH23 versus audio761 p55 order76 hypothesis
        run: node sims/lp2_signed2013_dh23_mod761_p55_orbit_sft.cjs
