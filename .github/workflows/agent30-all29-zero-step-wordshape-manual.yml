name: Agent30 all-29 fixed zero-step word-shape gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: All 29 zero-step marker original-source test and positive control
        run: node sims/lp2_all29_zero_step_wordshape_gate_sft.cjs
