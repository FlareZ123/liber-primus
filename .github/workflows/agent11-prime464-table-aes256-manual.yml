name: Agent11 Prime464 and terminal-table AES256 gate
on:
  workflow_dispatch:
jobs:
  original-source-gate:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source-fixed prime-column AES-256 page key
        run: node sims/lp2_prime464_terminaltable_pageaes256_sft.cjs
