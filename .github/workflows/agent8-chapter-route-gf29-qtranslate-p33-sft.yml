name: Agent8 chapter route GF29 q-translation p33 SFT

on:
  workflow_dispatch:
  push:
    paths:
      - 'sims/lp2_chapter_route_gf29_qtranslate_p33_sft.cjs'
      - 'resources/liber-primus/lp2-corpus.json'
      - 'resources/liber-primus/lp2-ink-annotations.json'
      - 'resources/liber-primus/lp2-transcription.txt'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp2_chapter_route_gf29_qtranslate_p33_sft.cjs
