name: p50-instar-interior-xor
on:
  workflow_dispatch:

jobs:
  frozen-receiver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Download pinned 2013 Instar Emergence MP3
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/neuroretransmit/cicada/ade9a02889ef8acbc8cde8edbfd0a785c369f4c3/2013/002-3301/3301-contents/audio/761.mp3' \
            --output /tmp/761.mp3

      - name: Run source-selected interior XOR
        run: |
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          from pathlib import Path

          source = json.loads(Path("resources/liber-primus/lp2-grid-256.json").read_text())
          cells = bytes(source["bytes"])
          assert len(cells) == 256
          assert hashlib.sha256(cells).hexdigest() == "3b9b07d9a26e6d55c432d94d2661fdff3c2b348daed06821f2bdb23184a4b290"

          rows = [cells[r * 8:(r + 1) * 8] for r in range(32)]
          # Shed the one-cell circumference: retain rows 1..30 and columns 1..6.
          interior = bytes(rows[r][c] for r in range(1, 31) for c in range(1, 7))
          assert len(interior) == 180

          mp3 = Path("/tmp/761.mp3").read_bytes()
          assert len(mp3) == 4_010_732
          assert hashlib.sha256(mp3).hexdigest() == "83008217439110c3b824898af73b99cb2cf0657dda88cb363c3aa34a4ec0a460"

          # Historical 2013 operator: offset-zero bytewise XOR, truncated to the shorter input.
          pad = mp3[:len(interior)]
          out = bytes(a ^ b for a, b in zip(interior, pad))
          Path("/tmp/p50-instar-xor.bin").write_bytes(out)

          printable = sum(32 <= b < 127 or b in (9, 10, 13) for b in out)
          counts = collections.Counter(out)
          entropy = -sum((n / len(out)) * __import__("math").log2(n / len(out)) for n in counts.values())
          ascii_view = "".join(chr(b) if 32 <= b < 127 else "." for b in out)
          report = "\n".join([
              "Frozen p50-interior180 XOR 761.mp3 test",
              f"table_cells={len(cells)} table_sha256={hashlib.sha256(cells).hexdigest()}",
              f"interior_shape=30x6 interior_len={len(interior)} interior_sha256={hashlib.sha256(interior).hexdigest()}",
              f"mp3_len={len(mp3)} mp3_sha256={hashlib.sha256(mp3).hexdigest()}",
              f"mp3_prefix180_hex={pad.hex()}",
              f"interior180_hex={interior.hex()}",
              f"xor_len={len(out)} xor_sha256={hashlib.sha256(out).hexdigest()}",
              f"xor_prefix16_hex={out[:16].hex()} printable={printable}/{len(out)} ({printable/len(out):.3%}) entropy={entropy:.4f} bits/byte",
              f"xor_ascii={ascii_view}",
              f"xor_full_hex={out.hex()}",
          ])
          Path("/tmp/p50-instar-xor-report.txt").write_text(report + "\n")
          print(report)
          PY

      - name: Preserve exact output and reproduction report
        uses: actions/upload-artifact@v4
        with:
          name: p50-instar-interior180-xor-761
          path: |
            /tmp/p50-instar-xor.bin
            /tmp/p50-instar-xor-report.txt
