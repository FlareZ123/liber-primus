name: Agent42 LP2 original pdir targeted three-part shard rescue
on:
  workflow_dispatch:
    inputs:
      conv:
        description: "Original pdir convention hmc (000 through 122)"
        required: true
        type: string
        default: "010"
      shard:
        description: "Original 12-way rule shard (0 through 11)"
        required: true
        type: string
        default: "3"
permissions:
  contents: read
jobs:
  pdir-rescue:
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [0, 1, 2]
    env:
      CONV: ${{ inputs.conv }}
      SHARD: ${{ inputs.shard }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin the identical 2016-hint pdir implementation
        uses: actions/checkout@v4
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external-cicada3301
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pinned engine and original source corpus
        shell: pwsh
        run: |
          if ($env:CONV -cnotmatch '^[01][012][012]$') { throw "Invalid convention" }
          if ($env:SHARD -cnotmatch '^(?:[0-9]|10|11)$') { throw "Invalid original shard" }
          python -m pip install numpy mpmath
          if ($LASTEXITCODE -ne 0) { throw "Python dependency failure" }
          cargo build --release --manifest-path external-cicada3301/work/kscreen/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Rust engine build failure" }
          python external-cicada3301/work/kscreen/export.py
          if ($LASTEXITCODE -ne 0) { throw "Original key-library export failure" }
          python external-cicada3301/work/kscreen/signrules.py
          if ($LASTEXITCODE -ne 0) { throw "Source sign-rule generation failure" }
          python external-cicada3301/work/kscreen/dirrules.py
          if ($LASTEXITCODE -ne 0) { throw "Source direction-rule generation failure" }
      - name: Assert all 12956 original runes and 581 genuine source keys
        run: python sims/lp2_pdir_issue1329_gate.py external-cicada3301
      - name: Independent engine and 2016-direction planted positives
        run: python external-cicada3301/work/kscreen/pdir_selftest.py --quick --threads 4
      - name: Screen a disjoint third of the failed original job
        shell: pwsh
        run: |
          $parts = "real"
          $nulls = "6"
          if ($env:CONV -in @("000","001","002")) {
            $parts = "real,null"
            $nulls = "581"
          }
          python sims/lp2_pdir_issue1329_gate.py external-cicada3301 --campaign --conv "$env:CONV" --shard "$env:SHARD" --shards 12 --subshard "${{ matrix.part }}" --subshards 3 --streams all --windows "seg0.9,seg0.11,seg0.12,seg0.13,seg0.14,seg0.15" --parts "$parts" --null "$nulls" --tag "issue1329-targeted-rescue-$env:CONV-$env:SHARD" --threads 4
          if ($LASTEXITCODE -ne 0) { throw "Targeted original-cipher screen failed" }
      - name: Save original per-rule scores, independent controls, and exact subshard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdir-sixsections-rescue-${{ inputs.conv }}-${{ inputs.shard }}-part${{ matrix.part }}of3
          path: |
            external-cicada3301/results/kscreen/pdir_selftest.txt
            external-cicada3301/results/kscreen/pdir/issue1329-targeted-rescue-${{ inputs.conv }}-${{ inputs.shard }}/${{ inputs.conv }}/
          if-no-files-found: warn
