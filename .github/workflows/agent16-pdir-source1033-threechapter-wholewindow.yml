name: Agent16 LP2 original 1033 three-section historical key whole-window verifier
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source1033-threechapter-inverse:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external-cicada3301
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-reference requirements and locked atomic helper
        run: python -m pip install numpy mpmath filelock
      - name: Build the independent original reference decoder
        run: cargo build --release --manifest-path external-cicada3301/work/kscreen/Cargo.toml
      - name: Reconstruct original 12956 runes and 66 published source directions
        run: |
          python external-cicada3301/work/kscreen/export.py
          python external-cicada3301/work/kscreen/signrules.py
          python external-cicada3301/work/kscreen/dirrules.py
          python sims/lp2_pdir_issue1329_gate.py external-cicada3301
      - name: Retrieve exactly the 12 source-completed 000 historical and matched-null shards
        shell: pwsh
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          $ErrorActionPreference = "Stop"
          gh run download 44075903575 --repo FlareZ123/liber-primus --dir raw-shards --pattern "pdir-sixsections-000-*"
          if ($LASTEXITCODE -ne 0) { throw "Original completed source shard download failed" }
      - name: Verify the frozen 1033 source stream over three complete unknown chapters
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python sims/lp2_pdir_source1033_threechapter_wholewindow.py --raw raw-shards --external external-cicada3301 --out original-source1033
          if ($LASTEXITCODE -ne 0) { throw "Original 1033 three-chapter verifier failed" }
      - name: Preserve complete authenticated original readouts and wrong-offset controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-source1033-threechapter-fullwindow-original
          path: |
            original-source1033/
            external-cicada3301/results/kscreen/pdir/issue1329-source1033-threechapters/
          if-no-files-found: warn
