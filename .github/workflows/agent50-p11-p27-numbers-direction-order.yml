name: Agent50 P11-P27 Numbers Direction Ordering

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p11-p27-order:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p11-to-p27 direction-order regression
        shell: pwsh
        run: node sims/lp2_p11_p27_numbers_direction_order_sft.cjs
