name: Agent10 source H-G quartic p33 WILL holdout
on:
  workflow_dispatch:

jobs:
  p33-source-crib:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original H-G polynomial and p33 210-rune holdout
        run: |
          node --check sims/lp2_hg_quartic_p33_will_holdout_sft.cjs
          node sims/lp2_hg_quartic_p33_will_holdout_sft.cjs
