name: LP2 Py27 MT32 exact unswept seeds

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "smoke tests 250k genuinely unswept seeds; full runs all 96 disjoint missing shards"
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: lp2-py27-mt32-exact-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.setup.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete exact partition and construct matrix
        id: setup
        shell: bash
        run: |
          node sims/lp2_py27_mt32_uncovered_shards_sft.cjs test
          echo "shards=$(node sims/lp2_py27_mt32_uncovered_shards_sft.cjs matrix '${{ inputs.scope }}')" >> "$GITHUB_OUTPUT"

  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable original 12-register engine and panel
        uses: actions/checkout@v4
        with:
          repository: Dukotah/cicada3301
          ref: 9087dc36b5aa64c1786428e32180261ab9420c29
          path: upstream
          persist-credentials: false
      - name: Gate committed panel-R36 against source hashes, frozen 64 vectors and true-key plant
        working-directory: upstream/liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy
        shell: bash
        run: |
          set -euo pipefail
          python3 check_panel_gate.py
          gcc -O2 -Wall -Wextra -std=gnu17 -fopenmp -ffp-contract=off -o grind27 grind27.c -lm
          ./grind27 --self-test --data engine.dat
          ./grind27 --drill --data engine.dat

  sweep:
    needs:
      - prepare
      - control
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source-pinned panel-R36 engine, plus exact six-worker coverage checkpoint
        uses: actions/checkout@v4
        with:
          repository: Dukotah/cicada3301
          ref: 9087dc36b5aa64c1786428e32180261ab9420c29
          path: upstream
          persist-credentials: false
      - name: Validate committed 12-register scorer and known planted truth
        shell: bash
        working-directory: upstream/liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy
        run: |
          set -euo pipefail
          python3 check_panel_gate.py
          gcc -O2 -Wall -Wextra -std=gnu17 -fopenmp -ffp-contract=off -o grind27 grind27.c -lm
          ./grind27 --self-test --data engine.dat
      - name: Select source-disjoint S2 exact key range
        shell: bash
        run: |
          set -euo pipefail
          node sims/lp2_py27_mt32_uncovered_shards_sft.cjs plan '${{ matrix.band }}' '${{ matrix.shard }}' '${{ inputs.scope }}'
      - name: Exhaust assigned interval under the pinned R36 exact keyskip1 clock
        shell: bash
        working-directory: upstream/liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy
        env:
          GRIND27_S2_CONTROL_OK: '1'
        run: |
          set -euo pipefail
          ./grind27 --data engine.dat --plan "${{ github.workspace }}/run/plan.json" --run-dir "${{ github.workspace }}/run" --threads 2
      - name: Verify complete local coverage and retain all flags
        shell: bash
        run: |
          set -euo pipefail
          node sims/lp2_py27_mt32_uncovered_shards_sft.cjs verify
      - name: Preserve shard evidence, including candidates and histogram
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-${{ inputs.scope }}-b${{ matrix.band }}-s${{ matrix.shard }}
          path: run/
          if-no-files-found: warn
          retention-days: 90
