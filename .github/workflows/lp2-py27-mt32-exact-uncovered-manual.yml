name: LP2 Py27 MT32 exact unswept seeds

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "smoke tests 250k genuinely unswept seeds; full runs all 96 disjoint missing shards"
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: lp2-py27-mt32-exact-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.setup.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete exact partition and construct matrix
        id: setup
        shell: bash
        run: |
          node sims/lp2_py27_mt32_uncovered_shards_sft.cjs test
          echo "shards=$(node sims/lp2_py27_mt32_uncovered_shards_sft.cjs matrix '${{ inputs.scope }}')" >> "$GITHUB_OUTPUT"

  control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out immutable independent decoder and all source control vectors
        uses: actions/checkout@v4
        with:
          repository: Dukotah/cicada3301
          ref: 9087dc36b5aa64c1786428e32180261ab9420c29
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned-engine dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Build unchanged original bit-exact C stage-A engine
        shell: bash
        working-directory: upstream/liber-primus/analysis/round27/P1-engine
        run: |
          set -euo pipefail
          python export_data.py
          gcc -O3 -march=native -fopenmp -std=gnu17 -ffp-contract=off -o grind27 grind27.c -lm
          ./grind27 --self-test
          ./grind27 --drill
      - name: Mandatory 64-vector exact keyskip1 parity and known-seed 777 full recovery
        shell: bash
        working-directory: upstream/liber-primus/analysis/round27/P2-harness/s2check
        run: |
          set -euo pipefail
          python check_s2.py

  sweep:
    needs:
      - prepare
      - control
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact independent decoder and frozen six-worker coverage receipt
        uses: actions/checkout@v4
        with:
          repository: Dukotah/cicada3301
          ref: 9087dc36b5aa64c1786428e32180261ab9420c29
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Required numerical model
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Build and self-test original byte-exact scorer
        shell: bash
        working-directory: upstream/liber-primus/analysis/round27/P1-engine
        run: |
          set -euo pipefail
          python export_data.py
          gcc -O3 -march=native -fopenmp -std=gnu17 -ffp-contract=off -o grind27 grind27.c -lm
          ./grind27 --self-test
      - name: Select source-disjoint S2 exact key range
        shell: bash
        run: |
          set -euo pipefail
          node sims/lp2_py27_mt32_uncovered_shards_sft.cjs plan '${{ matrix.band }}' '${{ matrix.shard }}' '${{ inputs.scope }}'
      - name: Exhaust assigned interval under the validated exact keyskip1 clock
        shell: bash
        working-directory: upstream/liber-primus/analysis/round27/P1-engine
        env:
          GRIND27_S2_CONTROL_OK: '1'
        run: |
          set -euo pipefail
          ./grind27 --plan "${{ github.workspace }}/run/plan.json" --run-dir "${{ github.workspace }}/run" --threads 2
      - name: Verify 100 percent local coverage, capture all flags and durable receipt
        shell: bash
        run: |
          set -euo pipefail
          node sims/lp2_py27_mt32_uncovered_shards_sft.cjs verify
      - name: Preserve complete shard evidence including candidate seeds and histogram
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-${{ inputs.scope }}-b${{ matrix.band }}-s${{ matrix.shard }}
          path: run/
          if-no-files-found: warn
          retention-days: 90
