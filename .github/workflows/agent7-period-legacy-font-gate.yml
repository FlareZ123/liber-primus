name: Agent7 Curtis Clark 1995 rune font gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curtis-elder-futhark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow fonttools scipy
      - name: Fetch Curtis Clark Elder Futhark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/curtis
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://dl.dafont.com/dl/?f=elder_futhark' -o /tmp/curtis.zip
          unzip -q /tmp/curtis.zip -d /tmp/curtis
          find /tmp/curtis -type f -maxdepth 2 -print
          sha256sum /tmp/curtis.zip
      - name: Oracle-slot gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t fonts < <(find /tmp/curtis -type f \( -iname '*.ttf' -o -iname '*.otf' \) | sort)
          test "${#fonts[@]}" -gt 0
          args=()
          for f in "${fonts[@]}"; do args+=(--font "$f"); done
          mkdir -p im-results
          python sims/lp2_unencoded_font_slot_gate.py \
            --image resources/liber-primus/74.jpg \
            "${args[@]}" \
            --output im-results/curtis-clark-elder-futhark-slot-gate.json
          cat im-results/curtis-clark-elder-futhark-slot-gate.json
      - name: Preserve result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Agent 7'
          git config user.email 'agent7@users.noreply.github.com'
          git add im-results/curtis-clark-elder-futhark-slot-gate.json
          git commit -m 'Agent 7: record Curtis Clark rune-font gate result'
          git pull --rebase origin main
          git push origin HEAD:main
