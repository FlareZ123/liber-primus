name: LP2 p0 dot13 stencil source inverse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 729-rune transposition and paired-difference inverse
        run: node sims/lp2_p0_dot13_27block_interleave_sft.cjs
