name: Agent8 original p33-39 all-secret affine Hill2 gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-gf29-affine-bound:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact all-key source gate and native-language plants
        run: node sims/lp2_p33_39_allsecret_affine_hill2_original_sft.cjs
