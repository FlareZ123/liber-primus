name: LP2-as-pad against pp49-51 payload (F-01 T5)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4
      - name: Checkout pinned external F-01 implementation and payload
        uses: actions/checkout@v4
        with:
          repository: Dukotah/cicada3301
          ref: 9087dc36b5aa64c1786428e32180261ab9420c29
          path: external/dukotah
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run T5 completion
        run: |
          python sims/lp2_as_pad_pp4951_t5.py \
            --dukotah-root external/dukotah \
            --out lp2-as-pad-pp49-51-t5.json
      - name: Upload reproducible result
        uses: actions/upload-artifact@v4
        with:
          name: lp2-as-pad-pp49-51-t5
          path: lp2-as-pad-pp49-51-t5.json
