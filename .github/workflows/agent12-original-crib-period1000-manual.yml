name: Agent12 source-original whole-word crib and all-secret GP29 period gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-native whole-word quotation crib control
        shell: pwsh
        run: |
          node sims/lp2_wordlength_reference_quotation_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Whole-word source crib SFT failed' }
      - name: Run all-secret 1 to 1000 chapter-period gate
        shell: pwsh
        run: |
          node sims/lp2_period1000_allsecret_lag_collision_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Chapter-period GP29 gate failed' }
      - name: Validate source-linked 180 missing 2013 primes and 2014 LP2 interior
        shell: pwsh
        run: |
          node sims/lp2_2013_telnet_180gap_p50_interior_source_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Telnet and p50 interior source test failed' }
      - name: Test authentic p56-prime F word-clock across 32 original page seams
        shell: pwsh
        run: |
          node sims/lp2_pagecarry_wordprime_Fclock_original_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw '32-seam GP prime/F word-clock SFT failed' }
      - name: Test all-secret 6x6 Hill affine table interior against solved terminal pages
        shell: pwsh
        run: |
          node sims/lp2_terminal_inner180_hill6_allsecret_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Original inner180 Hill key-recovery SFT failed' }
