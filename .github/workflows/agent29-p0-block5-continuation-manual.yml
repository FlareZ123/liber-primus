name: Agent29 p0 Block5 Continuation Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp2_p0_block5_branch_continuation_gate_sft.cjs
