name: Agent11 p32-trained stock pipeline p55 holdout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-pipeline dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 pillow==11.0.0 opencv-python-headless==4.10.0.84
      - name: Fit p32 only and score frozen p55 holdout
        run: python sims/lp2_p32_stock_pipeline_p55_holdout_sft.py
