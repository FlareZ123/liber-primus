name: Agent37 p0 title checksum holdout
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  title-checksum:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce title checksum holdout
        run: |
          node --check sims/lp2_p0_epiphany_seeks_key_checksum_sft.cjs
          node sims/lp2_p0_epiphany_seeks_key_checksum_sft.cjs
          node --check sims/lp2_p0_you_false_will_candidate_sft.cjs
          node sims/lp2_p0_you_false_will_candidate_sft.cjs
