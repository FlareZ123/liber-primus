name: OpenPuff v4.00 LP2 cuneiform printed-order password probe
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: single
        options:
          - single
          - seven-chain
          - seven-chain-medium
          - seven-chain-historical-maximum
          - seven-chain-historical-medium
permissions:
  contents: read
jobs:
  original-source:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Install original-tool native UI prerequisites
        shell: pwsh
        run: |
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
      - name: Retrieve original pinned OpenPuff v4.00
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-original-Maximum'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original OpenPuff executable mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Reproduce independently authored A-only JPEG positive on this runner
        shell: pwsh
        run: |
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Source-pinned public OpenPuff JPEG unavailable' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format "Jpeg (Image)" --bit-level "1/2 (50%) - Maximum" --out probe-output/public-recovery --wait-seconds 45
          if ($LASTEXITCODE -ne 0) { throw 'Known JPEG maximum positive failed to execute' }
          python -c "from pathlib import Path; from hashlib import sha256; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file(); b=p.read_bytes(); assert b==b'Dies ist eine versteckte Nachricht!'; print('ORIGINAL_NATIVE_JPEG_MAXIMUM_POSITIVE_PASS',len(b),sha256(b).hexdigest())"
          if ($LASTEXITCODE -ne 0) { throw 'Known plaintext JPEG positive not recovered' }
      - name: Test the clue-selected original LP2 JPEGs at JPEG Maximum 1/2
        if: ${{ inputs.mode == 'single' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pages = @(50..56) + @(66..68) + @(72)
          if (@($pages | Sort-Object -Unique).Count -ne 11) { throw 'Duplicate or missing source page selection' }
          $cases = @()
          foreach ($imageIndex in $pages) {
            $carrier = Join-Path $env:GITHUB_WORKSPACE ('resources/liber-primus/{0:D2}.jpg' -f $imageIndex)
            if (-not (Test-Path -LiteralPath $carrier)) { throw "Missing original source carrier: $carrier" }
            $out = 'probe-output/original-' + ('{0:D2}' -f $imageIndex)
            Write-Host "ORIGINAL_MAXIMUM_PROBE START source=$imageIndex physicalLP2=$($imageIndex - 17)"
            python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$carrier" --password 10333301 --bit-format "Jpeg (Image)" --bit-level "1/2 (50%) - Maximum" --out "$out" --wait-seconds 50
            if ($LASTEXITCODE -ne 0) { throw "Native OpenPuff UI failed: original $imageIndex" }
            $record = Get-Content -LiteralPath "$out/result.json" -Raw | ConvertFrom-Json
            if (-not $record.bit_selection_verified -or -not $record.attempted) {
              throw "Original native UI did not execute the selected JPEG Maximum action: $imageIndex"
            }
            $cases += [pscustomobject]@{
              original_image = $imageIndex
              physical_lp2_page = $imageIndex - 17
              outcome = $record.native_probe_outcome
              extracted_count = @($record.outputs).Count
              selected_capacity = $record.selected_capacity_bytes_after_level
            }
            Write-Host "ORIGINAL_MAXIMUM_PROBE RESULT $($cases[-1] | ConvertTo-Json -Compress)"
          }
          $cases | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath probe-output/original-maximum-summary.json -Encoding utf8
          Write-Host "ORIGINAL_MAXIMUM_SUMMARY $($cases | ConvertTo-Json -Compress)"
          $nonEmpty = @($cases | Where-Object { $_.extracted_count -gt 0 })
          if ($nonEmpty.Count -gt 0) { Write-Host "EXTRACTION_CANDIDATE_FOUND $($nonEmpty.Count)"; }
      - name: Test seven original cuneiform JPEGs with the source-selected depth
        if: ${{ inputs.mode == 'seven-chain' || inputs.mode == 'seven-chain-medium' || inputs.mode == 'seven-chain-historical-maximum' || inputs.mode == 'seven-chain-historical-medium' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $level = if ('${{ inputs.mode }}' -eq 'seven-chain-medium' -or '${{ inputs.mode }}' -eq 'seven-chain-historical-medium') { '1/5 (20%) - Medium' } else { '1/2 (50%) - Maximum' }
          $out = if ('${{ inputs.mode }}' -eq 'seven-chain-medium') { 'probe-output/original-cuneiform-seven-medium' } elseif ('${{ inputs.mode }}' -eq 'seven-chain-historical-medium') { 'probe-output/original-cuneiform-seven-historical-medium' } elseif ('${{ inputs.mode }}' -eq 'seven-chain-historical-maximum') { 'probe-output/original-cuneiform-seven-historical-maximum' } else { 'probe-output/original-cuneiform-seven-maximum' }
          $password = if ('${{ inputs.mode }}' -eq 'seven-chain-historical-maximum' -or '${{ inputs.mode }}' -eq 'seven-chain-historical-medium') { '33011033' } else { '10333301' }
          $arguments = @(
            '--exe', "$env:OPENPUFF_EXE",
            '--password', "$password",
            '--bit-format', 'Jpeg (Image)',
            '--bit-level', "$level",
            '--out', "$out",
            '--wait-seconds', '1100'
          )
          foreach ($idx in 50..56) {
            $carrier = Join-Path $env:GITHUB_WORKSPACE ('resources/liber-primus/{0:D2}.jpg' -f $idx)
            if (-not (Test-Path -LiteralPath "$carrier")) { throw "Original source image missing: $idx" }
            $arguments += @('--carrier', "$carrier")
          }
          python sims/openpuff_v400_extract.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Native original seven-image Maximum chain execution failed' }
          $result = Get-Content -LiteralPath "$out/result.json" -Raw | ConvertFrom-Json
          if ($result.carrier_count -ne 7 -or -not $result.carrier_chain_verified) {
            throw 'Original seven-file source order was not verified inside native OpenPuff'
          }
          if ($result.native_probe_outcome -eq 'inconclusive-timeout') {
            throw 'Seven-image original chain reached timeout without a native outcome'
          }
          Write-Host "SOURCE_SEVEN_CUNEIFORM_RESULT password=$password level=$level $($result | Select-Object carrier_count, native_probe_outcome, output_present, outputs, completion_dialogs, error_dialogs | ConvertTo-Json -Depth 12 -Compress)"
          if ($result.output_present) { Write-Host 'POTENTIAL_LP2_STEGO_PAYLOAD_DETECTED' }
      - name: Preserve original-tool evidence including hidden outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpuff-v400-lp2-topdown-${{ inputs.mode }}-source-evidence
          path: probe-output/
          if-no-files-found: warn
