name: LP2 p33-39 cuneiform period60 all-secret original gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate frozen source-controlled cipher family
        run: node sims/lp2_cuneiform60_allsecret_source_gate.cjs > cuneiform60-allsecret.json
      - uses: actions/upload-artifact@v4
        with:
          name: cuneiform60-allsecret-original
          path: cuneiform60-allsecret.json
