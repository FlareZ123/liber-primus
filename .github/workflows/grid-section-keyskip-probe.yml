name: Grid column section keyskip probe
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Viterbi collision-skip across AES and ChaCha section column keys
        run: node sims/grid_section_keyskip_probe.cjs
