name: Agent35 Ahmia 2014 archive custody probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Self-test
        shell: pwsh
        run: node sims/lp2_p56_ahmia_archive_probe.cjs --selftest
      - name: Probe public archive
        shell: pwsh
        run: node sims/lp2_p56_ahmia_archive_probe.cjs
