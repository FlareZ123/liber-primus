name: Printed-line-phase diagnostic

on:
  workflow_dispatch:

jobs:
  printed-line-invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact line-phase and planted-control experiment
        run: |
          node sims/printed_line_phase_invariant.cjs
          node sims/printed_line_start_channel.cjs
