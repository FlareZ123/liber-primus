name: Fabre Cicada chapter source-key gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-key:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fixed Fabre Chapter III GP29 running-key hypothesis
        run: node sims/lp2_fabre_cicada_runningkey_sft.cjs
