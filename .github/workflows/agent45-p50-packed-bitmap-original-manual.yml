name: Agent45 LP2 P50 Packed Bitmap Original Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact byte-packed source bitmap and QR-finder test
        shell: pwsh
        run: node sims/lp2_p50_packed_bitmap_32x64_sft.cjs
