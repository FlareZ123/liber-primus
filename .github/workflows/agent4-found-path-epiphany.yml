name: Agent4 FOUND PATH EPIPHANY Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run FOUND PATH EPIPHANY bridge
        shell: pwsh
        run: node sims/lp2_found_path_epiphany_bridge_sft.cjs
