name: Agent 13 original Agrippa RSA3 cipher invariant
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node sims/lp2_agrippa_rsa3_gpblock_collision_sft.cjs
