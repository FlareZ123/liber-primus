name: Original grid 179-square 255-byte terminal inverse
on:
  workflow_dispatch:

jobs:
  source-key-original-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original-source quotient and known-solved control
        run: node sims/grid179sq_255_terminal_bridge.cjs
      - name: Ac field-root and 127-pair original gate
        run: node sims/grid_ac24_double_root_pair_gate.cjs
      - name: P53 red 256-bit and black 128-rune source gate
        run: node sims/p53_red256_black128_source_gate.cjs
      - name: Source-marked red triad polynomial and exact grid factor
        run: node sims/lp2_red_triads_polynomial_source_gate.cjs
      - name: Test primitive GF841 840-phase key-independent invariant
        run: node sims/red_triad_gf841_phase_invariant.cjs
      - name: Primitive GF29 field-trace original inverse
        run: node sims/red_primitive_field_trace_original_inverse.cjs
