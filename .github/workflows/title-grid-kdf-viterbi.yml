name: Source-bound red-title grid KDF inversion
on:
  workflow_dispatch:
jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run source-true planted control and original 8-section inverse
        run: node sims/title_grid_kdf_viterbi.cjs
