name: LP2 original word-local GF29 arithmetic-ramp all-secret SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-source-exact-inverse:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original-word exhaustive secret arithmetic ramp and native plants
        shell: pwsh
        run: node sims/lp2_wordramp_affine_allsecret_sft.cjs
      - name: Test original p28–p31 prime-length and fixed-clock key-reuse gate
        shell: pwsh
        run: node sims/lp2_p28_p31_prime_length_sft.cjs
      - name: Check archive captures of previously unread Oct 2026 Zenodo paper
        shell: pwsh
        run: node sims/lp2_zenodo23487409_wayback_pdf_gate.cjs
