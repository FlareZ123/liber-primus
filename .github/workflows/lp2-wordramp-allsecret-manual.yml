name: LP2 original word-local GF29 arithmetic-ramp all-secret SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-source-exact-inverse:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original-word exhaustive secret arithmetic ramp and native plants
        shell: pwsh
        run: node sims/lp2_wordramp_affine_allsecret_sft.cjs
      - name: Test original p28–p31 prime-length and fixed-clock key-reuse gate
        shell: pwsh
        run: node sims/lp2_p28_p31_prime_length_sft.cjs
      - name: Original 256-byte table ARC4 against GP28 binary transport
        shell: pwsh
        run: node sims/lp2_p50_arc4_delta28_compressed_original_sft.cjs
      - name: Original whole-word cumulative step-affine inverse against native GP29 English
        shell: pwsh
        run: node sims/lp2_wordstep_affine_allsecret_sft.cjs
      - name: Original byte-pointer eleven-cycle source-key gate
        shell: pwsh
        run: node sims/lp2_p50_direct_byte_pointer_firstcycle_sft.cjs
      - name: Original-source 2026 external claimed-key crosscheck
        shell: pwsh
        run: node sims/lp2_wulfic_2026_p18p19_claimed_keys_original_sft.cjs
