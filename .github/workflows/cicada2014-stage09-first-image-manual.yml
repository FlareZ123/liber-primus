name: Original 2014 Stage09 missing first OutGuess message
on:
  workflow_dispatch:

jobs:
  extract-original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned 2014-compatible OutGuess
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential libjpeg-dev file
          git clone --depth 1 https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          git -C /tmp/outguess fetch --depth 1 origin 24810e14327c2bbeedeaadd3e24491f2a4425c02
          git -C /tmp/outguess checkout --detach 24810e14327c2bbeedeaadd3e24491f2a4425c02
          cd /tmp/outguess
          ./autogen.sh
          CFLAGS='-O2 -std=gnu11' ./configure --with-generic-jconfig
          make -j2 CC='gcc -std=gnu11' CFLAGS='-O2 -std=gnu11'
          sudo make install
      - name: Extract image one and compare the other three original positives
        run: python sims/cicada2014_stage09_missing_first_outguess_sft.py
      - name: Preserve only recovered first JPEG's original message
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cicada2014-stage09-image1-extracted
          path: stage09-first-image-output/actual-index.1.outguess
          if-no-files-found: warn
          retention-days: 30
