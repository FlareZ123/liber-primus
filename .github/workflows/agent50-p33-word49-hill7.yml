name: Agent50 P33 historical 7x7 full-word Hill readout
on:
  workflow_dispatch:

jobs:
  p33-historical-word49-hill:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode unchanged p33 49 word cells with authentic historical square
        run: node sims/lp2_p33_word49_hill7_original_sft.cjs
