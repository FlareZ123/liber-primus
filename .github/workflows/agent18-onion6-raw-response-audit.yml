name: Agent18 Onion6 raw response audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pinned original Onion 6 artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/onion6-input" "$RUNNER_TEMP/onion6-output"
          base="https://raw.githubusercontent.com/cijhho123/cicada3301/d360ad97d39c4719e42dc88b0cbbb81ed54aa02c/2014/Websites/onion%206"
          curl --fail --location --silent --show-error "$base/ut3qtzbrvs7dtvzp.onion" --output "$RUNNER_TEMP/onion6-input/response_body.bin"
          curl --fail --location --silent --show-error "$base/ut3qtzbrvs7dtvzp.onion.hex" --output "$RUNNER_TEMP/onion6-input/response.hex"
          curl --fail --location --silent --show-error "$base/ut3qtzbrvs7dtvzp.onion.headers" --output "$RUNNER_TEMP/onion6-input/response.headers"
          curl --fail --location --silent --show-error "$base/onion6.jpg" --output "$RUNNER_TEMP/onion6-input/onion6.jpg"
          echo "Downloaded pinned source artifacts:"
          wc -c "$RUNNER_TEMP/onion6-input/"*

      - name: Verify source blobs, decode response, and compare original image
        run: |
          python3 sims/agent18_onion6_raw_response_audit.py \
            "$RUNNER_TEMP/onion6-input" \
            "$RUNNER_TEMP/onion6-output"

      - name: Upload exact source and decoded comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent18-onion6-raw-response-audit
          path: |
            \${{ runner.temp }}/onion6-input/
            \${{ runner.temp }}/onion6-output/
          if-no-files-found: error
          retention-days: 14
