name: Agent29 p0 Artwork Rot180 Source Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-image-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy Pillow opencv-python-headless
      - run: python sims/lp2_p0_artwork_rot180_symmetry_sft.py
