name: LP2 long-section unknown alphabet (manual)
on:
  workflow_dispatch:
jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fit section-specific unknown outer alphabets and skips to sourced keys
        run: node sims/grid_long_section_unknown_sigma.cjs
