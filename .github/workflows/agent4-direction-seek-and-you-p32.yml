name: Agent4 DIRECTION SEEK AND YOU p32 Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run DIRECTION SEEK AND YOU p32 gate
        shell: pwsh
        run: node sims/lp2_direction_seek_and_you_p32_gate_sft.cjs
