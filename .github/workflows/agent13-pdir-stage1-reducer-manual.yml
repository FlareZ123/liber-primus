name: Agent 13 LP2 pointer-direction finished-stage1 reducer
on:
  workflow_dispatch:
    inputs:
      six_run_id:
        description: Completed six-convention original stage1 Actions run ID
        required: true
        default: "44006868510"
        type: string
      remaining_run_id:
        description: Completed remaining twelve-convention original stage1 run ID
        required: true
        default: "44007390480"
        type: string
permissions:
  contents: read
  actions: read
jobs:
  original-stage1-reduction:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install file lock helper
        run: python -m pip install filelock
      - name: Retrieve every disjoint first-six-convention original artifact
        uses: actions/download-artifact@v4
        with:
          run-id: "${{ inputs.six_run_id }}"
          pattern: pdir-stage1-*
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: from-six
          merge-multiple: false
      - id: source-artifacts
        name: Inventory all 144 immutable source shard IDs with API pagination
        uses: actions/github-script@v7
        with:
          script: |
            const conventions = ['001','002','011','012','021','022','101','102','111','112','121','122'];
            const items = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: Number('${{ inputs.remaining_run_id }}'), per_page: 100
            });
            const byName = new Map(items.map(a => [a.name, a]));
            const expected = conventions.flatMap(conv =>
              Array.from({length:12}, (_, shard) => 'pdir-stage1-remaining-' + conv + '-' + shard));
            const missing = expected.filter(name => !byName.has(name));
            if (missing.length || new Set(expected).size !== 144 || byName.size < 144) {
              throw new Error('Incomplete original source shards: ' + JSON.stringify(missing));
            }
            for (const prefix of ['0','1']) {
              const names = expected.filter(name => name.startsWith('pdir-stage1-remaining-' + prefix));
              if (names.length !== 72) throw new Error('Wrong original prefix count ' + prefix);
              const ids = names.map(name => byName.get(name).id);
              core.setOutput('ids' + prefix, ids.join(','));
            }
      - name: Retrieve remaining conventions beginning 0 (72 original shards)
        uses: actions/download-artifact@v4
        with:
          run-id: "${{ inputs.remaining_run_id }}"
          artifact-ids: "${{ steps.source-artifacts.outputs.ids0 }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: from-twelve
          merge-multiple: false
      - name: Retrieve remaining conventions beginning 1 (72 original shards)
        uses: actions/download-artifact@v4
        with:
          run-id: "${{ inputs.remaining_run_id }}"
          artifact-ids: "${{ steps.source-artifacts.outputs.ids1 }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: from-twelve
          merge-multiple: false
      - name: Reject missing, duplicate, wrong-engine, and incomplete vector coverage
        run: python sims/lp2_pdir_stage1_reduce.py --six from-six --remaining from-twelve --out stage1-report
      - name: Preserve calibrated original and matched-control reduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-lp2-pdir-stage1-18convention-report
          path: stage1-report/
          if-no-files-found: warn
