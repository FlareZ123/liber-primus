name: P32 signed 2016 prime-axis pixel gate
on:
  push:
    paths:
      - .github/workflows/p32-2016-prime-axis-once.yml
  workflow_dispatch:
jobs:
  source-pixels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Evaluate frozen original image coordinates
        run: python sims/p32_2016_prime_axis_image_sft.py
