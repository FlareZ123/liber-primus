name: Agent1 THEIR RISE H Rectangle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rectangle:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run THEIR RISE H rectangle selector
        shell: pwsh
        run: node sims/lp2_their_rise_h_rectangle_selector_sft.cjs
