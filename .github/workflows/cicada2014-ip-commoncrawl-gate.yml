name: Cicada 2014 IP Common Crawl gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commoncrawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Query historical Common Crawl indexes
        run: node sims/cicada2014_ip_archive_gate.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: cicada2014-ip-commoncrawl
          path: commoncrawl-ip-gate/
          if-no-files-found: error
          retention-days: 30
