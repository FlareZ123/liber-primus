name: LP2 nine original red-heading substitution SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-heading-gate:
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original nine-title equality and corrected native GP controls
        run: node sims/lp2_nine_red_heading_substitution_invariants_sft.cjs
