name: Agent16 source-affine plaintext feedback original SFT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affine-original:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: node --check sims/lp2_affine_plainfeedback_joint_original_sft.cjs
      - name: Execute independent plants and actual original-cipher inversion
        run: node sims/lp2_affine_plainfeedback_joint_original_sft.cjs
