name: LP2 period-six original F-clock all-secret exclusion
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-original-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original source exact period-six key family
        run: node sims/lp2_allsecret_period6_ftransparent_exact_sft.cjs
