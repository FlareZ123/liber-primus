name: Agent45 original p50 eight-column keys with plaintext-F clock
on:
  workflow_dispatch:
jobs:
  source-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full original-table F-clock inverse and authentic positive control
        run: node sims/lp2_p50_8column_ftransparent_source_sft.cjs
