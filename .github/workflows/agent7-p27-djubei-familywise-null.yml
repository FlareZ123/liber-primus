name: Agent7 p27 DJU-BEI familywise null

on:
  workflow_dispatch:
  push:
    paths:
      - 'sims/lp2_p27_djubei_familywise_null_sft.cjs'
      - '.github/workflows/agent7-p27-djubei-familywise-null.yml'

permissions:
  contents: read

jobs:
  familywise-null:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run familywise null and capture diagnostics
        shell: pwsh
        env:
          TRIALS: '100000'
        run: |
          node sims/lp2_p27_djubei_familywise_null_sft.cjs *>&1 | Set-Content -Path familywise-output.txt
          $LASTEXITCODE | Set-Content -Path familywise-exit-code.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p27-djubei-familywise-null
          path: |
            familywise-output.txt
            familywise-exit-code.txt
          if-no-files-found: error
      - name: Enforce simulation exit code
        shell: pwsh
        run: |
          $code = [int](Get-Content familywise-exit-code.txt)
          if ($code -ne 0) { exit $code }
