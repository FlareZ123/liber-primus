name: Agent7 p27 DJU-BEI familywise null

on:
  workflow_dispatch:
  push:
    paths:
      - 'sims/lp2_p27_djubei_familywise_null_sft.cjs'
      - '.github/workflows/agent7-p27-djubei-familywise-null.yml'

permissions:
  contents: read
  issues: write

jobs:
  familywise-null:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run familywise null and post raw result
        shell: pwsh
        env:
          TRIALS: '100000'
          GH_TOKEN: ${{ github.token }}
        run: |
          $output = node sims/lp2_p27_djubei_familywise_null_sft.cjs | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $body = "### Agent7 automated familywise calibration`n`nCommit: ``$env:GITHUB_SHA```n`n```json`n$output```"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $payload = @{ body = $body } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/1709/comments" -Method Post -Headers $headers -ContentType "application/json" -Body $payload
