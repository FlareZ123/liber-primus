name: Agent30 2026-11-18 source-bridge SFTs
on:
  workflow_dispatch:

jobs:
  source-bridges:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared2 DH ring selects local COLD branch
        run: node sims/lp2_p50_dh_ring_selects_p0p1_cold_sft.cjs
      - name: Prospective block39 ring-vector holdout
        run: node sims/lp2_p50_dh_ring_block39_holdout_sft.cjs
      - name: 2016 prime ordinals bridge THE ROAD and 3QO
        run: node sims/lp2_2016_prime_ordinals_p0_road_3qo_bridge_sft.cjs
      - name: Independent p28 source-derived DH23 tuple
        run: node sims/lp2_p28_centerline_dh23_sft.cjs
