name: LP2 original 2015 glyph420 source-object locator
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glyph420:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source pinned 2015 original speaker and cited objects
        run: |
          node --check sims/lp2_2015_glyph420_source_object_locator_sft.cjs
          node sims/lp2_2015_glyph420_source_object_locator_sft.cjs
