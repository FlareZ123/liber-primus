name: Manual Cryptanalysis - Word Lengths
on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Select independent source-sorting inverse or existing word-length controls'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - grid-sort
          - block-inverse
permissions:
  contents: read
jobs:
  word-length-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the source-locked grid256 word-sort inverse
        if: ${{ inputs.scan_mode == 'grid-sort' }}
        run: node sims/grid256_word_sort_inverse.cjs
      - name: Exact global eight-column word-order inverse
        if: ${{ inputs.scan_mode == 'block-inverse' }}
        run: node sims/word_block_hamiltonian_inverse.cjs
      - name: Reproduce page-local word-length structural tests
        if: ${{ inputs.scan_mode == 'standard' }}
        run: |
          node sims/test_lp2_word_pages.cjs
          node sims/word_length_order_probe.cjs
          node sims/wordlength_padding_dependence.cjs
          node sims/wordlength_padding_equality.cjs
