name: Agent47 original LP2 microspacing pair diagnostic (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-image dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Assert original-image source and microspacing statistics
        shell: pwsh
        run: python sims/lp2_original_rune_microspacing_sft.py
