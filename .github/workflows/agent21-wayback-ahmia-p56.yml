name: Agent21 2014-2015 Ahmia Wayback p56 search

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-and-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Recover historical Ahmia onion URLs from Wayback
        run: |
          python sims/agent21_wayback_ahmia_urls.py \
            "$RUNNER_TEMP/ahmia-2014-2015-urls.txt" \
            "$RUNNER_TEMP/ahmia-wayback-report.json"
      - name: Clone exact hash and later-corpus inputs
        run: |
          git clone --depth 1 https://github.com/tweqx/3301-hash-alarm.git "$RUNNER_TEMP/hash-alarm"
          git clone --depth 1 https://github.com/kal1gh0st/OSINT.git "$RUNNER_TEMP/onionscan-2016"
          git clone --depth 1 https://github.com/mylamour/onion.scan.result.git "$RUNNER_TEMP/onionscan-2017"
      - name: Hash recovered Ahmia URLs with the full community algorithm set
        run: |
          node sims/agent21_hash_alarm_corpus_sft.js \
            "$RUNNER_TEMP/hash-alarm" \
            "$RUNNER_TEMP/onionscan-2016/onionrunner/onion_result" \
            "$RUNNER_TEMP/onionscan-2017/onion_scan_results" \
            "$RUNNER_TEMP/onionscan-2017/onion_url_list.txt" \
            "$RUNNER_TEMP/agent21-ahmia-p56-report.json" \
            "$RUNNER_TEMP/ahmia-2014-2015-urls.txt"
      - name: Preserve recovery and hash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent21-ahmia-wayback-p56
          path: |
            ${{ runner.temp }}/ahmia-2014-2015-urls.txt
            ${{ runner.temp }}/ahmia-wayback-report.json
            ${{ runner.temp }}/agent21-ahmia-p56-report.json
          if-no-files-found: warn
