name: Agent11 Zenodo 2026 claimed-solve source gate (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read_public_paper:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public PDF reader
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Inspect exact public Zenodo record without storing PDF
        run: python sims/lp2_zenodo_claimed_solve_source_gate.py
