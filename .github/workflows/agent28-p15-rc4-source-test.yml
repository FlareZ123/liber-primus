name: Agent28 p15 RC4 original numeric and GP28 inverse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-original:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original-source RC4 receiver and planted reversibility tests
        shell: pwsh
        run: node sims/lp2_p15_rc4_grid_keysource_sft.cjs
