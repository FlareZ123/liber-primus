name: Agent 40 p50 DIVINITY DES ciphertext direct inverse

on:
  workflow_dispatch:

jobs:
  source-original:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 256-byte source and known plaintext receiver
        shell: pwsh
        run: node sims/lp2_p50_divinity_des_ciphertext_sft.cjs
