name: Agent40 temporary BASE29-to-Latin26 decoder SFT
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run word-integer decoder
        run: |
          node sims/lp2_word_base29_to_latin26_sft.cjs
          node sims/lp2_base29_wordinteger_additive_allsecret_sft.cjs
