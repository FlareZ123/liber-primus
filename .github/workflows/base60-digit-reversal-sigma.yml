name: LP2 base60 digit reversal source-key inversion
on:
  workflow_dispatch:
    inputs:
      nulls:
        description: Shuffled source-cell controls per reading
        required: false
        default: '4'
      variant:
        description: One source reading for targeted power test (optional)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LP2_BASE60_NULLS: ${{ inputs.nulls }}
      LP2_BASE60_VARIANT: ${{ inputs.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sims/base60_digit_reversal_sigma_heldout.cjs
      - run: node sims/base60_digit_reversal_sigma_heldout.cjs
