name: Agent43 P36 Section1 MEANING

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p36-meaning:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p36 section1 MEANING regression
        shell: pwsh
        run: node sims/lp2_p36_section1_meaning_state_sft.cjs
