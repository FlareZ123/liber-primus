name: Agent41 original p32 22-word numeric 11x11 map key gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-original:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact original LP2 map and test direct p33-34 key
        shell: pwsh
        run: |
          node --check sims/lp2_p32_22word_length_coordinate_original_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'CJS source test invalid' }
          node sims/lp2_p32_22word_length_coordinate_original_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Original coordinate test failed' }
