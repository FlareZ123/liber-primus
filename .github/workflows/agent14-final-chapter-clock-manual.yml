name: Agent14 original p54 chapter clock and two-authentic-key inverse

on:
  workflow_dispatch:

jobs:
  original-source:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate both source-selected clock starts and F violations
        run: |
          node --check sims/lp2_p57_circumference_divinity_double_vigenere_sft.cjs
          node sims/lp2_p57_circumference_divinity_double_vigenere_sft.cjs
