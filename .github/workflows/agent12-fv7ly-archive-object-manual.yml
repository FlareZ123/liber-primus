name: Agent12 bounded fv7ly historical archive recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6
      - run: python sims/fv7ly_archived_htaccess_sft.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fv7ly-archive-evidence
          path: fv7ly-evidence/
          retention-days: 30
