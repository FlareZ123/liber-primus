name: Agent12 previous-word prime-state capacity original SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-original-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original and native English control SFT
        run: node sims/lp2_wordprime_nextword_allsecret_sft.cjs
