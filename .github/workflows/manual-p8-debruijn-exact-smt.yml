name: LP2 p8 exact de Bruijn / binary 255 SMT tests

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Select one committed original-source SMT test in sims/'
        required: true
        default: sims/lp2_p8_debruijn_allclass_exact_sft.py

permissions:
  contents: read

jobs:
  original-source-sat:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout original LP2 references
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official Z3Py
        run: python -m pip install z3-solver==5.0.0.0

      - name: Verify selected source-exact SAT / UNSAT and positive controls
        shell: pwsh
        env:
          TEST_SCRIPT: ${{ inputs.script }}
        run: |
          if ($env:TEST_SCRIPT -notmatch '^sims/lp2_p8_(debruijn_allclass_exact_sft|binary255_tree_allsecret_sft)[.]py$') {
            throw 'Only the two reviewed p8 exact SAT studies are accepted'
          }
          if (-not (Test-Path -LiteralPath $env:TEST_SCRIPT -PathType Leaf)) {
            throw 'Requested source SFT is not present'
          }
          & python -- $env:TEST_SCRIPT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
