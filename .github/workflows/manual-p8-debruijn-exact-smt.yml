name: LP2 p8 exact ternary de Bruijn SAT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-sat:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout original LP2 references
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official Z3Py
        run: python -m pip install z3-solver==5.0.0.0

      - name: Verify 243/243 positive and original UNSAT
        run: python sims/lp2_p8_debruijn_allclass_exact_sft.py
