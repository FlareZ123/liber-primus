name: Agent6 LP2 pdir six-section original whole-window verify
on:
  workflow_dispatch:
    inputs:
      reducer_run_id:
        description: Completed strict six-section original reducer run ID
        required: true
        type: string
      source_run_id:
        description: Immutable six-section 216-job original input run ID
        required: true
        default: "44075903575"
        type: string
permissions:
  contents: read
  actions: read
jobs:
  inspect-original-reducer:
    runs-on: windows-latest
    outputs:
      candidate_count: ${{ steps.gate.outputs.candidate_count }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: "${{ inputs.reducer_run_id }}"
          name: original-lp2-pdir-sixsection-complete-screen
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: source-reducer
      - name: Validate 216-shard source matrix and freeze actual candidates
        id: gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content -LiteralPath 'source-reducer/lp2-pdir-original-sixsection.json' -Raw | ConvertFrom-Json
          if ($m.six_section_run -ne [long]"${{ inputs.source_run_id }}" -or $m.six_section_run -ne 44075903575) { throw "Wrong original source run" }
          if ($m.original_vectors -ne 2376 -or $m.matched_random_vectors -ne 396 -or $m.streams_per_vector -ne 581) { throw 'Incomplete source matrix' }
          $n = [int]$m.screen_candidate_count
          if ($n -ne @($m.screen_candidates).Count) { throw 'Frozen candidates/count differ' }
          "candidate_count=$n" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Original screen hits: $n"
  verify-original:
    needs: inspect-original-reducer
    if: needs.inspect-original-reducer.outputs.candidate_count != '0'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external-cicada3301
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference engine dependencies and atomic locks
        run: python -m pip install numpy mpmath filelock
      - name: Build pinned original-cipher reference inverse
        run: cargo build --release --manifest-path external-cicada3301/work/kscreen/Cargo.toml
      - name: Reconstruct all authentic original source and direction rules
        run: |
          python external-cicada3301/work/kscreen/export.py
          python external-cicada3301/work/kscreen/signrules.py
          python external-cicada3301/work/kscreen/dirrules.py
          python sims/lp2_pdir_issue1329_gate.py external-cicada3301
      - uses: actions/download-artifact@v4
        with:
          run-id: "${{ inputs.reducer_run_id }}"
          name: original-lp2-pdir-sixsection-complete-screen
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: source-reducer
      - name: Retrieve only the exact frozen original candidate shard artifacts
        shell: pwsh
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content -LiteralPath 'source-reducer/lp2-pdir-original-sixsection.json' -Raw | ConvertFrom-Json
          $artifacts = @($m.screen_candidates | ForEach-Object {
            $artifact = (($_.file -replace '\\', '/') -split '/')[0]
            if ($artifact -notmatch '^pdir-sixsections-[0-2]{3}-(?:[0-9]|1[01])$') { throw "Unexpected source candidate path: $($_.file)" }
            if (-not $artifact.StartsWith("pdir-sixsections-$($_.convention)-")) { throw "Wrong convention artifact: $artifact" }
            $artifact
          } | Sort-Object -Unique)
          foreach ($artifact in $artifacts) {
            $dest = Join-Path 'from-sixsections' $artifact
            gh run download "${{ inputs.source_run_id }}" --repo FlareZ123/liber-primus --dir $dest --name $artifact
            if ($LASTEXITCODE -ne 0) { throw "Failed exact original artifact: $artifact" }
          }
      - name: Verify each original threshold hit against six complete sections and 20 wrong offsets
        run: |
          python sims/lp2_pdir_stage2_verify_candidates.py --manifest source-reducer/lp2-pdir-original-sixsection.json --artifacts from-sixsections --external external-cicada3301 --out original-sixsection-whole-window
      - name: Preserve actual GP29 candidate plaintext and matched-offset controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-pdir-sixsection-fullwindow-verified-original
          if-no-files-found: warn
          path: |
            original-sixsection-whole-window/
            external-cicada3301/results/kscreen/pdir/issue1329-sixsection-autoverify/
