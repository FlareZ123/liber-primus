name: Agent23 historical 2015 OutGuess payload comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Liber Primus research and original JPEGs
        uses: actions/checkout@v4

      - name: Install Python, compiler and JPEG development library
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential libjpeg-dev git

      - name: Retrieve the immutable January 2015 participant repository
        run: |
          git clone https://github.com/thomasandfriends/Cicada3301Runes.git /tmp/cicada2015
          git -C /tmp/cicada2015 checkout --detach 52e5c7e4827d81ffc705ef61ac0217c9bdd6ff35
          test "$(git -C /tmp/cicada2015 rev-parse HEAD)" = "52e5c7e4827d81ffc705ef61ac0217c9bdd6ff35"

      - name: Compare saved 2015 OutGuess payloads against both image vintages
        run: |
          python3 sims/lp2_2015_outguess_payload_comparison_sft.py /tmp/cicada2015 --out-dir outguess-2015-comparison

      - name: Preserve exact historical and canonical XOR outputs and comparison summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-2015-outguess-historical-payload-comparison
          path: outguess-2015-comparison/
          if-no-files-found: warn
          retention-days: 30
