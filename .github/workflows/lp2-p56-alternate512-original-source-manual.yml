name: LP2 AN END alternate 512-bit original-source digests

on:
  workflow_dispatch:

jobs:
  source-original-alternate-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install exact alternate digest implementations
        run: python -m pip install --disable-pip-version-check 'pyskein==1.0' 'gostcrypto==1.2.5'
      - name: Hash exact original p56 candidate file bytes with published KATs
        run: python sims/lp2_p56_alternate512_original_source_sft.py
