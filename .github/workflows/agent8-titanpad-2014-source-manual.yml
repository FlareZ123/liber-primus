name: Agent8 original May 2014 Titanpad public-index lookup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact source-selected 2014 workpad in public CDX
        run: node sims/lp2_2014_titanpad_cdx_source_sft.cjs
      - name: Replay five indexed April-July 2016 workpad responses
        run: node sims/lp2_2016_titanpad_wayback_replay_sft.cjs
      - name: Inspect original pad for p56 destination context
        run: node sims/lp2_2016_titanpad_p56_context_sft.cjs
