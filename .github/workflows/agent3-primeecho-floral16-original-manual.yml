name: Agent3 original prime_echo 16x29 floral-page GP29 inverse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floral-original:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and original-key/source-runic inverse
        run: |
          node --check sims/lp2_2013_primeecho_floral16_29page_sft.cjs
          node sims/lp2_2013_primeecho_floral16_29page_sft.cjs | tee floral-original-16x29.json
      - name: Preserve 16-page original findings
        uses: actions/upload-artifact@v4
        with:
          name: original-primeecho-floral16-29row
          path: floral-original-16x29.json
          retention-days: 90
