name: P10 literal seven-G source bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and original-source SFT
        run: |
          node --check sims/lp2_p10_literal7g_red119_bridge_sft.cjs
          node sims/lp2_p10_literal7g_red119_bridge_sft.cjs
          node --check sims/lp2_p10_7g_p50_gem_crossartifact_sft.cjs
          node sims/lp2_p10_7g_p50_gem_crossartifact_sft.cjs
