name: Signed 2012 omitted-coordinate poster QR archival recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documented zxing-cpp image QR decoder
        run: python -m pip install --disable-pip-version-check "zxing-cpp==3.0.0" "Pillow==11.3.0" "qrcode==8.2"
      - name: Decode five original-image archive-bound photo controls
        run: python sims/cicada2012_missingcoordinate_poster_qr_sft.py
      - name: Source-only 2012 Seoul truncated QR to signed ten filename candidate gate
        run: python sims/cicada2012_seoul_partial_qr_10source_gate.py
