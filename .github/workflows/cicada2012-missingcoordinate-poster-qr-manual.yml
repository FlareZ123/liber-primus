name: Signed 2012 omitted-coordinate poster QR archival recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documented zxing-cpp image QR decoder
        run: python -m pip install --disable-pip-version-check "zxing-cpp==3.0.0" "Pillow==11.3.0"
      - name: Decode five original-image archive-bound photo controls
        run: python sims/cicada2012_missingcoordinate_poster_qr_sft.py
        env:
          SHOW_SEOUL_ORIGINAL: '1'
