name: Agent15 p32 SEEKS ARE SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run p32 SEEKS route ARE SFT
        shell: pwsh
        run: node sims/lp2_p32_seeks_route_are_readout_sft.cjs
      - name: Run p32 state-native THE SFT
        shell: pwsh
        run: node sims/lp2_p32_state_native_the_readout_sft.cjs
      - name: Run p32 coordinate-number direction SFT
        shell: pwsh
        run: node sims/lp2_p32_coordinate_number_direction_sft.cjs
