name: LP2 p56 hash-IV table AES-256 source gate
on:
  workflow_dispatch:
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test frozen source-selected IV and table keys against original GP29
        run: node sims/lp2_p56_hashiv_grid_aes256_source_sft.cjs
