name: Source-marked red triangle field79 AES/ChaCha inverse
on:
  workflow_dispatch:
jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run original LP2 and true-source GP-English plant
        run: node sims/red_triangle_field79_aes_inverse.cjs
