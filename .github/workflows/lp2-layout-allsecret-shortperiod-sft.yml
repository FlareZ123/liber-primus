name: LP2 original 23-layout all-secret short-period inverse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exhaustive secret 8- and 13-symbol layout-key optimization and blind controls
        shell: pwsh
        run: |
          node sims/lp2_layout_23rules_allsecret_8_13_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'All-secret original-source inversion regression failed' }
