name: Agent44 p56 2014 Onion5 signed-media hash gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-media-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify OpenSSL 3 legacy Whirlpool provider
        run: |
          openssl version
          openssl list -digest-algorithms -provider legacy | grep -i whirlpool
      - name: Test exact signed-media source forms against p56
        run: |
          python3 -m py_compile sims/lp2_p56_onion5_signed_media_hash_gate.py
          python3 sims/lp2_p56_onion5_signed_media_hash_gate.py | tee "$RUNNER_TEMP/p56-onion5-media-hash.json"
      - name: Preserve raw result
        uses: actions/upload-artifact@v4
        with:
          name: p56-onion5-signed-media-hash-gate
          path: ${{ runner.temp }}/p56-onion5-media-hash.json
          if-no-files-found: error
