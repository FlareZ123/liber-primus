name: Agent24 original GP29 word-chain all-secret gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-word-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original word-key chain against source-native controls
        run: node sims/lp2_word_chain_allsecret_affine_sft.cjs
