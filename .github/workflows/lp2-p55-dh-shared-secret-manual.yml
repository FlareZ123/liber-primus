name: LP2 p55 historically typed DH shared-secret receiver
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original p55 shared secret and p57 positive
        run: node sims/lp2_p55_dh_shared_secret_original_sft.cjs
