name: Agent1 p50 GF29 dual-tap original inverse gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reversible original LP2 GP29 and genuine native positive
        run: node sims/lp2_p50_bit0_fieldunit_dualtap_original_sft.cjs
