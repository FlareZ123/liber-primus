name: LP2 p15 TWIN PRIME / WILL BE FOUND × DATA-560.13 fixed-offset crib
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-offset-crib:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download authentic DATA/560.13
        shell: pwsh
        run: |
          $file = "$env:RUNNER_TEMP\\560.13"
          curl.exe -fL --retry 3 --retry-delay 2 "https://archive.org/download/3301.iso/3301.iso/DATA/560.13" -o $file
          if ((Get-Item $file).Length -ne 118818811) { throw "Unexpected DATA/560.13 length" }
      - name: Run fixed-offset source crib
        shell: pwsh
        run: node sims/lp2_p15_56013_twinprime_willbefound_crib_sft.cjs "$env:RUNNER_TEMP\\560.13"
