name: Temporary block39 original-source continuation audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frozen rules 00-15 on original and 100 fixed-anchor nulls
        shell: pwsh
        run: |
          node sims/external27_block39_complete_gate.cjs 100
          if ($LASTEXITCODE -ne 0) { throw 'Original-input audit failed' }
