name: 2012 MIDI signed-email verification and p56 exact-page gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signed-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import the preserved Cicada 2012 public key
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --batch --import resources/historical/cicada-3301-2012-public-key.asc
      - name: Verify the exact archived clear-signed MIDI email
        run: |
          set -euo pipefail
          gpg --batch --status-fd 1 --verify resources/historical/cicada2012-midi-email.asc 2>&1 | tee "$RUNNER_TEMP/verify.log"
          grep -F '[GNUPG:] GOODSIG 181F01E57A35090F' "$RUNNER_TEMP/verify.log"
      - name: Audit and verify the embedded signed MIDI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path("resources/historical/cicada2012-midi-email.asc").read_text().splitlines()
          start = lines.index("- -----BEGIN PGP MESSAGE-----")
          end = lines.index("- -----END PGP MESSAGE-----", start)
          block = lines[start:end + 1]
          assert block[0].startswith("- ") and block[-1].startswith("- ")
          block[0] = block[0][2:]
          block[-1] = block[-1][2:]
          out = Path(os.environ["RUNNER_TEMP"]) / "cicada2012-midi.pgp"
          out.write_text("\n".join(block) + "\n")
          PY
          gpg --batch --list-packets "$RUNNER_TEMP/cicada2012-midi.pgp" > "$RUNNER_TEMP/inner-packets.log" 2>&1
          grep -F ':compressed packet: algo=1' "$RUNNER_TEMP/inner-packets.log"
          grep -F ':onepass_sig packet: keyid 181F01E57A35090F' "$RUNNER_TEMP/inner-packets.log"
          grep -F ':literal data packet:' "$RUNNER_TEMP/inner-packets.log"
          grep -F 'name="Cicada.mid"' "$RUNNER_TEMP/inner-packets.log"
          grep -F ':signature packet: algo 1, keyid 181F01E57A35090F' "$RUNNER_TEMP/inner-packets.log"
          if grep -Ei 'pubkey enc packet|symkey enc packet|encrypted data packet|integrity protected encrypted data packet|AEAD encrypted data packet' "$RUNNER_TEMP/inner-packets.log"; then
            echo "Unexpected encrypted packet in the embedded MIDI message" >&2
            exit 1
          fi
          gpg --batch --decrypt --output "$RUNNER_TEMP/Cicada.mid" "$RUNNER_TEMP/cicada2012-midi.pgp" 2>&1 | tee "$RUNNER_TEMP/inner-verify.log"
          grep -F 'Good signature from "Cicada 3301 (845145127)"' "$RUNNER_TEMP/inner-verify.log"
          test "$(wc -c < "$RUNNER_TEMP/Cicada.mid")" -eq 10889
          printf '%s  %s\n' 'e6c5b86bb1a95f1a2239237eaf9d060ba708f07d46ffe8c4bce4fca06a5c529c' "$RUNNER_TEMP/Cicada.mid" | sha256sum -c -
          test "$(git hash-object "$RUNNER_TEMP/Cicada.mid")" = '11924e0e195208c2eea757655035e149fb8a190f'
          echo "Verified signed literal MIDI; embedded PGP block is compressed, not encrypted."
          cat "$RUNNER_TEMP/inner-packets.log"
      - name: Verify embedded 2012 onion root-page signature
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path("resources/external/2012-sq6wmgv2zcsrix6t-onion-index.html").read_bytes()
          match = re.search(rb"-----BEGIN PGP SIGNED MESSAGE-----\r?\n.*?-----END PGP SIGNATURE-----\\r?\\n", source, re.S)
          if not match:
              raise SystemExit("signed message block not found in exact archived HTML")
          pathlib.Path(os.environ["RUNNER_TEMP"], "2012-onion-root-signed-message.asc").write_bytes(match.group(0))
          PY
          log="$RUNNER_TEMP/2012-onion-root-signature.verify.log"
          gpg --batch --status-fd 1 --verify "$RUNNER_TEMP/2012-onion-root-signed-message.asc" > "$log" 2>&1
          grep -F '[GNUPG:] GOODSIG 181F01E57A35090F' "$log"
      - name: Verify the other exact 2012 signed pages and test p56 candidates
        run: |
          set -euo pipefail
          for f in resources/historical/cicada2012-countdown-message.asc resources/historical/cicada2012-message-only-displayed.asc; do
            log="$RUNNER_TEMP/$(basename "$f").verify.log"
            gpg --batch --status-fd 1 --verify "$f" > "$log" 2>&1
            grep -F '[GNUPG:] GOODSIG 181F01E57A35090F' "$log"
          done
          node sims/lp2_p56_2012_second_chance_page_sha512_gate.cjs "$RUNNER_TEMP/Cicada.mid" | tee "$RUNNER_TEMP/p56-2012-candidates.json"
      - name: Export raw MIDI note/time coordinates against the LP2 table
        run: |
          set -euo pipefail
          python3 sims/cicada2012_midi_event_extract.py "$RUNNER_TEMP/Cicada.mid" "$RUNNER_TEMP/cicada2012-midi-events.json"
      - name: Preserve exact MIDI and event coordinates
        uses: actions/upload-artifact@v4
        with:
          name: cicada2012-midi-events
          path: |
            ${{ runner.temp }}/Cicada.mid
            ${{ runner.temp }}/cicada2012-midi-events.json
            ${{ runner.temp }}/p56-2012-candidates.json
          if-no-files-found: error
