name: LP2 red-span pointer/totient triangle
on:
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/red_span_triangle.cjs
      - run: node sims/red_prime_gap_affine_echo.cjs
      - run: node sims/red_t6_ea_joint_source_gate.cjs
