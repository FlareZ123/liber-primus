name: Wordwise inverse and Fibonacci differential controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/test_lp2_word_pages.cjs
      - name: Scan original long rune words with algebraically unrestricted six-rune keys
        run: |
          set -o pipefail
          node sims/word_period6_exact_T_inverse.cjs | tee word-period6-inverse.json
          node sims/word_fibonacci_exact_inverse.cjs | tee word-fibonacci-inverse.json
            word-fibonacci-differential.json
          node sims/word_fibonacci_differential_invariant.cjs 100 | tee word-fibonacci-differential.json
      - uses: actions/upload-artifact@v4
        with:
          name: wordwise-exact-inverses
          retention-days: 90
          path: |
            word-period6-inverse.json
            word-fibonacci-inverse.json
