name: Agent27 ROAD/PATHS source-derived key SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce source-derived ROAD key
        shell: pwsh
        run: node sims/lp2_road_paths_signed_index_depth_key_sft.cjs
