name: Agent18 signed 2016 word-pointer source gate
on:
  push:
    paths:
      - "sims/lp2_signed2016_backward_prime_pointer_ftransparent_sft.cjs"
      - ".github/workflows/agent18-signed2016-pointer-ftransparent.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed2016-pointer:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: node --check sims/lp2_signed2016_backward_prime_pointer_ftransparent_sft.cjs
      - name: Source-authenticated positive and original reachable paths
        run: node sims/lp2_signed2016_backward_prime_pointer_ftransparent_sft.cjs
