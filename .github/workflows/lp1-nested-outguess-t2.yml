name: LP1 nested OutGuess T2 reproduction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lp1-nested-outguess-t2.yml"
      - "sims/lp1_nested_outguess_t2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install OutGuess build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential libjpeg-dev

      - name: Build pinned OutGuess 0.4
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          git -C /tmp/outguess fetch --depth 1 origin 24810e14327c2bbeedeaadd3e24491f2a4425c02
          git -C /tmp/outguess checkout --detach 24810e14327c2bbeedeaadd3e24491f2a4425c02
          cd /tmp/outguess
          ./autogen.sh
          CFLAGS='-O2 -std=gnu11' ./configure --with-generic-jconfig
          make -j2 CC='gcc -std=gnu11' CFLAGS='-O2 -std=gnu11'
          sudo make install
          /usr/local/bin/outguess -V || true
          git rev-parse HEAD

      - name: Reproduce page03 -> hidden 2.jpg -> source-key candidates
        run: |
          set -euo pipefail
          python3 sims/lp1_nested_outguess_t2.py \
            --outguess /usr/local/bin/outguess \
            --image resources/liber-primus/03.jpg \
            --out-dir lp1-nested-artifacts

      - name: Run independent T2 direct-key tests if a source key reproduces T2
        run: |
          set -euo pipefail
          if [ ! -f lp1-nested-artifacts/T2.bin ]; then
            echo "No candidate reproduced seed 38370 / length 7524; see manifest and candidate logs."
            exit 0
          fi
          git clone --depth 1 https://github.com/Dukotah/cicada3301.git /tmp/dukotah
          mkdir -p /tmp/dukotah/liber-primus/analysis/armada_osint/extracts
          cp lp1-nested-artifacts/T2.bin \
            /tmp/dukotah/liber-primus/analysis/armada_osint/extracts/T2.bin
          cd /tmp/dukotah/liber-primus
          PYTHONUTF8=1 python3 analysis/armada_osint/t2_keytest.py \
            2>&1 | tee "$GITHUB_WORKSPACE/lp1-nested-artifacts/t2_keytest.log"
          PYTHONUTF8=1 python3 analysis/armada_osint/t2_xortest.py \
            2>&1 | tee "$GITHUB_WORKSPACE/lp1-nested-artifacts/t2_xortest.log"

      - name: Upload reproducible extraction and test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp1-nested-outguess-t2
          path: lp1-nested-artifacts/
          if-no-files-found: warn
