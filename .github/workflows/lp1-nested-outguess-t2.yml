name: LP1 nested OutGuess T2 reproduction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lp1-nested-outguess-t2.yml"
      - "sims/lp1_nested_outguess_t2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install OutGuess build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libjpeg-dev zlib1g-dev

      - name: Build pinned OutGuess 0.4
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          git -C /tmp/outguess checkout 24810e14327c2bbeedeaadd3e24491f2a4425c02
          cd /tmp/outguess
          ./configure
          make -j2
          ./outguess -V || true
          git rev-parse HEAD

      - name: Reproduce page03 -> hidden 2.jpg -> T2.bin
        run: |
          python3 sims/lp1_nested_outguess_t2.py \
            --outguess /tmp/outguess/outguess \
            --image resources/liber-primus/03.jpg \
            --out-dir lp1-nested-artifacts

      - name: Run independent T2 direct-key tests
        run: |
          git clone --depth 1 https://github.com/Dukotah/cicada3301.git /tmp/dukotah
          mkdir -p /tmp/dukotah/liber-primus/analysis/armada_osint/extracts
          cp lp1-nested-artifacts/T2.bin \
            /tmp/dukotah/liber-primus/analysis/armada_osint/extracts/T2.bin
          cd /tmp/dukotah/liber-primus
          PYTHONUTF8=1 python3 analysis/armada_osint/t2_keytest.py \
            2>&1 | tee "$GITHUB_WORKSPACE/lp1-nested-artifacts/t2_keytest.log"

      - name: Upload reproducible extraction and test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp1-nested-outguess-t2
          path: lp1-nested-artifacts/
          if-no-files-found: warn
