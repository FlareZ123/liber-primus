name: Agent40 original terminal256 affine-byte-stream gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-planted:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original LP2 256-cell byte-stream inversion and planted controls
        run: node sims/lp2_terminal180_prng_original_gate_sft.cjs
      - name: Source red256 all-secret codebook inverse and blind p55 control
        run: node sims/lp2_terminal180_red256_codebook_gate_sft.cjs
      - name: Original GP29-native all-secret type codebook and blind terminal inverse
        run: node sims/lp2_terminal180_red256_gp29_original_gate_sft.cjs
