name: LP2 p0-2 all-secret 27x27 grouped-code invariant

on:
  workflow_dispatch:

jobs:
  source-invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 729-rune and native GP-English grouped-code invariants
        run: node sims/lp2_p0_allsecret_27group_invariant_sft.cjs
      - name: Source-native original LP2 F-transparent clause-prime parity gate
        run: node sims/lp2_f_literal_clause_parity_sft.cjs
