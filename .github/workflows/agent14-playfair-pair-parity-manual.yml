name: Agent14 original LP2 Playfair pair-parity invariant

on:
  workflow_dispatch:

jobs:
  original-playfair-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check sims/lp2_playfair_digraph_parity_original_sft.cjs
      - name: Verify original 86 sites and solved-p57 5x6 Playfair plant
        run: node sims/lp2_playfair_digraph_parity_original_sft.cjs
