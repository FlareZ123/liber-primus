name: Agent38 LP2 source-original all-secret gates

on:
  workflow_dispatch:

jobs:
  original-source-gates:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out original GP rune corpus and tests
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify p0/p16 all-secret thirteen-lag plaintext autokey invariant
        run: node sims/lp2_plaintext_autokey_k13_allsecret_sft.cjs
      - name: Verify physical p13 fold and frozen exposed-key original p14/p15
        run: node sims/lp2_p13_p14_physical_fold_pair_invariant_sft.cjs
