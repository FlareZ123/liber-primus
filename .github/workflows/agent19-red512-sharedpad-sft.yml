name: Agent19 red512 shared-pad original-cipher SFT
on:
  push:
    paths:
      - .github/workflows/agent19-red512-sharedpad-sft.yml
      - sims/lp2_p27_p54_red512_sharedpad_original_sft.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-original-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp2_p27_p54_red512_sharedpad_original_sft.cjs
