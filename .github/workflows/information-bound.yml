name: LP2 homophonic information bound
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  information-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce pinned-source information bound
        run: python sims/homophonic_information_bound.py
