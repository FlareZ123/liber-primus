name: LP2 original-grid SHA message-schedule gates (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source-byte and positive-control SHA-2 expansion SFT
        run: node sims/lp2_p50_sha2_message_schedule_sft.cjs
      - name: Original source-grid SHA-1 recurrence and positive plant
        run: node sims/lp2_p50_sha1_schedule_original_sft.cjs
