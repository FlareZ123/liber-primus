name: Agent5 Cicada original audio note-stream test (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent5-audio-note-source
  cancel-in-progress: false

jobs:
  decode-original-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible signal-analysis packages
        run: python -m pip install --disable-pip-version-check "librosa==0.11.0" "mido==1.3.3" "numpy==2.2.6" "scipy==1.16.2"
      - name: Verify Python source compiles
        run: python -m py_compile sims/lp2_cicada_audio_note_2012_source_sft.py
      - name: Fetch and authenticate 2012 MIDI and 2013-2014 original audio, then run original input
        run: python -u sims/lp2_cicada_audio_note_2012_source_sft.py
      - name: Preserve exact event counts, source SHA and independent note screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-original-audio-note-source
          path: lp2-audio-note-source-results.json
          retention-days: 30
          if-no-files-found: warn
