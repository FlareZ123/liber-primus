name: Agent6 bookend prime mean full words source gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original prime-mean channel and controls
        run: node sims/lp2_bookend_prime_mean_fullwords_original_sft.cjs
