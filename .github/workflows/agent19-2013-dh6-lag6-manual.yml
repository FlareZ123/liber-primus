name: Agent 19 signed 2013 DH6 lag-six bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-source-bridge:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original ciphertext with historical-source affine family
        shell: pwsh
        run: node sims/lp2_2013_dh6_lag6_signed_source_bridge_sft.cjs
      - name: Test original p39 red lag-5 S selector
        shell: pwsh
        run: node sims/lp2_p39_red515_s5_source_selector_sft.cjs
