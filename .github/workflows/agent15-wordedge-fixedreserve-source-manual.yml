name: "Agent15 LP2 word-boundary fixed-reserve original source gate"
on:
  workflow_dispatch:

jobs:
  original-source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Original source, lexical, and reversible cipher SFT
        run: node sims/lp2_wordedge_fixedreserve_source_sft.cjs
