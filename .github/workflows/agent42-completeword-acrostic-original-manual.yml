name: Agent42 complete-word acrostic original input

on:
  workflow_dispatch:

jobs:
  original-source-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original LP2 complete-word acrostic and reversible native controls
        run: node sims/lp2_completeword_acrostic_progressive_original_sft.cjs
