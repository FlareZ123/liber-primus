name: Agent28 original word-local five-phase secret alphabet gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-original five-phase substitution and matched word controls
        run: |
          node --check sims/lp2_wordlocal_fivephase_secret_alphabet_source_sft.cjs
          node sims/lp2_wordlocal_fivephase_secret_alphabet_source_sft.cjs
