name: Agent17 original red-rubric all-secret row gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-gp-original-gate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical Liber Primus corpus
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original GP29 rubric S-box all-key proof and source-native controls
        run: node sims/lp2_rubric_symbol_secret_permutation_sft.cjs
