name: Agent12 original LP2 58-JPEG RIGHT-source OutGuess exact key
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-selected-right-outguess:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Check out original archived JPEG and source test
        uses: actions/checkout@v4
      - name: Install native libjpeg development headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjpeg-dev
      - name: Run authenticated LP1 positive and all 58 original JPEGs with one derived RIGHT key
        run: python3 sims/lp2_2014_html_right_outguess_58source_sft.py
