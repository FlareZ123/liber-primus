name: Agent18 P50 zero-suffix p57 original
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-gate:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-frozen GP29 and SHA512 SFT
        run: node sims/lp2_p50_zero_suffix_p57_phrase_sft.cjs
      - name: Run source-frozen original 8x8 Hill6 inverse
        run: node sims/lp2_p50_final8_square_hill6_original_sft.cjs
