name: Agent15 LP2 P7 GF29-square full unit inverse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-field-unit-screen:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all 840 field-unit original pair inverses and source native controls
        shell: pwsh
        run: node sims/lp2_p7_field56_original_pair_inverse_sft.cjs
