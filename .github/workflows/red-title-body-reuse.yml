name: Red title body shared-pad discriminator
on:
  workflow_dispatch:
jobs:
  discriminate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test original LP2 and planted shared-pad controls
        run: node sims/red_title_body_key_reuse.cjs
