name: Label-free spectral key reuse
on:
  workflow_dispatch:
jobs:
  spectral-key:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/spectral_pad_synchrony.cjs
