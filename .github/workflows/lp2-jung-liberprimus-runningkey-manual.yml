name: LP2 original Jung Liber Primus complete running-key attack (manual)

on:
  workflow_dispatch:

jobs:
  jung-running-key:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout unmodified 58-page LP2 source corpus
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install supported PDF reader
        run: python -m pip install "pymupdf>=1.25,<2"
      - name: Download independently chosen Jung 2009 text and exhaust GP29 source offsets
        run: python sims/lp2_jung_liberprimus_runningkey_sft.py
