name: Agent1 source-anchored p55/p27 backward tape original-source SFT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-input:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source bridge, both complete p55 inverses and native p57 controls
        shell: pwsh
        run: |
          node sims/lp2_p55_p27_seam_openpuff_password_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Original source password derivation failed' }
          node sims/lp2_p55_p27_bridge_backward_wrap_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Original p55 inverse gate failed' }
