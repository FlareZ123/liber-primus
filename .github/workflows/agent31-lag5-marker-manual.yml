name: Agent 31 lag-five cipher-family source gates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-cipher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node sims/lp2_lag5_reserved_rune_triple_word_sft.cjs
      - run: node sims/lp2_wordlocal_fivephase_allword_lexical_capacity_sft.cjs
