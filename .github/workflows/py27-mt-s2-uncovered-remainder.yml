    steps:
      - name: Fetch pinned reference implementation and model
        uses: actions/checkout@v4
        with:
          repository: Dukotah/cicada3301
          ref: f63501d8f2d835b80c30230eb89a1110fb9197d2
          path: upstream
          sparse-checkout: |
            liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy
      - name: Check model hash, compile, self-test
        working-directory: upstream/liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy
        run: |
          python3 check_panel_gate.py
          gcc -O2 -Wall -Wextra -std=gnu17 -fopenmp -ffp-contract=off -o grind27 grind27.c -lm
          ./grind27 --data engine.dat --self-test
      - name: Run previously uncovered disjoint S2 interval
        working-directory: upstream/liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy
        env:
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          mkdir -p sweep-run
          python3 -c 'import os,json; json.dump([{"lane":"S2","reducer":"random29","relation":"exact","offset":0,"from":int(os.environ["START"]),"to":int(os.environ["END"]),"cand_bar":5.0,"claim_bar":7.6341931878728095}],open("sweep-plan.json","w"))'
          GRIND27_S2_CONTROL_OK=1 ./grind27 --data engine.dat --plan sweep-plan.json --threads 4 --run-dir sweep-run
          python3 -c 'import json; s=json.load(open("sweep-run/STATUS.json")); print("FINAL",json.dumps({"coverage":s["aggregate"],"from":s["from"],"to":s["to"],"hits":s["flagged_survivors"]},separators=(",",":")))'
      - name: Preserve observations and candidates for independent oracle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt-exact-remainder-${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            upstream/liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy/sweep-plan.json
            upstream/liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy/sweep-run/STATUS.json
            upstream/liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy/sweep-run/HIT-CANDIDATE.json
            upstream/liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy/sweep-run/top_S2.json
            upstream/liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy/sweep-run/hist_S2.u64
            upstream/liber-primus/analysis/round36/P1-panel-r36/engine_inputs_copy/sweep-run/candidates.jsonl
