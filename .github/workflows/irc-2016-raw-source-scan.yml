name: Historical 2016 IRC raw Git blob scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and hash-verify original IRC blobs
        run: python3 sims/irc_2016_raw_blob_source_scan.py
