name: Agent37 original finder plus November claim source check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Original LP2 Aztec-core all-secret gate
        shell: pwsh
        run: node sims/lp2_aztec_compact_27x27_finder_original_sft.cjs
      - name: Inspect 17 November 2026 external plaintext claim at exact public URLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $urlList = @(
            'https://21skibidiserb37.gitlab.io/xyzsolving333/',
            'https://21skibidiserb37-gitlab-io-e46f79.gitlab.io/',
            'https://www.reddit.com/r/mystery/comments/1x0432x.json?raw_json=1'
          )
          foreach ($u in $urlList) {
            Write-Output "CLAIM_URL=$u"
            try {
              $response = Invoke-WebRequest -Uri $u -TimeoutSec 15 -ErrorAction Stop
              Write-Output "STATUS=$($response.StatusCode); LENGTH=$($response.Content.Length)"
              $body = $response.Content -replace '<script[\\s\\S]*?</script>', '' -replace '<style[\\s\\S]*?</style>', ''
              $body = $body -replace '<[^>]+>', ' ' -replace '\\s+', ' '
              $sample = $body.Substring(0, [Math]::Min(14000, $body.Length))
              Write-Output "BODY_HEAD=$sample"
            } catch {
              Write-Output "HTTP_ERROR=$($_.Exception.Message)"
            }
          }
