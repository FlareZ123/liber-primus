name: p56 intragroup multiset prime-clock inverse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run exact multiset inverse and native controls
        run: node sims/lp2_p56_intragroup_multiset_prime_clock_sft.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: lp2-p56-intragroup-multiset-prime-clock
          path: im-results/lp2-p56-intragroup-multiset-prime-clock-output.json
          if-no-files-found: error
