name: LP2 original May 2014 ZIP mirror recovery

on:
  workflow_dispatch:
    inputs:
      source:
        description: Original archive source to check
        type: choice
        required: true
        default: commoncrawl
        options:
          - commoncrawl
          - commoncrawl-raw
          - wayback-arquivo

permissions:
  contents: read

jobs:
  exact-archive-mirror:
    if: ${{ inputs.source == 'wayback-arquivo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check self-contained source
        run: node --check sims/lp2_2014_original_zip_mirror_recovery.cjs
      - name: Archive index native plant control
        run: node sims/lp2_2014_original_zip_mirror_recovery.cjs --selftest
      - name: Check exact period-named mirror URLs
        run: node sims/lp2_2014_original_zip_mirror_recovery.cjs
      - name: Preserve source-index results and recovered original bytes
        uses: actions/upload-artifact@v4
        with:
          name: original-2014-named-zip-mirror
          path: mirror-2014-original-recovery/

  source-commoncrawl:
    if: ${{ inputs.source == 'commoncrawl' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original mirror probe syntax and parser plant
        run: |
          node --check sims/lp2_2014_commoncrawl_mirror_probe.cjs
          node sims/lp2_2014_commoncrawl_mirror_probe.cjs --selftest
      - name: Query the 2014–2015 source-named ZIP and directory indexes
        run: node sims/lp2_2014_commoncrawl_mirror_probe.cjs
      - name: Preserve original indexed archive records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-2014-commoncrawl-mirror
          path: mirror-2014-original-recovery/commoncrawl-index.json
          if-no-files-found: error

  raw-index-commoncrawl:
    if: ${{ inputs.source == 'commoncrawl-raw' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone direct-raw archive reader
        run: |
          node --check sims/lp2_2014_commoncrawl_raw_s3_sft.cjs
          node sims/lp2_2014_commoncrawl_raw_s3_sft.cjs --selftest
      - name: Search first two source-era raw indexes
        run: node sims/lp2_2014_commoncrawl_raw_s3_sft.cjs
      - name: Archive exact source-key index evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-2014-commoncrawl-raw-index
          path: mirror-2014-original-recovery/commoncrawl-raw-index.json
          if-no-files-found: error
