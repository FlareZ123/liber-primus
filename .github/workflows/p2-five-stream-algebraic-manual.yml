name: LP2 p2 five-stream original-cipher algebraic gates

on:
  workflow_dispatch:

jobs:
  exact-gf29-ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all-secret separable-additive gate
        run: node sims/lp2_p2_p23_five_stream_separable_rank_sft.cjs
      - name: Check sharp quartic degree and planted controls
        run: node sims/lp2_p2_p23_polynomial_degree_gate_sft.cjs
      - name: Check historical 984-bit SSSS against original p2 with XTEA
        run: node sims/lp2_p23_26_ssss984_p2_original_gate_sft.cjs
      - name: Install Boost multiprecision headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - name: Build complete historical 984-bit SSSS XTEA plaintext gate
        run: g++ -std=c++20 -O3 sims/lp2_p23_26_ssss984_full_xtea_ascii_sft.cpp -o ssss-984-check
      - name: Decode all 120960 original SSSS share assignments
        run: ./ssss-984-check
