name: Agent41 red32 source AES ChaCha original inverse
on:
  workflow_dispatch:
jobs:
  verify-source-original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original ciphertext and source-control inversion
        run: node sims/red32_aes_chacha_original_inverse.cjs > red32-original-results.json
      - name: Preserve exact original inversion diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: red32-original-results
          path: red32-original-results.json
