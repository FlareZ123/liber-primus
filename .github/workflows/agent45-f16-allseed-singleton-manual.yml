name: Agent 45 p50 factor16 all-secret singleton gate (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-input-sft:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-exact original input and synthetic positive
        run: node sims/lp2_p50_f16_allseed_singleton_original_sft.cjs
