name: Agent3 p7-p8 Roman cube five-tap original gate
on:
  workflow_dispatch:
jobs:
  original-source-inverse:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original ciphertext and positive known-GP plant
        run: node sims/lp2_p7_p8_roman_cuberoot_fivetap_sft.cjs

      - name: Source-derived LFSR 1876-period all-seed original gate
        run: node sims/lp2_p7_fiveproduct_lfsr1876_original_sft.cjs
