name: Recover exact 2013 DATA 560.13 from secondary community LFS archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-lfs-object:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned ISO reader and HTTP client
        run: python -m pip install --disable-pip-version-check pycdlib==1.22.0 requests==2.32.5
      - name: Request only the pinned LFS OID and compare it with the exact ISO member
        shell: bash
        run: |
          set -euo pipefail
          python sims/cicada2013_56013_lfs_object_gate.py \
            --output "$RUNNER_TEMP/cicada2013-56013-lfs-report.json" \
            --lfs-out "$RUNNER_TEMP/560.13-lfs-object.bin" \
            --iso "$RUNNER_TEMP/3301.iso" \
            --iso-member-out "$RUNNER_TEMP/560.13-iso-member.bin"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cicada2013-56013-secondary-lfs-object-gate
          path: |
            ${{ runner.temp }}/cicada2013-56013-lfs-report.json
            ${{ runner.temp }}/560.13-lfs-object.bin
          if-no-files-found: ignore
          retention-days: 90
