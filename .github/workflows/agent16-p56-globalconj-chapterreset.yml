name: Agent16 P56 Global Conjugation Chapter Reset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter-reset:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-exact all-secret chapter-reset gate
        shell: pwsh
        run: node sims/agent16_p56_globalconj_chapterreset_sft.cjs
