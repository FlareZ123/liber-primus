name: Agent30 layer2 periodic opening-only source gate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent30-layer2-periodic-opening-only
  cancel-in-progress: false

jobs:
  original-and-null:
    name: opening period ${{ matrix.literal_f }} / ${{ matrix.side }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        literal_f: [0, 1]
        side: [real, "null"]
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download exactly the source-fixed original-run prepared inputs
        uses: actions/download-artifact@v4
        with:
          name: layer2-prepared
          run-id: 44062412799
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prepared
      - name: Download the same original-run positive controls
        uses: actions/download-artifact@v4
        with:
          name: layer2-controls
          run-id: 44062412799
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: controls
      - name: Require both planted long-opening periodic controls, with pinned hash
        run: node sims/agent30_layer2_periodic_opening_control_gate.cjs controls/controls.json
      - name: Run only the previously blocked 729-rune original period family
        run: |
          chmod +x prepared/upstream/work/layer2/target/release/layer2
          python sims/agent2_layer2_sft.py screen prepared/upstream/work/layer2 opening periodic${{ matrix.literal_f }} ${{ matrix.side }} --threads 4
      - name: Preserve exact source and matched-null scores and whole-window verification
        uses: actions/upload-artifact@v4
        with:
          name: agent30-layer2-periodic-opening-${{ matrix.literal_f }}-${{ matrix.side }}
          path: |
            prepared/upstream/work/layer2/results/opening_periodic${{ matrix.literal_f }}_${{ matrix.side }}.tsv
            prepared/upstream/work/layer2/results/opening_periodic${{ matrix.literal_f }}_${{ matrix.side }}_verify.txt
            prepared/upstream/work/layer2/results/opening_periodic${{ matrix.literal_f }}_${{ matrix.side }}.json
          if-no-files-found: error
          retention-days: 30
