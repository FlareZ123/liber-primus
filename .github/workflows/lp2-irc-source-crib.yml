name: Original 2014 IRC partial-decipherment witness scan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-era-transcripts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan SHA-pinned original-era solving transcripts
        run: node sims/irc2014_undecoded_page_witness_sft.cjs
