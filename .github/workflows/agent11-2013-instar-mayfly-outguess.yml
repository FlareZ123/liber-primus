name: Agent 11 2013 instar title original mayfly OutGuess

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-two-mayfly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install original JPEG coefficient extraction dependency
        run: sudo apt-get install -y -qq libjpeg-dev
      - name: Authentic control and original p14/p23 mayfly keyed test
        run: python3 sims/lp2_2013_instar_title_mayfly_outguess_sft.py
