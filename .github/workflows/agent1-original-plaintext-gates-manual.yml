name: Agent1 original LP2 two independent plaintext-inversion gates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-inversion:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original tree-prime rank28 RSA syntax
        run: node --check sims/lp2_treeprimes_rank28_rsa_source_sft.cjs
      - name: Tree-prime rank28 RSA inverse original and planted source
        run: node sims/lp2_treeprimes_rank28_rsa_source_sft.cjs
      - name: Check source-red nonlinear state syntax
        run: node --check sims/lp2_p16_p39_nonlinear_forced_state_sft.cjs
      - name: Full p16–p21 original and withheld text-only cryptanalysis
        run: node sims/lp2_p16_p39_nonlinear_forced_state_sft.cjs
