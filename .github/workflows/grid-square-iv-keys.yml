name: LP2 square as IV and grid columns as keys
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cross-clue AES and ChaCha decryption of unsolved sections
        run: node sims/grid_square_iv_keys.cjs
      - name: Invert four 829-rune bookend blocks using four source square-row keys
        run: node sims/fibonacci829_fourrow_source_inverse.cjs
      - name: Test final sixteen physical pages using sixteen AES-128 grid keys and printed square IVs
        run: node sims/final16_grid_square_pagekeys.cjs
