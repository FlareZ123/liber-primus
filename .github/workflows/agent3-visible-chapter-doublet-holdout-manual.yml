name: Agent3 visible-chapter doublet heldout SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_holdout:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate source-fixed train/holdout and native controls
        run: node sims/lp2_doublet_visible_chapter_restart_holdout_sft.cjs
