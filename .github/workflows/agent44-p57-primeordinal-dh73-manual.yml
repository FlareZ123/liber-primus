name: Agent44 original p57 prime ordinal DH73 source tests
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-dh:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-native DH73 prime-ordinal and outer ring original tests
        run: |
          node --check sims/lp2_p57_primeordinal_dh73_source_sft.cjs
          node sims/lp2_p57_primeordinal_dh73_source_sft.cjs
          node --check sims/lp2_p50_outerring_dh73_selfindex_sft.cjs
          node sims/lp2_p50_outerring_dh73_selfindex_sft.cjs
          node --check sims/lp2_p50_clauseprime_square_p55_hill_sft.cjs
          node sims/lp2_p50_clauseprime_square_p55_hill_sft.cjs
