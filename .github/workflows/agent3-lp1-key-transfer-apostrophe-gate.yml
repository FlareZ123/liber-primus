name: Agent 3 LP1 key transfer to LP2 apostrophe anchors
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-transfer-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the authenticated LP1 key on original LP2 anchors
        run: node sims/lp2_lp1_vigenere_key_transfer_apostrophe_gate.cjs
