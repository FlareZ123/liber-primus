name: Agent7 p0 Report11 survivor census

on:
  workflow_dispatch:

jobs:
  report11:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check sims/lp2_p0_second_passage_report_ablation_sft.cjs
      - name: Enumerate all Report11 exact checksum survivors
        run: node sims/lp2_p0_second_passage_report_ablation_sft.cjs 11
