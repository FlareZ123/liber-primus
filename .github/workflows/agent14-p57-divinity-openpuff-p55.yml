name: Agent14 p57 DIVINITY original LP2 p55 single-JPEG native OpenPuff
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent14-p57-divinity-original-p55
  cancel-in-progress: false
jobs:
  p57-divinity-p55-source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Install original OpenPuff native UI requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native capture regression failed' }
      - name: Obtain source-pinned OpenPuff 4.00 executable and DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-v400-Agent14-Divinity'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original OpenPuff binary mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Recover exact independently published v4 JPEG payload first
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Source-published JPEG unavailable' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format "Jpeg (Image)" --bit-level "1/2 (50%) - Maximum" --out probe-output/public-recovery --wait-seconds 60
          if ($LASTEXITCODE -ne 0) { throw 'Original OpenPuff JPEG positive execution failed' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file() and p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('ORIGINAL_JPEG_35_BYTE_POSITIVE_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Exact published 35-byte positive missing' }
      - name: One p57 DIVINITY A-key on immediately preceding p55 JPEG
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # p57's author-visible DIVINITY clue immediately follows the encrypted p55 tree.
          # This tests that one original source carrier, not a guessed carrier subset.
          python -c "import json; d=json.load(open('resources/liber-primus/lp2-corpus.json',encoding='utf-8')); p=next(p for p in d['pages'] if p['page']==57); s=''.join(d['translit'][i] for i in p['indices']); assert 'DIUINITYWITHIN' in s; print('SOURCE_P57_DIVINITY_KEY_VERIFIED')"
          if ($LASTEXITCODE -ne 0) { throw 'Original clear p57 keyword absent' }
          $carrier = Join-Path $env:GITHUB_WORKSPACE 'resources/liber-primus/72.jpg'
          if (-not (Test-Path -LiteralPath $carrier)) { throw 'Original p55 72.jpg missing' }
          $out = 'probe-output/source-p57-divinity-p55'
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$carrier" --password DIVINITY --bit-format 'Jpeg (Image)' --bit-level '1/5 (20%) - Medium' --out $out --wait-seconds 120
          if ($LASTEXITCODE -ne 0) { throw 'Native p55 source extraction did not execute' }
          $result = Get-Content -LiteralPath "$out/result.json" -Raw | ConvertFrom-Json
          if ($result.carrier_count -ne 1 -or -not $result.carrier_added -or -not $result.bit_selection_verified -or -not $result.attempted) {
            throw 'Native GUI did not prove original p55 carrier addition, exact bit level and actual extraction'
          }
          if ($result.native_probe_outcome -eq 'inconclusive-timeout') {
            throw 'Native extraction result is inconclusive'
          }
          Write-Host "P57_DIVINITY_NATIVE_RESULT $($result | Select-Object native_probe_outcome, carrier_count, output_present, outputs, completion_dialogs, error_dialogs | ConvertTo-Json -Depth 12 -Compress)"
          if ($result.output_present) { Write-Host 'POTENTIAL_ORIGINAL_LP2_PAYLOAD_REQUIRES_BYTEWISE_VALIDATION' }
      - name: Preserve original-source order, GUI evidence and any recovered bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent14-p57-divinity-original-p55-evidence
          path: probe-output/
          if-no-files-found: warn
