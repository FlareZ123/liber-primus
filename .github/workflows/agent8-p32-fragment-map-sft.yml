name: Agent8 p32 fragment-sum map SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-map-sft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce p32 fragment-sum / p50 pointer map and DH controls
        run: node sims/lp2_p32_home_buds_p50_loop_sft.cjs
