name: Agent48 outside-in period-8 F-hold gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outside-in-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce chapter collision gate and exact word CSP
        run: node sims/lp2_chapter_outsidein_period8_fhold_csp_sft.cjs
