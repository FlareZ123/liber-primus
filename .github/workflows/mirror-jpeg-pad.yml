name: LP2 mirrored JPEG key candidate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-key:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test JPEG bytes as a skip-aware LP2 pad
        run: node sims/mirror_jpeg_pad.cjs
