name: Agent50 P7 P8 fixedpoint PGL Hill original inverse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-typed-projective-hill:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original PGL2 and Hill receiver source-key inverse
        shell: pwsh
        run: node sims/lp2_p7_p8_fixedpoint_projective_hill_original_sft.cjs
