name: LP2 cross-page carry content selector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content_selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce matched split-coordinate controls
        run: node sims/lp2_cross_page_carry_content_selector_sft.cjs
