name: Agent37 original 2014 magic squares plainbytes grid XOR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-inverse:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original-source 745-byte upstream key to 256-byte numerical manuscript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node sims/lp2_2014_magic_square_plainbytes_grid_xor_sft.cjs
          if ($LASTEXITCODE -ne 0) { throw "Original upstream-square XOR inverse failed" }
