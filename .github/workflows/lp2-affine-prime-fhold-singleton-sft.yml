name: Agent1 affine-prime F-hold singleton source gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-gate:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone Node 22 SFT
        run: node --check sims/lp2_affine_prime_fhold_singleton_sft.cjs
      - name: Run exact original prefix and blinded native controls
        run: node sims/lp2_affine_prime_fhold_singleton_sft.cjs
