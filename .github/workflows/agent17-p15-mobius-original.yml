name: Agent17 p15 original source Mobius inverse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-prime-mobius:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original p15 source and native English positive controls
        run: node sims/lp2_p15_mobius_squarefree_dirichlet_original_sft.cjs
