name: Agent18 LP2 pdir six-section original results reducer
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed six-section 216-shard original run
        required: true
        default: "44075903575"
        type: string
      recovery_run_id:
        description: Verified replacement for original failed convention 010, shard 3
        required: true
        default: "44247310794"
        type: string
      recovery_120_2_run_id:
        description: Verified replacement for original failed convention 120, shard 2
        required: false
        default: ""
        type: string
permissions:
  contents: read
  actions: read
jobs:
  pdir-sixsection-coverage-reduction:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install atomic lock helper
        run: python -m pip install filelock
      - name: Retrieve all 216 source-registered original and matched-null artifacts
        shell: pwsh
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: gh run download "${{ inputs.run_id }}" --repo FlareZ123/liber-primus --dir from-sixsections --pattern "pdir-sixsections-*"
      - name: Insert independently verified original source shard 010-3 replacement
        shell: pwsh
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          $ErrorActionPreference = "Stop"
          gh run download "${{ inputs.recovery_run_id }}" --repo FlareZ123/liber-primus --dir from-rescue-010-3 --pattern "pdir-sixsections-010-3-verified-replacement"
          if ($LASTEXITCODE -ne 0) { throw "Verified 010-3 rescue retrieval failed" }
          $replacement = "from-rescue-010-3/pdir-sixsections-010-3-verified-replacement/pdir-sixsections-010-3.zip"
          if (-not (Test-Path -LiteralPath $replacement -PathType Leaf)) { throw "Verified 010-3 rescue ZIP missing" }
          New-Item -ItemType Directory -Path source-verify-010-3 -Force | Out-Null
          Copy-Item -LiteralPath $replacement -Destination source-verify-010-3/pdir-sixsections-010-3.zip
          python sims/lp2_pdir_1329_incremental_artifact_gate.py source-verify-010-3 | Out-File -FilePath source-verify-010-3/gate.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Recovered 010-3 source shard fails exact original-score gate" }
          $original = "from-sixsections/pdir-sixsections-010-3"
          if (Test-Path -LiteralPath $original) { Remove-Item -LiteralPath $original -Recurse -Force }
          Expand-Archive -LiteralPath $replacement -DestinationPath $original -Force
      - name: Insert independently verified original source shard 120-2 replacement
        if: ${{ inputs.recovery_120_2_run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          $ErrorActionPreference = "Stop"
          gh run download "${{ inputs.recovery_120_2_run_id }}" --repo FlareZ123/liber-primus --dir from-rescue-120-2 --pattern "pdir-sixsections-120-2-verified-replacement"
          if ($LASTEXITCODE -ne 0) { throw "Verified 120-2 rescue retrieval failed" }
          $replacement = "from-rescue-120-2/pdir-sixsections-120-2-verified-replacement/pdir-sixsections-120-2.zip"
          if (-not (Test-Path -LiteralPath $replacement -PathType Leaf)) { throw "Verified 120-2 rescue ZIP missing" }
          New-Item -ItemType Directory -Path source-verify-120-2 -Force | Out-Null
          Copy-Item -LiteralPath $replacement -Destination source-verify-120-2/pdir-sixsections-120-2.zip
          python sims/lp2_pdir_1329_incremental_artifact_gate.py source-verify-120-2 | Out-File -FilePath source-verify-120-2/gate.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Recovered 120-2 source shard fails exact original-score gate" }
          $original = "from-sixsections/pdir-sixsections-120-2"
          if (Test-Path -LiteralPath $original) { Remove-Item -LiteralPath $original -Recurse -Force }
          Expand-Archive -LiteralPath $replacement -DestinationPath $original -Force
      - name: Reject incomplete, duplicate or wrong-engine records
        run: python sims/lp2_pdir_stage2_sixsection_reduce.py --root from-sixsections --out sixsection-report --run-id "${{ inputs.run_id }}"
      - name: Preserve source-registered original and matched-null coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-lp2-pdir-sixsection-complete-screen
          path: sixsection-report/
          if-no-files-found: warn
