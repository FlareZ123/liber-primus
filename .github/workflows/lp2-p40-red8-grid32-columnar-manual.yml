name: P40 original-source columnar and boundary gates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All 3000 original runes, full forward re-encryption and plant
        run: node sims/lp2_p40_red8_grid32_columnar_inverse_sft.cjs
      - name: All-secret 256 table-cell GP29 phase invariant with real source-native plant
        run: node sims/lp2_p40_grid256_allsecret_phase_equality_sft.cjs
      - name: Frozen source GP28 chain then red8 columnar and grid28 inverse (Director 696)
        run: node sims/lp2_p40_gp28_chain_grid_columnar_sft.cjs
      - name: Exact red8 40320-order adjacency and boundary transport all-key controls
        run: node sims/lp2_p40_columnar_antirepeat_order_sft.cjs
