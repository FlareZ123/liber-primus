name: LP2 entire 2014-15 Part9 wiki original revisions (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-part9-revisions:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch complete source period Part9 wiki revisions with API continuation
        shell: pwsh
        run: |
          node --check sims/lp2_wikia_part9_complete_revisions.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Syntax check failed' }
          node sims/lp2_wikia_part9_complete_revisions.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Original revision acquisition failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent46-original-part9-revision-data
          path: ${{ runner.temp }}/agent46-wikia-part9-original-revisions.json
          if-no-files-found: warn
