name: 2016 image-dimension lag-six source gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'sims/2016_image_dimension_lag6_source_gate.cjs'
      - 'sims/t6_source_register_gate.cjs'
      - 'resources/liber-primus/lp2-corpus.json'
      - 'resources/liber-primus/lp2-ink-annotations.json'
      - 'resources/liber-primus/lp1-plaintext-reference.txt'
      - 'resources/liber-primus/base60-grid.json'
      - 'resources/lp2-transcription.txt'
      - 'resources/control/shakespeare_first300k.txt'

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct source-derived lag-six rule and test bounded key candidates
        run: node sims/2016_image_dimension_lag6_source_gate.cjs
      - name: Upload source-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t6-source-gate-diagnostics
          path: |
            t6-source-gate-result.json
            t6-source-gate-candidates.json
          if-no-files-found: warn

  t6-register-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test T6-derived exponent clock, Haegl marker transport, and 13-dot interval states
        run: node sims/t6_source_register_gate.cjs
