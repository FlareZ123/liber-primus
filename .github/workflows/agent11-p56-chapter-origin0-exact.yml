name: Agent11 p56 chapter origin0 exact gate
on:
  workflow_dispatch:
    inputs:
      levels:
        description: Visible-F prefix depths, comma separated
        required: false
        default: '4,6,8'
      cap:
        description: Exact search node cap per solve
        required: false
        default: '200000'
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact origin0 chapter gate
        env:
          LEVELS: ${{ inputs.levels }}
          CAP: ${{ inputs.cap }}
        run: node sims/lp2_p56_chapter_origin0_exact_sft.cjs
