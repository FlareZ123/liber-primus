name: Hard-lexicon shared-key sieve (manual)

on:
  workflow_dispatch:
    inputs:
      scan_all:
        description: Scan every LP2 page pair and all 28 scales
        type: boolean
        default: false
        required: true
      max_depth:
        description: Maximum aligned runes tested in full scan
        type: number
        default: 100
        required: true
      threshold:
        description: Minimum surviving prefix length to report
        type: number
        default: 65
        required: true
jobs:
  exact-trie:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned lexicons
        run: python -m pip install textblob==0.19.0 cmudict==1.1.3
      - name: Execute exact word-trie probe
        env:
          SCAN_ALL: ${{ inputs.scan_all }}
          MAX_DEPTH: ${{ inputs.max_depth }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          if [ "$SCAN_ALL" = "true" ]; then
            python -u sims/relative_key_hard_lexicon.py --all --max-depth "$MAX_DEPTH" --threshold "$THRESHOLD"
          else
            python -u sims/relative_key_hard_lexicon.py --pair 28 42
          fi
