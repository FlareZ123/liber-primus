name: LP2 five-indexed row-sum familywise gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  familywise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce matrix and matched-window controls
        run: node sims/lp2_five_indexed_fragments_row_sum_sft.cjs
