name: Agent37 red225 terminal75 direct-key gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-input-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test red225 75-triplet direct key and original page-line-rune coordinates
        run: node sims/lp2_red225_terminal75_triplet_source_gate_sft.cjs
