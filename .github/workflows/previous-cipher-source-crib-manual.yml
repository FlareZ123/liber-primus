name: LP2 previous-cipher permutation source crib (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original full-page source crib and seeded source-true inversion
        run: node sims/previous_cipher_permutation_source_crib.cjs
      - name: Source-authenticated Parable multiplicative periods and matched native controls
        run: node sims/parable_primitive_period_source_gate.cjs
      - name: Exhaust 10134 Parable primitive seeds with unknown output alphabet
        run: node sims/parable_primitive_seed_mi_exhaustive.cjs
      - name: Exhaust 20268 primitive-pad phases under arbitrary stationary previous-ciphertext rows
        run: node sims/parable_primitive_feedback_row_collision.cjs
