name: LP2 carry-free red8 final bounded extension
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        id: [0,1,2,5,6,7,8,10,14,16,17,18,22,23,39,64,65,66,68,69,70,72,73,74,75,78,79,80,82,86,95,96,97,98,101,102,105,106,107]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 64d48aecfdce47de384ca9eb153d4320660815d7
          persist-credentials: false
      - name: Compile pinned solver
        run: g++ -O3 -march=native -std=c++17 sims/lp2_red8_carryfree_continuous_sft.cpp -o carryfree
      - name: Extend only remaining unresolved ID
        shell: bash
        env:
          ID: ${{ matrix.id }}
        run: |
          rc=0
          ./carryfree resources/control/english_wordfreq_textblob.txt original 180 "$ID" "$((ID+1))" || rc=$?
          if [[ "$rc" != 0 && "$rc" != 3 ]]; then exit "$rc"; fi
