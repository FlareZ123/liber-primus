name: Agent3 authenticated original audio bundle (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lock library
        run: python -m pip install filelock
      - name: Download authenticated 2012-2014 source audio
        run: python sims/agent3_fetch_audio_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: agent3-authentic-cicada-audio
          path: |
            run-data/agent3-authentic-audio/761.MP3
            run-data/agent3-authentic-audio/interconnectedness.mp3
            run-data/agent3-authentic-audio/c.mp3
            run-data/agent3-authentic-audio/song.mid
            run-data/agent3-authentic-audio/manifest.json
          retention-days: 7
