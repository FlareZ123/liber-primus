name: LP2 source-red LPAD original OutGuess five-page gate (Agent33)
on:
  workflow_dispatch:

jobs:
  original-lpad-key:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned OutGuess 0.4
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential libjpeg-dev file gnupg
          git clone --depth 1 https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          git -C /tmp/outguess fetch --depth 1 origin 24810e14327c2bbeedeaadd3e24491f2a4425c02
          git -C /tmp/outguess checkout --detach 24810e14327c2bbeedeaadd3e24491f2a4425c02
          cd /tmp/outguess
          ./autogen.sh
          CFLAGS='-O2 -std=gnu11' ./configure --with-generic-jconfig
          make -j2 CC='gcc -std=gnu11' CFLAGS='-O2 -std=gnu11'
          sudo make install
      - name: Run source-red LPAD extraction with embedded and clean controls
        run: |
          node --check sims/lp2_p3to7_lpad_outguess_original_sft.cjs
          node sims/lp2_p3to7_lpad_outguess_original_sft.cjs
      - name: Preserve byte-for-byte original candidates and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent33-lpad-original-outguess
          path: outguess-results-agent33-lpad/
          if-no-files-found: warn
          retention-days: 30
