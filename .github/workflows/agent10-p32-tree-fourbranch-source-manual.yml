name: Agent10 p32 original tree four-branch source gate
on:
  workflow_dispatch:

jobs:
  p32-tree:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image segmentation dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Reproduce p32 original scan mask and height intervals
        run: python sims/lp2_p32_tree_fourbranch_source_sft.py
