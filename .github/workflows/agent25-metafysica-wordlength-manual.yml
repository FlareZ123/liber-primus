name: Agent25 mayfly source webpage verbatim LP2 crib gate
on:
  workflow_dispatch:

jobs:
  direct-source-text:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source parser and atomic file locking
        run: python -m pip install requests filelock
      - name: Compare original LP2 word lengths against independently selected mayfly website text
        run: python sims/lp2_metafysica_wings14_verbatim_wordlength_sft.py
      - name: Keep full original-source matching evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp2-metafysica-wings14-original-wordlength
          path: im-results/lp2-metafysica-wings14-original-wordlength.json
          if-no-files-found: warn
