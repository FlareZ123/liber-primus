name: H2 book-global prime2 blind original receiver
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Blind native plants and p54-p55 authentic terminal
        shell: pwsh
        run: node sims/lp2_h2_bookglobal_joint_blind_original_sft.cjs
