name: LP2 reversible exponent feedback lookup attack

on:
  workflow_dispatch:

jobs:
  exponent-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fit nonlinear source-blind reversible lookup keys
        run: node sims/exponent_feedback_lookup_attack.cjs
      - name: Exhaustive 1..512 nonlinear one-tap feedback and planted recovery
        run: node sims/one_tap_exponent_feedback_search.cjs
      - name: Source-blind 2016-pair spectral feedback lag discovery
        run: node sims/spectral_two_lag_exponent_attack.cjs
      - name: Fixed original 256-byte source key through RC4 and reversible field decoder
        run: node sims/grid_rc4_field_inverse.cjs
