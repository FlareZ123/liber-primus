name: LP2 quote-pair affine prime-crib inverse
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select source-exact quote test'
        type: choice
        options:
          - prime
          - generic
          - f79-f29
        default: prime

permissions:
  contents: read

jobs:
  source-key-inversion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original-LP2 phase search with planted affine control
        if: ${{ inputs.mode != 'f79-f29' }}
        run: node sims/${{ inputs.mode == 'generic' && 'quote_pair_generic_invariants.cjs' || 'quote_pair_affine_prime_crib.cjs' }}
      - name: Source-derived F79/F29 equality gate for frozen p40/p53 crib
        if: ${{ inputs.mode == 'f79-f29' }}
        run: node sims/quote_pair_f79_f29_equality_gate.cjs
