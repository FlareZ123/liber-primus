name: LP2 quote-pair affine prime-crib inverse
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-key-inversion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original-LP2 phase search with planted affine control
        run: node sims/quote_pair_affine_prime_crib.cjs
