name: Agent6 - inspect Avowy .htaccess XOR-FF payload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download, hex-decode, complement and inspect
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/Dukotah/cicada3301/master/corpus/D-archives/iarchive/items/avowyfgl5lkzfj3n.onion/.htaccess"
          curl --fail --location --silent --show-error "$URL" -o raw.htaccess.hex
          python3 - <<'PY'
          import gzip, hashlib, json, pathlib, re, struct
          from collections import Counter

          p = pathlib.Path("raw.htaccess.hex")
          text = p.read_text(encoding="ascii")
          clean = re.sub(r"\s+", "", text)
          if not clean or len(clean) % 2 or re.search(r"[^0-9a-fA-F]", clean):
              raise SystemExit("source is not an even-length hexadecimal stream")
          raw = bytes.fromhex(clean)
          decoded = bytes(b ^ 0xff for b in raw)
          if decoded[:4] != bytes.fromhex("1f8b0808"):
              raise SystemExit(f"XOR-FF did not produce expected gzip header: {decoded[:8].hex()}")
          pathlib.Path("xorff.gz").write_bytes(decoded)
          payload = gzip.decompress(decoded)
          pathlib.Path("data.out").write_bytes(payload)

          report = {
              "source_url": "https://raw.githubusercontent.com/Dukotah/cicada3301/master/corpus/D-archives/iarchive/items/avowyfgl5lkzfj3n.onion/.htaccess",
              "source_hex_chars": len(clean),
              "source_decoded_bytes": len(raw),
              "source_sha256": hashlib.sha256(raw).hexdigest(),
              "xorff_gzip_bytes": len(decoded),
              "xorff_gzip_sha256": hashlib.sha256(decoded).hexdigest(),
              "gzip_header_hex": decoded[:32].hex(),
              "payload_bytes": len(payload),
              "payload_sha256": hashlib.sha256(payload).hexdigest(),
              "payload_sha1": hashlib.sha1(payload).hexdigest(),
              "payload_header_hex": payload[:64].hex(),
              "payload_prefix_ascii": "".join(chr(b) if 32 <= b < 127 else "." for b in payload[:64]),
              "payload_byte_entropy": round(-sum((n/len(payload))*__import__("math").log2(n/len(payload)) for n in Counter(payload).values()), 6),
              "payload_magic_offsets": {},
          }
          signatures = {
              "jpeg": bytes.fromhex("ffd8ff"),
              "png": bytes.fromhex("89504e47"),
              "zip": bytes.fromhex("504b0304"),
              "pdf": b"%PDF",
              "gzip": bytes.fromhex("1f8b"),
          }
          for name, sig in signatures.items():
              offsets = []
              start = 0
              while True:
                  i = payload.find(sig, start)
                  if i < 0: break
                  offsets.append(i)
                  start = i + 1
              report["payload_magic_offsets"][name] = offsets[:50]
          pathlib.Path("report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Install image inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick tesseract-ocr libimage-exiftool-perl
          python3 -m pip install --quiet pillow imagehash

      - name: Inspect extracted payload if it is an image
        shell: bash
        run: |
          set -euo pipefail
          file data.out | tee file-report.txt
          if head -c 3 data.out | od -An -tx1 | tr -d ' \n' | grep -qi '^ffd8ff'; then
            identify -verbose data.out > identify.txt
            exiftool -a -u -g1 data.out > exiftool.txt
            tesseract data.out stdout --psm 6 2>tesseract.stderr.txt > ocr.txt || true
            strings -a -n 4 data.out | head -300 > strings.txt
            python3 sims/known_gp29_image_readback.py data.out > gp29-readback.json
            python3 sims/avowy_page06_outguess_default_key_probe.py data.out --out-dir outguess-probe > avowy-outguess-default.json
            python3 sims/jpeg_embedded_image_scan.py data.out jpeg-subimages > jpeg-embedded-scan.json
          else
            echo "Payload is not JPEG; see report.json magic scan." > image-inspection.txt
            strings -a -n 4 data.out | head -300 > strings.txt
          fi

      - name: Compare image with LP corpus and print compact findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          import glob, imagehash, json
          target = Image.open("data.out").convert("RGB")
          hashes = {k: getattr(imagehash, k)(target) for k in ("phash", "dhash")}
          rows = []
          for path in glob.glob("resources/liber-primus/*.jpg"):
              try:
                  im = Image.open(path).convert("RGB")
                  best = {"phash": 65, "dhash": 65, "rotation": 0, "size": list(im.size)}
                  for angle in (0, 90, 180, 270):
                      candidate = im.rotate(angle, expand=True) if angle else im
                      for kind in ("phash", "dhash"):
                          distance = int(hashes[kind] - getattr(imagehash, kind)(candidate))
                          if distance < best[kind]:
                              best[kind] = int(distance)
                              best["rotation"] = angle
                  rows.append({"path": path, **best})
              except Exception as e:
                  rows.append({"path": path, "error": str(e)})
          rows.sort(key=lambda x: (x.get("phash", 65), x.get("dhash", 65)))
          open("page-similarity.json", "w").write(json.dumps(rows[:20], indent=2) + "\\n")
          print("=== PAGE SIMILARITY ===")
          print(json.dumps(rows[:20], indent=2))
          PY
          echo "=== GP29 GLYPH READBACK ==="
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("gp29-readback.json")
          if p.exists():
              d = json.loads(p.read_text())
              print(json.dumps({k: d.get(k) for k in ("row_count", "row_lengths", "predicted_letters", "predicted_runes", "nearest_distance_summary", "claim")}, ensure_ascii=False, indent=2))
          else:
              print("No GP29 readback produced.")
          PY
          echo "=== DEFAULT-KEY OUTGUESS COMPARISON ==="
          cat avowy-outguess-default.json 2>/dev/null || true
          echo "=== EMBEDDED JPEG STREAM SCAN ==="
          cat jpeg-embedded-scan.json 2>/dev/null || true
          echo "=== DECODE REPORT ==="
          cat report.json
          echo "=== FILE ==="
          cat file-report.txt
          echo "=== OCR (first 4000 bytes) ==="
          head -c 4000 ocr.txt 2>/dev/null || true
          echo
          echo "=== EXIF ==="
          head -100 exiftool.txt 2>/dev/null || true
          echo "=== STRINGS (first 100 lines) ==="
          head -100 strings.txt
          echo "=== IDENTIFY (first 80 lines) ==="
          head -80 identify.txt 2>/dev/null || true

      - name: Emit compact page preview for visual inspection
        shell: bash
        run: |
          set -euo pipefail
          echo "=== NEAREST ORIGINAL PAGES ==="
          head -70 page-similarity.json
          magick data.out -resize 600x900 -strip -quality 62 /tmp/avowy-preview.jpg
          python3 - <<'PY'
          import base64, pathlib
          s = base64.b64encode(pathlib.Path("/tmp/avowy-preview.jpg").read_bytes()).decode("ascii")
          print("PREVIEW_B64_BEGIN")
          for i in range(0, len(s), 3000):
              print("PREVIEW_B64_CHUNK:" + s[i:i+3000])
          print("PREVIEW_B64_END")
          PY

      - name: Preserve compact analysis artifacts in im-results
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p im-results/avowy-htaccess-xorff
          cp report.json file-report.txt exiftool.txt ocr.txt strings.txt page-similarity.json gp29-readback.json avowy-outguess-default.json jpeg-embedded-scan.json im-results/avowy-htaccess-xorff/ 2>/dev/null || true
          mkdir -p im-results/avowy-htaccess-xorff/embedded-previews
          for f in jpeg-subimages/preview-*.jpg; do [ -f "$f" ] && base64 -w0 "$f" > "im-results/avowy-htaccess-xorff/embedded-previews/$(basename "$f").b64" || true; done
          cat > im-results/avowy-htaccess-xorff/README.md <<'EOF'
          # Avowy archived .htaccess payload: XOR-FF + gzip recovery

          Source: Dukotah/cicada3301 corpus/D-archives/iarchive/items/avowyfgl5lkzfj3n.onion/.htaccess
          Operation: hex-decode, bytewise complement (XOR 0xFF), gzip-decompress.
          The full recovered JPEG and original hex are retained as workflow artifacts, not committed here.
          The recovered outer JPEG is 3,010,703 bytes at 2400x3600. Its pHash and dHash are both exactly 0 against `resources/liber-primus/06.jpg`, and visual inspection confirms the same LP1 page 06 illustration and rune layout: this is an alternate render, not a new manuscript page.
          See report.json for exact byte counts and hashes. gp29-readback.json's zero rows reflect the LP2-specific crop failing on this illustrated LP1 page; it is not a plaintext or cipher negative. avowy-outguess-default.json compares the source-authenticated "Default key" OutGuess retrieval on this render and original page 06. jpeg-embedded-scan.json validates additional SOI/EOI candidates; marker bytes alone are not treated as embedded-image evidence.
          EOF
          magick data.out -resize 600x900 -strip -quality 62 /tmp/avowy-preview.jpg
          base64 -w0 /tmp/avowy-preview.jpg > im-results/avowy-htaccess-xorff/preview.jpg.b64
          git config user.name "Agent6 research"
          git config user.email "agent6@users.noreply.github.com"
          git add im-results/avowy-htaccess-xorff
          if git diff --cached --quiet; then
            echo "No new compact artifacts to commit."
          else
            git commit -m "Agent6: preserve Avowy payload analysis artifacts"
            git fetch --no-tags --depth=20 origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload decoded evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent6-avowy-htaccess-xorff-evidence
          path: |
            raw.htaccess.hex
            xorff.gz
            data.out
            report.json
            file-report.txt
            identify.txt
            exiftool.txt
            ocr.txt
            tesseract.stderr.txt
            strings.txt
            gp29-readback.json
            avowy-outguess-default.json
            jpeg-embedded-scan.json
            outguess-probe/
            jpeg-subimages/
            image-inspection.txt
          if-no-files-found: ignore
          retention-days: 14
