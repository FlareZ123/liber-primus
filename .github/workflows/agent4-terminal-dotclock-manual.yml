name: Agent4 signed terminal 13 23 dotclock graph
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal-dotclock:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sims/lp2_signed_terminal_dotclock_graph_sft.cjs
      - run: node sims/lp2_signed_terminal_dotclock_graph_sft.cjs
