name: Agent4 terminal 256 p56 prime-key source gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout original Liber Primus corpus
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone source-gate syntax
        run: node --check sims/lp2_terminal_256_p56_primekey_original_sft.cjs
      - name: Test authenticated p56 known key vs 256 original cells
        run: node sims/lp2_terminal_256_p56_primekey_original_sft.cjs
