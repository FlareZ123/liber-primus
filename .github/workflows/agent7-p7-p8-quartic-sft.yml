name: Agent7 p7-p8 five-point quartic SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce source interpolation and bounded receivers
        run: node sims/lp2_p7_p8_fivepoint_quartic_shamir_packet_sft.cjs
