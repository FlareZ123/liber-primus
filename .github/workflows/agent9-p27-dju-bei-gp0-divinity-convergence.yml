name: Agent9 p27 DJU BEI GP0 DIVINITY convergence SFT

on:
  workflow_dispatch:

jobs:
  original-source-gate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check sims/lp2_p27_dju_bei_gp0_divinity_convergence_sft.cjs
      - name: Run source-selected convergence gate
        run: node sims/lp2_p27_dju_bei_gp0_divinity_convergence_sft.cjs
