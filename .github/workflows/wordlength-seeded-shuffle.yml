name: Seeded word-length shuffle inversion
on:
  workflow_dispatch:
jobs:
  invert-word-order:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Search LP2 seeded word shuffles with nulls and known-source controls
        run: node sims/wordlength_seeded_shuffle.cjs
