name: Agent 27 magic-square centers, 2016 tree height and p55 body SFT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source-selected center crosslink and finite p55 body inverses
        run: node sims/lp2_magic_centers_569_75body_sft.cjs

      - name: Source-original 2014 Jordan J3 p54 contradiction and native controls
        run: node sims/lp2_2014_p54_jordan3_prime_source_sft.cjs

      - name: Source-original GP28 six-window rank inverse and native recovered-key controls
        run: node sims/lp2_gp28_window6_rank_delta_inverse_sft.cjs
