name: OpenPuff v4.00 ordered complete 58-JPEG LP2 source chain
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-source-chain:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Confirm native Windows dependencies
        shell: pwsh
        run: |
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native UI regression failed' }
      - name: Fetch source-pinned original OpenPuff v4.00
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-original-full58'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original OpenPuff executable mismatch: $name"
            }
          }
          "OPENPUFF_EXE=$(Join-Path $root 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Calibrate the authentic native JPEG decoder on published known plaintext
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Publisher JPEG source unavailable' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format "Jpeg (Image)" --bit-level "1/2 (50%) - Maximum" --out probe-output/public-recovery --wait-seconds 45
          if ($LASTEXITCODE -ne 0) { throw 'Known JPEG extraction did not execute' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file() and p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('ORIGINAL_NATIVE_JPEG_PUBLISHED_PLAINTEXT_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Authentic public JPEG positive failed byte comparison' }
      - name: Test one frozen complete Stage11 source index as an ordered 58-carrier payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'probe-output/original-ordered58-medium'
          $arguments = @(
            '--exe', "$env:OPENPUFF_EXE",
            '--password', '33011033',
            '--bit-format', 'Jpeg (Image)',
            '--bit-level', '1/5 (20%) - Medium',
            '--out', "$out",
            '--wait-seconds', '1300'
          )
          $names = @()
          foreach ($idx in 17..74) {
            $name = '{0:D2}.jpg' -f $idx
            $carrier = Join-Path $env:GITHUB_WORKSPACE "resources/liber-primus/$name"
            if (-not (Test-Path -LiteralPath "$carrier")) {
              throw "Missing published original JPEG source: $name"
            }
            $arguments += @('--carrier', "$carrier")
            $names += $name
          }
          if ($names.Count -ne 58 -or @($names | Sort-Object -Unique).Count -ne 58) {
            throw 'The original index is not exactly 58 distinct ordered JPEGs'
          }
          Write-Host "ORIGINAL_FULL58_SOURCE_ORDER $($names -join ',')"
          python sims/openpuff_v400_extract.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Full 58-carrier native GUI attempt failed to execute; inspect artifact' }
          $result = Get-Content -LiteralPath "$out/result.json" -Raw | ConvertFrom-Json
          if ($result.carrier_count -ne 58 -or $result.carrier_chain_verified -ne $true -or $result.bit_selection_verified -ne $true -or $result.attempted -ne $true) {
            throw 'Full 58 source chain and actual native bit selection were not independently verified'
          }
          $reported = @($result.carrier_chain_native)
          if ($reported.Count -ne 58) { throw 'Native 58-carrier list has the wrong item count' }
          $outcome = $result.native_probe_outcome
          Write-Host "ORIGINAL_FULL58_RESULT outcome=$outcome selected_capacity=$($result.selected_capacity_bytes_after_level) output_present=$($result.output_present)"
          if ($result.output_present -eq $true) {
            Write-Host 'POTENTIAL_UNKNOWN_LP2_SOURCE_PAYLOAD_BYTES_EXTRACTED'
          } elseif ($outcome -eq 'native-corrupted-stream') {
            Write-Host 'BOUNDED_SOURCE_NEGATIVE authentic ordered58 A-only Medium1/5 corrupted-stream'
          } else {
            throw "Native full58 source chain produced inconclusive outcome $outcome"
          }
      - name: Preserve genuine native GUI source and any extracted bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpuff-lp2-original-full58-a-only-medium-v400
          path: probe-output/
          if-no-files-found: warn
