name: Agent37 p33 Stage7 49-word source gate
on:
  workflow_dispatch:
jobs:
  source-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Stage7 source-cell word key against original p33
        run: node sims/lp2_p33_stage7_49word_caesar_sft.cjs
