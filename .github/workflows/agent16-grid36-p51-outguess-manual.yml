name: Agent36 exact grid36 original OutGuess calibration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-p51:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: resurrecting-open-source-projects/outguess
          ref: 24810e14327c2bbeedeaadd3e24491f2a4425c02
          path: outguess-src
          persist-credentials: false
      - name: Build pinned OutGuess 0.4 and register binary
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool gnupg imagemagick file
          cd outguess-src
          ./autogen.sh
          ./configure --with-generic-jconfig
          sed -i 's/^#undef HAVE_PROTOTYPES/#define HAVE_PROTOTYPES/' src/jpeg-6b-steg/jconfig.h
          make -j2
          echo "$GITHUB_WORKSPACE/outguess-src/src" >> "$GITHUB_PATH"
      - name: Verify pinned OutGuess and RGB conversion tools
        run: |
          test "$(git -C outguess-src rev-parse HEAD)" = "24810e14327c2bbeedeaadd3e24491f2a4425c02"
          outguess -h || true
          magick -version
      - name: Historical positive, source-matched RGB embedding calibration, and one p51 extraction
        run: |
          node --check sims/lp2_grid36_original_outguess_source_sft.cjs
          node sims/lp2_grid36_original_outguess_source_sft.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent16-grid36-original-outguess
          path: outguess-grid36-source-results/
          retention-days: 30
