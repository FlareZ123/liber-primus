name: Agent10 p55 Atbash3 plus authenticated phi source gate
on:
  workflow_dispatch:

jobs:
  p55-layered:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original p55 layered F-transparent cipher and known controls
        run: |
          node --check sims/lp2_2014_atbash3_p56_phi_p55_sft.cjs
          node sims/lp2_2014_atbash3_p56_phi_p55_sft.cjs
