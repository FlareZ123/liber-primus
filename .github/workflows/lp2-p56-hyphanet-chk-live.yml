name: LP2 p56 live historical Hyphanet CHK gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p56-chk-live:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out fixed original p56 source and CJS probes
        uses: actions/checkout@v4
      - name: Set Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check exact source-only URI constructor and live probe
        run: |
          node --check sims/lp2_p56_freenet_chk_uri_sft.cjs
          node sims/lp2_p56_freenet_chk_uri_sft.cjs
          node --check sims/lp2_p56_hyphanet_live_fetch.cjs
      - name: Prepare ephemeral 0.7 opennet node with first-run wizard configured
        run: |
          mkdir -p "$RUNNER_TEMP/lp2-hyphanet"
          cp sims/lp2_p56_hyphanet_ephemeral_node.ini "$RUNNER_TEMP/lp2-hyphanet/freenet.ini"
          chmod 777 "$RUNNER_TEMP/lp2-hyphanet"
          chmod 666 "$RUNNER_TEMP/lp2-hyphanet/freenet.ini"
      - name: Start isolated historical Freenet 0.7 (Hyphanet) opennet
        run: |
          docker pull ghcr.io/soren-work/freenet:latest
          docker image inspect ghcr.io/soren-work/freenet:latest --format '{{.Id}}'
          docker run -d --name lp2-hyphanet --memory 1536m -p 127.0.0.1:8888:8888/tcp -p 28950:28950/udp -v "$RUNNER_TEMP/lp2-hyphanet:/data" ghcr.io/soren-work/freenet:latest
      - name: Allow the ephemeral node a fixed real-time bootstrap interval
        run: sleep 180
      - name: Probe four source-locked candidate CHKs and a documented public control
        run: node sims/lp2_p56_hyphanet_live_fetch.cjs
      - name: Collect bounded node bootstrap diagnostics
        if: always()
        run: |
          docker ps --filter name=lp2-hyphanet
          docker logs --tail 80 lp2-hyphanet || true
      - name: Upload immutable request summaries and any raw target content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp2-p56-hyphanet-2026-live-gate
          path: im-results-runtime/lp2-p56-chk-live/
          if-no-files-found: warn
          retention-days: 30
