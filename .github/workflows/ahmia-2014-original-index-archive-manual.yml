name: Ahmia 2014 original-era archived index source probe
on:
  workflow_dispatch:
    inputs:
      archive:
        description: Public archive index to inspect
        type: choice
        required: true
        options:
          - arquivo
          - wayback
        default: arquivo
permissions:
  contents: read
jobs:
  ahmia-2014:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search selected 2014-2015 Ahmia archival index
        env:
          ARCHIVE_MODE: ${{ inputs.archive }}
        run: node sims/ahmia_2014_original_index_archive_probe.cjs > ahmia-2014-source-probe.json
      - name: Print bounded JSON source decision for remote inspection
        run: node -e "process.stdout.write(require('node:fs').readFileSync('ahmia-2014-source-probe.json', 'utf8'))"
      - name: Preserve URL metadata and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahmia-2014-source-probe
          path: ahmia-2014-source-probe.json
          if-no-files-found: error
