name: Agent44 2017 RSA MPI p55 source gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-inverse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm original 2017 signature and run strict native-F inverse
        run: node sims/lp2_2017_rsa_mpi_p55_ftransparent_sft.cjs
