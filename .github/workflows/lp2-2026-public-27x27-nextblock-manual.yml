name: LP2 27x27 frozen post-block38 next word forecast
on:
  workflow_dispatch:
jobs:
  prospective-next:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate source-published frozen next blocks, dictionary and planted control
        run: node sims/lp2_2026_public_27x27_nextblock_frozen_sft.cjs
