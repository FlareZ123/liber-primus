name: LP2 whole JPEG exhaustive pad search
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whole-jpeg-key:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan all image byte offsets with a skip-aware cipher
        run: node sims/mirror_jpeg_whole_offsets.cjs
