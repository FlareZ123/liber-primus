name: LP2 pagewise feedback all-secret original-cipher gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-cipher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Original 1/2/3-tap all-secret GP29 E/O capacities and plant
        run: |
          node --check sims/lp2_pagewise_feedback_anyalphabet_capacity_sft.cjs
          node sims/lp2_pagewise_feedback_anyalphabet_capacity_sft.cjs
