name: Agent8 p15 Fibonacci exact original JPEG native OpenPuff gate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent8-p15-fibonacci-native
  cancel-in-progress: false
jobs:
  original-p15-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Prepare original 2014 native OpenPuff v4.00
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native UI prerequisite regression' }
          $folder = Join-Path $env:RUNNER_TEMP 'lp2-native-openpuff-v400'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $folder $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) { throw "Period executable mismatch: $name" }
          }
          "OPENPUFF_EXE=$(Join-Path $folder 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Calibrate period-native v4 JPEG extraction on source-published positive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_public_jpeg_positive_source.py --out probe-output/public-source
          if ($LASTEXITCODE -ne 0) { throw 'Known positive carrier unavailable' }
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier probe-output/public-source/openpuff.jpg --password 12345678 --bit-format "Jpeg (Image)" --bit-level "1/2 (50%) - Maximum" --out probe-output/public-recovery --wait-seconds 70
          if ($LASTEXITCODE -ne 0) { throw 'Native positive execution failed' }
          python -c "from pathlib import Path; p=Path('probe-output/public-recovery/extracted/hidden.txt'); assert p.is_file() and p.read_bytes()==b'Dies ist eine versteckte Nachricht!'; print('SOURCE_JPEG_POSITIVE_PASS 35 bytes')"
          if ($LASTEXITCODE -ne 0) { throw 'Original native JPEG positive recovered wrong bytes' }
      - name: Test original p15 carrier with the source-derived literal FIBONACCI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $carrier = Join-Path $env:GITHUB_WORKSPACE 'resources/liber-primus/32.jpg'
          if (-not (Test-Path -LiteralPath $carrier)) { throw 'Original LP2 p15 carrier missing' }
          $level = '1/2 (50%) - Maximum'
          $output = 'probe-output/original-p15-fibonacci-maximum'
          Write-Host 'FROZEN_SOURCE_MODE original LP2 p15 JPEG 32.jpg, 3301-centered Fibonacci-prime square, password FIBONACCI, JPEG Maximum 1/2, A only'
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$carrier" --password FIBONACCI --bit-format "Jpeg (Image)" --bit-level "$level" --out "$output" --wait-seconds 100
          if ($LASTEXITCODE -ne 0) { throw 'Native original p15 invocation failed' }
          $result = Get-Content -LiteralPath (Join-Path $output 'result.json') -Raw | ConvertFrom-Json
          if (-not $result.attempted -or -not $result.bit_selection_verified -or $result.carrier_count -ne 1) { throw 'Original carrier/bit-setting native selection unverified' }
          if ($result.native_probe_outcome -eq 'inconclusive-timeout') { throw 'No native data-level verdict' }
          Write-Host "ORIGINAL_P15_FIBONACCI_NATIVE_RESULT $($result | Select-Object carrier_count,selected_capacity_bytes_after_level,native_probe_outcome,output_present,outputs,error_dialogs,completion_dialogs | ConvertTo-Json -Depth 10 -Compress)"
          if ($result.output_present) { Write-Host 'AUTHENTIC_CANDIDATE_FILE_PRESENT_INVESTIGATE_BYTES' }
      - name: Preserve native original and positive-control outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent8-p15-fibonacci-original-openpuff-evidence
          path: probe-output/
          if-no-files-found: warn
