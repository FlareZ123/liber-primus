name: Agent 11 lag-five S conditional channel test
on:
  workflow_dispatch:
jobs:
  s-passthrough-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed-S-count English passthrough model
        run: node sims/lag5_S_passthrough_channel.cjs
