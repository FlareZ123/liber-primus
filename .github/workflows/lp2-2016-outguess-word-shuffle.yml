name: Signed 2016 OutGuess ARC4 word-permutation gate

on:
  workflow_dispatch:

jobs:
  original-word-shuffle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original LP2 inverse and native-GP planted control
        run: |
          node --check sims/lp2_2016_outguess_word_shuffle_sft.cjs
          node sims/lp2_2016_outguess_word_shuffle_sft.cjs
