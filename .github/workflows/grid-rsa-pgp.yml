name: LP2 base60 grid RSA / known Cicada PGP test
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/grid_rsa_pgp_signature.cjs
      - run: node sims/grid_rsa_crt_factor.cjs
      - run: node sims/base60_aes_schedule_necessary.cjs
      - run: node sims/grid_red_factor_screen.cjs
      - run: node sims/page48_grid_common_factor_sft.cjs
      - run: node sims/p48_red_triangle_prime_totient_inverse.cjs
      - run: node sims/p48_p52_two_time_pad_word_ac_sft.cjs
