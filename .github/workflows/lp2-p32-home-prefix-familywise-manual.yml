name: LP2 HOME word-start whole-book GP-English familywise null

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen CMU dictionary
        run: python -m pip install cmudict==1.1.3
      - name: Test all original unknown word starts with native plant and page-preserving null
        run: python sims/lp2_p32_home_english_prefix_familywise_sft.py
