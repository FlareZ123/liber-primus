name: Agent37 Q238 chorus and p55 terminal digest source gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify 2012 chorus Q238 LFSR gate
        run: node sims/2012_chorus_q238_lfsr_lp2_gate_sft.cjs
      - name: Verify p55 terminal packet direct hash gate
        run: node sims/lp2_terminal_quintet_hash_preimage_sft.cjs
      - name: Verify source-case 256-bit AES consumer
        run: node sims/lp2_p50_case_bitplane_aes256_original_sft.cjs
      - name: Test source pages 28 and 42 shared XOR key inversion
        run: node sims/lp2_p28_p42_xor_twotimepad_original_sft.cjs
