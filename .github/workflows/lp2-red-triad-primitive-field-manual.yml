name: LP2 primitive red-triad field inverse (manual)
on:
  push:
    paths:
      - 'sims/lp2_red_triad_composed_multiplier70_inverse.cjs'
      - 'sims/lp2_red_triad_pair_field_inverse.cjs'
      - '.github/workflows/lp2-red-triad-primitive-field-manual.yml'
  workflow_dispatch:
    inputs:
      qmult_gates:
        description: "Run source quotient-multiplier all-secret gates instead of legacy triad experiments"
        required: false
        type: boolean
        default: false
      primitive_rs:
        description: "Run source-defined primitive-power [127,51] GF841 Reed-Solomon gate only"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  field:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.primitive_rs }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source field construction, exact original seed gate and native plant
        if: ${{ !inputs.qmult_gates }}
        run: node sims/lp2_red_triad_primitive_field_inverse.cjs

      - name: Twisted-Frobenius order-56 source-state inverse
        if: ${{ !inputs.qmult_gates }}
        run: node sims/lp2_red_triad_frobenius56_source_state.cjs
      - name: Nonlinear source-grid polynomial evaluations over the red GF841 field
        if: ${{ !inputs.qmult_gates }}
        run: node sims/lp2_red_triad_polynomial_eval_inverse.cjs

      - name: Red-factor quotient polynomial source-key inversion
        if: ${{ !inputs.qmult_gates }}
        env:
          LP2_POLYNOMIAL_MODE: quotient
        run: node sims/lp2_red_triad_polynomial_eval_inverse.cjs

      - name: Two-coordinate field norm-trace affine cipher original inverse
        if: ${{ !inputs.qmult_gates }}
        run: node sims/lp2_red_triad_normtrace_affine_inverse.cjs

      - name: Nonlinear two-rune original/plaintext feedback inverse
        if: ${{ !inputs.qmult_gates }}
        run: node sims/lp2_red_triad_poly_two_rune_feedback.cjs

      - name: Test all-secret reversible GF841 field-trace decoder on original terminal 127 runes
        if: ${{ !inputs.qmult_gates }}
        run: node sims/lp2_red_terminal_127_trace_projection_sft.cjs
      - name: Source-locked quotient-multiplier direct GP inverse
        if: ${{ inputs.qmult_gates }}
        run: node sims/red_triad_quotient_multiplicative_inverse.cjs

      - name: All 841-state dynamic byte and cyclic logarithm transports
        if: ${{ inputs.qmult_gates }}
        run: node sims/red_triad_qmult_allstate_byte_sft.cjs

      - name: All 841 cubed initial states and arbitrary stationary 256-codebook
        if: ${{ inputs.qmult_gates }}
        run: node sims/red_triad_qmult_three_row_codebook_sft.cjs

      - name: Original p53 red-scaled all-state 256-codebook obstruction
        if: ${{ inputs.qmult_gates }}
        run: node sims/red_triad_qmult_red_scaled_codebook_sft.cjs

  rs-codeword:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.primitive_rs }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen source-primitive GF841 RS original-codeword gate
        run: node sims/gf841_51x127_primitive_rs_original_sft.cjs

  composed-multiplier70:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exhaust composed p39(p3) order-70 field transition on original LP2
        run: node sims/lp2_red_triad_composed_multiplier70_inverse.cjs
      - name: Exhaust two-rune GF29-squared additive and multiplicative original inverses
        run: node sims/lp2_red_triad_pair_field_inverse.cjs
