name: Agent25 Trithemius31 original word source gate
on:
  workflow_dispatch:
jobs:
  source-locked:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact original-rune extraction
        run: node sims/lp2_trithemius31_original_word_gate.cjs
