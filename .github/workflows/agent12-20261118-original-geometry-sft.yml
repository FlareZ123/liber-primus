name: Agent12 original geometry source-fixed SFT

on:
  workflow_dispatch:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Table 32 by 8 typed bit registers
        run: node sims/lp2_p50_32x8_bitplane_original_sft.cjs
      - name: Table direct linear-state inverse
        run: node sims/lp2_p50_linearstream_source_sft.cjs
      - name: Twenty-eight page-pair nonperiodic signed pad
        run: node sims/lp2_two28_nonperiodic_reusedpad_original_sft.cjs
