name: OpenPuff v4.00 native Hide password-state order probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native-gui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Install native UI dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
      - name: Retrieve original pinned OpenPuff v4.00
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'OpenPuff-v400-password-state'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $root $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) {
              throw "Original OpenPuff artifact mismatch: $name"
            }
          }
          $exe = Join-Path $root 'OpenPuff.exe'
          if ((Get-Item $exe).VersionInfo.FileMajorPart -ne 4) { throw 'Unexpected OpenPuff version' }
          "OPENPUFF_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Probe source-native password-state transition by entry order
        shell: pwsh
        run: |
          python sims/openpuff_v400_hide_password_state_probe.py --exe "$env:OPENPUFF_EXE" --out probe-output/password-state
          if ($LASTEXITCODE -ne 0) { throw 'Native password-state probe did not complete all modes' }
      - name: Preserve reproducible original UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openpuff-v400-hide-password-order-evidence
          path: probe-output/
          if-no-files-found: warn
