name: Agent5 original Cicada audio notes under R4 hold-spend (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent5-audio-notes-r4-source
  cancel-in-progress: false

jobs:
  original-audio-note-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source note analysis and artifact-lock dependencies
        run: python -m pip install --disable-pip-version-check "librosa==0.11.0" "mido==1.3.3" "numpy==2.2.6" "scipy==1.16.2" "imageio-ffmpeg==0.6.0" "filelock==3.20.0"
      - name: Validate original-image rune text and syntactic correctness
        run: |
          python -m py_compile sims/lp2_cicada_audio_note_2012_source_sft.py
          python -m py_compile sims/lp2_cicada_audio_note_r4_source_sft.py
          rustc --version
      - name: Run exact original audio notes through original R4 300-rune source chapters
        run: python -u sims/lp2_cicada_audio_note_r4_source_sft.py
      - name: Preserve complete hashes, source-specific outcomes and control outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-original-audio-notes-r4-source
          path: lp2-audio-note-r4-source-results.json
          if-no-files-found: warn
          retention-days: 30
