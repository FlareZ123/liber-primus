name: Agent3 p24-p26 mayfly terminal packet SFT

on:
  workflow_dispatch:

jobs:
  sft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-typed mayfly packet test
        shell: pwsh
        run: node sims/lp2_p24_26_mayfly_terminal_curvature_sft.cjs
