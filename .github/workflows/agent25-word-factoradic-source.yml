name: Agent25 original word multiset factoradic source gate
on:
  workflow_dispatch:
jobs:
  exact-original:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original factoradic and source-multiset null
        run: node sims/lp2_word_multiset_factoradic_original_sft.cjs
