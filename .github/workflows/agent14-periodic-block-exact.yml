name: Agent14 LP2 exact periodic block receiver
on:
  push:
    paths:
      - '.github/workflows/agent14-periodic-block-exact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        period: [8, 13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python sims/lp2_p0_title_exhaustive_model.py output
      - run: g++ -O3 -std=c++17 sims/lp2_periodic_fhold_block_exact.cpp -o receiver
      - run: python sims/lp2_periodic_fhold_block_scan.py output ./receiver ${{ matrix.period }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent14-period-${{ matrix.period }}
          path: |
            output/period-*.json
            output/original-all.csv
            output/model.bin
