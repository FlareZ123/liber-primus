name: LP2 shared q8 carry-prefix blind controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fhold-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ortools==9.14.6206'
      - name: Check literal plaintext-F hold in both CP-SAT builders
        run: python -u sims/lp2_common_cycle_fhold_regression.py --cpsat
  blind:
    needs: fhold-regression
    strategy:
      fail-fast: false
      matrix:
        plant: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ortools==9.14.6206'
      - name: Blind corrected word-reset control
        continue-on-error: true
        run: >-
          python -u sims/lp2_shared_gp29_q8_carry_prefix_sft.py
          --target control --plant ${{ matrix.plant }} --seconds 1200 --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q8-carry-prefix-control-${{ matrix.plant }}
          path: im-results/lp2-shared-gp29-q8-carry-prefix-control-${{ matrix.plant }}.json
          if-no-files-found: error
  gate:
    if: always()
    needs: [fhold-regression, blind]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: q8-carry-prefix-control-*
          path: controls
      - name: Require both exact blind controls before any original fit
        run: |
          python - <<'PY'
          import glob, json, os, sys
          files = glob.glob('controls/**/lp2-shared-gp29-q8-carry-prefix-control-*.json', recursive=True)
          rows = [json.load(open(p, encoding='utf-8')) for p in files]
          passed = len(rows) == 2 and all(
              r.get('status') in ('OPTIMAL', 'FEASIBLE')
              and r.get('passed') is True
              and r.get('exact_action') is True
              and r.get('training_truth_present') == 47
              and r.get('carry_prefix_present') is True
              and r.get('holdout_truth_present') == 17
              and r.get('holdout_unique', 0) >= 8
              and not r.get('oov_indices')
              for r in rows
          )
          print(json.dumps({'files': files, 'rows': rows, 'passed': passed}, separators=(',', ':')))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              print('passed=' + str(passed).lower(), file=f)
          if not passed:
              sys.exit('Both corrected blind controls did not pass; do not fit the original.')
          PY
