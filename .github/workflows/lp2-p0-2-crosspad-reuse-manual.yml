name: LP2 first three original cross pages same additive pad exact decoder gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-crosspad-pair-exact:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-exact syntax
        run: node --check sims/lp2_p0_2_crosspad_reuse_original_sft.cjs
      - name: Decode page pairs under all possible shared keys
        run: node sims/lp2_p0_2_crosspad_reuse_original_sft.cjs
