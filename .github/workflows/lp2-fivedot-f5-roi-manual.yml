name: LP2 five-dot coefficient-exact F5 ROI original gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lp2-fivedot-f5-roi
  cancel-in-progress: false

jobs:
  original-carrier-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout original source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: false
      - name: Install pinned F5 and libjpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjpeg-dev
          go install github.com/0verkilll/f5/cmd/f5@v1.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gcc -O2 -Wall -Wextra sims/lp2_fivedot_lossless_jpeg_roi.c -o /tmp/lp2_fivedot_lossless_jpeg_roi -ljpeg
          python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Calibrate and test original JPEG coefficient ROIs
        run: python sims/lp2_fivedot_f5_roi_screen_sft.py /tmp/lp2_fivedot_lossless_jpeg_roi
