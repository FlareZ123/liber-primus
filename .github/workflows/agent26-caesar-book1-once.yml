name: Agent26 Caesar Book I original source-key inverse SFT
on:
  push:
    paths:
      - '.github/workflows/agent26-caesar-book1-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-selected Caesar Book I original-cipher gate
        shell: pwsh
        run: node sims/lp2_caesar_bello_civili_book1_original_receiver_sft.cjs
