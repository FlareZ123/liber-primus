name: Exact 2013 DATA 560.13 Git LFS mirror retrieval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-exact-lfs-object:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch the pinned community archive commit without smudging
        shell: bash
        run: |
          set -euo pipefail
          repo="https://github.com/mrroot01011001/Cicada-3301-.git"
          commit="1ccf9583b7064ffd6feb52a49442311048295b41"
          path="puzzles/2013/cicada-os/DATA/560.13"
          work="${RUNNER_TEMP}/cicada-lfs"
          mkdir -p "$work"
          git -C "$work" init
          git -C "$work" remote add origin "$repo"
          export GIT_LFS_SKIP_SMUDGE=1
          git -C "$work" fetch --depth=1 origin "$commit"
          git -C "$work" checkout --detach FETCH_HEAD
          git -C "$work" lfs install --local
          git -C "$work" lfs ls-files --long "$path" | tee "${RUNNER_TEMP}/56013-lfs-pointer.txt"
          git -C "$work" show "HEAD:$path" | tee "${RUNNER_TEMP}/56013-lfs-pointer-content.txt"
          grep -F "oid sha256:db79072ce580efa54acf5f31f3ef0eb00aef867871a051d04e27ee5e7fbc112f" "${RUNNER_TEMP}/56013-lfs-pointer-content.txt"
          grep -F "size 118818811" "${RUNNER_TEMP}/56013-lfs-pointer-content.txt"
      - name: Fetch exactly the named LFS object
        shell: bash
        run: |
          set -uo pipefail
          work="${RUNNER_TEMP}/cicada-lfs"
          commit="1ccf9583b7064ffd6feb52a49442311048295b41"
          path="puzzles/2013/cicada-os/DATA/560.13"
          mkdir -p "${RUNNER_TEMP}/56013-evidence"
          set +e
          git -C "$work" lfs fetch origin "$commit" --include="$path" 2>&1 | tee "${RUNNER_TEMP}/56013-evidence/lfs-fetch.log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'git_lfs_fetch_exit=%s\n' "$status" > "${RUNNER_TEMP}/56013-evidence/status.txt"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          git -C "$work" lfs checkout "$path"
          asset="$work/$path"
          test -f "$asset"
          size="$(stat -c%s "$asset")"
          sha="$(sha256sum "$asset" | cut -d' ' -f1)"
          magic="$(xxd -p -l 64 "$asset" | tr -d '\n')"
          kind="$(file -b "$asset")"
          {
            printf 'repository=%s\n' "$repo"
            printf 'commit=%s\n' "$commit"
            printf 'path=%s\n' "$path"
            printf 'expected_size=118818811\n'
            printf 'actual_size=%s\n' "$size"
            printf 'expected_sha256=db79072ce580efa54acf5f31f3ef0eb00aef867871a051d04e27ee5e7fbc112f\n'
            printf 'actual_sha256=%s\n' "$sha"
            printf 'first_64_bytes_hex=%s\n' "$magic"
            printf 'file_type=%s\n' "$kind"
          } | tee "${RUNNER_TEMP}/56013-evidence/retrieval-receipt.txt"
          test "$size" = "118818811"
          test "$sha" = "db79072ce580efa54acf5f31f3ef0eb00aef867871a051d04e27ee5e7fbc112f"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cicada2013-data56013-lfs-exact-retrieval
          path: |
            ${{ runner.temp }}/56013-lfs-pointer.txt
            ${{ runner.temp }}/56013-lfs-pointer-content.txt
            ${{ runner.temp }}/56013-evidence
            ${{ runner.temp }}/cicada-lfs/puzzles/2013/cicada-os/DATA/560.13
          compression-level: 0
          if-no-files-found: warn
