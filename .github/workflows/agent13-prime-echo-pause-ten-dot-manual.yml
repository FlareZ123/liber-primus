name: Agent13 original 2013 prime pauses to LP2 10-dot gate
on:
  workflow_dispatch:
jobs:
  source-gate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original source-only two-pause gate
        run: node sims/lp2_prime_echo_pause_tendot_boundary_sft.cjs
