name: Agent44 p6 red-span to p32 source-gate SFT

on:
  workflow_dispatch:
  push:
    paths:
      - "sims/lp2_redspan_181_p50_path_p32_source_gate.cjs"
      - "resources/liber-primus/lp2-corpus.json"
      - "resources/liber-primus/lp2-ink-annotations.json"
      - "resources/liber-primus/lp2-grid-256.json"
      - "resources/liber-primus/base60-grid.json"
      - "resources/lp2-transcription.txt"

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Reproduce red-span, p50 and p32 source gates
        run: node sims/lp2_redspan_181_p50_path_p32_source_gate.cjs
