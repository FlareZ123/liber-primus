name: Agent18 original lag-five word-boundary locality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-original-input:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact original source and word-locality null
        run: |
          node --check sims/lp2_lag5_word_boundary_locality_sft.cjs
          node sims/lp2_lag5_word_boundary_locality_sft.cjs
          node --check sims/lp2_wordlocal_fivephase_allsecret_sft.cjs
          node sims/lp2_wordlocal_fivephase_allsecret_sft.cjs
          node --check sims/lp2_wordlocal_fivephase_english_controls_sft.cjs
          node sims/lp2_wordlocal_fivephase_english_controls_sft.cjs
