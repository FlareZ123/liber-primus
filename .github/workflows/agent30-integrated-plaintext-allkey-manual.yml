name: Agent30 integrated plaintext feedback original gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-all-key-inverse:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full original and source-native positive controls
        run: node sims/lp2_integrated_plainfeedback_allkey_sft.cjs
