name: Agent50 original source all-secret inverse gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-selected-original-plaintext-controls:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CommonJS syntax for direct plaintext feedback
        run: node --check sims/lp2_direct_plainprev_lookup_consensus_sft.cjs
      - name: Original direct plaintext-feedback and native plant
        run: node sims/lp2_direct_plainprev_lookup_consensus_sft.cjs
      - name: CommonJS syntax for p27/p55 six-phase all-secret gate
        run: node --check sims/lp2_p27_p55_sixphase_allsecret_sft.cjs
      - name: Original six-phase key-reuse obstruction and native plant
        run: node sims/lp2_p27_p55_sixphase_allsecret_sft.cjs
