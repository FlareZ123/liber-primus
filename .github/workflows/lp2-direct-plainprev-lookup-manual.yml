name: Agent50 direct plaintext-predecessor all-secret consensus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-and-native-positive:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CommonJS syntax
        run: node --check sims/lp2_direct_plainprev_lookup_consensus_sft.cjs
      - name: Original GP29 all-secret lookup and source-native planted control
        run: node sims/lp2_direct_plainprev_lookup_consensus_sft.cjs
