name: Agent45 P33 DH Layout State Register

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p33-layout:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run p33 DH layout state-register gate
        shell: pwsh
        run: node sims/lp2_p33_dh_layout_state_register_sft.cjs
