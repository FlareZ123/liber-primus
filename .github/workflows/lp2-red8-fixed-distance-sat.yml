name: Carry-independent fixed-heading distance SAT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        variant: [ordinal, prime]
        seed: [7311, 8317]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check python-sat==1.9.dev24
      - name: Blind matched-profile test
        run: python -u sims/lp2_red8_carryfree_fixed_distance_sat_sft.py --variant ${{ matrix.variant }} --seed ${{ matrix.seed }} --seconds 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red8-distance-${{ matrix.variant }}-${{ matrix.seed }}
          path: im-results/lp2-red8-fixed-distance-*.json
          if-no-files-found: warn
  original-gate:
    if: always()
    needs: controls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: red8-distance-*
          path: controls
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check python-sat==1.9.dev24
      - name: Gate each original vector independently
        run: |
          python - <<'PY'
          import json,glob,subprocess
          rows=[json.load(open(p)) for p in glob.glob('controls/**/*.json',recursive=True)]
          for v in ('ordinal','prime'):
              cases=[r for r in rows if r['variant']==v]
              passed=len(cases)==2 and {r['seed'] for r in cases}=={7311,8317} and all(r['passed'] for r in cases)
              print(v, 'original gate', passed, flush=True)
              if passed:
                  subprocess.run(['python','-u','sims/lp2_red8_carryfree_fixed_distance_sat_sft.py','--variant',v,'--original','--seconds','600'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red8-distance-original
          path: im-results/lp2-red8-fixed-distance-*-original.json
          if-no-files-found: ignore
