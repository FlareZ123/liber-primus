name: Agent4 terminal CDE double-phi gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal-cde:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sims/lp2_terminal_cde_double_phi_sft.cjs
      - run: node sims/lp2_terminal_cde_double_phi_sft.cjs
