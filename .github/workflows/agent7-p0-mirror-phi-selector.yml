name: Agent7 p0 pre-IDEA mirror-to-phi selector

on:
  workflow_dispatch:

jobs:
  selector:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check sims/lp2_p0_second_passage_mirror_phi_selector_sft.cjs
      - name: Run Report11 plus mirror-to-phi selector
        run: node sims/lp2_p0_second_passage_mirror_phi_selector_sft.cjs
