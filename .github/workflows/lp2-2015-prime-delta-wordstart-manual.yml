name: LP2 original prime-delta word-start signal

on:
  workflow_dispatch:

jobs:
  original-wordstart-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original-source word-start test
        run: node sims/lp2_2015_prime_delta_wordstart_signal_sft.cjs
