name: Agent34 p55 WE p33 map cycle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce p55 WE p33 map cycle
        shell: pwsh
        run: node sims/lp2_p55_we_p33_map_cycle_sft.cjs
