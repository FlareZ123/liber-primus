name: Agent20 original-source cryptanalytic controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-sft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original p7-p8 GF3 state-address readout and solved control
        run: node sims/lp2_p7_gf3_p8_lexicographic_cycle_sft.cjs
      - name: Original p55 H-sum pair readout and conditioned null
        run: node sims/lp2_p55_hsum_gp29_source_sft.cjs
      - name: Original p55 H-sum 55-page familywise selection test
        run: node sims/lp2_p55_hsum_familywise_55page_original_sft.cjs
      - name: Original p8 DH exponent codebook and both GF3 splices
        run: node sims/lp2_p8_dh_exponent_context_original_sft.cjs
