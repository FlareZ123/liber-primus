name: LP2 period-eight all-secret F-clock original source
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-original-source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full eight-key necessary-condition and native-plant gate
        run: node sims/lp2_allsecret_period8_ftransparent_exact_sft.cjs
