name: Agent11 original LP2 inverted-cross title and strict cipher gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-title-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original red 8+5 title cipher with authentic positive
        run: node sims/lp2_p0_inverted_cross_8plus5_title_fclock_sft.cjs
