name: Agent14 source-addressed AES keyskip heldout test
on:
  workflow_dispatch:
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run exact source-key anti-repeat gate
        run: node sims/lp2_pagecarry_aes_keyskip_original_sft.cjs
