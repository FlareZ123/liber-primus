name: Stage 10 matrix order and key-schedule gates
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Reproduce matrix orders and LP2 transforms
        run: node sims/lp1_p16_order56_pagepower_sft.cjs --write stage10-matrix-gates.json
      - name: Upload complete numerical output
        uses: actions/upload-artifact@v4
        with:
          name: stage10-matrix-gates
          path: stage10-matrix-gates.json
