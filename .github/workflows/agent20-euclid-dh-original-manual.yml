name: Agent20 LP1 magic-square Euclid to LP2 p28 DH state
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  euclid-dh-original:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original first-release magic-square and page28 source state test
        run: node sims/lp2_lp1_square_euclid_dh23_p28_sft.cjs
