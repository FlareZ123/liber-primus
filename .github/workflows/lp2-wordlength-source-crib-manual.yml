name: LP2 independent source-crib and periodic-key gates
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-crib:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Evaluate original input and source native controls
        run: node sims/lp2_wordlength_source_crib_sft.cjs
      - name: Test source-derived periodic keys without fitting a key
        run: node sims/lp2_sourceperiod_keyblind_gate_sft.cjs
