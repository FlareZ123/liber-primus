name: LP2 p57 one-edge word key original-cipher gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p57-wordedge19-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-pinned p55 19-word-key family and matched negative
        run: node sims/lp2_p57_wordedge19_p55_source_sft.cjs
