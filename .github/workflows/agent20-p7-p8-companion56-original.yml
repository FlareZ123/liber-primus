name: Agent20 LP2 p7-p8 reverse companion56 original cipher gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-companion56:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reverse title algebra and full 56-page cipher gate
        shell: pwsh
        run: node sims/lp2_p7_p8_title_companion56_original_sft.cjs
