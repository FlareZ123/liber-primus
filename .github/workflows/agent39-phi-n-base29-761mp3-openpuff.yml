name: Agent39 parable totient BASE29 key on original 2013 761.MP3
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent39-phi-n-base29-original-761mp3-openpuff
  cancel-in-progress: false
jobs:
  source-derived-audio-carrier:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit Python and native UI requirements
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Verify source-derived parable totient and BASE29 key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import struct; assert struct.calcsize('P') == 4"
          python -m pip install --disable-pip-version-check pywinauto Pillow filelock
          python sims/openpuff_output_capture_sft.py
          if ($LASTEXITCODE -ne 0) { throw 'Native OpenPuff capture control failed' }
          node sims/instar_metadata_totient_p55_gate.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Original p57 prime-product/totient source gate failed' }
          python -c "import json; c=json.load(open('resources/liber-primus/lp2-corpus.json',encoding='utf-8')); d=[2,19,16,20,7,2,26]; k=''.join(c['translit'][i] for i in d); assert k=='THMTLWTHY', (d,k); print('SOURCE_DERIVED_PHI_N_BASE29_KEY=THMTLWTHY')"
          if ($LASTEXITCODE -ne 0) { throw 'BASE29 key transliteration mismatch' }
      - name: Pin historical OpenPuff v4.00 binary and DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://raw.githubusercontent.com/codejanus/ToolSuite/1eaf6d006d31ba842f6cc6b16e9d82dbf904aaf5/OpenPuff'
          $folder = Join-Path $env:RUNNER_TEMP 'OpenPuff-v400-Agent39-761'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $expected = @{
            'OpenPuff.exe' = '466e03c792075313ce533a5dc7a789e8a41209f9'
            'libObfuscate.dll' = 'f3b1c3315f8286346416fefd6141410f422f2454'
          }
          foreach ($name in $expected.Keys) {
            $target = Join-Path $folder $name
            Invoke-WebRequest -Uri "$base/$name" -OutFile $target
            $actual = (& git hash-object -- $target).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$name]) { throw "Original OpenPuff binary mismatch: $name" }
          }
          "OPENPUFF_EXE=$(Join-Path $folder 'OpenPuff.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Retrieve and authenticate original 2013 and 2014 MP3 carriers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $controlUrl = 'https://raw.githubusercontent.com/iBotPeaches/cicada_3301/a0a616d85717af59f8b806875b43d51e06e1e874/tool/storage/interconnected.mp3'
          $targetUrl = 'https://raw.githubusercontent.com/rtkd/iddqd/f2267b0c2f1e1d2662806b90b9c3a2953b3a7023/2013/02/761.MP3'
          $control = Join-Path $env:RUNNER_TEMP 'interconnected.mp3'
          $target = Join-Path $env:RUNNER_TEMP '761.MP3'
          Invoke-WebRequest -Uri $controlUrl -OutFile $control
          Invoke-WebRequest -Uri $targetUrl -OutFile $target
          if ((Get-Item $control).Length -ne 6651873) { throw '2014 original length mismatch' }
          if ((Get-Item $target).Length -ne 4010732) { throw '2013 original length mismatch' }
          $controlBlob = (& git hash-object -- $control).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $controlBlob -ne '09fe068192b76a3697c47ec1d604b527703db798') { throw "2014 source blob mismatch: $controlBlob" }
          $targetHash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($targetHash -ne '83008217439110c3b824898af73b99cb2cf0657dda88cb363c3aa34a4ec0a460') { throw "2013 source SHA256 mismatch: $targetHash" }
          $tag = [System.Text.Encoding]::GetEncoding('ISO-8859-1').GetString([System.IO.File]::ReadAllBytes($target),0,206)
          if (-not $tag.Contains('Parable 1,595,277,641')) { throw '2013 ID3 Parable number absent from authenticated original' }
          Write-Host "AUTHENTICATED_2013_761_MP3_SHA256=$targetHash"
          "CONTROL_MP3=$control" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PARABLE_MP3=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate historical single-MP3 positive control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$env:CONTROL_MP3" --password '33011033' --bit-format 'Mp3 (Audio)' --bit-level '1/2 (50%) - Maximum' --out probe-output/2014-control --output-name 'magicsquares.txt' --wait-seconds 30 --expected-crc32 '6A8C41E3' --expected-size 745
          if ($LASTEXITCODE -ne 0) { throw '2014 native positive control failed to execute' }
          $r = Get-Content 'probe-output/2014-control/result.json' -Raw | ConvertFrom-Json
          if (-not $r.expected_match) { throw 'Exact 745-byte 2014 MP3 positive control mismatch' }
          Write-Host 'NATIVE_SINGLE_MP3_POSITIVE_CONTROL_PASS'
      - name: One A-only Unhide of original 2013 761.MP3 with the frozen BASE29 totient key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python sims/openpuff_v400_extract.py --exe "$env:OPENPUFF_EXE" --carrier "$env:PARABLE_MP3" --password 'THMTLWTHY' --bit-format 'Mp3 (Audio)' --bit-level '1/2 (50%) - Maximum' --out probe-output/original-2013-761-phi-n-base29 --wait-seconds 150
          if ($LASTEXITCODE -ne 0) { throw 'Native original 2013 MP3 extraction did not execute' }
          $r = Get-Content 'probe-output/original-2013-761-phi-n-base29/result.json' -Raw | ConvertFrom-Json
          if ($r.carrier_count -ne 1 -or -not $r.carrier_added -or -not $r.bit_selection_verified -or -not $r.attempted) { throw 'Native GUI did not verify the original single MP3 carrier and actual extraction' }
          if ($r.native_probe_outcome -eq 'inconclusive-timeout') { throw 'Native OpenPuff result inconclusive' }
          Write-Host "ORIGINAL_2013_761_MP3_NATIVE_RESULT $($r | Select-Object carrier_count,native_probe_outcome,output_present,outputs,selected_capacity_bytes_after_level,completion_dialogs,error_dialogs | ConvertTo-Json -Depth 12 -Compress)"
      - name: Preserve exact native evidence and any extracted bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent39-phi-n-base29-original-761mp3-openpuff-evidence
          path: probe-output/
          if-no-files-found: warn
