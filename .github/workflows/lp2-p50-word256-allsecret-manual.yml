name: LP2 P50 256-word all-secret codebook gate
on:
  workflow_dispatch:
jobs:
  original-source-codebook:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-exact 256-word secret-alphabet original and native controls
        run: node sims/lp2_p50_256word_secret_codebook_sft.cjs
