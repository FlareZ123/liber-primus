name: Agent 7 original page-start common-reset all-secret gate
on:
  push:
    paths:
      - 'sims/lp2_page_start_fixed_reset_allsecret_sft.cjs'
      - '.github/workflows/agent7-page-start-allsecret-sft.yml'
  workflow_dispatch:

jobs:
  original-and-plants:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original GP29 page-start all-secret gate and source-native controls
        run: node sims/lp2_page_start_fixed_reset_allsecret_sft.cjs
