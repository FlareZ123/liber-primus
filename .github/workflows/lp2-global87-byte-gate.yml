name: LP2 book-global 87-packet all-secret byte gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 87-packet source test and synthetic exact inverse
        run: node sims/lp2_global87_chapter_byte_gate_sft.cjs
