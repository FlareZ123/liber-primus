name: LP2 p56 literal-hash OutGuess p55 invalid-geometry guard

on:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned OutGuess with a rejecting zero-skip modulus guard
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential libjpeg-dev
          git clone --depth 1 https://github.com/resurrecting-open-source-projects/outguess.git /tmp/outguess
          git -C /tmp/outguess fetch --depth 1 origin 24810e14327c2bbeedeaadd3e24491f2a4425c02
          git -C /tmp/outguess checkout --detach 24810e14327c2bbeedeaadd3e24491f2a4425c02
          python3 -c 'from pathlib import Path; p=Path("/tmp/outguess/src/outguess.c"); s=p.read_text(); old="while (datalen > 0) {\\n\\t\\titerator_adapt(iter, bitmap, datalen);\\n\\t\\tbuf[n++]"; new="while (datalen > 0) {\\n\\t\\titerator_adapt(iter, bitmap, datalen);\\n\\t\\tif (iter->skipmod == 0) {\\n\\t\\t\\tfprintf(stderr, \\"Steg retrieve: impossible zero skipmod for len=%u bits=%d offset=%d\\\\n\\", datalen, bitmap->bits, iter->off);\\n\\t\\t\\texit(1);\\n\\t\\t}\\n\\t\\tbuf[n++]"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
          cd /tmp/outguess
          ./autogen.sh
          CFLAGS='-O2 -std=gnu11' ./configure --with-generic-jconfig
          make -j2 CC=gcc CFLAGS='-O2 -std=gnu11'
          sudo make install
      - name: Reproduce original wrong-key case and reject the impossible geometry
        shell: bash
        env:
          LP2_OUTGUESS_PASSWORD: 36367763ab73783c7af284446c59466b4cd653239a311cb7116d4618dee09a8425893dc7500b464fdaf1672d7bef5e891c6e2274568926a49fb4f45132c2a8b4
          LP2_OUTGUESS_SOURCE_IMAGE: '72'
        run: |
          set -euo pipefail
          node --check sims/outguess_lp2_keyed_probe.cjs
          node sims/outguess_lp2_keyed_probe.cjs
          set +e
          outguess -k "$LP2_OUTGUESS_PASSWORD" -r resources/liber-primus/72.jpg /tmp/lp2-hash-72.out > /tmp/lp2-hash-72.log 2>&1
          result=$?
          set -e
          cat /tmp/lp2-hash-72.log
          echo "Original image extraction return code: $result"
          test "$result" -eq 1
          grep -q 'Steg retrieve: impossible zero skipmod' /tmp/lp2-hash-72.log
          if test -f /tmp/lp2-hash-72.out; then test ! -s /tmp/lp2-hash-72.out; fi
