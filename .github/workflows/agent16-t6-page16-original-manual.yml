name: Agent16 LP2 original lag-six 16-phase source gate
on:
  workflow_dispatch:
jobs:
  original-page-phase:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original page-16-phase SFT with rotations and planted positive
        run: node sims/lp2_t6_page16_residue_original_sft.cjs
