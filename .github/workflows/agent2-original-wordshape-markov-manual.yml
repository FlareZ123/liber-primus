name: Agent2 original Markov and language controls (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-shaped-controls:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original word-local chain model
        run: node sims/lp2_chain28_lag5_joint_null_sft.cjs
      - name: Test original Orthodox Russian word-shape alternative
        run: node sims/lp2_orthodox_russian_wordshape_sft.cjs
