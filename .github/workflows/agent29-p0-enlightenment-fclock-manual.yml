      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original p0, solved p56 and native p57 controls
        run: |
          node --check sims/lp2_p0_enlightenment_ftransparent_exact_certificate_sft.cjs
          node sims/lp2_p0_enlightenment_ftransparent_exact_certificate_sft.cjs
