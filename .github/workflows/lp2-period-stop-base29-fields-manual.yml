name: LP2 original punctuation BASE29 fields
on:
  workflow_dispatch:
jobs:
  original-inverse:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original GP29 punctuation fields and source-positive control
        run: node sims/lp2_period_stop_base29_fields_sft.cjs
