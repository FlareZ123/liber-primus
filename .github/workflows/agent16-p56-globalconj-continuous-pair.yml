name: Agent16 P56 Global Conjugation Continuous Pair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run optimized continuous-clock pair gate
        shell: pwsh
        run: node sims/agent16_p56_globalconj_continuous_pair_sft.cjs
