name: De Bruijn row x 13-31 LCG8 column DES inverse
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-fixed-des:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-fixed combined row and column map
        run: |
          node sims/fragment_grid_des_debruijn_lcg8_inverse.cjs > /tmp/result.json
          cat /tmp/result.json
      - name: Persist compact reproducible result
        run: |
          cp /tmp/result.json im-results/fragment-grid-des-debruijn-lcg8-inverse.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/fragment-grid-des-debruijn-lcg8-inverse.json
          git commit -m "Agent 23: record combined de Bruijn LCG8 DES screen"
          git pull --rebase origin main
          git push
