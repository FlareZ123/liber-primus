name: LP2 Latin heading conditional geometry
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Select original conditional geometry runs or the frozen continuation inverse
        type: choice
        required: true
        default: standard
        options:
          - standard
          - continuation
permissions:
  contents: read
jobs:
  original-geometry-null:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original LP2 p0 candidate and conditional 1000000 shuffle null
        if: inputs.probe != 'continuation'
        run: node sims/latin_heading_geometry_joint_null.cjs 1000000
      - name: Uncribbed source-geometric Latin model and 100000 max-null calibration
        if: inputs.probe != 'continuation'
        run: node sims/latin_heading_unlabeled_inverse.cjs 100000
      - name: Self-rooted source-only 27x27 circuit with frozen geometry nulls
        if: inputs.probe != 'continuation'
        run: node sims/latin_heading_source_closed_loop.cjs 20000
      - name: Frozen source-only original LP2 route 38 to 39
        if: inputs.probe == 'continuation'
        run: node sims/latin_27square_frozen_nextblock.cjs
