name: Agent50 p39 quadratic original all-secret cipher gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-original-key-invariant:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone CommonJS syntax
        run: node --check sims/lp2_p39_quadratic203_allsecret_sft.cjs
      - name: Exhaust original p39 quadratic seeds and compare native controls
        run: node sims/lp2_p39_quadratic203_allsecret_sft.cjs
      - name: Check source-selected plaintext-autokey CJS syntax
        run: node --check sims/lp2_p39_quadratic_plaintext_autokey_allsecret_sft.cjs
      - name: Exhaust 841 plaintext-autokey seed states and native GP controls
        run: node sims/lp2_p39_quadratic_plaintext_autokey_allsecret_sft.cjs
