name: Original LP2 p27 p55 affine two-time-pad dictionary inverse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-native word list
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cmudict==1.1.3
      - name: Run original-corpus exact shared-pad affine inverse
        shell: pwsh
        run: python sims/lp2_p27_p55_affine_twotimepad_sft.py
