name: LP2 lag-five contiguous echo challenge (manual)

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Original forward controls or frozen predictive holdout'
        required: true
        type: choice
        default: forward-controls
        options:
          - forward-controls
          - frozen-predictor
          - grid-rank28
          - fibonacci-logstep-inverse
      train:
        description: 'Independent null calibration replicates'
        required: false
        default: '2000'
      test:
        description: 'Independent familywise null replicates'
        required: false
        default: '5000'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conditioned lag family and S echo
        if: ${{ inputs.experiment == 'forward-controls' }}
        run: node sims/lag5_contiguous_echo_challenge.cjs ${{ inputs.train }} ${{ inputs.test }}

      - name: Published M1 and independent-copy M3 forward controls
        if: ${{ inputs.experiment == 'forward-controls' }}
        run: node sims/lag5_block_echo_forward_challenge.cjs 8000

      - name: Conditioned lag-five and lag-six hit-pattern coupling
        if: ${{ inputs.experiment == 'forward-controls' }}
        run: node sims/lag5_t6_joint_hitpatterns.cjs

      - name: Frozen predictive LP2 lag5/lag6 heldout test
        if: ${{ inputs.experiment == 'frozen-predictor' }}
        run: node sims/lp2_heldout_echo_predictor.cjs

      - name: Forward adequacy against original-trained conditional score
        if: ${{ inputs.experiment == 'frozen-predictor' }}
        run: node sims/lp2_echo_forward_model_gate.cjs

      - name: Eight source-section leave-one-out likelihood challenge
        if: ${{ inputs.experiment == 'frozen-predictor' }}
        run: node sims/lp2_echo_section_crossfit.cjs

      - name: Eight original grid-column predecessor-exclusion inverse
        if: ${{ inputs.experiment == 'grid-rank28' }}
        run: node sims/grid_rank28_cryptanalysis.cjs

      - name: Exact Fibonacci28 logarithmic-step GP-word inverse
        if: ${{ inputs.experiment == 'fibonacci-logstep-inverse' }}
        run: node sims/fibonacci_step_word_inverse.cjs 40
