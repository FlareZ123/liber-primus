name: Agent5 DIUINITY readout-order source gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sims/lp2_p57_divinity_readout_order_source_sft.cjs
      - run: node sims/lp2_p57_divinity_readout_order_source_sft.cjs
