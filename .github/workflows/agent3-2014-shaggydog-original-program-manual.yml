name: Agent3 original 2014 modified rcrypto plus OEIS helper
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static source acquisition and controls
        run: |
          node --check sims/lp2_2014_shaggydog_original_program_sft.cjs
          node sims/lp2_2014_shaggydog_original_program_sft.cjs --selftest
      - name: Acquire three exact 2014 original participant sources and inspect without executing
        run: node sims/lp2_2014_shaggydog_original_program_sft.cjs
      - name: Replay original source marked-F page56 against the image-native 85-rune control
        run: |
          node --check sims/lp2_2014_shaggydog_source_p56_positive_sft.cjs
          node sims/lp2_2014_shaggydog_source_p56_positive_sft.cjs --selftest
          node sims/lp2_2014_shaggydog_source_p56_positive_sft.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent3-original-2014-shaggydog-python-sources
          path: irc2014-source-code/
          retention-days: 90
          if-no-files-found: warn
