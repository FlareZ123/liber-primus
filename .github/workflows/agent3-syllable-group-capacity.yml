name: Agent3 syllable-count original capacity SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CMU dictionary
        run: python -m pip install --disable-pip-version-check "cmudict==1.1.3"
      - name: Exact alignment-independent syllable counts
        run: python sims/lp2_syllable_group_capacity_sft.py
