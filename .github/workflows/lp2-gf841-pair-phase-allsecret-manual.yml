name: LP2 GF841 pair-phase all-secret gate (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sims/lp2_gf841_pair_phase_allsecret_sft.cjs'
      - '.github/workflows/lp2-gf841-pair-phase-allsecret-manual.yml'
permissions:
  contents: read
jobs:
  pair-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All-secret 841-symbol pair-bijection invariant, periods 1/7/28/840
        run: node sims/lp2_gf841_pair_phase_allsecret_sft.cjs
