name: LP2 GF841 pair-phase and Q238 p36 relative-trace gates (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All-secret 841-symbol pair-bijection invariant, periods 1/7/28/840
        run: node sims/lp2_gf841_pair_phase_allsecret_sft.cjs
  p36-relative-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: p36-seeded Q238 relative-trace additive gate
        run: node sims/lp2_p36_gf841_q238_relative_trace_sft.cjs
