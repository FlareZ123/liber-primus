name: Agent6 2014 LP2 PDF and PostScript master-pointer source gate

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  period-master-pointer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate parser and planted controls
        run: |
          node --check sims/lp2_2014_period_master_pointer_sft.cjs
          node sims/lp2_2014_period_master_pointer_sft.cjs --selftest
      - name: Scan only SHA-pinned original 2014 transcripts and Stage11 source files
        run: node sims/lp2_2014_period_master_pointer_sft.cjs --network
      - name: Publish source findings to Director Issue 1066
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/issues/1066/comments" -f body="$(cat im-results/lp2-2014-period-master-pointer-report.md)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent6-2014-period-master-pointer-report
          path: |
            im-results/lp2-2014-period-master-pointer-report.md
            im-results/lp2-2014-period-master-pointer-report.json
          retention-days: 90
          if-no-files-found: warn
