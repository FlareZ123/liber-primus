name: LP2 OutGuess page 05 probe (manual)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sims/outguess_lp2_page05_probe.sh'
      - 'resources/liber-primus/05.jpg'
      - '.github/workflows/lp2-outguess-page05-probe.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: henkman/outguess
          ref: 80f4b313c580a6928aa7fe8bf0bb4fabb7990262
          path: outguess-src
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Build pinned read-only OutGuess extractor (MIT Go port)
        run: |
          mkdir -p "$RUNNER_TEMP/gopath/src/github.com/henkman"
          ln -s "$GITHUB_WORKSPACE/outguess-src" "$RUNNER_TEMP/gopath/src/github.com/henkman/outguess"
          GO111MODULE=off GOPATH="$RUNNER_TEMP/gopath" go build -o "$RUNNER_TEMP/outguess" github.com/henkman/outguess/cmd/outguess
      - name: Probe known carrier 00 and candidate 05
        run: bash sims/outguess_lp2_page05_probe.sh "$RUNNER_TEMP/outguess" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/outguess-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp2-outguess-page05-probe
          path: ${{ runner.temp }}/outguess-probe
          if-no-files-found: warn
