name: LP1 physical page 05 source-derived keyed OutGuess probe (manual/push)
on:
  workflow_dispatch:
  push:
    paths:
      - 'sims/outguess_lp2_page05_probe.sh'
      - '.github/workflows/lp2-outguess-page05-probe.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: resurrecting-open-source-projects/outguess
          ref: 24810e14327c2bbeedeaadd3e24491f2a4425c02
          path: outguess-src
          persist-credentials: false
      - name: Build pinned OutGuess 0.4 C extractor (BSD)
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool gnupg
          cd outguess-src
          ./autogen.sh
          ./configure --with-generic-jconfig
          # The generic libjpeg config leaves prototypes undefined; enable them for modern compilers.
          sed -i 's/^#undef HAVE_PROTOTYPES/#define HAVE_PROTOTYPES/' src/jpeg-6b-steg/jconfig.h
          make -j2
          echo "$GITHUB_WORKSPACE/outguess-src/src" >> "$GITHUB_PATH"
      - name: Probe LP1 page00 control and source-keyed LP1 page05
        run: bash sims/outguess_lp2_page05_probe.sh outguess "$GITHUB_WORKSPACE" "$RUNNER_TEMP/outguess-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp2-outguess-page05-probe
          path: ${{ runner.temp }}/outguess-probe
          if-no-files-found: warn
