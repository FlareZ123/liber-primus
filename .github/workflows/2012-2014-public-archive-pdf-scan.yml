name: 2012-2014 public archive PDF token scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-public-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install PDF text and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Scan named public archive records
        run: python3 sims/cicada_public_archive_pdf_scan.py

      - name: Upload sanitized candidate report
        uses: actions/upload-artifact@v4
        with:
          name: cicada-public-archive-pdf-scan
          path: artifacts/cicada-public-archive-pdf-scan/
          if-no-files-found: error
          retention-days: 30
