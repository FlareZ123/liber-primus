name: Agent49 skip-aware all-phase 581-key original long-word gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skipaware:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Source-pin registered historical key generator
        uses: actions/checkout@v4
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external-cicada3301
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate the exact frozen 581 source-key library
        run: |
          python -m pip install numpy mpmath
          python external-cicada3301/work/kscreen/export.py
          python external-cicada3301/work/kscreen/signrules.py
      - name: Enumerate all key phases signs directions and hidden skip modes on original GP words
        run: node sims/lp2_pdir_581_skipaware_wordlex_sft.cjs external-cicada3301/work/kscreen/data/library_flat.ksb ${{ matrix.shard }} 6
