name: Cross-clue full plaintext inversion under unknown alphabet
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 29-symbol Hungarian inversion and heldout plaintext test
        run: node sims/grid_square_outer_plaintext.cjs
