name: LP2 doublet plaintext-letter marker
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Score 29-symbol letter-marker hypotheses
        run: node sims/doublet_plaintext_letter_marker.cjs
