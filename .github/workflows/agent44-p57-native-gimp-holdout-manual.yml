name: LP2 p57 GIMP native 576 heldout artwork SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original-image analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "scipy>=1.11,<2" "pillow>=10,<13"
      - name: Verify original JPEGs, native GLib and 20% heldout GIMP rendering
        run: python sims/lp2_p57_gimp_dissolve_native_holdout_sft.py
