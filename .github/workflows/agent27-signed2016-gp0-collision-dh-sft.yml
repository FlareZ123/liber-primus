name: Agent27 signed-2016 GP0 collision DH state SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct DH state from authenticated source collisions
        shell: pwsh
        run: node sims/lp2_signed2016_gp0_collision_dh_state_sft.cjs
