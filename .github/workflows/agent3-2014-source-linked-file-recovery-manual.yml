name: Agent3 2014 source-linked original file acquisition
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pinned source and file-selection controls
        run: |
          node --check sims/lp2_2014_source_link_acquisition_sft.cjs
          node sims/lp2_2014_source_link_acquisition_sft.cjs --selftest
      - name: Download historical links without executing untrusted content
        run: node sims/lp2_2014_source_link_acquisition_sft.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent3-2014-original-irc-file-objects
          path: irc2014-link-acquired/
          retention-days: 90
          if-no-files-found: warn
