name: LP2 grid-column unknown-alphabet inversion (manual)
on:
  workflow_dispatch:
jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover plaintext candidates with jointly inferred rune alphabet and skips
        run: node sims/grid_column_unknown_sigma.cjs
