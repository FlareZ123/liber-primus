name: LP2 shared-pad unknown-offset heldout

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pairwise offset search and heldout validation
        run: node sims/pair_offset_pad.cjs
