name: LP2 2019 publisher manuscript attachments
on:
  workflow_dispatch:
jobs:
  scan-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-date interview public attachment metadata
        run: |
          node --check sims/lp2_2019_interview_public_attachment_source_sft.cjs
          node sims/lp2_2019_interview_public_attachment_source_sft.cjs
