name: LP2 p32 direction-field test on original 2016 image

on:
  workflow_dispatch:

jobs:
  direction-field:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image reader
        run: python -m pip install --disable-pip-version-check --quiet Pillow
      - name: Run frozen source-locked 100-cell direction test
        run: python sims/tree121_directional_field_sft.py
