name: LP2 p15 all-secret 16-column word gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact 16-column DP and held-out language controls
        run: node sims/lp2_p15_allsecret_16column_word_gate_sft.cjs
