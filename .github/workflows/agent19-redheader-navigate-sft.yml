name: Agent19 red-header prime256 page-navigation SFT
on:
  push:
    paths:
      - .github/workflows/agent19-redheader-navigate-sft.yml
      - sims/lp2_red_headings_gpprime_p50_page_navigation_sft.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-original-navigation:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/lp2_red_headings_gpprime_p50_page_navigation_sft.cjs
