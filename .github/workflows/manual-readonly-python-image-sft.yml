name: Run one read-only Python research SFT

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Committed sims/*.py research test; the R4/H1 test selects its own pinned Linux job'
        required: true
        default: sims/lp2_fivedot_original_jpeg_reflection_sft.py

permissions:
  contents: read
  actions: read

jobs:
  image-source-test:
    if: ${{ inputs.script != 'sims/lp2_r4_composite_h1_sft.py' && inputs.script != 'sims/lp2_plaintext_autokey_q8_keyless_pair_bv.py' && inputs.script != 'sims/lp2_semantic_running_key_distilgpt2_sft.py' && inputs.script != 'sims/lp2_semantic_running_key_recovery_sft.py' && inputs.script != 'sims/lp2_semantic_running_key_boundary_profile_sft.py' && inputs.script != 'sims/lp2_shared_gp29_q8_carry_prefix_sft.py' && inputs.script != 'sims/lp2_shared_gp29_q8_multichapter_pool_sft.py' && inputs.script != 'sims/lp2_nonperiodic_fhold_outer_sat.py' && inputs.script != 'sims/lp2_nonperiodic_fhold_outer_scope_sat.py' && inputs.script != 'sims/lp2_p56_primeclock_projected_sat.py' }}
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out primary repository
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned JPEG reader
        shell: pwsh
        run: |
          & python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install PDF renderer for Song 2004 figure acquisition
        if: ${{ inputs.script == 'sims/lp2_p27_song2004_figure_acquisition_sft.py' }}
        shell: pwsh
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Install PDF renderer for Boulard 2013 figure acquisition
        if: ${{ inputs.script == 'sims/lp2_p27_boulard2013_source_acquisition_sft.py' }}
        shell: pwsh
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Install bounded wing-source registration dependencies
        if: ${{ inputs.script == 'sims/lp2_p27_myers1929_commons2011_source_sft.py' }}
        shell: pwsh
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7 opencv-python-headless==4.12.0.88 requests==2.32.5 filelock==3.20.0
      - name: Install later Moulds plate topology dependencies
        if: ${{ inputs.script == 'sims/lp2_p27_moulds_lateplate_topology_sft.py' || inputs.script == 'sims/lp2_p27_other_auchenorrhyncha_sft.py' }}
        shell: pwsh
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7 opencv-python-headless==4.12.0.88 requests==2.32.5 filelock==3.20.0 scipy==1.16.3 networkx==3.5
      - name: Install topology dependencies for the exact p27 shared-source candidate
        if: ${{ inputs.script == 'sims/lp2_p27_thieme_samepage_topology_sft.py' || inputs.script == 'sims/lp2_p27_rohdendorf1949_topology_sft.py' }}
        shell: pwsh
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 scipy==1.16.3 networkx==3.5
      - name: Install matching dependency for literal-F conjugacy recovery
        if: ${{ inputs.script == 'sims/lp2_cipher_conjugacy_fhold_matching_sft.py' }}
        shell: pwsh
        run: python -m pip install --disable-pip-version-check networkx==3.5
      - name: Install pinned Kumar proxy registration dependencies
        if: ${{ inputs.script == 'sims/lp2_p27_kumar2021_song_proxy_sft.py' }}
        shell: pwsh
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7 opencv-python-headless==4.12.0.88 requests==2.32.5 filelock==3.20.0
      - name: Validate and execute selected research SFT
        shell: pwsh
        env:
          TEST_SCRIPT: ${{ inputs.script }}
        run: |
          if ($env:TEST_SCRIPT -notmatch '^sims/[A-Za-z0-9_.-]+[.]py$') {
            throw 'Script must be a direct .py file in sims/'
          }
          if (-not (Test-Path -LiteralPath $env:TEST_SCRIPT -PathType Leaf)) {
            throw 'Requested committed research script does not exist'
          }
          & python -- $env:TEST_SCRIPT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve sealed p33–39 discovery packet
        if: ${{ success() && inputs.script == 'sims/lp2_p33_p39_blind_packet_sft.py' }}
        uses: actions/upload-artifact@v4
        with:
          name: lp2-p33-p39-discovery
          path: im-results/lp2-p33-p39-blind-packet/discovery.zip
          if-no-files-found: error
      - name: Preserve separate moderator-only p33–39 materials
        if: ${{ success() && inputs.script == 'sims/lp2_p33_p39_blind_packet_sft.py' }}
        uses: actions/upload-artifact@v4
        with:
          name: lp2-p33-p39-moderator-only
          path: |
            im-results/lp2-p33-p39-blind-packet/holdout.zip
            im-results/lp2-p33-p39-blind-packet/moderator.md
          if-no-files-found: error

      - name: Preserve Kumar proxy evidence
        if: ${{ always() && inputs.script == 'sims/lp2_p27_kumar2021_song_proxy_sft.py' }}
        uses: actions/upload-artifact@v4
        with:
          name: source-test-output
          path: im-results/lp2-p27-kumar2021-proxy/source-test-output.json
          if-no-files-found: warn
      - name: Preserve bounded Song 2004 figure acquisition
        if: ${{ always() && inputs.script == 'sims/lp2_p27_song2004_figure_acquisition_sft.py' }}
        uses: actions/upload-artifact@v4
        with:
          name: lp2-p27-song2004-figure
          path: im-results/lp2-p27-song2004-figure/
          if-no-files-found: warn
      - name: Preserve Boulard 2013 labeled wing figure
        if: ${{ always() && inputs.script == 'sims/lp2_p27_boulard2013_source_acquisition_sft.py' }}
        uses: actions/upload-artifact@v4
        with:
          name: lp2-p27-boulard2013-figure
          path: im-results/lp2-p27-boulard2013-figure/
          if-no-files-found: warn
      - name: Preserve Myers and Commons wing source comparison
        if: ${{ always() && inputs.script == 'sims/lp2_p27_myers1929_commons2011_source_sft.py' }}
        uses: actions/upload-artifact@v4
        with:
          name: lp2-p27-myers-commons
          path: im-results/lp2-p27-myers-commons/
          if-no-files-found: warn
      - name: Preserve later Moulds plate topology evidence
        if: ${{ always() && inputs.script == 'sims/lp2_p27_moulds_lateplate_topology_sft.py' }}
        uses: actions/upload-artifact@v4
        with:
          name: lp2-p27-moulds-lateplates
          path: im-results/lp2-p27-moulds-lateplates/
          if-no-files-found: warn
      - name: Preserve Middle English C7/C8 evidence
        if: ${{ always() && inputs.script == 'sims/lp2_middle_english_register_gate_sft.py' }}
        uses: actions/upload-artifact@v4
        with:
          name: lp2-middle-english-register-gate
          path: im-results/lp2-middle-english-register-gate/
          if-no-files-found: warn
      - name: Preserve Stage10 participant IRC capture search
        if: ${{ always() && inputs.script == 'sims/stage10_participant_irc_capture_search.py' }}
        uses: actions/upload-artifact@v4
        with:
          name: stage10-participant-irc-capture-search
          path: im-results/stage10-participant-irc-capture-search/
          if-no-files-found: warn


  r4-composite-h1:
    if: ${{ inputs.script == 'sims/lp2_r4_composite_h1_sft.py' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out primary repository
        uses: actions/checkout@v7
      - name: Check out pinned independent R4 reference
        uses: actions/checkout@v7
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external/pnotisdev
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Build pinned mid-word likelihood engine
        run: |
          mkdir -p external/pnotisdev/work/chanscreen/v2/build
          rustc --edition=2021 --crate-type cdylib -C opt-level=3 external/pnotisdev/work/chanscreen/v2/backward_mid.rs -o external/pnotisdev/work/chanscreen/v2/build/libbackward_mid.so
      - name: Execute source-fixed composite-key test
        env:
          PNOTISDEV_ROOT: ${{ github.workspace }}/external/pnotisdev
          PNOTISDEV_COMMIT: 15200c67abee106913ba01ff504c5b6e88d16cc7
        run: python sims/lp2_r4_composite_h1_sft.py
      - name: Preserve reproducible result
        uses: actions/upload-artifact@v4
        with:
          name: lp2-r4-composite-h1-sft
          path: im-results/lp2-r4-composite-h1-sft.json

  q8-keyless-z3:
    if: ${{ inputs.script == 'sims/lp2_plaintext_autokey_q8_keyless_pair_bv.py' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native solver
        run: python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
      - name: Execute exact original and control inverses
        shell: bash
        run: |
          set -euo pipefail
          export Z3_LIBRARY="$(python -c 'import z3,pathlib; print(pathlib.Path(z3.__file__).parent/"lib"/"libz3.so")')"
          python sims/lp2_plaintext_autokey_q8_keyless_pair_bv.py --target control --mode default --freq 100 --timeout 60000
          python sims/lp2_plaintext_autokey_q8_keyless_pair_bv.py --target original --mode sat --freq 100 --timeout 60000
          python sims/lp2_plaintext_autokey_q8_keyless_pair_bv.py --target original --mode sat --freq 0 --timeout 180000

  semantic-running-key:
    if: ${{ inputs.script == 'sims/lp2_semantic_running_key_distilgpt2_sft.py' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.49.0 safetensors==0.5.3
      - name: Evaluate the frozen semantic rank gate
        run: python sims/lp2_semantic_running_key_distilgpt2_sft.py
      - uses: actions/upload-artifact@v4
        with:
          name: lp2-semantic-running-key-distilgpt2
          path: im-results/lp2-semantic-running-key-distilgpt2.json

  semantic-running-key-recovery:
    if: ${{ inputs.script == 'sims/lp2_semantic_running_key_recovery_sft.py' }}
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.49.0 safetensors==0.5.3
      - name: Decode one blind native and uniform pair
        run: python sims/lp2_semantic_running_key_recovery_sft.py --index ${{ matrix.index }}
      - uses: actions/upload-artifact@v4
        with:
          name: lp2-semantic-running-key-recovery-${{ matrix.index }}
          path: im-results/lp2-semantic-running-key-recovery-${{ matrix.index }}.json

  semantic-running-key-boundary-profile:
    if: ${{ inputs.script == 'sims/lp2_semantic_running_key_boundary_profile_sft.py' }}
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned CPU model dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.49.0 safetensors==0.5.3
      - name: Profile authentic and rival rune pairs with equal boundary freedom
        run: |
          python sims/lp2_semantic_running_key_boundary_profile_sft.py --index ${{ matrix.index }}
      - name: Preserve symmetric boundary-profile evidence
        uses: actions/upload-artifact@v4
        with:
          name: lp2-semantic-running-key-boundary-profile-${{ matrix.index }}
          path: im-results/lp2-semantic-running-key-boundary-profile-${{ matrix.index }}.json


  q8-multichapter-pool:
    if: ${{ inputs.script == 'sims/lp2_shared_gp29_q8_multichapter_pool_sft.py' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plant: 0, world: common, mode: pooled }
          - { plant: 1, world: common, mode: pooled }
          - { plant: 0, world: independent, mode: pooled }
          - { plant: 1, world: independent, mode: pooled }
          - { plant: 0, world: common, mode: independent, chapter: 0 }
          - { plant: 0, world: common, mode: independent, chapter: 1 }
          - { plant: 0, world: common, mode: independent, chapter: 2 }
          - { plant: 1, world: common, mode: independent, chapter: 0 }
          - { plant: 1, world: common, mode: independent, chapter: 1 }
          - { plant: 1, world: common, mode: independent, chapter: 2 }
          - { plant: 0, world: independent, mode: independent, chapter: 0 }
          - { plant: 0, world: independent, mode: independent, chapter: 1 }
          - { plant: 0, world: independent, mode: independent, chapter: 2 }
          - { plant: 1, world: independent, mode: independent, chapter: 0 }
          - { plant: 1, world: independent, mode: independent, chapter: 1 }
          - { plant: 1, world: independent, mode: independent, chapter: 2 }
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CP-SAT solver
        run: python -m pip install --disable-pip-version-check 'ortools==9.14.6206'
      - name: Run pooled or independent blind native control
        continue-on-error: true
        env:
          PLANT: ${{ matrix.plant }}
          WORLD: ${{ matrix.world }}
          MODE: ${{ matrix.mode }}
          CHAPTER: ${{ matrix.chapter }}
        run: |
          if [ "$MODE" = "pooled" ]; then
            python -u sims/lp2_shared_gp29_q8_multichapter_pool_sft.py --plant "$PLANT" --world "$WORLD" --mode "$MODE" --seconds 1200 --workers 4
          else
            python -u sims/lp2_shared_gp29_q8_multichapter_pool_sft.py --plant "$PLANT" --world "$WORLD" --mode "$MODE" --chapter "$CHAPTER" --seconds 1200 --workers 4
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q8-multichapter-${{ matrix.world }}-${{ matrix.mode }}-p${{ matrix.plant }}-${{ matrix.chapter || 'all' }}
          path: im-results/lp2-q8-multichapter-*.json
          if-no-files-found: warn

  q8-multichapter-pool-gate:
    if: ${{ always() && inputs.script == 'sims/lp2_shared_gp29_q8_multichapter_pool_sft.py' }}
    needs: q8-multichapter-pool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: q8-multichapter-*
          path: controls
      - name: Require calibrated common-pi recovery and independent-cycle discrimination
        run: |
          python - <<'PY'
          import glob, json, sys
          files = glob.glob('controls/**/lp2-q8-multichapter-*.json', recursive=True)
          rows = [json.load(open(p, encoding='utf-8')) for p in files]
          def subset(world, mode):
              return [r for r in rows if r.get('world') == world and r.get('mode') == mode]
          common_pooled = subset('common', 'pooled')
          rival_pooled = subset('independent', 'pooled')
          rival_fits = subset('independent', 'independent')
          fit_counts = {plant: sum(r.get('passed') is True for r in rival_fits if r.get('plant') == plant) for plant in (0, 1)}
          summary = {
              'artifacts': len(files),
              'common_pooled': [{'plant': r.get('plant'), 'status': r.get('solver', {}).get('status'), 'passed': r.get('passed')} for r in common_pooled],
              'independent_cycle_pooled_rival': [{'plant': r.get('plant'), 'status': r.get('solver', {}).get('status'), 'passed': r.get('passed'), 'shared_action_recovered_all': r.get('shared_action_recovered_all'), 'rank_ceiling': r.get('known_plaintext_phase_rank_ceiling', {}).get('shared_pi_pooled')} for r in rival_pooled],
              'independent_pi_fits_on_rival': [{'plant': r.get('plant'), 'chapter': r.get('independent_chapter_index'), 'status': r.get('solver', {}).get('status'), 'passed': r.get('passed')} for r in rival_fits],
              'rival_fit_passes_per_plant': fit_counts,
          }
          print(json.dumps(summary, separators=(',', ':')))
          complete = len(files) == 16 and len(common_pooled) == 2 and len(rival_pooled) == 2 and len(rival_fits) == 6
          common_ok = complete and all(r.get('passed') is True for r in common_pooled)
          rival_ok = complete and all(r.get('passed') is True for r in rival_pooled)
          independent_ok = complete and all(count >= 2 for count in fit_counts.values())
          if not (common_ok and rival_ok and independent_ok):
              sys.exit('Multi-chapter common-pi recovery or independent-cycle rival calibration did not pass.')
          PY

  nonperiodic-fhold-outer-sat:
    if: ${{ inputs.script == 'sims/lp2_nonperiodic_fhold_outer_sat.py' }}
    strategy:
      fail-fast: false
      matrix:
        schedule: [ordinal, prime]
        target: [control, original]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned native solver
        run: python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
      - name: Recover or exactly reject one full source-schedule case
        run: python -u sims/lp2_nonperiodic_fhold_outer_sat.py --schedule ${{ matrix.schedule }} --target ${{ matrix.target }} --timeout 420000 --alternate-timeout 90000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonperiodic-outer-sat-${{ matrix.target }}-${{ matrix.schedule }}
          path: im-results/lp2-nonperiodic-outer-sat-*.json
          if-no-files-found: warn

  nonperiodic-fhold-outer-scope-sat:
    if: ${{ inputs.script == 'sims/lp2_nonperiodic_fhold_outer_scope_sat.py' }}
    strategy:
      fail-fast: false
      matrix:
        schedule: [ordinal, prime, p56]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
      - run: python -u sims/lp2_nonperiodic_fhold_outer_scope_sat.py --schedule ${{ matrix.schedule }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonperiodic-outer-scope-${{ matrix.schedule }}
          path: im-results/lp2-nonperiodic-outer-scope-*.json
          if-no-files-found: warn

  p56-primeclock-projected-sat:
    if: ${{ inputs.script == 'sims/lp2_p56_primeclock_projected_sat.py' }}
    strategy:
      fail-fast: false
      matrix:
        solver: [cadical195, kissat404]
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check z3-solver==4.13.3.0 python-sat==1.9.dev24
      - run: python -u sims/lp2_p56_primeclock_projected_sat.py --solver ${{ matrix.solver }} --seconds 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p56-primeclock-projected-${{ matrix.solver }}
          path: im-results/lp2-p56-primeclock-projected-*.json
          if-no-files-found: warn
