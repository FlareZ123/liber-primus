name: Run one read-only Python research SFT

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Committed sims/*.py research test; the R4/H1 test selects its own pinned Linux job'
        required: true
        default: sims/lp2_fivedot_original_jpeg_reflection_sft.py

permissions:
  contents: read

jobs:
  image-source-test:
    if: ${{ inputs.script != 'sims/lp2_r4_composite_h1_sft.py' && inputs.script != 'sims/lp2_plaintext_autokey_q8_keyless_pair_bv.py' && inputs.script != 'sims/lp2_semantic_running_key_distilgpt2_sft.py' && inputs.script != 'sims/lp2_semantic_running_key_recovery_sft.py' && inputs.script != 'sims/lp2_shared_gp29_q8_carry_prefix_sft.py' }}
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out primary repository
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned JPEG reader
        shell: pwsh
        run: |
          & python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate and execute selected research SFT
        shell: pwsh
        env:
          TEST_SCRIPT: ${{ inputs.script }}
        run: |
          if ($env:TEST_SCRIPT -notmatch '^sims/[A-Za-z0-9_.-]+[.]py$') {
            throw 'Script must be a direct .py file in sims/'
          }
          if (-not (Test-Path -LiteralPath $env:TEST_SCRIPT -PathType Leaf)) {
            throw 'Requested committed research script does not exist'
          }
          & python -- $env:TEST_SCRIPT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  r4-composite-h1:
    if: ${{ inputs.script == 'sims/lp2_r4_composite_h1_sft.py' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out primary repository
        uses: actions/checkout@v7
      - name: Check out pinned independent R4 reference
        uses: actions/checkout@v7
        with:
          repository: pnotisdev/cicada3301
          ref: 15200c67abee106913ba01ff504c5b6e88d16cc7
          path: external/pnotisdev
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Build pinned mid-word likelihood engine
        run: |
          mkdir -p external/pnotisdev/work/chanscreen/v2/build
          rustc --edition=2021 --crate-type cdylib -C opt-level=3 external/pnotisdev/work/chanscreen/v2/backward_mid.rs -o external/pnotisdev/work/chanscreen/v2/build/libbackward_mid.so
      - name: Execute source-fixed composite-key test
        env:
          PNOTISDEV_ROOT: ${{ github.workspace }}/external/pnotisdev
          PNOTISDEV_COMMIT: 15200c67abee106913ba01ff504c5b6e88d16cc7
        run: python sims/lp2_r4_composite_h1_sft.py
      - name: Preserve reproducible result
        uses: actions/upload-artifact@v4
        with:
          name: lp2-r4-composite-h1-sft
          path: im-results/lp2-r4-composite-h1-sft.json

  q8-keyless-z3:
    if: ${{ inputs.script == 'sims/lp2_plaintext_autokey_q8_keyless_pair_bv.py' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native solver
        run: python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
      - name: Execute exact original and control inverses
        shell: bash
        run: |
          set -euo pipefail
          export Z3_LIBRARY="$(python -c 'import z3,pathlib; print(pathlib.Path(z3.__file__).parent/"lib"/"libz3.so")')"
          python sims/lp2_plaintext_autokey_q8_keyless_pair_bv.py --target control --mode default --freq 100 --timeout 60000
          python sims/lp2_plaintext_autokey_q8_keyless_pair_bv.py --target original --mode sat --freq 100 --timeout 60000
          python sims/lp2_plaintext_autokey_q8_keyless_pair_bv.py --target original --mode sat --freq 0 --timeout 180000

  semantic-running-key:
    if: ${{ inputs.script == 'sims/lp2_semantic_running_key_distilgpt2_sft.py' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.49.0 safetensors==0.5.3
      - name: Evaluate the frozen semantic rank gate
        run: python sims/lp2_semantic_running_key_distilgpt2_sft.py
      - uses: actions/upload-artifact@v4
        with:
          name: lp2-semantic-running-key-distilgpt2
          path: im-results/lp2-semantic-running-key-distilgpt2.json

  semantic-running-key-recovery:
    if: ${{ inputs.script == 'sims/lp2_semantic_running_key_recovery_sft.py' }}
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.49.0 safetensors==0.5.3
      - name: Decode one blind native and uniform pair
        run: python sims/lp2_semantic_running_key_recovery_sft.py --index ${{ matrix.index }}
      - uses: actions/upload-artifact@v4
        with:
          name: lp2-semantic-running-key-recovery-${{ matrix.index }}
          path: im-results/lp2-semantic-running-key-recovery-${{ matrix.index }}.json

  q8_carry_prefix_control:
    if: \${{ inputs.script == 'sims/lp2_shared_gp29_q8_carry_prefix_sft.py' }}
    strategy:
      fail-fast: false
      matrix:
        plant: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned CP-SAT dependency
        run: python -m pip install --disable-pip-version-check ortools==9.14.6206
      - name: Compile source-corrected carry-prefix SFT
        run: python -m py_compile sims/lp2_shared_gp29_q8_carry_prefix_sft.py
      - name: Blind recovery on one source-matched plant
        run: python sims/lp2_shared_gp29_q8_carry_prefix_sft.py --target control --plant \${{ matrix.plant }} --seconds 900 --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q8-carry-prefix-control-\${{ matrix.plant }}
          path: im-results/lp2-shared-gp29-q8-carry-prefix-control-\${{ matrix.plant }}.json

  q8_carry_prefix_original:
    needs: q8_carry_prefix_control
    if: \${{ inputs.script == 'sims/lp2_shared_gp29_q8_carry_prefix_sft.py' && needs.q8_carry_prefix_control.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned CP-SAT dependency
        run: python -m pip install --disable-pip-version-check ortools==9.14.6206
      - name: Run original gate (nonzero exit intentionally exposes JSON in failed-job logs)
        run: python sims/lp2_shared_gp29_q8_carry_prefix_sft.py --target original --seconds 900 --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q8-carry-prefix-original
          path: im-results/lp2-shared-gp29-q8-carry-prefix-original.json
