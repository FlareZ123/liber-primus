name: P36 Q238 finite-field original inversion (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-cipher:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original finite-field test
        run: node sims/p36_q238_field_key_original_sft.cjs
      - name: Q238 versus p36 all-secret transposition obstruction
        run: node sims/p36_q238_secret_transposition_obstruction_sft.cjs
