name: P36 Q238 finite-field original inversion (manual)
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which source-field experiment to run'
        required: true
        type: choice
        options:
          - legacy
          - signed-dh-mobius
          - frobenius
          - frobenius-secret
          - semilinear-p36
        default: legacy

permissions:
  contents: read

jobs:
  original-cipher:
    if: inputs.suite == 'legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original finite-field test
        run: node sims/p36_q238_field_key_original_sft.cjs
      - name: Q238 versus p36 all-secret transposition obstruction
        run: node sims/p36_q238_secret_transposition_obstruction_sft.cjs
  signed-dh-mobius:
    if: inputs.suite == 'signed-dh-mobius'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Signed-DH totalized pair-register Mobius original-cipher control
        run: node sims/p36_dh23_totalized_mobius_original_sft.cjs
      - name: Signed-DH totalized degree238-field Mobius original-cipher control
        run: node sims/p36_dh23_fullfield_mobius_original_sft.cjs

  frobenius:
    if: inputs.suite == 'frobenius'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original p36 exact 238-member Frobenius inverse SFT
        run: node sims/lp2_p36_field_frobenius_orbit_sft.cjs

  frobenius-secret:
    if: inputs.suite == 'frobenius-secret'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source Q238 Frobenius stationary-key all-secret exclusion
        run: node sims/lp2_q238_frobenius_stationary_secret_sft.cjs

  semilinear-p36:
    if: inputs.suite == 'semilinear-p36'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-p36 keyed GF29 Frobenius semilinear field inverse
        run: node sims/lp2_p36_q238_semilinear_original_sft.cjs
