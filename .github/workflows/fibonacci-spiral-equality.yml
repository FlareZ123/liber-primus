name: Fibonacci-prime spiral hidden-alphabet key sieve
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sims/fibonacci_spiral_equality_sieve.cjs
