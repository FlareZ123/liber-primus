name: Agent12 Jan2015 p0 punchcard source mask gate
on:
  workflow_dispatch:
jobs:
  source-mask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image analysis
        run: python -m pip install -q numpy opencv-python-headless sympy
      - name: Test original p0 foreground-stencil extraction
        run: python sims/lp2_2015_p0_punchcard_redS_mask_sft.py
