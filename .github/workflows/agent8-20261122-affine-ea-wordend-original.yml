name: Agent8 affine two-back and EA word-end original research SFT
on:
  push:
    paths:
      - '.github/workflows/agent8-20261122-affine-ea-wordend-original.yml'
  workflow_dispatch:
jobs:
  original-sft:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Blind recover three native plants and test 784 original keys
        run: node sims/lp2_two_back_affine_rank28_blind_sft.cjs
      - name: Test all-secret EA source-native word ending hypothesis
        run: node sims/lp2_ea_sentinel_wordend_frequency_original_sft.cjs
