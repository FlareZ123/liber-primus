name: Agent2 original word-local pair-phase SFT
on:
  workflow_dispatch:

jobs:
  original-source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce original typed-word statistics and frozen pair inverse
        run: node sims/lp2_wordlocal_pairphase_chapter_sft.cjs
