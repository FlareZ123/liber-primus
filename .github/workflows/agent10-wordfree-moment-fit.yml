name: Agent 10 LP2 all-secret wordfree GP29 moment inversion
on:
  workflow_dispatch:

jobs:
  source-moments:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fit full 29-entry predecessor key under native GP Markov model
        run: node sims/lp2_plainprev_wordfree_native_moment_fit_sft.cjs
