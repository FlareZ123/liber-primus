name: p36 DH-source exponent field-power gate
on:
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact original p36 Q238 power inverses
        run: node sims/lp2_p36_q238_dh_power_sft.cjs | tee p36_dh_field_power.json
      - uses: actions/upload-artifact@v4
        with:
          name: p36-dh-source-exponent-field-power
          path: p36_dh_field_power.json
