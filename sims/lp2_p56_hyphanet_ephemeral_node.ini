[Node]
node.listenPort=28949
node.opennet.listenPort=28950
node.bindTo=0.0.0.0
node.opennet.bindTo=0.0.0.0
node.opennet.enabled=true
node.assumeNATed=true
node.storeType=salt-hash
node.storeSize=256M
node.outputBandwidthLimit=512k
node.inputBandwidthLimit=1024k
node.downloadsDir=./downloads
node.install.userDir=.
node.install.tempDir=./temp
node.install.persistentTempDir=./persistent-temp
node.install.storeDir=./datastore
node.l10n=English

[FProxy]
fproxy.enabled=true
fproxy.port=8888
fproxy.bindTo=0.0.0.0
fproxy.allowedHosts=*
fproxy.allowedHostsFullAccess=*
fproxy.hasCompletedWizard=true

[FCP]
fcp.enabled=false
